<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>河北SS ポータル</title>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #e9eef0; --surface: #ffffff; --surface-2: #f3f6f7; --fg: #182328; --muted: #5f7079; --line: #d6dfe3;
  --track: #c4512f; --track-soft: #f6e1d9; --field: #237a55; --field-soft: #dcefe5; --sky: #2f6fae; --sky-soft: #dde9f5;
  --warn: #a8660b; --warn-soft: #f8ead2;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1518; --surface: #182126; --surface-2: #1f2a30; --fg: #e4ebee; --muted: #94a5ad; --line: #2d3a40;
    --track: #ec8566; --track-soft: #3f2219; --field: #4cc28c; --field-soft: #163527; --sky: #6aa7e3; --sky-soft: #172b3f;
    --warn: #e5a54a; --warn-soft: #3a2a12; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.app { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
.frame { background: var(--surface-2); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; min-height: calc(100vh - 24px); }
.top { background: var(--surface); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--track); display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 13px; flex: none; }
.top h1 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; line-height: 1.3; }
.top .me { font-size: 11.5px; color: var(--muted); }
.top > div:not(.logo) { min-width: 0; flex: 1; }
.top .me { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .reload { margin-left: auto; flex: none; white-space: nowrap; }
.view { flex: 1; padding: 12px; display: grid; gap: 12px; align-content: start; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); position: sticky; bottom: 0; }
.nav.admin { grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 8px 0 7px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--track); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: .95rem; margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-family: var(--font-body); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.big { font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; line-height: 1.35; }
.sub { color: var(--muted); font-size: 12.5px; }
.hint { font-size: 11.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; line-height: 1.7; white-space: nowrap; }
.p-race { background: var(--track-soft); color: var(--track); }
.p-prac { background: var(--sky-soft); color: var(--sky); }
.p-ok { background: var(--field-soft); color: var(--field); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-gray { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.btn { border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: var(--track); color: #fff; }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.small { padding: 4px 10px; font-size: 12px; border-radius: 8px; white-space: nowrap; flex: none; }
.btn.ok { background: var(--field); }
.btn:disabled { opacity: .5; cursor: wait; }
.link { border: 0; background: none; color: var(--sky); font: inherit; cursor: pointer; padding: 0; justify-self: start; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.list { display: grid; }
.list > * { padding: 8px 0; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; padding-top: 0; }
.notice .t { font-weight: 700; }
.notice .b { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
.date { flex: none; width: 46px; text-align: center; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px 0; line-height: 1.2; font-variant-numeric: tabular-nums; }
.date b { display: block; font-size: 15px; }
.date span { font-size: 10.5px; color: var(--muted); }
.date.race { background: var(--track-soft); border-color: transparent; }
.ev { display: flex; gap: 10px; align-items: center; background: none; border: 0; text-align: left; font: inherit; color: inherit; width: 100%; cursor: pointer; }
.ev .main { flex: 1; min-width: 0; }
.ev .ttl { font-weight: 700; }
.ev.past { opacity: .55; }
.ev.cancel .ttl { text-decoration: line-through; }
.month { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 12px; margin: 4px 2px -4px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--track); border-color: var(--track); color: #fff; font-weight: 700; }
.kv { display: grid; grid-template-columns: 4.5em 1fr; gap: 4px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; white-space: pre-wrap; }
.tbl-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 11.5px; }
tr.hl td { background: var(--track-soft); }
.kid { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--field); border-color: var(--field); color: #fff; font-weight: 700; }
.choice button.no[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); }
.choice button:disabled { opacity: .45; cursor: not-allowed; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 6px 8px; display: grid; }
.stat b { font-family: var(--font-display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
form.f, .f { display: grid; gap: 8px; }
.f label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.f select, .f input, .f textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0; }
.f textarea { min-height: 90px; resize: vertical; font-size: 13.5px; }
.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f .lbl { font-size: 12px; color: var(--muted); margin-bottom: -4px; }
.f input::placeholder, .f textarea::placeholder { color: var(--muted); opacity: .7; }
.filled { background: var(--field-soft) !important; border-color: var(--field) !important; }
.quick { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.quick button { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 1px 9px; font: inherit; font-size: 12px; cursor: pointer; }
.toast { background: var(--field-soft); color: var(--field); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; }
.toast.err { background: var(--track-soft); color: var(--track); }
.copybox { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12.5px; user-select: all; }
.menu { display: grid; gap: 8px; }
.menu button { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 12px; font: inherit; cursor: pointer; }
.menu b { display: block; font-size: 14px; }
.menu span.d { font-size: 12px; color: var(--muted); }
.busy { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--surface); padding: 6px 14px; border-radius: 999px; font-size: 12.5px; z-index: 10; }
.childrow { display: grid; grid-template-columns: minmax(0, 1fr) 6.5em 32px; gap: 6px; align-items: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; width: 32px; height: 32px; font: inherit; cursor: pointer; }
.empty { padding: 24px 8px; text-align: center; color: var(--muted); }
.top .acts { margin-left: auto; flex: none; display: flex; gap: 6px; }
.top .acts .btn { white-space: nowrap; text-decoration: none; }
.btn.line { background: #06c755; color: #fff; border: 0; }
.childrow { grid-template-columns: minmax(0, 1fr) 5.4em 4.4em 32px; }
.choice.duty button { display: grid; text-align: center; line-height: 1.3; padding: 4px 10px; border-radius: 12px; }
.choice.duty button small { font-size: 10.5px; opacity: .8; font-weight: 400; }
.att { display: grid; gap: 4px; }
.att .g { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.att .g > b { font-size: 11.5px; color: var(--muted); width: 2.6em; flex: none; }
.tt { display: flex; gap: 10px; align-items: flex-start; }
.tt-time { flex: none; width: 3.4em; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.tt .main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.tt-kids { display: grid; gap: 4px; }
.tt-kids > span { justify-content: space-between; }
.callt { color: var(--track); }
.tte { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 6px 0; border-top: 1px solid var(--line); }
.tte:first-child { border-top: 0; }
.tte .w2 { grid-column: span 2; }
.tte .w3 { grid-column: span 3; }
.tte input { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; min-width: 0; width: 100%; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.thumb { border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.upl { display: inline-block; }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; display: grid; place-items: center; padding: 12px; }
.viewer img { max-width: 100%; max-height: calc(100vh - 80px); border-radius: 8px; }
.viewer .vbar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; left: 12px; display: flex; gap: 8px; justify-content: flex-end; }
.viewer .vbar a { text-decoration: none; }
.viewer .vcap { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; color: #fff; font-size: 12px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); }
.cal button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 0 4px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cal button small { display: block; font-size: 9px; color: var(--muted); height: 10px; }
.cal button[aria-pressed="true"] { background: var(--field); border-color: var(--field); color: #fff; font-weight: 700; }
.cal button[aria-pressed="true"] small { color: #fff; }
.cal button:disabled { opacity: .35; cursor: not-allowed; }
.banner { background: var(--track-soft); border-color: transparent; }
.relay-round { border-top: 1px dashed var(--line); padding-top: 6px; display: grid; gap: 4px; }
.steps { display: flex; gap: 3px; flex-wrap: wrap; }
.steps span { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.steps span.done { background: var(--field-soft); color: var(--field); border-color: transparent; }
.steps span.now { background: var(--track); color: #fff; border-color: transparent; font-weight: 700; }
.cmt { display: grid; gap: 4px; }
.cmt .b { white-space: pre-wrap; }
.cmt.nm { background: var(--warn-soft); border-radius: 10px; padding: 8px 10px; border-top: 0; margin-top: 4px; }
.measure { background: var(--field-soft); color: var(--fg); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; white-space: pre-wrap; }
.p-nm { background: var(--warn); color: #fff; }
.f label.chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.f label.chk input { width: auto; }
</style>
</head>
<body>
<div class="app">
  <div class="frame">
    <div class="top">
      <div class="logo" aria-hidden="true">SS</div>
      <div><h1 id="clubName">ポータル</h1><div class="me" id="me"></div></div>
      <div class="acts"><button class="btn small ghost" id="reload" type="button" hidden>更新</button><a class="btn small line" id="toLine" href="https://line.me/R/nv/chat" target="_top">LINEへ</a></div>
    </div>
    <main class="view" id="view"><div class="empty">読み込んでいます…</div></main>
    <nav class="nav" id="nav" aria-label="メニュー" hidden></nav>
  </div>
</div>
<div class="busy" id="busy" hidden>保存しています…</div>
<script>
var KEY = "";
var LOGIN_URL = "";
var LOGIN_ERROR = "";
var HOME_URL = "https://kahokuss.github.io/portal/";
var CLUB = "河北SS";
// GitHub Pages に置いた画面では、Apps Script のウェブアプリの URL が入る（Apps Script の画面では空）
var API_URL = "https://script.google.com/macros/s/AKfycbyUMYsbH2Ivw5SlLrcQxO4DCnb1Gj2K8JNSYmgrlqYlXuoCYs9guHuqi0FN2m65t2qz/exec";
// GitHub Pages の画面の版（tools/build-pages.js が入れる）。新しい版が出ていたら読み直すのに使う
var BUILD = "5767c10e71";
document.getElementById('clubName').textContent = CLUB + ' ポータル';
(function () {
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var ST = null;
  var S = { tab: 'home', event: null, etab: '概要', toast: '', toastErr: false, absForm: false, onlyRace: false, admin: 'menu', draft: null, filled: {}, saved: null, notice: null };
  var view = document.getElementById('view');

  // ---- 共通 ----
  function d(s) { var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function md(s) { var x = d(s); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate() + '(' + WD[x.getUTCDay()] + ')'; }
  function diff(a, b) { return Math.round((d(b) - d(a)) / 86400000); }
  function addDays(s, n) { return new Date(d(s).getTime() + n * 86400000).toISOString().slice(0, 10); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function yen(n) { return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
  function pad(n) { return ('0' + n).slice(-2); }
  function toHalf(s) { return String(s).replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); }).replace(/　/g, ' '); }
  function fmtTime(s) { s = toHalf(String(s)).trim().replace('時', ':').replace('分', ''); var m = s.match(/^(\d{1,2})[:.]?(\d{2})$/); return m ? (+m[1]) + ':' + m[2] : s; }
  function on(sel, fn) { view.querySelectorAll(sel).forEach(function (el) { el.addEventListener('click', fn); }); }
  function when(e) { return md(e.date) + (e.start && e.start !== '終日' ? ' ' + e.start.replace(/^0/, '') + (e.end ? '〜' + e.end.replace(/^0/, '') : '') : ''); }
  function isRace(e) { return e.type !== '練習'; }
  function typePill(e) { return '<span class="pill ' + (isRace(e) ? 'p-race' : 'p-prac') + '">' + esc(e.type) + '</span>'; }
  function evByKey(k) { return ST.events.find(function (e) { return e.key === k; }); }
  function kidInfo(n) { return ST.kids.find(function (k) { return k.name === n; }) || { name: n, grade: 0 }; }
  function myNames() { return ST.me.children.map(function (c) { return c.name; }); }
  function inTarget(target, grade) { var m = String(target || '').match(/([1-6])年生?以上/); return !m || !grade || grade >= Number(m[1]); }
  function entryOf(key, child) { return ST.entries.find(function (x) { return x.key === key && x.child === child; }); }
  function toastHtml() { return S.toast ? '<div class="toast' + (S.toastErr ? ' err' : '') + '">' + esc(S.toast) + '</div>' : ''; }

  /** サーバーを呼ぶ。Apps Script の画面なら google.script.run、GitHub Pages の画面なら fetch で */
  function rpc(action, payload, ok, ng) {
    if (!API_URL) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ng).api(KEY, action, payload || {});
      return;
    }
    // text/plain で送ると、ブラウザの事前確認（CORS のプリフライト）なしで Apps Script に届く
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, key: KEY, payload: payload || {} }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res.error) ng(new Error(res.error)); else ok(res.ok); })
      .catch(function () { ng(new Error('通信できませんでした。電波のよいところで「更新」を押してください。')); });
  }
  function call(action, payload, done) {
    document.getElementById('busy').hidden = false;
    rpc(action, payload, function (st) {
        document.getElementById('busy').hidden = true;
        ST = fillDefaults(st);
        if (st.message) { S.toast = '✅ ' + st.message; S.toastErr = false; }
        if (done) done(st);
        render();
      }, function (err) {
        document.getElementById('busy').hidden = true;
        var msg = String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '');
        if (/ログインが切れ|グループのメンバーではない/.test(msg)) { clearKey(); ST = null; showLogin(msg); return; }
        S.toast = '⚠ ' + msg;
        S.toastErr = true;
        if (!ST) { view.innerHTML = '<div class="card"><div class="big">ページを開けませんでした</div><div class="sub">' + esc(msg) + '</div></div>'; return; }
        render();
      });
  }
  /** サーバー（Apps Script）が古い版のままでも画面がこわれないよう、足りない項目をうめる */
  function fillDefaults(st) {
    ['duties', 'timetable', 'tasks', 'photos', 'families', 'parents', 'results', 'ledger', 'comments', 'docs', 'history'].forEach(function (k) { if (!st[k]) st[k] = []; });
    if (!st.me.canManage) st.me.canManage = [];
    if (!st.me.family) st.me.family = [st.me.name];
    if (!st.choices.practiceTimes) st.choices.practiceTimes = [['17:00', '18:30'], ['18:00', '19:30']];
    if (!st.choices.warmMinutes) st.choices.warmMinutes = 30;
    if (!st.choices.rounds) st.choices.rounds = ['予選', '準決勝', '決勝', 'タイムレース'];
    if (!st.choices.applyHow) st.choices.applyHow = ['Web', 'メール', 'FAX', '郵送', '持参', '当日'];
    if (!st.choices.docKinds) st.choices.docKinds = ['要項', '申込書', 'プログラム', '地図', 'リザルト', 'その他'];
    return st;
  }
  function go(tab, key) { S.tab = tab; S.event = key || null; S.toast = ''; S.absForm = false; render(); window.scrollTo(0, 0); }

  function upcoming(filter) { return ST.events.filter(function (e) { return !e.cancelled && e.date >= ST.today && filter(e); }); }
  function myStatus(e) {
    var det = e.detail || {};
    return ST.me.children.map(function (k) {
      if (!inTarget(det.target, k.grade)) return '<span class="pill p-gray">' + esc(k.name) + '：対象外</span>';
      var x = entryOf(e.key, k.name);
      if (!x) return '<span class="pill p-warn">' + esc(k.name) + '：未回答</span>';
      return '<span class="pill ' + (x.join === '参加' ? 'p-ok' : 'p-gray') + '">' + esc(k.name) + '：' + x.join + (x.races.length ? '（' + esc(x.races.join('・')) + '）' : '') + '</span>';
    }).join(' ');
  }

  // ---- ホーム ----
  function home() {
    var h = toastHtml();
    if (!ST.me.children.length) {
      h += '<section class="card"><h2>はじめに</h2><div class="sub">お子さんの名前と学年を登録してください。</div><button class="btn" data-tab="family" type="button">お子さんを登録する</button></section>';
    }
    if (ST.notices.length) {
      h += '<section class="card"><h2>お知らせ</h2><div class="list">' + ST.notices.slice(0, 3).map(function (n) {
        return '<div class="notice"><div class="between"><span class="t">' + esc(n.title) + '</span><span class="sub">' + md(n.date) + '</span></div>' + (n.body ? '<div class="b">' + esc(n.body) + '</div>' : '') +
          (n.key && evByKey(n.key) ? '<button class="link" data-ev="' + n.key + '" type="button">詳しく見る ›</button>' : '') + '</div>';
      }).join('') + '</div></section>';
    }

    var md0 = myDuties()[0], mdE = md0 && evByKey(md0.key);
    if (mdE && diff(ST.today, mdE.date) <= 14) {
      h += '<section class="card banner"><h2>わが家の当番<small>' + (mdE.date === ST.today ? '今日' : 'あと' + diff(ST.today, mdE.date) + '日') + '</small></h2><button class="ev" type="button" data-ev="' + mdE.key + '"><span class="main"><span class="big">' + md(mdE.date) + ' ' + esc(md0.type) + '当番</span><br><span class="sub">' + esc(mdE.title) + (mdE.place ? '・' + esc(mdE.place) : '') + '</span></span>›</button></section>';
    }
    var today = upcoming(function (e) { return isRace(e) && e.date <= addDays(ST.today, 1); }).filter(function (e) { return myCalls(e).length; })[0];
    if (today) {
      var calls = myCalls(today);
      h += '<section class="card banner"><h2>' + (today.date === ST.today ? '今日' : '明日') + 'の大会<small>' + esc(today.title) + '</small></h2><div class="list">' + calls.map(function (c) {
        return '<div class="between"><span><b>' + esc(c.r.start || '') + '</b> ' + esc(c.k.name) + '・' + esc(c.r.race) + ' <span class="sub">' + (c.r.call ? '招集 ' + esc(c.r.call) : '') + '</span></span>' + (c.done ? '<span class="pill p-ok">招集OK</span>' : '') + '</div>';
      }).join('') + '</div><button class="btn small" type="button" data-gott="' + today.key + '">タイムテーブル・招集 ›</button></section>';
    }
    var orphan = ST.comments.filter(function (c) { return c.kind === '変更連絡' && !c.key && !c.measure && c.date >= ST.today; });
    if (orphan.length) h += '<section class="card"><h2>予定にない日の連絡<small>' + orphan.length + '件</small></h2><div class="list">' + orphan.map(noticeHtml).join('') + '</div></section>';
    var nms = ST.comments.filter(function (c) { return c.kind === 'ヒヤリハット' && c.date >= addDays(ST.today, -30); });
    if (nms.length) h += '<section class="card"><h2>最近のヒヤリハット<small>' + nms.length + '件（30日以内）</small></h2><div class="list">' + nms.slice(0, 3).map(function (c) {
      return '<button class="ev" type="button" data-ev="' + esc(c.key) + '"><span class="main"><span class="pill p-nm">⚠</span> <b>' + md(c.date) + '</b> ' + esc(c.body.slice(0, 40)) + (c.body.length > 40 ? '…' : '') + '<br><span class="sub">' + (c.measure ? '✅ 対策：' + esc(c.measure.slice(0, 30)) : '対策：まだ') + '</span></span>›</button>';
    }).join('') + '</div></section>';
    var np = upcoming(function (e) { return !isRace(e); })[0];
    var practices = upcoming(function (e) { return !isRace(e); }).slice(0, 8);
    h += '<section class="card"><h2>次の練習' + (np ? '<small>' + (diff(ST.today, np.date) === 0 ? '今日' : diff(ST.today, np.date) === 1 ? '明日' : 'あと' + diff(ST.today, np.date) + '日') + '</small>' : '') + '</h2>';
    if (np) {
      var off = absentOn(np.date);
      h += '<button class="ev" type="button" data-ev="' + np.key + '"><span class="main"><span class="big">' + when(np) + '</span>' + (np.place ? '<br><span class="sub">📍 ' + esc(np.place) + '</span>' : '') + '</span>›</button>' +
        (np.down ? '<div class="toast">' + downText(np) + '</div>' : '') +
        (noticesOf(np.key).length ? '<div class="toast" style="background:var(--sky-soft);color:var(--sky)">📣 変更連絡：' + esc(noticesOf(np.key)[0].body.slice(0, 50)) + '</div>' : '') +
        '<div class="sub">休み：' + (off.length ? off.map(function (a) { return esc(a.child); }).join('・') + '（' + off.length + '人）' : 'いまのところなし') + (dutyOf(np.key).length ? '　当番：' + esc(dutyText(np.key)) : '') + '</div>';
    }
    else h += '<div class="sub">カレンダーに練習の予定がありません</div>';
    if (ST.me.children.length) {
      h += '<div class="between"><span class="sub">お休みするときは</span><button class="btn small" id="absBtn" type="button">休みを連絡する</button></div>';
      if (S.absForm) {
        h += '<form class="f" id="absForm"><div class="two"><label>お子さん<select id="absKid">' + ST.me.children.map(function (k) { return '<option>' + esc(k.name) + '</option>'; }).join('') + '</select></label>' +
          '<label>日にち<select id="absDate">' + practices.map(function (p) { return '<option value="' + p.date + '">' + md(p.date) + ' ' + esc(p.title) + '</option>'; }).join('') + '<option value="other">ほかの日…</option></select></label></div>' +
          '<label id="absOtherWrap" hidden>ほかの日<input type="date" id="absOther" min="' + ST.today + '"></label>' +
          '<label>理由<select id="absReason">' + ST.choices.reasons.map(function (r) { return '<option>' + r + '</option>'; }).join('') + '</select></label>' +
          '<label>ひとこと（なくてもOK）<input id="absMemo" maxlength="200"></label>' +
          '<div class="row"><button class="btn" type="submit">連絡する</button><button class="btn ghost" type="button" id="absCancel">やめる</button></div>' +
          '<div class="hint">グループには流れません。役員とその日の当番が、ポータルやBotで確認します。理由とひとことは役員と本人だけに見えます。</div></form>';
      }
    }
    var abs = ST.absences.filter(function (a) { return a.date >= ST.today; });
    if (abs.length) {
      h += '<div class="list">' + abs.map(function (a) {
        var right = a.ack ? '<span class="pill p-ok">確認済み</span>' : '<span class="pill p-warn">未確認</span>';
        if (ST.me.admin) right = '<button class="btn small ' + (a.ack ? 'ghost' : 'ok') + '" data-ack="' + a.id + '" type="button">' + (a.ack ? '確認済み' : '確認した') + '</button>';
        return '<div class="between"><span>' + md(a.date) + ' <b>' + esc(a.child) + '</b> <span class="sub">' + esc(a.reason) + (a.memo ? '・' + esc(a.memo) : '') + (ST.me.admin && !a.mine ? '（' + esc(a.by) + 'さん）' : '') + '</span></span>' +
          '<span class="row">' + right + (a.mine ? '<button class="btn small ghost" data-unabs="' + a.id + '" type="button">取消</button>' : '') + '</span></div>';
      }).join('') + '</div>';
    }
    h += '</section>';

    var ne = upcoming(isRace)[0];
    h += '<section class="card"><h2>次の大会・記録会' + (ne ? '<small>あと' + diff(ST.today, ne.date) + '日</small>' : '') + '</h2>';
    if (ne) {
      var det = ne.detail || {};
      h += '<button class="ev" data-ev="' + ne.key + '" type="button"><div class="date race"><b>' + d(ne.date).getUTCDate() + '</b><span>' + (d(ne.date).getUTCMonth() + 1) + '月</span></div><div class="main"><div class="ttl">' + esc(ne.title) + '</div><div class="sub">' + esc(ne.place || '') + (det.target ? '・' + esc(det.target) : '') + '</div></div>›</button>' +
        '<div class="row">' + myStatus(ne) + '</div>' +
        '<div class="between"><span class="sub">' + (det.deadline ? 'エントリー締切 ' + md(det.deadline) + (det.deadline >= ST.today ? '（あと' + diff(ST.today, det.deadline) + '日）' : '（締切済み）') : '参加・不参加を回答してください') + '</span><button class="btn small" data-entry="' + ne.key + '" type="button">エントリー</button></div>';
      if (ST.me.admin) h += statsHtml(ne);
    } else h += '<div class="sub">予定されている大会はありません</div>';
    h += '</section>';
    view.innerHTML = h;
    bindCommon();
    bindNotices();
    on('[data-cdel]', function () { if (confirm('このコメントを消しますか？')) call('deleteComment', { id: this.dataset.cdel }); });
    on('#absBtn', function () { S.absForm = !S.absForm; S.toast = ''; render(); });
    on('#absCancel', function () { S.absForm = false; render(); });
    var sel = document.getElementById('absDate');
    if (sel) sel.addEventListener('change', function () { document.getElementById('absOtherWrap').hidden = this.value !== 'other'; });
    var f = document.getElementById('absForm');
    if (f) f.addEventListener('submit', function (e) {
      e.preventDefault();
      var date = document.getElementById('absDate').value;
      if (date === 'other') date = document.getElementById('absOther').value;
      call('reportAbsence', { child: document.getElementById('absKid').value, date: date, reason: document.getElementById('absReason').value, memo: document.getElementById('absMemo').value }, function (st) { if (st.message) S.absForm = false; });
    });
    on('[data-ack]', function () { call('ackAbsence', { id: this.dataset.ack }); });
    on('[data-unabs]', function () { call('cancelAbsence', { id: this.dataset.unabs }); });
  }

  function eligible(e) {
    var det = e.detail || {};
    return ST.kids.filter(function (k) { return inTarget(det.target, k.grade); });
  }
  function statsHtml(e) {
    var all = eligible(e), joined = all.filter(function (k) { var x = entryOf(e.key, k.name); return x && x.join === '参加'; });
    var paid = joined.filter(function (k) { return entryOf(e.key, k.name).paid; }).length;
    var none = all.filter(function (k) { return !entryOf(e.key, k.name); }).length;
    return '<div class="stats"><div class="stat"><b>' + joined.length + '</b><span>参加</span></div><div class="stat"><b>' + none + '</b><span>未回答</span></div><div class="stat"><b>' + paid + '/' + joined.length + '</b><span>集金済み</span></div></div>';
  }
  function bindCommon() {
    on('[data-ev]', function () { S.tab = 'events'; S.event = this.dataset.ev; S.etab = '概要'; S.toast = ''; render(); window.scrollTo(0, 0); });
    on('[data-entry]', function () { S.tab = 'events'; S.event = this.dataset.entry; S.etab = 'エントリー'; S.toast = ''; render(); window.scrollTo(0, 0); });
    on('[data-gott]', function () { S.tab = 'events'; S.event = this.dataset.gott; S.etab = 'タイムテーブル'; S.ttf = ''; S.toast = ''; render(); window.scrollTo(0, 0); });
    on('[data-tab]', function () { go(this.dataset.tab); });
  }

  // ---- 予定 ----
  function events() {
    if (S.event) { var e = evByKey(S.event); if (e) return eventDetail(e); S.event = null; }
    var h = toastHtml() + '<div class="tabs" role="group" aria-label="表示">' + ['すべて', '大会だけ'].map(function (t) { return '<button type="button" data-f="' + t + '" aria-pressed="' + ((S.onlyRace ? '大会だけ' : 'すべて') === t) + '">' + t + '</button>'; }).join('') + '</div>';
    var month = '', open = false;
    ST.events.forEach(function (e) {
      if (S.onlyRace && !isRace(e)) return;
      if (!S.onlyRace && !isRace(e) && e.date < addDays(ST.today, -7)) return;
      var m = e.date.slice(0, 7);
      if (m !== month) { if (open) h += '</div></section>'; month = m; open = true; h += '<div class="month">' + Number(m.slice(5)) + '月</div><section class="card"><div class="list">'; }
      var cls = (e.date < ST.today ? ' past' : '') + (e.cancelled ? ' cancel' : '');
      h += '<button class="ev' + cls + '" type="button" data-ev="' + e.key + '"><div class="date' + (isRace(e) ? ' race' : '') + '"><b>' + d(e.date).getUTCDate() + '</b><span>' + WD[d(e.date).getUTCDay()] + '</span></div>' +
        '<div class="main"><div class="ttl">' + esc(e.title) + '</div><div class="sub">' + typePill(e) + (e.cancelled ? ' <span class="pill p-gray">中止</span>' : '') +
        (!e.cancelled && e.date >= ST.today && absentOn(e.date).length && !isRace(e) ? ' <span class="pill p-warn">休み' + absentOn(e.date).length + '</span>' : '') +
        (dutyOf(e.key).some(function (x) { return x.fam === ST.me.fam; }) ? ' <span class="pill p-race">当番</span>' : '') +
        (noticesOf(e.key).length ? ' <span class="pill p-prac">📣変更</span>' : '') +
        (commentsOf(e.key).some(function (c) { return c.kind === 'ヒヤリハット'; }) ? ' <span class="pill p-nm">⚠</span>' : commentsOf(e.key).filter(function (c) { return c.kind !== '変更連絡'; }).length ? ' <span class="pill p-gray">💬' + commentsOf(e.key).filter(function (c) { return c.kind !== '変更連絡'; }).length + '</span>' : '') +
        ' ' + (e.start && e.start !== '終日' ? e.start.replace(/^0/, '') + '〜 ' : '') + esc(e.place || '') + '</div></div>›</button>';
    });
    if (open) h += '</div></section>'; else h += '<div class="card empty">予定がありません</div>';
    h += '<div class="hint">予定はクラブのGoogleカレンダーから取り込んでいます。</div>';
    view.innerHTML = h;
    bindCommon();
    on('[data-f]', function () { S.onlyRace = this.dataset.f === '大会だけ'; render(); });
  }

  function eventDetail(e) {
    var det = e.detail, past = e.date < ST.today;
    var h = '<button class="link" id="back" type="button">‹ 予定一覧</button>' +
      '<section class="card"><div class="row">' + typePill(e) + (det && det.target ? '<span class="pill p-gray">' + esc(det.target) + '</span>' : '') + (e.cancelled ? '<span class="pill p-gray">中止</span>' : past ? '<span class="pill p-gray">終了</span>' : '') + '</div>' +
      '<div class="big">' + esc(e.title) + '</div><div class="sub">' + when(e) + (e.place ? '　📍 ' + esc(e.place) : '') + '</div>' + (isRace(e) && ST.me.children.length ? '<div class="row">' + myStatus(e) + '</div>' : '') + '</section>';
    if (!isRace(e)) {
      var nts = noticesOf(e.key);
      h += toastHtml() + (nts.length ? '<section class="card banner"><h2>変更の連絡があります</h2>' + nts.map(noticeHtml).join('') + '</section>' : '') + downCard(e) + (e.cancelled ? '' : attendCard(e)) + dutyCard(e) +
        '<section class="card"><div class="sub">お休みするときはホームの「休みを連絡する」からどうぞ。</div>' +
        (ST.me.admin ? '<button class="btn small ghost" data-type="大会" type="button" style="justify-self:start">この予定を大会として扱う</button>' : '') + '</section>' +
        commentsCard(e) + (ST.me.admin && !e.cancelled ? eventEditCard(e) : '');
      view.innerHTML = h;
      on('#back', function () { S.event = null; S.toast = ''; render(); });
      on('[data-type]', function () { call('setEventType', { key: e.key, type: this.dataset.type }); });
      bindDuty(e); bindEventEdit(e); bindComments(e); bindDown(e);
      return;
    }
    var tabs = ['概要', 'エントリー', '種目', 'タイムテーブル', '手続き', '結果', '写真'];
    h += '<div class="tabs" role="group" aria-label="大会の情報">' + tabs.map(function (t) { return '<button type="button" data-et="' + t + '" aria-pressed="' + (S.etab === t) + '">' + t + '</button>'; }).join('') + '</div>' + toastHtml();
    if (S.etab === '概要') {
      h += statusCard(e);
      if (!det) h += '<section class="card"><div class="sub">集合時刻や持ち物などの詳しい案内は、まだ入っていません。</div>' + (ST.me.admin ? '<div class="row"><button class="btn small" id="editRace" type="button">詳しい案内を入れる</button><button class="btn small ghost" data-type="練習" type="button">これは練習の予定</button></div>' : '') + '</section>';
      else {
        h += '<section class="card"><dl class="kv">' + (det.meetTime || det.meetPlace ? '<dt>集合</dt><dd><b>' + esc([det.meetTime, det.meetPlace].filter(Boolean).join(' ')) + '</b></dd>' : '') +
          '<dt>参加費</dt><dd>' + (det.fee ? yen(det.fee) + '／人' : 'なし') + '</dd>' + 
          (det.races.length ? '<dt>種目</dt><dd>' + esc(det.races.join('・')) + '</dd>' : '') + (det.items.length ? '<dt>持ち物</dt><dd>' + det.items.map(esc).join('<br>') + '</dd>' : '') +
          (det.notes ? '<dt>注意</dt><dd>' + esc(det.notes) + '</dd>' : '') + '</dl>' + (ST.me.admin ? '<button class="btn small ghost" id="editRace" type="button">案内を直す</button>' : '') + '</section>';
      }
      h += docsCard(e) + dutyCard(e) + commentsCard(e) + historyCard(e);
    }
    if (S.etab === 'エントリー') h += entryHtml(e);
    if (S.etab === 'タイムテーブル') h += timetableHtml(e);
    if (S.etab === '手続き') h += tasksHtml(e);
    if (S.etab === '写真') h += photosTab(e);
    if (S.etab === '結果') h += resultsTab(e);
    if (S.etab === '種目') h += racesTab(e);
    view.innerHTML = h;
    bindDuty(e);
    if (S.etab === '概要') { bindComments(e); bindRaceInfo(e); bindDeadlines(e); }
    if (S.etab === 'タイムテーブル') bindTimetable(e);
    if (S.etab === '手続き') { bindTasks(e); bindTimetable(e); }
    if (S.etab === '写真') bindPhotos(e);
    if (S.etab === '結果') bindResults(e);
    if (S.etab === '種目') { bindRelay(e); bindDeadlines(e); bindTimetable(e); bindPhotos(e); }
    on('#back', function () { S.event = null; S.toast = ''; S.ttDraft = null; S.relay = null; render(); });
    on('[data-et]', function () { S.etab = this.dataset.et; S.toast = ''; S.ttDraft = null; S.relay = null; render(); });
    on('#editRace', function () { S.draft = draftFrom(e); S.filled = {}; S.tab = 'admin'; S.admin = 'race'; S.toast = ''; render(); window.scrollTo(0, 0); });
    on('[data-type]', function () { call('setEventType', { key: e.key, type: this.dataset.type }); });
    bindEntry(e);
  }

  function entryHtml(e) {
    var det = e.detail || { races: [], target: '全員' }, closed = det.deadline && ST.today > det.deadline, locked = closed && !ST.me.admin, h = '';
    if (ST.me.children.length && e.date >= ST.today) {
      h += '<section class="card"><h2>わが家のエントリー' + (det.deadline ? '<small>締切 ' + md(det.deadline) + '</small>' : '') + '</h2>' + (locked ? '<div class="toast err">締切を過ぎました。変更は役員に連絡してください。</div>' : '') +
        ST.me.children.map(function (k) {
          if (!inTarget(det.target, k.grade)) return '<div class="kid"><b>' + esc(k.name) + '（' + k.grade + '年）</b><span class="sub">この大会の対象外です</span></div>';
          var x = entryOf(e.key, k.name) || { join: '', races: [] }, dis = locked ? ' disabled' : '';
          return '<div class="kid" data-kid="' + esc(k.name) + '"><div class="between"><b>' + esc(k.name) + (k.grade ? '（' + k.grade + '年）' : '') + '</b>' + (x.join === '参加' && det.fee ? '<span class="pill ' + (x.paid ? 'p-ok' : 'p-warn') + '">参加費 ' + yen(det.fee) + (x.paid ? ' 支払い済み' : ' 未払い') + '</span>' : '') + '</div>' +
            '<div class="choice">' + ['参加', '不参加'].map(function (j) { return '<button type="button" class="' + (j === '不参加' ? 'no' : '') + '" data-join="' + j + '" aria-pressed="' + (x.join === j) + '"' + dis + '>' + j + '</button>'; }).join('') + '</div>' +
            (x.join === '参加' && det.races.length > 1 ? '<div class="sub">出る種目</div><div class="choice">' + det.races.map(function (r) { return '<button type="button" data-race="' + esc(r) + '" aria-pressed="' + (x.races.indexOf(r) >= 0) + '"' + dis + '>' + esc(r) + '</button>'; }).join('') + '</div>' : '') + '</div>';
        }).join('') + '</section>';
    }
    var all = eligible(e).slice().sort(function (a, b) { return b.grade - a.grade || (a.name < b.name ? -1 : 1); });
    var joined = all.filter(function (k) { var x = entryOf(e.key, k.name); return x && x.join === '参加'; });
    var paid = joined.filter(function (k) { return entryOf(e.key, k.name).paid; });
    var mine = myNames();
    h += '<section class="card"><h2>みんなのエントリー<small>' + all.length + '人中</small></h2><div class="stats"><div class="stat"><b>' + joined.length + '</b><span>参加</span></div>' +
      '<div class="stat"><b>' + all.filter(function (k) { return !entryOf(e.key, k.name); }).length + '</b><span>未回答</span></div><div class="stat"><b>' + yen(paid.length * (det.fee || 0)) + '</b><span>集金 ' + paid.length + '/' + joined.length + '人</span></div></div>' +

  function parseNotice(raw) {

    function ymd(M, D) { var yy = Number(M) < mo - 2 ? y + 1 : y; return yy + '-' + pad(M) + '-' + pad(D); }

    var extra = t.split('\n').filter(function (l) { return /可です|注意|お願いします|必要です/.test(l) && !/よろしく|宜しく/.test(l) && !/場所|会場/.test(l); });

    return r;
  }

  /** 「5年男子」「4.5.6年混合」「4〜6年の男子」「高学年女子」などの区分に、この子が入るか */
  function groupMatch(g, k) {
    g = toHalf(g || '').replace(/[〜～]/g, '~');
    var sex = /男女|混合/.test(g) ? '' : /男/.test(g) ? '男' : /女/.test(g) ? '女' : '';
    if (sex && k.sex && sex !== k.sex) return false;
    return gradesOf(g).indexOf(k.grade) >= 0 || !gradesOf(g).length || !k.grade;
  }
  function gradesOf(g) {
    var grades = [], m;

    if (/中学年/.test(g)) grades = [3, 4];
    if (/高学年/.test(g)) grades = [4, 5, 6];
    var re = /([1-6](?:\s*[~\-－・.,、]\s*[1-6])*)\s*年/g;
    while ((m = re.exec(g))) {
      var nums = m[1].match(/[1-6]/g).map(Number);
      if (/[~\-－]/.test(m[1]) && nums.length === 2) { for (var i = nums[0]; i <= nums[1]; i++) grades.push(i); }
      else grades = grades.concat(nums);
    }
    return grades;
  }
  /** 種目名の書き方のちがいをそろえる（走り幅跳び＝走幅跳、ボール投げ＝ジャベボール投、リレー＝4X100mR など） */
  function canon(r) {
    r = toHalf(r || '').toLowerCase().replace(/\s/g, '').replace(/[×x]/g, 'x').replace(/\(.*?\)/g, '');
    if (/リレー|\dx\d+m/.test(r)) return 'リレー';

  }

  function callBtn(e, row, k) {

  function nowFull() { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 16).replace('T', ' '); }

  /** 「⏰ 10:00まで（あと40分）」。過ぎた・近いものは色を変える。役員・当番には締切を入れるボタン */

  /** 「10:00」「10/31 17:00」「10/31」を日時にする（時刻だけなら大会の日） */

  // ---- 結果・記録 ----
  /** 種目が「大きいほどよい」（跳・投）か */
  function higherBetter(race) { return /跳|投|ボール/.test(race); }
  /** '1:01.27' '54.95' '15.2秒' → 秒、'41m08' '1m20' '3.20m' → m。読めなければ null */
  function markValue(rec) {
    var r = toHalf(rec || '').replace(/\s/g, ''), m;
    if ((m = r.match(/^(\d+)m(\d{1,2})$/))) return +m[1] + +m[2] / 100;
    if ((m = r.match(/^(\d+(?:\.\d+)?)m$/))) return +m[1];
    if ((m = r.match(/^(\d+)[:'分](\d{1,2}(?:\.\d+)?)"?秒?$/))) return +m[1] * 60 + +m[2];
    if ((m = r.match(/^(\d+(?:\.\d+)?)秒?$/))) return +m[1];
    return null;
  }
  function isBetter(race, a, b) { var x = markValue(a), y = markValue(b); if (x === null) return false; if (y === null) return true; return higherBetter(race) ? x > y : x < y; }
  /** 子どもの種目ごとの自己ベスト（種目名のちがいはそろえる） */
  function bests(child) {
    var out = {};
    ST.results.filter(function (r) { return r.child === child; }).forEach(function (r) {
      var k = canon(r.race), cur = out[k];
      if (!cur || isBetter(r.race, r.record, cur.record)) out[k] = r;
    });
    return out;
  }
  function isPB(r) { var b = bests(r.child)[canon(r.race)]; return b && b === r && ST.results.filter(function (x) { return x.child === r.child && canon(x.race) === canon(r.race); }).length > 1; }

    var h = '';
    if (targets.length) {
      if (!R.child || !targets.some(function (k) { return k.name === R.child; })) R.child = targets[0].name;
      var x = entryOf(e.key, R.child) || { races: [] }, races = x.races.length ? x.races : (e.detail && e.detail.races.length ? e.detail.races : ST.choices.races);

        (targets.length > 1 ? '<label>だれの<select id="rs-child">' + targets.map(function (k) { return '<option' + (k.name === R.child ? ' selected' : '') + '>' + esc(k.name) + '</option>'; }).join('') + '</select></label>' : '<div class="sub"><b>' + esc(R.child) + '</b></div>') +

    });
    bindCopy();
    var f = document.getElementById('joinForm');
    if (f) f.addEventListener('submit', function (x) { x.preventDefault(); call('joinFamily', { code: val('joinCode') }, function () { S.kidsDraft = null; }); });
    on('#leaveFam', function () { if (confirm('家族のまとまりから外れますか？　お子さんの登録は、ほかの家族の人に残ります。')) call('leaveFamily', {}, function () { S.kidsDraft = null; }); });
  }

  // ---- ナビ ----
  var ICONS = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    events: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    family: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    admin: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
    album: '<rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>'
  };
  var NAV = [['home', 'ホーム'], ['events', '予定・大会'], ['album', '写真'], ['family', 'わが家'], ['admin', '管理']];
  function renderNav() {
    var nav = document.getElementById('nav');
    nav.hidden = false;
    nav.className = 'nav' + (ST.me.admin ? ' admin' : '');
    nav.innerHTML = NAV.filter(function (n) { return n[0] !== 'admin' || ST.me.admin; }).map(function (n) {
      return '<button type="button" data-nav="' + n[0] + '"' + (S.tab === n[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n[0]] + '</svg>' + n[1] + '</button>';
    }).join('');
    nav.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { if (this.dataset.nav === 'admin') S.admin = 'menu'; if (this.dataset.nav === 'family') S.kidsDraft = null; go(this.dataset.nav); }); });
  }
  function render() {
    document.getElementById('clubName').textContent = ST.club + ' ポータル';
    document.getElementById('me').textContent = ST.me.name + 'さん' + (ST.me.children.length ? '（' + ST.me.children.map(function (k) { return k.name + (k.grade ? ' ' + k.grade + '年' : ''); }).join('・') + '）' : '') + (ST.me.admin ? '・役員' : '');
    document.getElementById('reload').hidden = false;
    if (S.tab === 'admin' && !ST.me.admin) S.tab = 'home';
    renderNav();
    ({ home: home, events: events, album: album, family: family, admin: admin })[S.tab]();
  }
  document.getElementById('reload').addEventListener('click', function () { S.toast = ''; checkNewVersion(); call('refresh'); });

  /** スマホに古い画面が残っていても、新しい版が出ていれば読み直す（?v= を付けて、保存された画面を使わせない） */
  function checkNewVersion() {
    if (!BUILD || !window.fetch) return;
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/var BUILD = "([^"]*)"/);
      if (m && m[1] && m[1] !== BUILD) location.replace(location.pathname + '?v=' + m[1]);
    }).catch(function () {});
  }

  // ---- ログイン ----
  var STORE = 'clubPortalKey';
  function saveKey(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function loadKey() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function clearKey() { try { localStorage.removeItem(STORE); } catch (e) {} KEY = ''; }
  function showLogin(msg) {
    document.getElementById('nav').hidden = true;
    document.getElementById('reload').hidden = true;
    document.getElementById('me').textContent = '';
    view.innerHTML = '<section class="card"><div class="big">ようこそ</div><div class="sub">このページは、' + esc(CLUB) + 'のLINEグループのメンバーだけが見られます。グループに入っているLINEアカウントでログインしてください。</div>' +
      (msg ? '<div class="toast' + (/しました/.test(msg) ? '' : ' err') + '">' + esc(msg) + '</div>' : '') +
      '<a class="btn" id="loginBtn" href="' + esc(LOGIN_URL || '#') + '" target="_top" style="text-align:center;text-decoration:none;background:#06c755">LINEでログイン</a>' +
      '<div class="hint">LINEアプリの中で開くと、ボタンを押すだけでログインできます。</div></section>';
    // GitHub Pages の画面では、押したときにログイン用の URL をもらう
    if (!LOGIN_URL) document.getElementById('loginBtn').addEventListener('click', function (e) {
      e.preventDefault();
      var b = this; b.textContent = 'LINEに移動しています…';
      rpc('loginUrl', {}, function (r) { window.top.location.href = r.url; }, function (err) { b.textContent = 'LINEでログイン'; showLogin(err.message); });
    });
  }
  // 家族の招待リンク（?join=番号）で開いたときは、ログインのあとで家族になる
  var JOIN = 'clubPortalJoin';
  function pendingJoin() {
    var code = ''; try { code = localStorage.getItem(JOIN) || ''; localStorage.removeItem(JOIN); } catch (e) {}
    if (code && confirm('家族の招待番号 ' + code + ' で、家族の登録をまとめますか？')) call('joinFamily', { code: code }, function () { S.tab = 'family'; S.kidsDraft = null; });
  }
  function start() {
    if (KEY) saveKey(KEY);
    else KEY = loadKey();
    if (KEY) call('bootstrap', null, pendingJoin);   // ログイン直後、または前回のログインが残っているとき（再読み込みで期限切れの表示が出ても、保存したキーで開く）
    else showLogin(LOGIN_ERROR);
  }
  // GitHub Pages の画面に LINE ログインから戻ってきたとき（?code=&state=）
  var q = new URLSearchParams(location.search);
  if (q.get('tab') && /^(home|events|album|family)$/.test(q.get('tab'))) S.tab = q.get('tab');
  if (q.get('v') || q.get('tab')) { q.delete('v'); q.delete('tab'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
  if (q.get('join')) {
    try { localStorage.setItem(JOIN, q.get('join').replace(/\D/g, '').slice(0, 6)); } catch (e) {}
    q.delete('join');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  }
  if (API_URL && (q.get('code') || q.get('error'))) {
    history.replaceState(null, '', location.pathname);
    if (q.get('error')) { LOGIN_ERROR = 'LINEログインがキャンセルされました。'; start(); }
    else {
      view.innerHTML = '<div class="empty">ログインしています…</div>';
      rpc('login', { code: q.get('code'), state: q.get('state') }, function (r) { KEY = r.key; start(); }, function (err) {
        // 再読み込みなどで同じ code をもう一度使ったときは、保存してあるキーで開く
        KEY = loadKey();
        if (KEY) call('bootstrap', null, pendingJoin); else showLogin(err.message);
      });
    }
  } else {
    start();
  }
  checkNewVersion();
})();
</script>
</body>
</html>
