x),\n    dutyOrder: ctx.admin ? { '練習': dutyOrder_('練習'), '大会': dutyOrder_('大会') } : {},\n    comments: commentsFor_(ctx),\n    polls: pollsFor_(ctx, families),\n    fees: feesFor_(ctx, children),\n    docs: readRows_(SHEETS.DOCS).filter((x) => x.id && raceKeys[x.eventKey]).map((x) => ({ id: x.id, key: x.eventKey, kind: x['種類'], name: x['名前'], url: x.URL, file: x['ファイルID'], type: x['形式'], by: x['追加者'], at: x['日時'] })),\n    history: readRows_(SHEETS.HISTORY).filter((x) => raceKeys[x.eventKey]).map((x) => ({ key: x.eventKey, at: x['日時'], by: x['表示名'], text: x['内容'] })).reverse(),\n    choices: { races: CHOICES.RACES, items: CHOICES.ITEMS, targets: CHOICES.TARGETS, reasons: CHOICES.ABSENCE_REASONS, deadlineDays: CONFIG.DEADLINE_DAYS_BEFORE, practiceTimes: CONFIG.PRACTICE_TIMES, rounds: CHOICES.ROUNDS, applyHow: CHOICES.APPLY_HOW, docKinds: CHOICES.DOC_KINDS, warmMinutes: CONFIG.WARM_UP_MINUTES_BEFORE_CALL, dutyGuide: CONFIG.DUTY_GUIDE || [], videoKinds: VIDEO_KINDS, botId: botBasicId_(), absencePush: CONFIG.ABSENCE_PUSH_TO_ADMINS },\n  };\n}\n\n/**\n * 子どものいる家族の一覧（当番表に使う）。名前は「子どもの名前」で表す。\n * @return {{id: string, label: string, parents: string[], userIds: string[]}[]}\n */\nfunction familiesList_(familyRows, children) {\n  const byId = {};\n  familyRows.forEach((f) => {\n    const id = famIdOf_(f);\n    const x = byId[id] || (byId[id] = { id: id, parents: [], userIds: [], kids: [] });\n    x.parents.push(f['表示名'] || '保護者');\n    x.userIds.push(f.userId);\n  });\n  children.forEach((c) => {\n    Object.keys(byId).forEach((id) => {\n      const x = byId[id];\n      if (c.parents.some((u) => x.userIds.indexOf(u) >= 0) && x.kids.indexOf(c) < 0) x.kids.push(c);\n    });\n  });\n  // 空白入りで登録された子の名字（「海野 そら」→ 海野）。空白なしの子の名字さがしに使う\n  const knownSur = children.map((c) => String(c.name).trim().split(/[\\s　]+/)).filter((x) => x.length > 1).map((x) => x[0]);\n  return Object.keys(byId).map((id) => byId[id]).filter((x) => x.kids.length)\n    .map((x) => ({ id: x.id, label: familyLabel_(x.kids.sort((a, b) => b.grade - a.grade).map((c) => c.name), x.parents, knownSur), parents: x.parents, userIds: x.userIds, kids: x.kids.map((c) => c.name) }))\n    .sort((a, b) => (a.label < b.label ? -1 : 1));\n}\n\n/**\n * 家族の呼び名：「名字家（子どもの下の名前）」。例：海野家（そら）、森家（あおい・ゆう）\n * 名字は、子どもの名前の空白の前。空白がなければ、ほかの子の名字（空白入りで登録された子）、保護者のLINEの名前、きょうだいの名前の頭の共通部分から。\n * 分からなければ子どもの名前をそのまま\n */\nfunction familyLabel_(kids, parents, knownSur) {\n  const strip = (s) => String(s || '').replace(/[\\s　]/g, '');\n  const common = (a, b) => { let n = 0; while (n < a.length && n < b.length && a[n] === b[n]) n++; return n; };\n  let sur = '';\n  const sp = kids.map((k) => String(k).trim().split(/[\\s　]+/)).find((x) => x.length > 1);\n  if (sp) sur = sp[0];\n  else {\n    const k0 = strip(kids[0]);\n    const fromParent = Math.max.apply(null, [0].concat(parents.map((p) => common(k0, strip(p)))));\n    const fromSib = kids.length > 1 ? Math.min.apply(null, kids.slice(1).map((k) => common(k0, strip(k)))) : 0;\n    const known = (knownSur || []).filter((x) => k0.indexOf(x) === 0 && k0.length > x.length).sort((a, b) => b.length - a.length)[0];\n    const n = known ? known.length : fromParent || fromSib;\n    if (n > 0 && n < k0.length) sur = k0.slice(0, Math.min(n, 4));\n  }\n  if (!sur) return kids.join('・');\n  const given = kids.map((k) => { const t = strip(k); return t.indexOf(sur) === 0 && t.length > sur.length ? t.slice(sur.length) : t; });\n  return sur + '家（' + given.join('・') + '）';\n}\n\n/** 休みの連絡をLINEで受け取るか。「休み通知」が ○ の人、または役員（× にした人を除く） */\nfunction wantsAbsenceNotice_(f) {\n  const v = String(f['休み通知'] || '').trim();\n  if (/^(○|◯|〇|o|1|true)$/i.test(v)) return true;\n  if (/^(×|x|0|false)$/i.test(v)) return false;\n  return isAdmin_(f);\n}\n\n// ---- 操作 ----\n\n/** 役員か、この大会の当番の家族 */\nfunction isManager_(ctx, key) {\n  if (ctx.admin) return true;\n  return !!key && readRows_(SHEETS.DUTIES).some((d) => d.eventKey === key && d['家族ID'] === ctx.famId);\n}\n\nfunction requireMyChild_(ctx, name) {\n  const mine = childrenOf_(ctx.userId).some((c) => c.name === name);\n  if (!mine && !ctx.admin) throw new Error(name + 'さんは、あなたのお子さんとして登録されていません。');\n}\n\nfunction saveChildrenAction_(ctx, p) {\n  const list = (p.children || [])\n    .map((c) => ({ name: String(c.name || '').trim().slice(0, 30), grade: Math.max(0, Math.min(6, Number(c.grade) || 0)), sex: c.sex === '男' || c.sex === '女' ? c.sex : '' }))\n    .filter((c) => c.name);\n  saveChildren_(ctx.userId, list);\n  return list.length ? '登録しました：' + list.map((c) => c.name).join('、') : '登録を消しました';\n}\n\n/** 大会の対象学年に入っているか */\nfunction inTarget_(target, grade) {\n  const m = String(target || '').match(/([1-6])年生?以上/);\n  return !m || !grade || grade >= Number(m[1]);\n}\n\n/**\n * エントリー。保護者は「参加・不参加」だけ。出る種目は役員（とこの大会の当番）が登録する。\n * 保護者が送った種目は使わず、役員が入れた種目をそのまま残す（種目が1つだけの大会は自動でそれ）\n */\nfunction saveEntryAction_(ctx, p) {\n  const mgr = isManager_(ctx, p.key);\n  if (!mgr) requireMyChild_(ctx, p.child);\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  const race = readRows_(SHEETS.RACES).find((r) => r.eventKey === p.key);\n  const detail = race ? raceToObj_(race) : { races: [], deadline: '' };\n  if (!mgr && detail.deadline && today_() > detail.deadline) throw new Error('エントリーの締切（' + formatDate_(detail.deadline) + '）を過ぎています。役員に連絡してください。');\n  if (p.join !== '参加' && p.join !== '不参加') throw new Error('参加か不参加を選んでください。');\n  // 「クロカンリレー（男子）」のように部を付けたものは、もとの種目が大会にあればよい\n  const okRace = (r) => !detail.races.length || detail.races.indexOf(r) >= 0 || detail.races.indexOf(String(r).replace(/\\s*[（(][^）)]*[）)]\\s*$/, '').trim()) >= 0;\n  let races = [];\n  withLock_(() => {\n    const rows = readRows_(SHEETS.ENTRIES);\n    const row = rows.find((x) => x.eventKey === p.key && x['子ども'] === p.child);\n    if (p.join === '参加') {\n      if (mgr && p.races) races = p.races.filter(okRace);\n      else races = row ? splitNames_(row['種目']).filter(okRace) : [];\n      if (!races.length && detail.races.length === 1) races = detail.races.slice();\n    }\n    const data = { eventKey: p.key, '子ども': p.child, '回答': p.join, '種目': races.join(','), '更新者': ctx.name, '更新日時': now_() };\n    if (row) updateRow_(SHEETS.ENTRIES, Object.assign(row, data));\n    else appendRow_(SHEETS.ENTRIES, Object.assign(data, { '集金': '' }));\n  });\n  logHistory_(p.key, ctx, 'エントリー：' + p.child + ' ' + p.join + (races.length ? '（' + races.join('・') + '）' : ''));\n  return p.child + '：' + p.join + (races.length ? '（' + races.join('・') + '）' : '') + 'で受け付けました';\n}\n\nfunction setPaidAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.ENTRIES).find((x) => x.eventKey === p.key && x['子ども'] === p.child);\n    if (!row) throw new Error('エントリーが見つかりません。');\n    row['集金'] = p.paid ? '済' : '';\n    row['更新日時'] = now_();\n    updateRow_(SHEETS.ENTRIES, row);\n  });\n  logHistory_(p.key, ctx, '集金：' + p.child + (p.paid ? ' 済' : ' 未にもどす'));\n  return '';\n}\n\nfunction reportAbsenceAction_(ctx, p) {\n  requireMyChild_(ctx, p.child);\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(p.date || '')) throw new Error('日にちを選んでください。');\n  if (p.date < today_()) throw new Error('過ぎた日の連絡はできません。');\n  const reason = CHOICES.ABSENCE_REASONS.indexOf(p.reason) >= 0 ? p.reason : 'その他';\n  const memo = String(p.memo || '').slice(0, 200);\n  withLock_(() => {\n    clearAttend_(p.date, p.child);\n    appendRow_(SHEETS.ABSENCES, { id: randomKey_().slice(0, 10), '日付': p.date, '子ども': p.child, '理由': reason, 'メモ': memo, '連絡者userId': ctx.userId, '連絡者': ctx.name, '確認': '', '確認者': '', '日時': now_() });\n  });\n  if (CONFIG.ABSENCE_PUSH_TO_ADMINS) notifyAbsence_(p.date, '🏃 休みの連絡\\n' + formatDate_(p.date) + ' ' + p.child + '（' + reason + '）' + (memo ? '\\n' + memo : '') + '\\n連絡：' + ctx.name + 'さん', ctx.userId);\n  return formatDate_(p.date) + ' ' + p.child + 'のお休みを連絡しました';\n}\n\n/**\n * 休みの連絡を、受け取る係の人（役員など）と、その日の練習の当番の家族に、1対1のLINEで送る。\n * Botを友だち追加している人にだけ届く。1人につき1通、無料枠の通数を使う。\n */\nfunction absenceRecipients_(date) {\n  const families = readRows_(SHEETS.FAMILIES);\n  const dutyFams = readRows_(SHEETS.DUTIES).filter((d) => d['日付'] === date && d['種類'] === '練習').map((d) => d['家族ID']);\n  return families.filter((f) => wantsAbsenceNotice_(f) || dutyFams.indexOf(famIdOf_(f)) >= 0).map((f) => f.userId);\n}\n\nfunction notifyAbsence_(date, text, exceptUserId) {\n  absenceRecipients_(date).filter((u) => u !== exceptUserId).forEach((u) => {\n    try {\n      push_(u, [text_(text)]);\n    } catch (err) {\n      console.warn('休みの通知に失敗: ' + u + ' ' + err);\n    }\n  });\n}\n\nfunction findAbsence_(id) {\n  return readRows_(SHEETS.ABSENCES).find((a) => a.id && a.id === id) || null;\n}\n\nfunction cancelAbsenceAction_(ctx, p) {\n  withLock_(() => {\n    const a = findAbsence_(p.id);\n    if (!a || (a['連絡者userId'] !== ctx.userId && !ctx.admin)) throw new Error('取り消せる連絡が見つかりません。');\n    clearRow_(SHEETS.ABSENCES, a);\n  });\n  return '休みの連絡を取り消しました';\n}\n\nfunction ackAbsenceAction_(ctx, p) {\n  withLock_(() => {\n    const a = findAbsence_(p.id);\n    if (!a) throw new Error('連絡が見つかりません。');\n    a['確認'] = a['確認'] === '済' ? '' : '済';\n    a['確認者'] = a['確認'] ? ctx.name : '';\n    updateRow_(SHEETS.ABSENCES, a);\n  });\n  return '';\n}\n\nfunction cleanList_(list, max) {\n  return (list || []).map((x) => String(x).trim().slice(0, 30)).filter(Boolean).slice(0, max || 30);\n}\n\nfunction saveRaceAction_(ctx, p) {\n  const title = String(p.title || '').trim().slice(0, 80);\n  if (!title) throw new Error('大会名を入れてください。');\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(p.date || '')) throw new Error('日付を入れてください。');\n  const place = String(p.place || '').trim().slice(0, 80);\n  const prev = p.key ? readRows_(SHEETS.EVENTS).find((e) => e.eventKey === p.key) : null;\n  if (!ctx.admin && !prev) throw new Error('新しい大会を作るのは役員だけです。');\n  const ev = upsertRaceEvent_(p.key || '', title, p.date, place);\n  const deadline = /^\\d{4}-\\d{2}-\\d{2}$/.test(p.deadline || '') ? p.deadline : '';\n  const ymd = (v) => (/^\\d{4}-\\d{2}-\\d{2}$/.test(v || '') ? v : '');\n  const url = /^https?:\\/\\/\\S+$/.test(String(p.url || '').trim()) ? String(p.url).trim().slice(0, 300) : '';\n  const data = {\n    eventKey: ev.eventKey,\n    '種別': ['大会', '記録会', '練習試合'].indexOf(p.type) >= 0 ? p.type : '大会',\n    '対象': String(p.target || '全員').slice(0, 20),\n    '参加費': String(Math.max(0, Number(p.fee) || 0)),\n    '締切': deadline,\n    '集合時刻': String(p.meetTime || '').slice(0, 10),\n    '集合場所': String(p.meetPlace || '').slice(0, 80),\n    '種目': cleanList_(p.races).join(','),\n    '持ち物': cleanList_(p.items).join(','),\n    '注意': String(p.notes || '').slice(0, 1000),\n    '更新日時': now_(),\n    '主催': String(p.organizer || '').trim().slice(0, 60),\n    '申込期限': ymd(p.applyBy),\n    '申込方法': CHOICES.APPLY_HOW.indexOf(p.applyHow) >= 0 ? p.applyHow : '',\n    '支払期限': ymd(p.payBy),\n    '受付': String(p.reception || '').trim().slice(0, 80),\n    '要項URL': url,\n  };\n  let created = false, changes = [];\n  withLock_(() => {\n    const row = readRows_(SHEETS.RACES).find((r) => r.eventKey === ev.eventKey);\n    if (row) { changes = raceChanges_(row, data); updateRow_(SHEETS.RACES, Object.assign(row, data)); }\n    else { appendRow_(SHEETS.RACES, data); created = true; }\n  });\n  if (prev) {\n    if (String(prev['タイトル']) !== title) changes.unshift('大会名');\n    if (String(prev['日付']) !== p.date) changes.unshift('日付 ' + String(prev['日付']).slice(5).replace('-', '/') + '→' + p.date.slice(5).replace('-', '/'));\n    if (String(prev['場所'] || '') !== place) changes.push('会場');\n  }\n  logHistory_(ev.eventKey, ctx, created ? '大会の案内をつくりました' : '大会の案内を直しました' + (changes.length ? '（' + changes.join('、') + '）' : ''));\n  return '「' + title + '」を保存しました';\n}\n\n/** 大会の案内で変わったところ（履歴に残して、みんなで確かめられるように） */\nfunction raceChanges_(before, after) {\n  const out = [];\n  const short = { '集合時刻': 1, '参加費': 1, '締切': 1, '申込期限': 1, '支払期限': 1, '対象': 1, '種別': 1 };\n  const md = (v) => (/^\\d{4}-\\d{2}-\\d{2}$/.test(v) ? v.slice(5).replace('-', '/') : v);\n  Object.keys(after).forEach((k) => {\n    if (k === 'eventKey' || k === '更新日時') return;\n    const a = String(before[k] == null ? '' : before[k]), b = String(after[k] == null ? '' : after[k]);\n    if (a === b) return;\n    if (k === '種目' || k === '持ち物') {\n      const A = a ? a.split(',') : [], B = b ? b.split(',') : [];\n      const add = B.filter((x) => A.indexOf(x) < 0), del = A.filter((x) => B.indexOf(x) < 0);\n      return out.push(k + ' ' + add.map((x) => '+' + x).concat(del.map((x) => '−' + x)).join(' '));\n    }\n    if (short[k]) return out.push(k + ' ' + (md(a) || 'なし') + '→' + (md(b) || 'なし'));\n    out.push(k);\n  });\n  return out;\n}\n\n/** カレンダーから取り込んだ予定の種別（練習／大会）を直す */\nfunction setEventTypeAction_(ctx, p) {\n  withLock_(() => {\n    const ev = findEvent_(p.key);\n    if (!ev) throw new Error('予定が見つかりません。');\n    ev['種別'] = p.type === '練習' ? '練習' : '大会';\n    updateRow_(SHEETS.EVENTS, ev);\n  });\n  return '';\n}\n\nfunction saveNoticeAction_(ctx, p) {\n  const title = String(p.title || '').trim().slice(0, 80);\n  if (!title) throw new Error('タイトルを入れてください。');\n  withLock_(() => {\n    appendRow_(SHEETS.NOTICES, { id: randomKey_().slice(0, 10), '日付': today_(), 'タイトル': title, '本文': String(p.body || '').slice(0, 2000), eventKey: p.key || '', '作成者': ctx.name, '日時': now_(), '重要': p.important ? '○' : '' });\n  });\n  return 'お知らせを載せました';\n}\n\n/** お知らせを読んだ（画面に出たら、まとめて呼ぶ） */\nfunction markReadAction_(ctx, p) {\n  const ids = (p.ids || []).slice(0, 20).map(String);\n  if (!ids.length) return '';\n  withLock_(() => {\n    const have = readRows_(SHEETS.READS).filter((r) => r.userId === ctx.userId).map((r) => r['お知らせid']);\n    ids.filter((id) => have.indexOf(id) < 0).forEach((id) => appendRow_(SHEETS.READS, { 'お知らせid': id, userId: ctx.userId, '日時': now_() }));\n  });\n  return '';\n}\n\nfunction deleteNoticeAction_(ctx, p) {\n  withLock_(() => {\n    const n = readRows_(SHEETS.NOTICES).find((x) => x.id && x.id === p.id);\n    if (n) clearRow_(SHEETS.NOTICES, n);\n  });\n  return 'お知らせを消しました';\n}\n\n/** このApps Scriptのエディタを開くURL（役員の「サーバーの更新」から開く） */\nfunction scriptEditorUrl_() {\n  try { return 'https://script.google.com/home/projects/' + ScriptApp.getScriptId() + '/edit'; } catch (err) { return 'https://script.google.com/home'; }\n}\n","Portal.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<base target=\"_top\">\n<meta charset=\"utf-8\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap\">\n<style>\n:root {\n  --bg: #e9eef0; --surface: #ffffff; --surface-2: #f3f6f7; --fg: #182328; --muted: #5f7079; --line: #d6dfe3;\n  --track: #c4512f; --track-soft: #f6e1d9; --field: #237a55; --field-soft: #dcefe5; --sky: #2f6fae; --sky-soft: #dde9f5;\n  --warn: #a8660b; --warn-soft: #f8ead2; --viz-line: #2f6fae; --viz-pb: #c4512f;\n  /* 学年の色（1年〜6年。色は学年に付いて、並びで変わらない） */\n  --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --g4: #eda100; --g5: #e87ba4; --g6: #008300;\n  /* 目標の色（濃い藍に金。ほかの画面と区別する） */\n  --goal-a: #26457f; --goal-b: #172c55; --goal-gold: #ffc94d; --goal-ink: #ffffff; --goal-soft: #e6ecf7;\n  --staff: #6a4fb0; --staff-soft: #f1ecfa;\n  --font-display: \"M PLUS Rounded 1c\", \"Hiragino Maru Gothic ProN\", \"Noto Sans JP\", sans-serif;\n  --font-body: \"Hiragino Sans\", \"Noto Sans CJK JP\", \"Noto Sans JP\", \"Yu Gothic UI\", system-ui, sans-serif; /* 本文はスマホに入っている日本語の字（ダウンロードしない） */\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #0f1518; --surface: #182126; --surface-2: #1f2a30; --fg: #e4ebee; --muted: #94a5ad; --line: #2d3a40;\n    --track: #ec8566; --track-soft: #3f2219; --field: #4cc28c; --field-soft: #163527; --sky: #6aa7e3; --sky-soft: #172b3f;\n    --warn: #e5a54a; --warn-soft: #3a2a12; --viz-line: #4f8fd1; --viz-pb: #e07050; color-scheme: dark;\n    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500; --g5: #d55181; --g6: #008300;\n    --goal-a: #24395f; --goal-b: #141f38; --goal-gold: #ffd36b; --goal-ink: #f4f7ff; --goal-so (LITE || diff(ST.today, mdE.date) > 7)) {\n      info += '<section class=\"card banner\"><h2>わが家の当番<small>' + (mdE.date === ST.today ? '今日' : 'あと' + diff(ST.today, mdE.date) + '日') + '<\/small><\/h2><button class=\"ev\" type=\"button\" data-ev=\"' + mdE.key + '\"><span class=\"main\"><span class=\"big\">' + md(mdE.date) + ' ' + esc(md0.type) + '当番<\/span><br><span class=\"sub\">' + esc(mdE.title) + (mdE.place ? '・' + esc(mdE.place) : '') + '<\/span><\/span>›<\/button><div class=\"row\">' + swapBtn(mdE.key) + '<\/div><\/section>';\n    }\n    upcoming(function (e) { return isRace(e) && e.date <= addDays(ST.today, 1); }).forEach(function (e) { h += jinchiCard(e, true); });\n    var today = upcoming(function (e) { return isRace(e) && e.date <= addDays(ST.today, 1); }).filter(function (e) { return myCalls(e).length; })[0];\n    if (today) {\n      var calls = myCalls(today);\n      h += '<section class=\"card banner\"><h2>' + (today.date === ST.today ? '今日' : '明日') + 'の大会<small>' + esc(today.title) + '<\/small><\/h2><div class=\"list\">' + calls.map(function (c) {\n        return '<div class=\"between\"><span><b>' + esc(c.r.start || '') + '<\/b> ' + esc(c.k.name) + '・' + esc(c.r.race) + ' <span class=\"sub\">' + (c.r.call ? '招集 ' + esc(c.r.call) : '') + '<\/span><\/span>' + (c.done ? '<span class=\"pill p-ok\">招集OK<\/span>' : '') + '<\/div>';\n      }).join('') + '<\/div><button class=\"btn small\" type=\"button\" data-gott=\"' + today.key + '\">タイムテーブル・招集 ›<\/button><\/section>';\n    }\n    var orphan = ST.comments.filter(function (c) { return c.kind === '変更連絡' && !c.key && !c.measure && c.date >= ST.today; });\n    if (orphan.length) info += '<section class=\"card\"><h2>予定にない日の連絡<small>' + orphan.length + '件<\/small><\/h2><div class=\"list\">' + orphan.map(noticeHtml).join('') + '<\/div><\/section>';\n    var nms = ST.comments.filter(function (c) { return c.kind === 'ヒヤリハット' && c.date >= addDays(ST.today, -30); });\n    if (nms.length && !LITE) info += '<section clas e', { id: this.dataset.freopen, reopen: true }); });\n    on('[data-fdel]', function () { if (confirm('この集金と記録を消しますか？')) call('closeFee', { id: this.dataset.fdel, remove: true }); });\n  }\n\n  /** 名簿の文を読む：1行に1人。「山田 はな 6年 女」「山田はな,6,女」「名前\\t学年\\t男女」など */\n  function parseRoster(text) {\n    return String(text || '').split(/\\r?\\n/).map(function (line) {\n      var t = toHalf(line).replace(/[,，、\\t]/g, ' ').trim();\n      if (!t || /^(名前|氏名|No|番号)/.test(t)) return null;\n      var toks = t.split(/\\s+/), grade = 0, sex = '', name = [];\n      toks.forEach(function (x, i) {\n        var g = x.match(/^([1-6])(年生?)?$/);\n        if (g && !grade && (i > 0 || toks.length === 1)) { grade = +g[1]; return; }\n        if (/^(男|女|男子|女子|M|F)$/i.test(x) && !sex) { sex = /女|F/i.test(x) ? '女' : '男'; return; }\n        if (/^\\d+$/.test(x) && i === 0) return; // 行の番号\n        name.push(x);\n      });\n      return name.length ? { name: name.join(' '), grade: grade, sex: sex } : null;\n    }).filter(Boolean);\n  }\n  function adminRoster() {\n    var R = S.roster || (S.roster = { text: '', preview: null });\n    var kids = ST.kids.slice().sort(byGrade), free = kids.filter(function (k) { return k.free; }).length;\n    var h = backBtn() + toastHtml() + '<section class=\"card\"><h2>名簿にまとめて入れる<\/h2><div class=\"sub\">1行に1人、<b>名前・学年・男女<\/b>を書いて（Excelやスプレッドシートからのコピーでも）貼り付けてください。学年と男女はなくてもOK。<\/div>' +\n      '<form class=\"f\" id=\"rosForm\"><textarea id=\"rosIn\" rows=\"8\" placeholder=\"山田 はな 6年 女&#10;佐藤 じろう 5年 男&#10;鈴木 さくら 4 女\">' + esc(R.text) + '<\/textarea><button class=\"btn ghost\" type=\"submit\">読み取って確認する<\/button><\/form>';\n    if (R.preview) {\n      h += '<div class=\"tbl-wrap\"><table><thead><tr><th>名前<\/th><th>学年<\/th><th>男女<\/th><th><\/th><\/tr><\/thead><tbody>' + R.preview.map(function (r) {\n        var have = ST.kids.some(function (k) { return k.name.replace(/\\s/g, '') === r.name.replace(/\\s/g, ''); });\n        return '<tr><td>' + esc(r.name) + '<\/td><td>' + (r.grade ? r.grade + '年' : '<span class=\"sub\">—<\/span>') + '<\/td><td>' + (r.sex || '<span class=\"sub\">—<\/span>') + '<\/td><td class=\"sub\">' + (have ? '登録済み（学年などを直す）' : '新しく入れる') + '<\/td><\/tr>';\n      }).join('') + '<\/tbody><\/table><\/div><div class=\"row\"><button class=\"btn\" id=\"rosSave\" type=\"button\">' + R.preview.length + '人を名簿に入れる<\/button><button class=\"btn ghost\" id=\"rosX\" type=\"button\">やめる<\/button><\/div>';\n    }\n    h += '<div class=\"hint\">保護者がポータルの「わが家」で同じ名前（空白はあってもなくてもOK）を登録すると、その子に結びつきます。「わが家」の登録画面にも、名簿の名前がボタンで出ます。<\/div><\/section>';\n    h += '<section class=\"card\"><h2>名簿<small>' + kids.length + '人・保護者まだ ' + free + '人<\/small><\/h2>' + (kids.length ? '<div class=\"list\">' + kids.map(function (k) {\n      return '<div class=\"between\"><span><b>' + esc(k.name) + '<\/b> <span class=\"sub\">' + (k.grade ? k.grade + '年' : '学年？') + (k.sex ? '・' + k.sex : '') + '<\/span>' + (k.free ? ' <span class=\"pill p-warn\">保護者まだ<\/span>' : '') + '<\/span>' + (k.free ? '<button class=\"btn small ghost\" data-rosdel=\"' + esc(k.name) + '\" type=\"button\">外す<\/button>' : '') + '<\/div>';\n    }).join('') + '<\/div>' : '<div class=\"sub\">まだだれもいません。<\/div>') + '<div class=\"hint\">保護者が登録した子の学年・男女は、上に同じ名前で書いて入れると直せます。<\/div><\/section>';\n    view.innerHTML = h;\n    bindBack();\n    document.getElementById('rosForm').addEventListener('submit', function (x) { x.preventDefault(); R.text = document.getElementById('rosIn').value; R.preview = parseRoster(R.text); if (!R.preview.length) { S.toast = '名前が読み取れませんでした。'; S.toastErr = true; } render(); });\n    on('#rosX', function () { R.preview = null; render(); });\n    on('#rosSave', function () { call('saveRoster', { rows: R.preview }, function (st) { if (st.message) { R.preview = null; R.text = ''; } }); });\n    on('[data-rosdel]', function () { if (confirm(this.dataset.rosdel + 'を名簿から外しますか？')) call('removeRoster', { name: this.dataset.rosdel }); });\n  }\n  function adminAbsences() {\n    var list  function sameRace(a, b) { return sameCanon(canon(a), canon(b)); }\n  /** 同じ種目か。リレーとリレーでないもの・距離のちがうもの・ハードルとそうでないものは別 */\n  function sameCanon(a, b) {\n    if (!a || !b) return false;\n    if (a === b) return true;\n    var rel = function (x) { return x.indexOf('リレー') === 0; }, num = function (x) { return (x.match(/\\d+/g) || []).join('x'); }, hur = function (x) { return /\\dmh|^h|h$/.test(x); };\n    if (rel(a) !== rel(b) || hur(a) !== hur(b)) return false;\n    if (num(a) && num(b) && num(a) !== num(b)) return false;\n    return a.indexOf(b) >= 0 || b.indexOf(a) >= 0;\n  }\n  function isRelay(r) { return canon(r).indexOf('リレー') === 0; }\n  // エントリーの種目に「（男子）」のように部が付いていたら、時刻表のその部（区分）の行だけに合わせる\n  function raceMatch(row, x) { return x.races.some(function (q) { return sameRace(row.race, q) && (!raceQual(q) || sameGroup(raceQual(q), row.group)); }); }\n  /** 同じ部か（「1・2・3・4年男女」と「1〜4年男女」は同じ） */\n  function sameGroup(a, b) {\n    if (normG(a) === normG(b)) return true;\n    var x = ttGroupParse(a), y = ttGroupParse(b);\n    return (x.grades.length || x.sex) && x.grades.slice().sort().join() === y.grades.slice().sort().join() && x.sex === y.sex;\n  }\n  /** 部の名前（保存のときに「・」や空白で切れないように、学年は「1〜4年」の形に） */\n  function qualLabel(g) {\n    var p = ttGroupParse(g), gs = p.grades.slice().sort();\n    var ok = gs.length && gs.every(function (v, i) { return !i || v === gs[i - 1] + 1; });\n    if (!gs.length && p.sex) return p.sex;\n    if (ok) return (gs.length > 1 ? gs[0] + '〜' + gs[gs.length - 1] : gs[0]) + '年' + p.sex;\n    return toHalf(g).replace(/[\\s・,、]/g, '');\n  }\n  function raceBase(q) { return String(q || '').replace(/\\s*[（(][^）)]*[）)]\\s*$/, '').trim(); }\n  function raceQual(q) { var m = String(q || '').match(/[（(]([^）)]*)[）)]\\s*$/); return m ? m[1].trim() : ''; }\n  /** 種目の選びかた。時刻表で同じ種目が部（男子・女子・学年など）に分かれていたら「種目（部）」ごとに。保護者・一般の部は除く */\n  function raceOptions(e, race) {\n    if (raceQual(race)) return [race];\n    var gs = [];\n    ttRows(e).forEach(function (r) { var g = S lded));\n      if (!h2.querySelector('.fold-ic')) h2.insertAdjacentHTML('beforeend', '<span class=\"fold-ic\" aria-hidden=\"true\">⌄<\/span>');\n      var toggle = function (ev) {\n        if (ev.target.closest('button, a, input, select, label')) return;\n        if (ev.type === 'keydown' && ev.key !== 'Enter' && ev.key !== ' ') return;\n        ev.preventDefault();\n        var now = !card.classList.contains('folded'), s2 = foldState();\n        s2[key] = now;\n        try { localStorage.setItem(FOLD_STORE, JSON.stringify(s2)); } catch (e) {}\n        card.classList.toggle('folded', now);\n        h2.setAttribute('aria-expanded', String(!now));\n      };\n      h2.addEventListener('click', toggle);\n      h2.addEventListener('keydown', toggle);\n    });\n  }\n\n  document.getElementById('reload').addEventListener('click', function () { S.toast = ''; checkNewVersion(); call('refresh'); });\n\n  /** スマホに古い画面が残っていても、新しい版が出ていれば読み直す（?v= を付けて、保存された画面を使わせない） */\n  function checkNewVersion() {\n    if (!BUILD || !window.fetch) return;\n    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {\n      var m = t.match(/var BUILD = \"([^\"]*)\"/);\n      if (m && m[1] && m[1] !== BUILD) location.replace(location.pathname + '?v=' + m[1]);\n    }).catch(function () {});\n  }\n\n  // ---- ログイン ----\n  var STORE = 'clubPortalKey';\n  function saveKey(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }\n  function loadKey() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }\n  function clearKey() { try { localStorage.removeItem(STORE); localStorage.removeItem(STATE); } catch (e) {} KEY = ''; }\n  // 前回の画面を覚えておき、次に開いたときすぐ出す（そのあと裏で最新にする）\n  var STATE = 'clubPortalState';\n  function saveState(st) { saveStateJs(JSON.stringify(st)); }\n  function saveStateJs(js) { if (S.asTest) return; try { localStorage.setItem(STATE, '{\"k\":' + JSON.stringify(String(KEY).slice(0, 8)) + ',\"st\":' + js + '}'); } catch (e) {} }\n  function loadState() { try { var s = JSON.parse(localStorage.getItem(STATE) || 'null'); return s && s.k === String(KEY).slice(0, 8) ? s.st : null; } catch (e) { return null; } }\n  function openFast() {\n    var cached = loadState();\n    if (cached && cached.me) { try { LASTJS = JSON.stringify(cached); ST = fillDefaults(cached); render(); } catch (e) { ST = null; } }\n    call('bootstrap', null, pendingJoin);\n    if (ST) document.getElementById('busy').textContent = '最新にしています…';\n  }\n  function showLogin(msg) {\n    document.getElementById('nav').hidden = true; document.getElementById('view').classList.remove('navpad');\n    document.getElementById('reload').hidden = true;\n    document.getElementById('me').textContent = '';\n    view.innerHTML = '<section class=\"card\"><div class=\"big\">ようこそ<\/div><div class=\"sub\">このページは、' + esc(CLUB) + 'のLINEグループのメンバーだけが見られます。グループに入っているLINEアカウントでログインしてください。<\/div>' +\n      (msg ? '<div class=\"toast' + (/しました/.test(msg) ? '' : ' err') + '\">' + esc(msg) + '<\/div>' : '') +\n      '<a class=\"btn\" id=\"loginBtn\" href=\"' + esc(LOGIN_URL || '#') + '\" target=\"_top\" style=\"text-align:center;text-decoration:none;background:#06c755\">LINEでログイン<\/a>' +\n      '<div class=\"hint\">LINEアプリの中で開くと、ボタンを押すだけでログインできます。PCでは、LINEのQRコードをスマホで読み取ってログインできます。<\/div>' +\n      (API_URL ? '<a class=\"link\" href=\"demo/\" target=\"_top\" style=\"justify-self:start\">🧪 ログインせずにお試し（ダミーデータ） ›<\/a>' : '') + '<\/section>' +\n      (API_URL ? '<section class=\"card\"><h2>スマホに出した番号でログイン（PC）<\/h2><div class=\"sub\">スマホのポータルの「わが家」→「PCでも使う」で出る6けたの番号を入れてください。<\/div>' +\n        '<form class=\"f\" id=\"codeForm\"><input id=\"pcCode\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"6けたの番号\" autocomplete=\"one-time-code\" style=\"font-size:20px;letter-spacing:.3em;text-align:center\"><button class=\"btn\" type=\"submit\">ログイン<\/button><\/form><\/section>' : '');\n    var cf = document.getElementById('codeForm');\n    if (cf) cf.addEventListener('submit', function (e) {\n      e.preventDefault();\n      var b = cf.querySelector('button'); b.disabled = true; b.textContent = 'ログインしています…';\n      rpc('codeLogin', { code: document.getElementById('pcCode').value }, function (r) { KEY = r.key; start(); }, function (err) { showLogin(err.message); });\n    });\n    // GitHub Pages の画面では、押したときにログイン用の URL をもらう\n    if (!LOGIN_URL) document.getElementById('loginBtn').addEventListener('click', function (e) {\n      e.preventDefault();\n      var b = this; b.textContent = 'LINEに移動しています…';\n      rpc('loginUrl', {}, function (r) { window.top.location.href = r.url; }, function (err) { b.textContent = 'LINEでログイン'; showLogin(err.message); });\n    });\n  }\n  // 家族の招待リンク（?join=番号）で開いたときは、ログインのあとで家族になる\n  var JOIN = 'clubPortalJoin';\n  function pendingJoin() {\n    var code = ''; try { code = localStorage.getItem(JOIN) || ''; localStorage.removeItem(JOIN); } catch (e) {}\n    if (code && confirm('家族の招待番号 ' + code + ' で、家族の登録をまとめますか？')) call('joinFamily', { code: code }, function () { S.tab = 'family'; S.kidsDraft = null; });\n  }\n  function start() {\n    if (KEY) saveKey(KEY);\n    else KEY = loadKey();\n    if (KEY) openFast();   // ログイン直後、または前回のログインが残っているとき（再読み込みで期限切れの表示が出ても、保存したキーで開く）\n    else showLogin(LOGIN_ERROR);\n  }\n  // GitHub Pages の画面に LINE ログインから戻ってきたとき（?code=&state=）\n  var q = new URLSearchParams(location.search);\n  if (q.get('tab') && /^(home|events|album|family|train|admin|dash)$/.test(q.get('tab'))) S.tab = q.get('tab');\n  // 役員ページ（staff/）は、役員ページから開く\n  if (/\\/staff\\/?$/.test(location.pathname) && !q.get('tab') && !q.get('ev')) { S.tab = 'admin'; S.admin = 'menu'; }\n  if (q.get('adm') && /^[a-z]{2,12}$/.test(q.get('adm'))) { S.tab = 'admin'; S.admin = q.get('adm'); q.delete('adm'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }\n  if (q.get('trv') && /^(goal|log|video)$/.test(q.get('trv'))) S.trView = q.get('trv');\n  if (q.get('ev') && /^[\\w-]{6,40}$/.test(q.get('ev'))) { S.tab = 'events'; S.event = q.get('ev'); S.etab = /^(概要|エントリー|種目|タイムテーブル|手続き|結果|写真)$/.test(q.get('et') || '') ? q.get('et') : '概要'; }\n  if (q.get('v') || q.get('tab') || q.get('ev')) { q.delete('v'); q.delete('tab'); q.delete('ev'); q.delete('et'); q.delete('trv'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }\n  // Strava のログインから戻ってきたとき（?strava=1&code=…&state=…）。LINEログインの code とは分けて扱う\n  if (q.get('strava')) {\n    S.stravaPending = { code: q.get('code') || '', state: q.get('state') || '', scope: q.get('scope') || '', error: q.get('error') || '' };\n    S.tab = 'train';\n    q.delete('strava'); q.delete('code'); q.delete('state'); q.delete('scope'); q.delete('error');\n    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));\n  }\n  if (q.get('join')) {\n    try { localStorage.setItem(JOIN, q.get('join').replace(/\\D/g, '').slice(0, 6)); } catch (e) {}\n    q.delete('join');\n    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));\n  }\n  if (API_URL && (q.get('code') || q.get('error'))) {\n    history.replaceState(null, '', location.pathname);\n    if (q.get('error')) { LOGIN_ERROR = 'LINEログインがキャンセルされました。'; start(); }\n    else {\n      view.innerHTML = '<div class=\"empty\">ログインしています…<\/div>';\n      rpc('login', { code: q.get('code'), state: q.get('state') }, function (r) { KEY = r.key; start(); }, function (err) {\n        // 再読み込みなどで同じ code をもう一度使ったときは、保存してあるキーで開く\n        KEY = loadKey();\n        if (KEY) openFast(); else showLogin(err.message);\n      });\n    }\n  } else {\n    start();\n  }\n  checkNewVersion();\n})();\n<\/script>\n<\/body>\n<\/html>\n","PortalMore.gs":"/**\n * ポータルの操作（家族・当番・大会の日・写真・予定づくり）。\n * 画面からの呼び出しの入口は Portal.gs の api()。\n */\n\n// ---- 家族 ----\n\n/** 父母・祖父母・兄姉などを同じ家族にまとめるための招待番号（6けた）を作る */\nfunction inviteFamilyAction_(ctx) {\n  const cache = CacheService.getScriptCache();\n  let code = '';\n  for (let i = 0; i < 5 && !code; i++) {\n    const c = String(100000 + (parseInt(randomKey_().slice(0, 8), 16) % 900000));\n    if (!cache.get('fam:' + c)) code = c;\n  }\n  if (!code) throw new Error('もう一度お試しください。');\n  const hours = Math.min(6, CONFIG.INVITE_HOURS);\n  cache.put('fam:' + code, ctx.userId, hours * 3600);\n  return { code: code, hours: hours, url: portalUrl_() + (portalUrl_().indexOf('?') >= 0 ? '&' : '?') + 'join=' + code };\n}\n\nfunction joinFamilyAction_(ctx, p) {\n  const code = toHalfWidth_(p.code || '').replace(/\\D/g, '');\n  const cache = CacheService.getScriptCache();\n  const inviter = code.length === 6 ? cache.get('fam:' + code) : null;\n  if (!inviter) throw new Error('招待番号が違うか、期限が切れています。家族の人に、もう一度番号を出してもらってください。');\n  if (inviter === ctx.userId) throw new Error('自分の招待番号です。家族の人のスマホで入れてください。');\n  joinFamily_(ctx.userId, inviter);\n  cache.remove('fam:' + code);\n  const name = (findFamily_(inviter) || {})['表示名'] || '家族';\n  return name + 'さんと同じ家族になりました。お子さんの登録も共通になります';\n}\n\n/** 役員にする・外す（役員だけ）。役員が1人もいなくなる操作はしない */\nfunction setAdminAction_(ctx, p) {\n  withLock_(() => {\n    const rows = readRows_(SHEETS.FAMILIES);\n    const f = rows.find((x) => x.userId === p.userId);\n    if (!f) throw new Error('見つかりません。');\n    const id = famIdOf_(f);\n    if (!p.on && !rows.some((x) => famIdOf_(x) !== id && isAdminRow_(x))) throw new Error('役員が1家族もいなくなるので、外せません。先にほかの家族を役員にしてください。');\n    // 役員は家族ごと：家族のみんなの行もそろえる\n    familyRowsOf_(rows, id).forEach((x) => { x['役員'] = p.on ? '○' : ''; x['役員申請'] = ''; x['更新日時'] = now_(); updateRow_(SHEETS.FAMILIES, x); });\n  });\n  return (p.on ? '役員にしました（家族の全員）' : '役員から外しました（家族の全員）');\n}\n\n/** 休みの連絡をLINEで受け取る人を切り替える（役員だけ） */\nfunction setNotifyAction_(ctx, p) {\n  withLock_(() => {\n    const f = findFamily_(p.userId);\n    if (!f) throw new Error('見つかりません。');\n    f['休み通知'] = p.on ? '○' : '×';\n    f['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, f);\n  });\n  return '';\n}\n\n// ---- 当番 ----\n\nfunction dutyType_(ev, races) {\n  const race = races ? races[ev.eventKey] : readRows_(SHEETS.RACES).find((r) => r.eventKey === ev.eventKey);\n  return race || (ev['種別'] || guessType_(ev['タイトル'])) !== '練習' ? '大会' : '練習';\n}\n\n/** 大会ごとの「大会係」（役員でなくても、その大会の入力ができる家族）。当番表の行に 種類＝大会係 で残す */\nconst RACE_STAFF = '大会係';\nfunction isRaceStaffRow_(d) { return d['種類'] === RACE_STAFF; }\n\nfunction setDutyAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('予定が見つかりません。');\n  const fam = String(p.fam || '');\n  if (!fam) throw new Error('家族を選んでください。');\n  const staff = p.kind === RACE_STAFF;\n  if (staff && dutyType_(ev) !== '大会') throw new Error('大会係は、大会だけに決められます。');\n  const type = staff ? RACE_STAFF : dutyType_(ev);\n  withLock_(() => {\n    const row = readRows_(SHEETS.DUTIES).find((d) => d.eventKey === p.key && d['家族ID'] === fam && isRaceStaffRow_(d) === staff);\n    if (p.on && !row) appendRow_(SHEETS.DUTIES, { eventKey: p.key, '日付': ev['日付'], '種類': type, '家族ID': fam, '更新者': ctx.name, '更新日時': now_() });\n    if (!p.on && row) clearRow_(SHEETS.DUTIES, row);\n  });\n  if (dutyType_(ev) === '大会') logHistory_(p.key, ctx, (staff ? '大会係：' : '当番：') + ((familiesList_(readRows_(SHEETS.FAMILIES), activeChildren_()).find((f) => f.id === fam) || {}).label || '') + (p.on ? ' に決定' : ' を外す'));\n  return '';\n}\n\n/**\n * まだ当番がいない練習（または大会）に、前回の当番から日がたっている家族から順に入れる。\n * @param {{type: string, days: number, per: number}} p\n */\nfunction autoDutyAction_(ctx, p) {\n  const type = p.type === '大会' ? '大会' : '練習';\n  const per = 1; // 当番は1回に1家族\n  const days = Math.max(1, Math.min(400, Number(p.days) || 30));\n  const today = today_();\n  const families = familiesList_(readRows_(SHEETS.FAMILIES), activeChildren_());\n  if (!families.length) throw new Error('お子さんを登録している家族がいません。');\n  const races = {};\n  readRows_(SHEETS.RACES).forEach((r) => (races[r.eventKey] = r));\n  let added = 0;\n  withLock_(() => {\n    const duties = readRows_(SHEETS.DUTIES);\n    const last = {};\n    const count = {};\n    families.forEach((f) => { last[f.id] = ''; count[f.id] = 0; });\n    const order = dutyOrder_(type);\n    const idx = (id) => { const i = order.indexOf(id); return i < 0 ? 9999 : i; };\n    const w = (f) => Math.max(1, (f.kids || []).length); // 子どもの人数（当番は子ども1人ずつ）\n    // 回数は今年度（4月から）の分。これからの予定に入っている当番も数える\n    const fy0 = fyStart_(today);\n    duties.filter((d) => d['種類'] === type && d['日付'] >= addDays_(today, -400)).forEach((d) => {\n      if (!(d['家族ID'] in last)) return;\n      if (d['日付'] < fy0) { if (d['日付'] > last[d['家族ID']]) last[d['家族ID']] = d['日付']; return; }\n      if (d['日付'] > last[d['家族ID']]) last[d['家族ID']] = d['日付'];\n      count[d['家族ID']]++;\n    });\n    const targets = readRows_(SHEETS.EVENTS)\n      .filter((e) => e['状態'] !== '中止' && e['日付'] >= today && e['日付'] <= addDays_(today, days) && dutyType_(e, races) === type)\n      .sort(compareEvents_);\n    targets.forEach((e) => {\n      const have = duties.filter((d) => d.eventKey === e.eventKey && !isRaceStaffRow_(d)).map((d) => d['家族ID']);\n      for (let n = have.length; n < per; n++) {\n        const pick = families\n          .filter((f) => have.indexOf(f.id) < 0)\n          // 子ども1人あたりの回数が少ない家族から（きょうだい2人の家は2回分）。交代で代わりに入った家族は後回し、代わってもらった家族は先。\n          // 同じなら役員が決めた順番、なければ前回から日がたっている順\n          .sort((a, b) => count[a.id] * w(b) - count[b.id] * w(a) || idx(a.id) - idx(b.id) || (last[a.id] < last[b.id] ? -1 : last[a.id] > last[b.id] ? 1 : a.label < b.label ? -1 : 1))[0];\n        if (!pick) break;\n        const row = appendRow_(SHEETS.DUTIES, { eventKey: e.eventKey, '日付': e['日付'], '種類': type, '家族ID': pick.id, '更新者': ctx.name, '更新日時': now_() });\n        duties.push(row);\n        have.push(pick.id);\n        last[pick.id] = e['日付'];\n        count[pick.id]++;\n        added++;\n      }\n    });\n  });\n  return added ? added + '件の当番を入れました（回数が少ない家族から、当番の順番どおり）' : '当番を入れる予定がありませんでした（もう全部入っています）';\n}\n\n/** 当番の順番（役員が並べかえたもの）。家族IDの並び */\nfunction dutyOrder_(type) {\n  try { return JSON.parse(PropertiesService.getScriptProperties().getProperty('DUTY_ORDER_' + type) || '[]'); } catch (e) { return []; }\n}\nfunction setDutyOrderAction_(ctx, p) {\n  const type = p.type === '大会' ? '大会' : '練習';\n  const ids = (p.order || []).map(String).filter((x, i, a) => x && a.indexOf(x) === i).slice(0, 300);\n  PropertiesService.getScriptProperties().setProperty('DUTY_ORDER_' + type, JSON.stringify(ids));\n  invalidateTable_(SHEETS.DUTIES.name); // 画面のデータを作り直させる\n  return type + '当番の順番を保存しました';\n}\n\n/** 大会のタイムテーブル・手続きを直せる人（役員と、その大会の当番・大会係の家族） */\nfunction requireManager_(ctx, key) {\n  if (ctx.admin) return;\n  const ok = readRows_(SHEETS.DUTIES).some((d) => d.eventKey === key && d['家族ID'] === ctx.famId);\n  if (!ok) throw new Error('この操作は、役員と、この予定の当番・大会係の人だけができます。');\n}\n\n// ---- タイムテーブル ----\n\nfunction cleanTime_(s) {\n  const t = parseTimeCell_(s || '');\n  return t ? t.replace(/^0/, '') : '';\n}\n\n/** 「9:00〜9:10」のような幅のある時刻も受け付ける（招集・アップ） */\nfunction cleanTimeRange_(s) {\n  const parts = toHalfWidth_(s || '').split(/\\s*[〜～~\\-－ー]\\s*/).filter(Boolean);\n  if (parts.length === 2) {\n    const a = cleanTime_(parts[0]), b = cleanTime_(parts[1]);\n    if (a && b) return a + '〜' + b;\n  }\n  return cleanTime_(s);\n}\n\nfunction saveTimetableAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  requireManager_(ctx, p.key);\n  const list = (p.rows || []).slice(0, 200).map((r) => ({\n    id: /^[A-Za-z0-9]{6,12}$/.test(r.id || '') ? r.id : '',\n    '開始': cleanTime_(r.start),\n    '種目': String(r.race || '').trim().slice(0, 30),\n    '区分': String(r.group || '').trim().slice(0, 30),\n    '組': String(r.heat || '').trim().slice(0, 20),\n    '招集': cleanTimeRange_(r.call),\n    'アップ': cleanTimeRange_(r.warm),\n    'メモ': String(r.memo || '').trim().slice(0, 100),\n  })).filter((r) => r['種目']).filter((r, i, all) => {\n    // 同じ種目（時刻・種目・区分・組がおなじ）が2つあれば1つにする\n    const k = (x) => [x['開始'], x['種目'], String(x['区分']).replace(/\\s/g, ''), x['組']].join('|');\n    return all.findIndex((x) => k(x) === k(r)) === i;\n  });\n  withLock_(() => {\n    const rows = readRows_(SHEETS.TIMETABLE).filter((x) => x.eventKey === p.key);\n    const keep = {};\n    list.forEach((r) => {\n      const row = r.id && rows.find((x) => x.id === r.id);\n      const data = Object.assign({}, r, { eventKey: p.key, '更新日時': now_() });\n      if (row) { updateRow_(SHEETS.TIMETABLE, Object.assign(row, data)); keep[row.id] = true; }\n      else appendRow_(SHEETS.TIMETABLE, Object.assign(data, { id: randomKey_().slice(0, 10) }));\n    });\n    rows.filter((x) => !keep[x.id]).forEach((x) => clearRow_(SHEETS.TIMETABLE, x));\n  });\n  // タイムテーブルにあって大会の「種目」にない種目は、エントリーで選べるよう大会の種目に足す（全体アップなどは除く）\n  let added = [];\n  withLock_(() => {\n    const race = readRows_(SHEETS.RACES).find((r) => r.eventKey === p.key);\n    if (!race) return;\n    const have = splitNames_(race['種目']);\n    list.forEach((r) => {\n      const name = r['種目'];\n      if (/全体|アップ|集合|開会|閉会|昼|休憩/.test(name)) return;\n      if (have.some((h) => sameRaceGs_(h, name)) || added.indexOf(name) >= 0) return;\n      added.push(name);\n    });\n    if (added.length) { race['種目'] = have.concat(added).join(','); race['更新日時'] = now_(); updateRow_(SHEETS.RACES, race); }\n  });\n  logHistory_(p.key, ctx, 'タイムテーブルを保存（' + list.length + '件）' + (added.length ? '・大会の種目に ' + added.join('・') + ' を追加' : ''));\n  return 'タイムテーブルを保存しました（' + list.length + '件）' + (added.length ? '。大会の種目に ' + added.join('・') + ' を足したので、エントリーで選べます' : '');\n}\n\n/**\n * 大会の種目から外す（役員・当番）。エントリーで選んでいた子の種目からも外す。\n * withTimetable なら時刻表のその種目の行も消す（残すと、時刻表を保存したときにまた種目に足されるため）\n */\nfunction removeEventRaceAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  requireManager_(ctx, p.key);\n  const race = String(p.race || '').trim();\n  if (!race) throw new Error('種目を選んでください。');\n  let tt = 0, ent = 0;\n  withLock_(() => {\n    const row = readRows_(SHEETS.RACES).find((r) => r.eventKey === p.key);\n    if (row) { row['種目'] = splitNames_(row['種目']).filter((x) => !sameRaceGs_(x, race)).join(','); row['更新日時'] = now_(); updateRow_(SHEETS.RACES, row); }\n    readRows_(SHEETS.ENTRIES).filter((x) => x.eventKey === p.key && splitNames_(x['種目']).some((q) => sameRaceGs_(q, race))).forEach((x) => {\n      x['種目'] = splitNames_(x['種目']).filter((q) => !sameRaceGs_(q, race)).join(','); updateRow_(SHEETS.ENTRIES, x); ent++;\n    });\n    if (p.withTimetable) readRows_(SHEETS.TIMETABLE).filter((x) => x.id && x.eventKey === p.key && sameRaceGs_(x['種目'], race)).forEach((x) => { clearRow_(SHEETS.TIMETABLE, x); tt++; });\n  });\n  logHistory_(p.key, ctx, '種目から「' + race + '」を外しました' + (tt ? '（時刻表の' + tt + '行も）' : ''));\n  return '「' + race + '」を種目から外しました' + (ent ? '（' + ent + '人のエントリーからも）' : '') + (tt ? '。時刻表の ' + tt + '行も消しました' : '');\n}\n\n// ---- 手続き（チェックリスト） ----\n\n/** 招集・レーン・ナンバー・リザルトの写真はだれでも（会場で助け合えるように）。ほかは役員と当番 */\nfunction requireTaskRight_(ctx, key, kind) {\n  if (CHOICES.TASKS.indexOf(kind) < 0) throw new Error('不明な手続きです。');\n  if (CHOICES.OPEN_TASKS.indexOf(kind) < 0) requireManager_(ctx, key);\n}\n\nfunction upsertTask_(ctx, key, kind, target, fn) {\n  return withLock_(() => {\n    const row = readRows_(SHEETS.TASKS).find((x) => x.id && x.eventKey === key && x['種類'] === kind && x['対象'] === target);\n    const t = row || { id: randomKey_().slice(0, 10), eventKey: key, '種類': kind, '対象': target, '状態': '', 'メモ': '', '写真ID': '' };\n    fn(t);\n    t['更新者'] = ctx.name;\n    t['日時'] = now_();\n    if (row) updateRow_(SHEETS.TASKS, t);\n    else appendRow_(SHEETS.TASKS, t);\n    return t;\n  });\n}\n\nfunction setTaskAction_(ctx, p) {\n  if (!findEvent_(p.key)) throw new Error('大会が見つかりません。');\n  const kind = String(p.kind || '');\n  requireTaskRight_(ctx, p.key, kind);\n  const target = String(p.target || '').slice(0, 60);\n  upsertTask_(ctx, p.key, kind, target, (t) => {\n    if (p.done !== undefined) t['状態'] = p.done ? '済' : '';\n    if (p.memo !== undefined) t['メモ'] = String(p.memo).slice(0, 500);\n  });\n  if (kind !== 'レーン' && kind !== 'ナンバー') logHistory_(p.key, ctx, kind + (target && kind !== '招集' ? '（' + target.split('|')[0] + '）' : kind === '招集' ? '：' + target.split('|')[0] : '') + (p.done === true ? ' 済' : p.done === false ? ' 取り消し' : ' を記録'));\n  return p.done ? kind + '：済にしました' : '';\n}\n\n// ---- 写真 ----\n\n/** ポータルから写真を上げる。kind があれば、その手続きの写真として付ける */\nfunction uploadPhotoAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('予定が見つかりません。');\n  const kind = String(p.kind || '');\n  if (kind) requireTaskRight_(ctx, p.key, kind);\n  const file = savePhotoFile_(ctx, ev, p.data, kind || 'ポータル');\n  if (kind) {\n    upsertTask_(ctx, p.key, kind, String(p.target || '').slice(0, 60), (t) => {\n      t['写真ID'] = splitNames_(t['写真ID']).concat([file.getId()]).join(',');\n      if (kind === 'エントリー控え' || kind === 'プログラム' || kind === '参加費支払い' || kind === '陣地') t['状態'] = '済';\n    });\n  }\n  logHistory_(p.key, ctx, (kind ? kind + 'の' : '') + '写真を追加');\n  return '写真を保存しました';\n}\n\n/** 画面から送られた写真（data URL）をドライブの予定ごとのフォルダに保存し、「写真」シートに記録する */\nfunction savePhotoFile_(ctx, ev, data, kind) {\n  const m = String(data || '').match(/^data:(image\\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=]+)$/);\n  if (!m) throw new Error('写真を読み込めませんでした。');\n  if (m[2].length > 8 * 1024 * 1024) throw new Error('写真が大きすぎます。');\n  const at = now_();\n  const ext = EXTENSIONS[m[1]] || 'jpg';\n  const fileName = at.replace(/[-: ]/g, '').slice(0, 14) + '_' + (safeName_(kind) || 'photo') + '_' + (safeName_(ctx.name) || 'portal') + '.' + ext;\n  const folder = ev ? subfolder_(photoRoot_(), ev['日付'] + ' ' + safeName_(ev['タイトル'])) : subfolder_(photoRoot_(), '会計');\n  const file = folder.createFile(Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], fileName));\n  appendRow_(SHEETS.PHOTOS, { '日時': at, eventKey: ev ? ev.eventKey : '', '予定': ev ? ev['タイトル'] : '', userId: ctx.userId, '表示名': ctx.name, 'ファイル名': fileName, URL: file.getUrl(), 'ファイルID': file.getId(), '種類': kind });\n  return file;\n}\n\n/** 「写真」シートの行のドライブのファイルID（前の版の行は URL から取り出す） */\nfunction photoIdOf_(row) {\n  if (row['ファイルID']) return row['ファイルID'];\n  const m = String(row.URL || '').match(/\\/d\\/([A-Za-z0-9_-]{10,})/);\n  return m ? m[1] : '';\n}\n\nfunction photoData_(id, thumb) {\n  const file = DriveApp.getFileById(id);\n  let blob = thumb ? file.getThumbnail() : null;\n  if (!blob) blob = file.getBlob();\n  return 'data:' + (blob.getContentType() || 'image/jpeg') + ';base64,' + Utilities.base64Encode(blob.getBytes());\n}\n\n/**\n * 写真を画面に出す。「写真」シートにある写真だけ（ほかのドライブのファイルは出さない）。\n * ドライブのフォルダは共用アカウントだけのものにしておき、保護者はポータル（LINEグループのメンバーだけ）で見る。\n */\nfunction photoAction_(ctx, p) {\n  const id = String(p.id || '');\n  if (!id || !readRows_(SHEETS.PHOTOS).some((x) => photoIdOf_(x) === id)) throw new Error('写真が見つかりません。');\n  return { id: id, data: photoData_(id, !!p.thumb) };\n}\n\n/** アルバムの小さい写真をまとめて返す（1回に12枚まで） */\nfunction thumbsAction_(ctx, p) {\n  const known = {};\n  readRows_(SHEETS.PHOTOS).forEach((x) => { const id = photoIdOf_(x); if (id) known[id] = true; });\n  // ドライブから作るのは遅いので、作った小さい写真は6時間おぼえておく（まとめて取り出す）\n  const ids = (p.ids || []).slice(0, 12).filter((id) => known[id]);\n  const cache = CacheService.getScriptCache(), hit = cache.getAll(ids.map((id) => 'pth:' + id)) || {}, out = {};\n  ids.forEach((id) => {\n    let data = hit['pth:' + id];\n    if (!data) {\n      try { data = photoData_(id, true); } catch (err) { console.warn('写真を読めません: ' + id + ' ' + err); return; }\n      if (data.length < 95000) { try { cache.put('pth:' + id, data, 21600); } catch (e) { /* 入らなければそのまま */ } }\n    }\n    out[id] = data;\n  });\n  return out;\n}\n\n/** 写真を消す（上げた本人と役員）。ドライブではゴミ箱に入れる（30日は戻せる） */\nfunction deletePhotoAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.PHOTOS).find((x) => photoIdOf_(x) === p.id);\n    if (!row) throw new Error('写真が見つかりません。');\n    if (!ctx.admin && row.userId !== ctx.userId) throw new Error('写真を消せるのは、上げた人と役員だけです。');\n    try { DriveApp.getFileById(p.id).setTrashed(true); } catch (err) { console.warn(err); }\n    clearRow_(SHEETS.PHOTOS, row);\n    readRows_(SHEETS.TASKS).filter((t) => splitNames_(t['写真ID']).indexOf(p.id) >= 0).forEach((t) => {\n      t['写真ID'] = splitNames_(t['写真ID']).filter((x) => x !== p.id).join(',');\n      updateRow_(SHEETS.TASKS, t);\n    });\n  });\n  return '写真を消しました';\n}\n\n// ---- 予定づくり（役員） ----\n\nfunction cleanEventInput_(p, requireDate) {\n  const title = String(p.title || '').trim().slice(0, 80);\n  if (!title) throw new Error('タイトルを入れてください。');\n  const start = parseTimeCell_(p.start || '');\n  const end = parseTimeCell_(p.end || '');\n  if (start === null || end === null) throw new Error('時刻が読めません。');\n  if (start && end && end < start) throw new Error('終わりが始まりより前になっています。');\n  const date = String(p.date || '');\n  if (requireDate && !/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) throw new Error('日付を入れてください。');\n  return { date: date, start: start, end: start ? end || start : '', title: title, place: String(p.place || '').trim().slice(0, 80) };\n}\n\n/** 練習の予定をまとめて作る（日付を複数選べる） */\nfunction savePracticesAction_(ctx, p) {\n  const o = cleanEventInput_(p, false);\n  const dates = (p.dates || []).filter((d) => /^\\d{4}-\\d{2}-\\d{2}$/.test(d)).filter((d, i, a) => a.indexOf(d) === i).sort();\n  if (!dates.length) throw new Error('日にちを選んでください。');\n  if (dates.length > 60) throw new Error('一度に作れるのは60日までです。');\n  const type = p.type === '大会' || p.type === '記録会' ? p.type : '練習';\n  withLock_(() => {\n    dates.forEach((d) => upsertEventRow_(createCalEvent_(Object.assign({}, o, { date: d })), type));\n  });\n  return dates.length + '日分の「' + o.title + '」をカレンダーに入れました';\n}\n\n/** 練習などの予定の日時・場所を直す */\nfunction editEventAction_(ctx, p) {\n  const row = findEvent_(p.key);\n  if (!row) throw new Error('予定が見つかりません。');\n  const o = cleanEventInput_(p, true);\n  const ce = editableCalEvent_(row);\n  if (!ce) throw new Error('カレンダーに予定が見つかりません。「更新」を押してからやり直してください。');\n  withLock_(() => {\n    updateCalEvent_(ce, o);\n    upsertEventRow_(ce, row['種別']);\n    readRows_(SHEETS.DUTIES).filter((d) => d.eventKey === p.key && d['日付'] !== o.date).forEach((d) => { d['日付'] = o.date; updateRow_(SHEETS.DUTIES, d); });\n  });\n  return '「' + o.title + '」を直しました';\n}\n\n/** 予定を中止にする（カレンダーから消す。ポータルでは「中止」と表示が残る） */\nfunction cancelEventAction_(ctx, p) {\n  const row = findEvent_(p.key);\n  if (!row) throw new Error('予定が見つかりません。');\n  const ce = editableCalEvent_(row);\n  withLock_(() => {\n    if (ce) ce.deleteEvent();\n    row['状態'] = '中止';\n    row['更新日時'] = now_();\n    updateRow_(SHEETS.EVENTS, row);\n  });\n  return formatDate_(row['日付']) + '「' + row['タイトル'] + '」を中止にしました';\n}\n\n// ---- 結果（記録） ----\n\n/** 結果を入れられる人：その子の家族、役員、その大会の当番 */\nfunction requireResultRight_(ctx, key, child) {\n  if (ctx.admin) return;\n  if (childrenOf_(ctx.userId).some((c) => c.name === child)) return;\n  requireManager_(ctx, key);\n}\n\nfunction saveResultAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  const child = String(p.child || '');\n  if (!activeChildren_().some((c) => c.name === child)) throw new Error('お子さんが見つかりません。');\n  requireResultRight_(ctx, p.key, child);\n  const race = String(p.race || '').trim().slice(0, 30);\n  const record = toHalfWidth_(p.record || '').trim().replace(/\\s/g, '').slice(0, 20);\n  if (!race) throw new Error('種目を選んでください。');\n  if (!record) throw new Error('記録を入れてください（例：15.21、1:01.27、3m20）。');\n  const data = {\n    eventKey: ev.eventKey, '大会・練習': ev['日付'] + ' ' + ev['タイトル'], '子ども': child, '種目': race, '記録': record,\n    '順位': String(p.place || '').replace(/[^0-9]/g, '').slice(0, 3), 'ラウンド': CHOICES.ROUNDS.indexOf(p.round) >= 0 ? p.round : '',\n    // 加速走（助走つきの計測）は公式記録にしない\n    '区分': /加速/.test(String(p.memo || '') + String(p.race || '')) ? '練習' : p.kind === '公式' || p.kind === '練習' ? p.kind : dutyType_(ev) === '大会' ? '公式' : '練習',\n    'メモ': String(p.memo || '').slice(0, 100), userId: ctx.userId, '表示名': ctx.name, '日時': now_(),\n  };\n  withLock_(() => {\n    const row = p.id ? readRows_(SHEETS.RESULTS).find((r) => r.id && r.id === p.id) : null;\n    if (row) updateRow_(SHEETS.RESULTS, Object.assign(row, data));\n    else appendRow_(SHEETS.RESULTS, Object.assign(data, { id: randomKey_().slice(0, 10) }));\n  });\n  logHistory_(ev.eventKey, ctx, '結果：' + child + ' ' + race + ' ' + record);\n  return child + ' ' + race + ' ' + record + ' を記録しました';\n}\n\nfunction deleteResultAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.RESULTS).find((r) => r.id && r.id === p.id);\n    if (!row) throw new Error('記録が見つかりません。');\n    requireResultRight_(ctx, row.eventKey, row['子ども']);\n    clearRow_(SHEETS.RESULTS, row);\n  });\n  return '記録を消しました';\n}\n\n// ---- LINEグループへの一斉通知（役員） ----\n\nfunction broadcastInfoAction_() {\n  return pushQuota_();\n}\n\n/** LINEグループに送る。グループの人数分の通数を使うので、足りないときは送らない */\nfunction broadcastAction_(ctx, p) {\n  const groupId = requireProp_('GROUP_ID');\n  const text = String(p.text || '').trim().slice(0, 2000);\n  if (!text) throw new Error('送る文章がありません。');\n  const q = pushQuota_();\n  if (q.remaining !== null && q.members !== null && q.remaining < q.members) {\n    throw new Error('今月のLINEの無料の通数が足りません（残り' + q.remaining + '通・グループ' + q.members + '人）。文章をコピーして、手でグループに貼ってください。');\n  }\n  push_(groupId, [text_(text)]);\n  CacheService.getScriptCache().remove('pushQuota');\n  return 'LINEグループに送りました' + (q.members ? '（' + q.members + '通ぶん）' : '');\n}\n\n// ---- 会計（参加費の支払い・領収書の履歴） ----\n\n/**\n * 支払い（大会への参加費など）や入金を記録する。領収書の写真も付けられる。\n * 大会に結びつけるときは役員かその大会の当番、結びつけないときは役員だけ\n */\nfunction saveLedgerAction_(ctx, p) {\n  const ev = p.key ? findEvent_(p.key) : null;\n  if (p.key && !ev) throw new Error('大会が見つかりません。');\n  if (ev) requireManager_(ctx, ev.eventKey);\n  else if (!ctx.admin) throw new Error('この操作は役員だけができます。');\n  const amount = Number(toHalfWidth_(p.amount || '').replace(/[^0-9]/g, ''));\n  if (!amount) throw new Error('金額を入れてください。');\n  const date = /^\\d{4}-\\d{2}-\\d{2}$/.test(p.date || '') ? p.date : ev ? ev['日付'] : today_();\n  const kind = p.kind === '入金' ? '入金' : '支払い';\n  const photo = p.data ? savePhotoFile_(ctx, ev, p.data, '領収書').getId() : '';\n  withLock_(() => {\n    appendRow_(SHEETS.LEDGER, {\n      id: randomKey_().slice(0, 10), '日付': date, eventKey: ev ? ev.eventKey : '', '種類': kind, '金額': String(amount),\n      '相手': String(p.payee || '').trim().slice(0, 60), '但し書き': String(p.note || '').trim().slice(0, 100), '写真ID': photo, '記録者': ctx.name, '日時': now_(),\n      '科目': String(p.cat || (ev && kind === '支払い' ? '大会参加費' : '')).trim().slice(0, 30),\n    });\n  });\n  if (ev) logHistory_(ev.eventKey, ctx, kind + ' ¥' + amount.toLocaleString('ja-JP') + (p.payee ? '（' + String(p.payee).slice(0, 30) + '）' : '') + (photo ? '・領収書の写真あり' : ''));\n  if (ev && kind === '支払い') upsertTask_(ctx, ev.eventKey, '参加費支払い', '', (t) => { t['状態'] = '済'; if (photo) t['写真ID'] = splitNames_(t['写真ID']).concat([photo]).join(','); });\n  return (kind === '入金' ? '入金' : '支払い') + ' ¥' + amount.toLocaleString('ja-JP') + ' を記録しました';\n}\n\nfunction deleteLedgerAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.LEDGER).find((x) => x.id && x.id === p.id);\n    if (!row) throw new Error('記録が見つかりません。');\n    clearRow_(SHEETS.LEDGER, row);\n  });\n  return '会計の記録を消しました';\n}\n\n/** 画面に渡す会計の記録。役員はすべて、当番は自分の大会の分だけ */\nfunction ledgerFor_(ctx, manageKeys) {\n  return readRows_(SHEETS.LEDGER)\n    .filter((x) => x.id && (ctx.admin || (x.eventKey && manageKeys.indexOf(x.eventKey) >= 0)))\n    .map((x) => ({ id: x.id, date: x['日付'], key: x.eventKey, kind: x['種類'], amount: Number(x['金額']) || 0, payee: x['相手'], note: x['但し書き'], photo: x['写真ID'], by: x['記録者'], cat: x['科目'] || '' }))\n    .sort((a, b) => (a.date < b.date ? 1 : -1));\n}\n\n// ---- コメント・ヒヤリハット ----\n\n/**\n * 練習・大会への保護者のコメント。種類が「ヒヤリハット」（けがにはならなかったが危なかったこと）のものは、\n * 目立たせて一覧にし、役員が対策を書きこむ。「役員だけ」にすると、書いた人と役員にだけ見える\n */\nfunction saveCommentAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('予定が見つかりません。');\n  const kind = p.kind === 'ヒヤリハット' ? 'ヒヤリハット' : 'コメント';\n  const body = String(p.body || '').trim().slice(0, 1000);\n  if (!body) throw new Error(kind === 'ヒヤリハット' ? '何があったかを書いてください。' : 'コメントを書いてください。');\n  const photo = p.data ? savePhotoFile_(ctx, ev, p.data, kind).getId() : '';\n  withLock_(() => {\n    appendRow_(SHEETS.COMMENTS, {\n      id: randomKey_().slice(0, 10), eventKey: ev.eventKey, '種類': kind, '本文': body, '場所': String(p.place || '').trim().slice(0, 60),\n      '公開': p.adminOnly ? '役員' : '全員', '写真ID': photo, userId: ctx.userId, '表示名': ctx.name, '日時': now_(),\n    });\n  });\n  if (kind === 'ヒヤリハット' && CONFIG.NEAR_MISS_PUSH_TO_ADMINS) {\n    const text = '⚠ ヒヤリハットの報告\\n' + formatDate_(ev['日付']) + ' ' + ev['タイトル'] + (p.place ? '（' + String(p.place).slice(0, 60) + '）' : '') + '\\n' + body.slice(0, 300) + '\\n報告：' + ctx.name + 'さん\\n対策はポータルで書きこめます\\n' + portalUrl_();\n    readRows_(SHEETS.FAMILIES).filter((f) => isAdmin_(f) && f.userId !== ctx.userId).forEach((f) => {\n      try { push_(f.userId, [text_(text)]); } catch (err) { console.warn('ヒヤリハットの通知に失敗: ' + err); }\n    });\n  }\n  return kind === 'ヒヤリハット' ? 'ヒヤリハットを共有しました。ありがとうございます' : 'コメントを書きました';\n}\n\nfunction deleteCommentAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.COMMENTS).find((x) => x.id && x.id === p.id);\n    if (!row) throw new Error('コメントが見つかりません。');\n    if (!ctx.admin && row.userId !== ctx.userId) throw new Error('消せるのは、書いた人と役員だけです。');\n    clearRow_(SHEETS.COMMENTS, row);\n  });\n  return 'コメントを消しました';\n}\n\n/** ヒヤリハットへの対策（役員） */\nfunction setMeasureAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.COMMENTS).find((x) => x.id && x.id === p.id);\n    if (!row) throw new Error('見つかりません。');\n    row['対策'] = String(p.measure || '').trim().slice(0, 500);\n    row['対策者'] = row['対策'] ? ctx.name : '';\n    row['対策日時'] = row['対策'] ? now_() : '';\n    updateRow_(SHEETS.COMMENTS, row);\n  });\n  return p.measure ? '対策を書きました' : '';\n}\n\n/** 画面に渡すコメント（1年分）。「役員だけ」のものは、書いた人と役員にだけ */\nfunction parseSuggest_(s) {\n  try { return JSON.parse(s || '{}'); } catch (err) { return {}; }\n}\n\nfunction commentsFor_(ctx) {\n  const from = addDays_(today_(), -400);\n  const all = {};\n  readRows_(SHEETS.EVENTS).forEach((e) => (all[e.eventKey] = e));\n  return readRows_(SHEETS.COMMENTS)\n    .filter((x) => x.id && String(x['日時']).slice(0, 10) >= from && (x['公開'] !== '役員' || ctx.admin || x.userId === ctx.userId))\n    .map((x) => {\n      const ev = all[x.eventKey];\n      return {\n        id: x.id, key: x.eventKey, kind: x['種類'], body: x['本文'], place: x['場所'], adminOnly: x['公開'] === '役員', photo: x['写真ID'],\n        by: x['表示名'], at: x['日時'], mine: x.userId === ctx.userId, measure: x['対策'], measureBy: x['対策者'],\n        date: ev ? ev['日付'] : String(x['日時']).slice(0, 10), title: ev ? ev['タイトル'] : '',\n        suggest: x['種類'] === '変更連絡' ? parseSuggest_(x['提案']) : null,\n      };\n    })\n    .map((c) => {\n      if (c.kind === '変更連絡' && !c.key && c.suggest && c.suggest.date) c.date = c.suggest.date;\n      return c;\n    });\n}\n\n// ---- 大会の資料・履歴 ----\n\n/** 大会の履歴に1行足す（だれが・いつ・何をしたか） */\nfunction logHistory_(eventKey, ctx, text) {\n  if (!eventKey) return;\n  try {\n    appendRow_(SHEETS.HISTORY, { '日時': now_(), eventKey: eventKey, '表示名': (ctx && ctx.name) || '', '内容': String(text).slice(0, 200) });\n  } catch (err) {\n    console.warn('履歴を残せませんでした: ' + err);\n  }\n}\n\n/**\n * 大会の資料（要項・申込書・プログラム・地図・リザルトなど）を足す。\n * リンク（主催者のページ）か、ファイル（写真・PDF）。メンバー全員が見られる。足せるのは役員と当番\n */\nfunction addDocAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  requireManager_(ctx, p.key);\n  const kind = CHOICES.DOC_KINDS.indexOf(p.kind) >= 0 ? p.kind : 'その他';\n  const url = String(p.url || '').trim();\n  let fileId = '';\n  let type = 'link';\n  if (p.data) {\n    const m = String(p.data).match(/^data:(image\\/(?:jpeg|png|webp)|application\\/pdf);base64,([A-Za-z0-9+/=]+)$/);\n    if (!m) throw new Error('写真かPDFを選んでください。');\n    if (m[2].length > 14 * 1024 * 1024) throw new Error('ファイルが大きすぎます（10MBまで）。');\n    if (m[1] === 'application/pdf') {\n      const name = now_().replace(/[-: ]/g, '').slice(0, 14) + '_' + safeName_(kind) + '_' + safeName_(p.name || 'document') + '.pdf';\n      const folder = subfolder_(photoRoot_(), ev['日付'] + ' ' + safeName_(ev['タイトル']));\n      const file = folder.createFile(Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], name));\n      appendRow_(SHEETS.PHOTOS, { '日時': now_(), eventKey: ev.eventKey, '予定': ev['タイトル'], userId: ctx.userId, '表示名': ctx.name, 'ファイル名': name, URL: file.getUrl(), 'ファイルID': file.getId(), '種類': '資料' });\n      fileId = file.getId();\n      type = 'pdf';\n    } else {\n      fileId = savePhotoFile_(ctx, ev, p.data, '資料').getId();\n      type = 'image';\n    }\n  } else if (!/^https?:\\/\\/\\S+$/.test(url)) {\n    throw new Error('リンク（https://…）を入れるか、ファイルを選んでください。');\n  }\n  const name = String(p.name || '').trim().slice(0, 60) || kind;\n  withLock_(() => {\n    appendRow_(SHEETS.DOCS, { id: randomKey_().slice(0, 10), eventKey: ev.eventKey, '種類': kind, '名前': name, URL: fileId ? '' : url.slice(0, 300), 'ファイルID': fileId, '形式': type, '追加者': ctx.name, '日時': now_() });\n  });\n  logHistory_(ev.eventKey, ctx, '資料を追加：' + kind + (name !== kind ? '（' + name + '）' : ''));\n  return '資料「' + name + '」を追加しました';\n}\n\nfunction deleteDocAction_(ctx, p) {\n  const row = readRows_(SHEETS.DOCS).find((x) => x.id && x.id === p.id);\n  if (!row) throw new Error('資料が見つかりません。');\n  requireManager_(ctx, row.eventKey);\n  withLock_(() => clearRow_(SHEETS.DOCS, row));\n  logHistory_(row.eventKey, ctx, '資料を削除：' + row['名前']);\n  return '資料を消しました';\n}\n\n/** 資料のファイル（写真・PDF）を返す。「資料」シートにあるものだけ */\nfunction docAction_(ctx, p) {\n  const row = readRows_(SHEETS.DOCS).find((x) => x.id && x.id === p.id && x['ファイルID']);\n  if (!row) throw new Error('資料が見つかりません。');\n  const blob = DriveApp.getFileById(row['ファイルID']).getBlob();\n  return { name: row['名前'], data: 'data:' + (blob.getContentType() || 'application/octet-stream') + ';base64,' + Utilities.base64Encode(blob.getBytes()) };\n}\n\n/**\n * LINEのブラウザはファイルを保存できないので、ふつうのブラウザで開く保存用のページのリンクを作る（10分だけ・1回だけ使える）\n */\nfunction docLinkAction_(ctx, p) {\n  const row = readRows_(SHEETS.DOCS).find((x) => x.id && x.id === p.id && x['ファイルID']);\n  if (!row) throw new Error('資料が見つかりません。');\n  const token = randomKey_();\n  CacheService.getScriptCache().put('dl:' + token, row.id, 600);\n  return { url: ScriptApp.getService().getUrl() + '?dl=' + token };\n}\n\n/** 保存用のページ（ふつうのブラウザで開く）。リンクは1回だけ使える */\nfunction docDownloadPage_(token) {\n  const cache = CacheService.getScriptCache(), id = /^[A-Za-z0-9]+$/.test(token) ? cache.get('dl:' + token) : null;\n  const page = (body) => HtmlService.createHtmlOutput('<!DOCTYPE html><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><div style=\"font-family:sans-serif;padding:24px;max-width:560px;margin:auto;line-height:1.7\">' + body + '<\/div>').setTitle(CONFIG.CLUB_NAME + ' 資料');\n  if (!id) return page('<h3>リンクの期限が切れました<\/h3><p>ポータルに戻って、もう一度「PDF」を押してください（リンクは10分・1回だけ使えます）。<\/p>');\n  cache.remove('dl:' + token);\n  const row = readRows_(SHEETS.DOCS).find((x) => x.id === id && x['ファイルID']);\n  if (!row) return page('<h3>資料が見つかりません<\/h3>');\n  const blob = DriveApp.getFileById(row['ファイルID']).getBlob();\n  const type = blob.getContentType() || 'application/pdf', name = String(row['名前'] || '資料').replace(/[\\\\/:*?\"<>|]/g, '_') + (/pdf/.test(type) ? '.pdf' : '');\n  const esc = (t) => String(t).replace(/[&<>\"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c]);\n  return page('<h3>' + esc(row['名前'] || '資料') + '<\/h3><p><a id=\"dl\" download=\"' + esc(name) + '\" href=\"data:' + type + ';base64,' + Utilities.base64Encode(blob.getBytes()) + '\" style=\"display:inline-block;background:#c4512f;color:#fff;padding:14px 22px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:18px\">⬇ PDFを保存する<\/a><\/p><p style=\"color:#5f7079;font-size:14px\">保存したら、ファイルアプリや「ダウンロード」から開けます。このページは閉じてかまいません。<\/p>');\n}\n\n/** 資料の小さい画像（PDFは1ページ目）。ドライブの縮小画像を使い、6時間覚えておく。1回に12件まで */\nfunction docThumbsAction_(ctx, p) {\n  const rows = {};\n  readRows_(SHEETS.DOCS).forEach((x) => { if (x.id && x['ファイルID']) rows[x.id] = x; });\n  const cache = CacheService.getScriptCache(), out = {};\n  (p.ids || []).slice(0, 12).forEach((id) => {\n    const row = rows[id];\n    if (!row) return;\n    const key = 'dth:' + row['ファイルID'];\n    try {\n      let data = cache.get(key);\n      if (!data) {\n        const blob = DriveApp.getFileById(row['ファイルID']).getThumbnail();\n        if (!blob) return;\n        data = 'data:' + (blob.getContentType() || 'image/png') + ';base64,' + Utilities.base64Encode(blob.getBytes());\n        if (data.length < 95000) cache.put(key, data, 21600);\n      }\n      out[id] = data;\n    } catch (err) { console.warn('資料の縮小画像を作れません: ' + id + ' ' + err); }\n  });\n  return out;\n}\n\n/**\n * 手続きの締切（日時）を入れる。例：リレー予選のオーダー提出は当日10:00まで。役員と当番\n * @param {{key: string, kind: string, at: string}} p at は 'yyyy-MM-dd HH:mm'（空なら消す）\n */\nfunction setDeadlineAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  requireManager_(ctx, p.key);\n  if (CHOICES.TASKS.indexOf(p.kind) < 0) throw new Error('不明な手続きです。');\n  const at = String(p.at || '').trim();\n  if (at && !/^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$/.test(at)) throw new Error('締切の日時が読めません。');\n  withLock_(() => {\n    let row = readRows_(SHEETS.RACES).find((r) => r.eventKey === p.key);\n    if (!row) row = appendRow_(SHEETS.RACES, { eventKey: p.key, '種別': '大会', '対象': '全員', '更新日時': now_() });\n    const d = parseDeadlines_(row['手続き期限']);\n    if (at) d[p.kind] = at; else delete d[p.kind];\n    row['手続き期限'] = JSON.stringify(d);\n    updateRow_(SHEETS.RACES, row);\n  });\n  logHistory_(p.key, ctx, '締切：' + deadlineLabel_(p.kind) + (at ? ' ' + formatDate_(at.slice(0, 10)) + ' ' + at.slice(11) + 'まで' : ' を消す'));\n  return at ? deadlineLabel_(p.kind) + 'の締切を入れました' : '';\n}\n\nfunction deadlineLabel_(kind) {\n  return { 'エントリー控え': 'エントリーの提出', '参加費支払い': '参加費の支払い', 'リレー予選': 'リレー予選のオーダー', 'リレー決勝': 'リレー決勝のオーダー' }[kind] || kind;\n}\n\n// ---- 練習のダウン（お迎えの合図） ----\n\n/**\n * 今日の練習に、ダウンに入った時刻を記録する。どの練習か分からないときは、今の時刻にいちばん近い今日の練習\n * @return {Object|null} 記録した「予定」シートの行\n */\nfunction recordDown_(when, by, eventKey) {\n  const date = fmt_(when, 'yyyy-MM-dd');\n  const hm = fmt_(when, 'HH:mm');\n  return withLock_(() => {\n    const todays = readRows_(SHEETS.EVENTS).filter((e) => e['日付'] === date && e['状態'] !== '中止' && (eventKey ? e.eventKey === eventKey : (e['種別'] || guessType_(e['タイトル'])) === '練習'));\n    if (!todays.length) return null;\n    const dist = (e) => (e['開始'] && e['開始'] !== '終日' ? Math.abs(toMin_(e['終了'] || e['開始']) - toMin_(hm)) : 9999);\n    const row = todays.sort((a, b) => dist(a) - dist(b))[0];\n    row['ダウン'] = hm;\n    updateRow_(SHEETS.EVENTS, row);\n    return row;\n  });\n}\n\nfunction toMin_(hm) {\n  const m = String(hm || '').match(/^(\\d{1,2}):(\\d{2})/);\n  return m ? +m[1] * 60 + +m[2] : 0;\n}\n\n/** ポータルの「ダウンに入った」ボタン（役員と、その日の当番の家族）。押し直すと時刻を直せる。clear で消す */\nfunction markDownAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('予定が見つかりません。');\n  if (ev['日付'] !== today_()) throw new Error('今日の練習だけ記録できます。');\n  if (!ctx.admin && !readRows_(SHEETS.DUTIES).some((d) => d.eventKey === p.key && d['家族ID'] === ctx.famId)) throw new Error('この操作は、役員とその日の当番の人だけができます。');\n  if (p.clear) {\n    withLock_(() => { const row = findEvent_(p.key); row['ダウン'] = ''; updateRow_(SHEETS.EVENTS, row); });\n    return 'ダウンの記録を消しました';\n  }\n  const row = recordDown_(new Date(), ctx.name, p.key);\n  return 'ダウン ' + row['ダウン'] + ' を記録しました';\n}\n\n/** 予定をまとめて直す（ポータルの「予定を表でまとめて直す」）。直せなかった行は理由を返す */\nfunction bulkEditEventsAction_(ctx, p) {\n  let ok = 0;\n  const ng = [];\n  (p.rows || []).slice(0, 200).forEach((r) => {\n    try {\n      if (r.cancel) cancelEventAction_(ctx, { key: r.key });\n      else editEventAction_(ctx, r);\n      ok++;\n    } catch (err) {\n      const ev = findEvent_(r.key);\n      ng.push((ev ? formatDate_(ev['日付']) + ' ' + ev['タイトル'] : '予定') + '：' + String(err.message || err));\n    }\n  });\n  if (ng.length && !ok) throw new Error(ng.join('\\n'));\n  return ok + '件を直しました' + (ng.length ? '（直せなかったもの：' + ng.join('／') + '）' : '');\n}\n\n/**\n * 過去の記録（ポータルを使う前の自己ベストなど）をまとめて入れる（役員）。大会に結びつけなくてよい\n * @param {{rows: {child: string, race: string, record: string, date: string, meet: string, place: string, round: string, memo: string}[]}} p\n */\nfunction addRecordsAction_(ctx, p) {\n  const kids = {};\n  activeChildren_().forEach((c) => (kids[c.name] = true));\n  const ok = [];\n  const ng = [];\n  // 同じ子・同じ種目・同じ記録・同じ日・同じ大会名は、もう入っていれば入れない（同じ表を2回貼っても2重にならない）\n  const sig = (child, race, record, meet) => [String(child).replace(/\\s|　/g, ''), String(race).trim(), String(record).trim(), String(meet).trim()].join('|');\n  const have = {};\n  readRows_(SHEETS.RESULTS).forEach((x) => { if (x['記録']) have[sig(x['子ども'], x['種目'], x['記録'], x['大会・練習'])] = true; });\n  let dup = 0;\n  (p.rows || []).slice(0, 300).forEach((r, i) => {\n    const child = String(r.child || '').trim();\n    const race = String(r.race || '').trim().slice(0, 30);\n    const record = toHalfWidth_(r.record || '').trim().replace(/\\s/g, '').slice(0, 20);\n    const date = /^\\d{4}-\\d{2}-\\d{2}$/.test(r.date || '') ? r.date : today_();\n    if (!kids[child]) return ng.push((i + 1) + '行目：「' + child + '」というお子さんが登録されていません');\n    if (!race || !record) return ng.push((i + 1) + '行目：種目と記録を入れてください');\n    const meet = date + ' ' + String(r.meet || '過去の記録').trim().slice(0, 60);\n    const k = sig(child, race, record, meet);\n    if (have[k]) { dup++; return; }\n    have[k] = true;\n    ok.push({\n      '日時': now_(), eventKey: '', '大会・練習': meet, '子ども': child, '種目': race, '記録': record,\n      '順位': String(r.place || '').replace(/[^0-9]/g, '').slice(0, 3), 'ラウンド': CHOICES.ROUNDS.indexOf(r.round) >= 0 ? r.round : '',\n      '区分': (r.kind || p.kind) === '練習' || PRACTICE_MEET.test(String(r.meet || '')) ? '練習' : '公式',\n      'メモ': String(r.memo || '').slice(0, 100), userId: ctx.userId, '表示名': ctx.name, id: randomKey_().slice(0, 10),\n    });\n  });\n  if (!ok.length && dup && !ng.length) {\n    const linked = linkResultsToEvents_();\n    return 'どの記録も、もう入っています（' + dup + '件）。2重にはしていません' + (linked ? '。' + linked + '件を、その日の大会・練習に結びつけました' : '');\n  }\n  if (!ok.length) throw new Error(ng.join('\\n') || '入れる記録がありません。');\n  withLock_(() => ok.forEach((row) => appendRow_(SHEETS.RESULTS, row)));\n  const linked = linkResultsToEvents_();\n  return ok.length + '件の記録を入れました' + (linked ? '（' + linked + '件はその日の大会・練習のページにも出ます）' : '') + (dup ? '（' + dup + '件はもう入っていたので、とばしました）' : '') + (ng.length ? '（入れられなかったもの：' + ng.join('／') + '）' : '');\n}\n\n// ---- タイムテーブルづくり（コーチ・役員が事前に） ----\n\n/**\n * タイムテーブルの表（種目・時刻・招集・アップ・出る子）をまとめて保存する（役員と当番）。\n *   ・時刻表（タイムテーブル）を入れかえる\n *   ・集合時刻を大会の案内に入れ、表の種目を案内の種目に足す\n *   ・出る子のエントリー（参加・種目）を表にそろえる（表にない種目はそのまま残す）\n * @param {{key: string, meetTime: string, rows: Object[]}} p rows の kids に、出る子の名前\n */\nfunction saveTimetablePlanAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('大会が見つかりません。');\n  requireManager_(ctx, p.key);\n  const rows = (p.rows || []).slice(0, 200);\n  saveTimetableAction_(ctx, { key: p.key, rows: rows });\n  const kids = {};\n  activeChildren_().forEach((c) => (kids[c.name] = c));\n  const planRaces = rows.map((r) => String(r.race || '').trim()).filter((r) => r && !/全体/.test(r)).filter((r, i, a) => a.indexOf(r) === i);\n  const assigned = {};\n  rows.forEach((r) => (r.kids || []).forEach((n) => { if (kids[n]) (assigned[n] = assigned[n] || []).push(String(r.race).trim()); }));\n  let changed = 0;\n  withLock_(() => {\n    let race = readRows_(SHEETS.RACES).find((r) => r.eventKey === p.key);\n    if (!race) race = appendRow_(SHEETS.RACES, { eventKey: p.key, '種別': '大会', '対象': '全員', '更新日時': now_() });\n    const list = splitNames_(race['種目']);\n    planRaces.forEach((r) => { if (list.indexOf(r) < 0) list.push(r); });\n    race['種目'] = list.join(',');\n    const meet = cleanTime_(p.meetTime || '');\n    if (meet) race['集合時刻'] = meet;\n    race['時刻表メモ'] = String(p.memo || '').slice(0, 1000);\n    race['時刻表下書き'] = '';\n    race['更新日時'] = now_();\n    updateRow_(SHEETS.RACES, race);\n    const entries = readRows_(SHEETS.ENTRIES).filter((x) => x.eventKey === p.key);\n    Object.keys(kids).forEach((name) => {\n      const mine = (assigned[name] || []).filter((r, i, a) => a.indexOf(r) === i);\n      const row = entries.find((x) => x['子ども'] === name);\n      const before = row ? splitNames_(row['種目']) : [];\n      const next = before.filter((r) => planRaces.indexOf(r) < 0).concat(mine);\n      if (!row && !mine.length) return;\n      if (row && next.join(',') === before.join(',') && (!mine.length || row['回答'] === '参加')) return;\n      const data = { eventKey: p.key, '子ども': name, '回答': mine.length ? '参加' : row['回答'], '種目': next.join(','), '更新者': ctx.name, '更新日時': now_() };\n      if (row) updateRow_(SHEETS.ENTRIES, Object.assign(row, data));\n      else appendRow_(SHEETS.ENTRIES, Object.assign(data, { '集金': '' }));\n      changed++;\n    });\n  });\n  logHistory_(p.key, ctx, 'タイムテーブルを大会に反映（' + rows.length + '種目・エントリー ' + changed + '人を更新）');\n  return 'タイムテーブルを大会に反映しました（' + rows.length + '件・エントリー ' + changed + '人を更新）';\n}\n\n/** タイムテーブルの下書き（まだ大会には出さない）。役員・当番 */\nfunction saveTimetableDraftAction_(ctx, p) {\n  if (!findEvent_(p.key)) throw new Error('大会が見つかりません。');\n  requireManager_(ctx, p.key);\n  const json = p.clear ? '' : JSON.stringify(p.draft || {});\n  if (json.length > 45000) throw new Error('下書きが大きすぎます。種目を減らしてください。');\n  withLock_(() => {\n    let race = readRows_(SHEETS.RACES).find((r) => r.eventKey === p.key);\n    if (!race) race = appendRow_(SHEETS.RACES, { eventKey: p.key, '種別': '大会', '対象': '全員', '更新日時': now_() });\n    race['時刻表下書き'] = json;\n    updateRow_(SHEETS.RACES, race);\n  });\n  return p.clear ? '下書きを消しました' : '下書きを保存しました（まだ大会には出ていません）';\n}\n\n// ---- アンケート（出欠・投票） ----\n\n/** アンケートをつくる（役員）。選択肢はボタンで答える。家族ごとに1つの回答 */\nfunction savePollAction_(ctx, p) {\n  const title = String(p.title || '').trim().slice(0, 80);\n  const options = (p.options || []).map((x) => String(x).trim().slice(0, 30)).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).slice(0, 12);\n  if (!title) throw new Error('タイトルを入れてください。');\n  if (options.length < 2) throw new Error('選択肢を2つ以上入れてください。');\n  withLock_(() => appendRow_(SHEETS.POLLS, {\n    id: randomKey_().slice(0, 10), 'タイトル': title, '説明': String(p.body || '').slice(0, 1000), '選択肢': JSON.stringify(options), '複数': p.multi ? '○' : '',\n    '締切': /^\\d{4}-\\d{2}-\\d{2}$/.test(p.deadline || '') ? p.deadline : '', eventKey: p.key || '', '作成者': ctx.name, '日時': now_(), '終了': '',\n  }));\n  return 'アンケートをつくりました';\n}\n\nfunction closePollAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.POLLS).find((x) => x.id && x.id === p.id);\n    if (!row) throw new Error('アンケートが見つかりません。');\n    if (p.remove) clearRow_(SHEETS.POLLS, row);\n    else {\n      row['終了'] = p.reopen ? '' : '○';\n      if (p.reopen && row['締切'] && row['締切'] < today_()) row['締切'] = '';\n      updateRow_(SHEETS.POLLS, row);\n    }\n  });\n  return p.remove ? 'アンケートを消しました' : p.reopen ? 'アンケートを再開しました' : 'アンケートを締め切りました';\n}\n\nfunction answerPollAction_(ctx, p) {\n  const poll = readRows_(SHEETS.POLLS).find((x) => x.id && x.id === p.id);\n  if (!poll) throw new Error('アンケートが見つかりません。');\n  if (poll['終了'] === '○' || (poll['締切'] && today_() > poll['締切'])) throw new Error('このアンケートは締め切りました。');\n  const options = JSON.parse(poll['選択肢'] || '[]');\n  let ans = (p.answers || []).map(String).filter((x) => options.indexOf(x) >= 0);\n  if (poll['複数'] !== '○') ans = ans.slice(0, 1);\n  withLock_(() => {\n    const row = readRows_(SHEETS.ANSWERS).find((x) => x['アンケートid'] === p.id && x['家族ID'] === ctx.famId);\n    const data = { 'アンケートid': p.id, '家族ID': ctx.famId, '回答': JSON.stringify(ans), 'コメント': String(p.comment || '').slice(0, 200), '更新者': ctx.name, '日時': now_() };\n    if (row) updateRow_(SHEETS.ANSWERS, Object.assign(row, data));\n    else appendRow_(SHEETS.ANSWERS, data);\n  });\n  return ans.length ? '回答しました：' + ans.join('・') : '回答を取り消しました';\n}\n\n/** 画面に渡すアンケート（終わってから60日まで）。結果の数・わが家の回答。役員には未回答の家族 */\nfunction pollsFor_(ctx, families) {\n  const answers = readRows_(SHEETS.ANSWERS);\n  const label = {};\n  families.forEach((f) => (label[f.id] = f.label));\n  return readRows_(SHEETS.POLLS).filter((x) => x.id).reverse().map((x) => {\n    const options = JSON.parse(x['選択肢'] || '[]');\n    const mine = answers.filter((a) => a['アンケートid'] === x.id);\n    const counts = {};\n    options.forEach((o) => (counts[o] = 0));\n    const who = {};\n    mine.forEach((a) => JSON.parse(a['回答'] || '[]').forEach((o) => { counts[o] = (counts[o] || 0) + 1; (who[o] = who[o] || []).push(label[a['家族ID']] || a['更新者']); }));\n    const my = mine.find((a) => a['家族ID'] === ctx.famId);\n    const closed = x['終了'] === '○' || (x['締切'] && today_() > x['締切']);\n    const answered = mine.filter((a) => JSON.parse(a['回答'] || '[]').length).map((a) => a['家族ID']);\n    return {\n      id: x.id, title: x['タイトル'], body: x['説明'], options: options, multi: x['複数'] === '○', deadline: x['締切'], key: x.eventKey, by: x['作成者'], at: x['日時'], closed: closed,\n      counts: counts, who: who, total: answered.length, families: families.length, mine: my ? JSON.parse(my['回答'] || '[]') : [], myComment: my ? my['コメント'] : '',\n      unanswered: ctx.admin ? families.filter((f) => answered.indexOf(f.id) < 0).map((f) => f.label) : [],\n    };\n  }).filter((p) => !p.closed || String(p.at).slice(0, 10) >= addDays_(today_(), -60));\n}\n\n// ---- 集金（年会費・ユニフォーム代など） ----\n\nfunction saveFeeAction_(ctx, p) {\n  const name = String(p.name || '').trim().slice(0, 40);\n  const amount = Number(toHalfWidth_(p.amount || '').replace(/[^0-9]/g, ''));\n  if (!name) throw new Error('名前を入れてください（例：年会費）。');\n  if (!amount) throw new Error('金額を入れてください。');\n  withLock_(() => appendRow_(SHEETS.FEES, {\n    id: randomKey_().slice(0, 10), '名前': name, '金額': String(amount), '対象': String(p.target || '全員').slice(0, 20),\n    '期限': /^\\d{4}-\\d{2}-\\d{2}$/.test(p.deadline || '') ? p.deadline : '', 'メモ': String(p.memo || '').slice(0, 200), '作成者': ctx.name, '日時': now_(), '終了': '',\n  }));\n  return '集金「' + name + '」をつくりました';\n}\n\nfunction closeFeeAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.FEES).find((x) => x.id && x.id === p.id);\n    if (!row) throw new Error('見つかりません。');\n    if (p.remove) clearRow_(SHEETS.FEES, row);\n    else { row['終了'] = p.reopen ? '' : '○'; updateRow_(SHEETS.FEES, row); }\n  });\n  return p.remove ? '集金を消しました' : p.reopen ? '集金を再開しました' : '集金を終わりにしました';\n}\n\nfunction setFeePaidAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.FEE_PAID).find((x) => x['集金id'] === p.id && x['子ども'] === p.child);\n    const data = { '集金id': p.id, '子ども': p.child, '状態': p.paid ? '済' : '', '更新者': ctx.name, '日時': now_() };\n    if (row) updateRow_(SHEETS.FEE_PAID, Object.assign(row, data));\n    else appendRow_(SHEETS.FEE_PAID, data);\n  });\n  return '';\n}\n\n/** 画面に渡す集金。対象の子ども（学年で決まる）と、済んだ子 */\nfunction feesFor_(ctx, children) {\n  const paid = readRows_(SHEETS.FEE_PAID).filter((x) => x['状態'] === '済');\n  return readRows_(SHEETS.FEES).filter((x) => x.id).reverse().map((x) => {\n    // 役員以外には、自分の子の分だけ見せる（だれが払ったかは役員だけ）\n    const target = children.filter((c) => inTarget_(x['対象'], c.grade) && (ctx.admin || c.parents.indexOf(ctx.userId) >= 0)).map((c) => c.name);\n    return {\n      id: x.id, name: x['名前'], amount: Number(x['金額']) || 0, target: x['対象'], deadline: x['期限'], memo
