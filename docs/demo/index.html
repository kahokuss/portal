<html lang="ja"><head><meta charset="utf-8">

<title>お試しポータル（ダミーデータ）</title>
<style>
html,body{margin:0;height:100%;background:#e9eef0;font-family:"Hiragino Sans","Noto Sans CJK JP",system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#6a4fb0;color:#fff;font-size:13px}
#bar b{font-size:14px}#bar select,#bar button{font:inherit;font-size:13px;border:0;border-radius:8px;padding:4px 8px}

</style></head><body>
<div id="bar"><b>🧪 お試し（ダミーデータ）</b><span>本物のデータには入りません</span><label>だれで見る <select id="who"></select></label><button id="reset" type="button">最初から</button></div>
<div id="loading">ダミーデータを準備しています…</div>
<iframe id="app" title="お試しポータル" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
<script>var FILES = {"Bot.gs":"/**\n * Botに聞くと答える機能（返信なので、1対1のトークなら通数はかかりません）。\n *   新着 … わが家にかかわること（次の練習・当番・エントリーの締切・新しいお知らせ・ヒヤリハット）。役員には確認待ちの休みなども\n *   今日 … 今日の予定。大会の日は、わが家の子の時刻・招集・ナンバー\n *   予定 … これからの予定5件\n *   休み … 休みの連絡（「休み 明日」「休み たろう 10/20 体調不良」）。ボタンからも選べる\n *   当番 … わが家の当番\n *   出欠 … 次の練習の休みの人\n *   エントリー … 大会のエントリーの状況と締切\n */\n\n/** 返事の下に出すボタン（クイックリプライ） */\nfunction quickItems_(labels) {\n  return {\n    items: labels.slice(0, 13).map((x) => {\n      if (x && x.type === 'uri') return { type: 'action', action: { type: 'uri', label: String(x.label).slice(0, 20), uri: x.uri } };\n      const label = typeof x === 'string' ? x : x[0];\n      const text = typeof x === 'string' ? x : x[1];\n      return { type: 'action', action: { type: 'message', label: label.slice(0, 20), text: text } };\n    }),\n  };\n}\n\nconst MAIN_QUICK = ['メニュー', '新着', 'カレンダー', '休み'];\n\n/** 「カレンダー 12」→ 今日から見て近いほうの12月 */\nfunction botMonthOf_(m) {\n  const t = today_(), y = Number(t.slice(0, 4)), now = Number(t.slice(5, 7));\n  const yy = m < now - 3 ? y + 1 : y;\n  return yy + '-' + ('0' + Math.min(12, Math.max(1, m))).slice(-2);\n}\n\n/** 文章の配列を、最後にボタンを付けた返事にする */\nfunction botMessages_(texts, quick) {\n  const msgs = texts.filter(Boolean).slice(0, 5).map((t) => text_(t));\n  if (msgs.length) msgs[msgs.length - 1].quickReply = quickItems_(quick || MAIN_QUICK);\n  return msgs;\n}\n\nfunction botData_() {\n  const today = today_();\n  const races = {};\n  readRows_(SHEETS.RACES).forEach((r) => (races[r.eventKey] = r));\n  const events = readRows_(SHEETS.EVENTS)\n    .filter((e) => e['状態'] !== '中止' && e['日付'] >= today)\n    .sort(compareEvents_)\n    .map((e) => ({ row: e, key: e.eventKey, date: e['日付'], title: e['タイトル'], place: e['場所'], race: !!races[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習', detail: races[e.eventKey] ? raceToObj_(races[e.eventKey]) : null }));\n  return { today: today, events: events, races: races };\n}\n\nfunction famLabelMap_() {\n  const map = {};\n  familiesList_(readRows_(SHEETS.FAMILIES), activeChildren_()).forEach((f) => (map[f.id] = f.label));\n  return map;\n}\n\n/** まだ予定に反映していない、LINEの変更連絡（その予定の分） */\nfunction pendingNotices_() {\n  const out = {};\n  readRows_(SHEETS.COMMENTS).forEach((c) => {\n    if (c.id && c['種類'] === '変更連絡' && !c['対策'] && c.eventKey) (out[c.eventKey] = out[c.eventKey] || []).push(c);\n  });\n  return out;\n}\n\nfunction noticeLine_(list) {\n  return list && list.length ? '📣 変更連絡あり（' + list[list.length - 1]['表示名'] + 'さん）：' + String(list[list.length - 1]['本文']).replace(/\\s+/g, ' ').slice(0, 60) : '';\n}\n\nfunction whenText_(e) {\n  return formatWhen_(e.row) + ' ' + e.title + (e.place ? '（' + e.place + '）' : '');\n}\n\nfunction dayWord_(date, today) {\n  const n = Math.round((new Date(date + 'T00:00:00Z') - new Date(today + 'T00:00:00Z')) / 86400000);\n  return n === 0 ? '今日' : n === 1 ? '明日' : n === 2 ? 'あさって' : 'あと' + n + '日';\n}\n\nfunction botUser_(ev) {\n  const userId = ev.source.userId;\n  const family = findFamily_(userId);\n  const kids = childrenOf_(userId);\n  return { userId: userId, family: family, admin: isAdmin_(family), famId: family ? famIdOf_(family) : userId, kids: kids, name: (family && family['表示名']) || '' };\n}\n\nfunction needRegister_(ev) {\n  respond_(ev, botMessages_(['先にお子さんを登録してください。\\n「登録 山田たろう 3年」と送るか、ポータルの「わが家」から登録できます。\\n' + portalUrl_()], ['ヘルプ', 'ポータル']));\n}\n\n// ---- 新着 ----\n\nfunction handleNews_(ev) {\n  const u = botUser_(ev);\n  const d = botData_();\n  const lines = ['🔔 ' + CONFIG.CLUB_NAME + ' 新着（' + formatDate_(d.today) + '）'];\n  const absences = readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['日付'] >= d.today);\n  const duties = readRows_(SHEETS.DUTIES).filter((x) => x['日付'] >= d.today && !isRaceStaffRow_(x));\n  const labels = famLabelMap_();\n\n  const np = d.events.find((e) => !e.race);\n  if (np) {\n    const off = absences.filter((a) => a['日付'] === np.date);\n    const duty = duties.filter((x) => x.eventKey === np.key).map((x) => labels[x['家族ID']] || '').filter(Boolean);\n    lines.push('', '🏃 次の練習（' + dayWord_(np.date, d.today) + '）', whenText_(np), '休み ' + off.length + '人' + (duty.length ? '・当番 ' + duty.join('、') : ''));\n    if (duties.some((x) => x.eventKey === np.key && x['家族ID'] === u.famId) && off.length) lines.push('（当番のため表示）休む子：' + off.map((a) => a['子ども']).join('、'));\n    const nl = noticeLine_(pendingNotices_()[np.key]);\n    if (nl) lines.push(nl);\n  }\n\n  const mine = duties.filter((x) => x['家族ID'] === u.famId && x['日付'] <= addDays_(d.today, 14));\n  if (mine.length) {\n    lines.push('', '🧹 わが家の当番');\n    mine.forEach((x) => { const e = d.events.find((y) => y.key === x.eventKey); if (e) lines.push('・' + formatDate_(e.date) + ' ' + x['種類'] + '当番（' + e.title + '）'); });\n  }\n\n  const entries = readRows_(SHEETS.ENTRIES);\n  const todo = [];\n  d.events.filter((e) => e.race && e.detail && e.detail.deadline && e.detail.deadline >= d.today).forEach((e) => {\n    u.kids.forEach((k) => {\n      if (!inTarget_(e.detail.target, k.grade)) return;\n      if (!entries.some((x) => x.eventKey === e.key && x['子ども'] === k.name)) todo.push('・' + e.title + '：' + k.name + ' 未回答（締切 ' + formatDate_(e.detail.deadline) + '）');\n    });\n  });\n  if (todo.length) lines.push('', '✅ エントリーの回答がまだです', ...todo.slice(0, 5));\n\n  const seen = (u.family && u.family['新着確認']) || '';\n  const notices = readRows_(SHEETS.NOTICES).filter((n) => n.id && n['日時'] > (seen || now_().slice(0, 10) + ' 00')).sort((a, b) => (a['日時'] < b['日時'] ? 1 : -1));\n  const recent = notices.length ? notices : readRows_(SHEETS.NOTICES).filter((n) => n.id && n['日付'] >= addDays_(d.today, -7));\n  if (recent.length) {\n    lines.push('', notices.length ? '📢 新しいお知らせ' : '📢 最近のお知らせ');\n    recent.slice(0, 3).forEach((n) => lines.push('・' + n['タイトル'] + (n['本文'] ? '：' + String(n['本文']).slice(0, 40) : '')));\n  }\n\n  const nm = readRows_(SHEETS.COMMENTS).filter((c) => c.id && c['種類'] === 'ヒヤリハット' && c['公開'] !== '役員' && String(c['日時']).slice(0, 10) >= addDays_(d.today, -14));\n  if (nm.length) {\n    lines.push('', '⚠ ヒヤリハット（2週間以内）');\n    nm.slice(-3).forEach((c) => lines.push('・' + (c['場所'] ? c['場所'] + '：' : '') + String(c['本文']).slice(0, 40) + (c['対策'] ? '\\n　→ 対策：' + String(c['対策']).slice(0, 40) : '（対策まだ）')));\n  }\n\n  const adminLines = [];\n  if (u.admin) {\n    const unack = absences.filter((a) => a['確認'] !== '済');\n    if (unack.length) {\n      adminLines.push('🙋 確認していない休みの連絡 ' + unack.length + '件');\n      unack.slice(0, 8).forEach((a) => adminLines.push('・' + formatDate_(a['日付']) + ' ' + a['子ども'] + '（' + a['理由'] + (a['メモ'] ? '・' + a['メモ'] : '') + '）'));\n    }\n    const pend = readRows_(SHEETS.COMMENTS).filter((c) => c.id && c['種類'] === '変更連絡' && !c['対策']);\n    if (pend.length) adminLines.push('📣 予定にまだ反映していない変更連絡 ' + pend.length + '件（ポータルの練習のページで「予定に反映する」）');\n    const open = readRows_(SHEETS.COMMENTS).filter((c) => c.id && c['種類'] === 'ヒヤリハット' && !c['対策']);\n    if (open.length) adminLines.push('⚠ 対策がまだのヒヤリハット ' + open.length + '件');\n    const tasks = readRows_(SHEETS.TASKS);\n    d.events.filter((e) => e.detail && e.detail.applyBy && e.detail.applyBy <= addDays_(d.today, 7)).forEach((e) => {\n      const done = tasks.some((t) => t.eventKey === e.key && t['種類'] === 'エントリー控え' && t['状態'] === '済');\n      if (!done) adminLines.push('📮 申込期限が近い：' + e.title + '（' + formatDate_(e.detail.applyBy) + '・' + dayWord_(e.detail.applyBy, d.today).replace('今日', '今日まで') + '）');\n    });\n    const nowStr = now_().slice(0, 16), soon = fmt_(new Date(Date.now() + 24 * 3600000), 'yyyy-MM-dd HH:mm');\n    d.events.filter((e) => e.detail).forEach((e) => {\n      Object.keys(e.detail.deadlines || {}).forEach((k) => {\n        const at = e.detail.deadlines[k];\n        if (at < nowStr || at > soon) return;\n        const done = tasks.filter((t) => t.eventKey === e.key && t['種類'] === k);\n        if (done.length && done.every((t) => t['状態'] === '済')) return;\n        adminLines.push('⏰ ' + deadlineLabel_(k) + '：' + at.slice(5, 10).replace('-', '/') + ' ' + at.slice(11) + 'まで（' + e.title + '）');\n      });\n    });\n    const noDuty = d.events.filter((e) => e.date <= addDays_(d.today, 14) && !duties.some((x) => x.eventKey === e.key));\n    if (noDuty.length) adminLines.push('🧹 当番が決まっていない予定（2週間以内）' + noDuty.length + '件');\n    if (adminLines.length) adminLines.unshift('【役員向け】');\n  }\n\n  if (lines.length === 1) lines.push('', '新しいことはありません。');\n  if (u.family) withLock_(() => { const f = findFamily_(u.userId); if (f) { f['新着確認'] = now_(); updateRow_(SHEETS.FAMILIES, f); } });\n  const msgs = botMessages_([lines.join('\\n'), adminLines.length ? adminLines.join('\\n') + '\\n\\n詳しくはポータルの管理メニューで\\n' + portalUrl_() : '']);\n  // 次の練習・次の大会をカードでも（休み・参加をそのまま押せる）\n  const cards = [d.events.find((e) => !e.race), d.events.find((e) => e.race)].filter(Boolean);\n  if (cards.length && u.kids.length) { try { msgs.push(eventsCarousel_(cards, u, d, '次の練習・大会')); } catch (err) { console.warn(err); } }\n  respond_(ev, msgs);\n}\n\n// ---- 今日・予定 ----\n\n/** 今日の「やること」（目標）の文。なければ空 */\nfunction goalTodayText_(u, today) {\n  const list = todayGoalActions_(u.kids.map((k) => k.name), today);\n  const lines = [];\n  if (list.length) lines.push('🎯 今日やること（目標）', ...list.map((x) => (x.done ? '✓ ' : '□ ') + (u.kids.length > 1 ? x.child + '：' : '') + x.t));\n  // 連続日数・この7日・ペース予想（目標がある子だけ）\n  u.kids.forEach((k) => {\n    const st = kidGoalStats_(k.name, today);\n    if (!st.hero) return;\n    const who = u.kids.length > 1 ? k.name + '：' : '';\n    const bits = [];\n    if (st.streak >= 2) bits.push('🔥 ' + st.streak + '日連続');\n    if (st.plan7 >= 3) bits.push('この7日 ' + st.done7 + '/' + st.plan7);\n    if (bits.length) lines.push(who + bits.join('・'));\n    if (st.pace) lines.push(who + (st.pace.ok ? '👍 ' + st.pace.race + '：このペースなら届きそう（' + formatDate_(st.pace.at) + 'に ' + st.pace.pred + ' の予想）' : '⏱ ' + st.pace.race + '：このままだと ' + formatDate_(st.pace.at) + 'に ' + st.pace.pred + '（あと ' + st.pace.gap + '）'));\n    if (!st.hasActs) lines.push(who + '⚠ 目標に向けた「やること」がまだ決まっていません');\n  });\n  if (!lines.length) return '';\n  if (list.length) lines.push('できたらポータルの「目標・自主トレ」でチェック');\n  // 土・日は週のふりかえりも\n  const wd = new Date(today + 'T00:00:00Z').getUTCDay();\n  if (wd === 0 || wd === 6) u.kids.forEach((k) => { if (kidGoalStats_(k.name, today).hero) lines.push('', weekReviewText_(k.name, today)); });\n  return lines.join('\\n');\n}\n\n/** 「ふりかえり」：今週（月曜は先週）のできた・できなかった */\nfunction handleReview_(ev) {\n  const u = botUser_(ev);\n  if (!u.kids.length) return needRegister_(ev);\n  respond_(ev, botMessages_(u.kids.slice(0, 4).map((k) => weekReviewText_(k.name, today_()))));\n}\n\nfunction handleToday_(ev) {\n  const u = botUser_(ev);\n  const d = botData_();\n  const todays = d.events.filter((e) => e.date === d.today);\n  const goalText = goalTodayText_(u, d.today);\n  if (!todays.length) {\n    const next = d.events[0];\n    return respond_(ev, botMessages_(['今日の予定はありません。' + (next ? '\\n次は ' + whenText_(next) + '（' + dayWord_(next.date, d.today) + '）' : ''), goalText]));\n  }\n  const tasks = readRows_(SHEETS.TASKS);\n  const entries = readRows_(SHEETS.ENTRIES);\n  const notices = pendingNotices_();\n  const out = todays.map((e) => {\n    const lines = ['📅 今日 ' + whenText_(e)];\n    if (notices[e.key]) lines.push(noticeLine_(notices[e.key]));\n    if (e.race && e.detail && (e.detail.meetTime || e.detail.meetPlace)) lines.push('集合 ' + [e.detail.meetTime, e.detail.meetPlace].filter(Boolean).join(' '));\n    const jin = e.race && tasks.find((t) => t.eventKey === e.key && t['種類'] === '陣地');\n    if (jin && (jin['メモ'] || jin['写真ID'])) lines.push('📍 陣地：' + (jin['メモ'] ? String(jin['メモ']).replace(/\\s+/g, ' ').slice(0, 80) : '写真あり') + (jin['写真ID'] ? '（写真はポータルで）' : ''));\n    if (e.race) {\n      const rows = readRows_(SHEETS.TIMETABLE).filter((r) => r.id && r.eventKey === e.key);\n      u.kids.forEach((k) => {\n        const x = entries.find((y) => y.eventKey === e.key && y['子ども'] === k.name);\n        if (!x || x['回答'] !== '参加') return;\n        const bib = tasks.find((t) => t.eventKey === e.key && t['種類'] === 'ナンバー' && t['対象'] === k.name);\n        lines.push('', '👟 ' + k.name + (bib && bib['メモ'] ? '（ナンバー ' + bib['メモ'] + '）' : ''));\n        const mine = rows.filter((r) => splitNames_(x['種目']).some((q) => sameRaceGs_(r['種目'], q) && qualOkGs_(q, r['区分'])) && groupMatchGs_(r['区分'], k)).sort((a, b) => (padTime_(a['開始']) < padTime_(b['開始']) ? -1 : 1));\n        const adv = (r) => !needsAdvanceGs_(rows, r) || tasks.some((t) => t.eventKey === e.key && t['種類'] === '進出' && t['対象'] === k.name + '|' + r.id && t['状態'] === '済');\n        if (!mine.length) lines.push('　種目：' + (x['種目'] || '—') + '（タイムテーブルはまだ）');\n        mine.forEach((r) => {\n          const lane = tasks.find((t) => t.eventKey === e.key && t['種類'] === 'レーン' && t['対象'] === k.name + '|' + r.id);\n          lines.push('　' + (r['開始'] || '—') + ' ' + r['種目'] + (r['組'] ? ' ' + r['組'] : '') + (r['招集'] ? '　招集 ' + r['招集'] : '') + (lane && lane['メモ'] ? '　' + lane['メモ'] : '') + (adv(r) ? '' : '（進んだら）'));\n        });\n      });\n    } else {\n      if (e.row['ダウン']) lines.push('🏃 ダウンに入りました（' + e.row['ダウン'].replace(/^0/, '') + '）。お迎えをお願いします');\n      const off = readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['日付'] === e.date).map((a) => a['子ども']);\n      lines.push('休み ' + off.length + '人' + (off.length ? '：' + off.join('、') : ''));\n    }\n    return lines.join('\\n');\n  });\n  if (goalText) out.push(goalText);\n  respond_(ev, botMessages_(out.slice(0, 5)));\n}\n\nfunction handleSchedule_(ev) {\n  const d = botData_();\n  const list = d.events.slice(0, 6);\n  if (!list.length) return respond_(ev, botMessages_(['これからの予定はありません。']));\n  // カードで出す（休み・エントリーをそのまま押せる）。カードが出せないときは文章\n  try { return respond_(ev, [eventsCarousel_(d.events.slice(0, 10), botUser_(ev), d, 'これからの予定：' + list.slice(0, 3).map((e) => formatDate_(e.date) + ' ' + e.title).join('、'))]); } catch (err) { console.warn(err); }\n  const lines = ['📅 これからの予定'];\n  const notices = pendingNotices_();\n  list.forEach((e) => lines.push((e.race ? '🏅 ' : '・') + whenText_(e) + (e.race && e.detail && e.detail.deadline && e.detail.deadline >= d.today ? '\\n　締切 ' + formatDate_(e.detail.deadline) : '') + (notices[e.key] ? '\\n　' + noticeLine_(notices[e.key]) : '')));\n  lines.push('', 'ぜんぶ見るときはポータルで\\n' + portalUrl_());\n  respond_(ev, botMessages_([lines.join('\\n')]));\n}\n\n// ---- 休み ----\n\n/** 「休み 明日」「休み たろう 10/20 体調不良 熱があります」を読み取る */\nfunction parseAbsenceArgs_(args, kids, practiceDates, today) {\n  const tokens = toHalfWidth_(args || '').trim().split(/\\s+/).filter(Boolean);\n  let child = kids.length === 1 ? kids[0].name : '';\n  let date = '';\n  let reason = '';\n  const memo = [];\n  tokens.forEach((t) => {\n    const k = kids.find((c) => c.name === t || c.name.indexOf(t) >= 0);\n    if (k && !child) { child = k.name; return; }\n    if (k && child === k.name) return;\n    const dd = t === '今日' ? today : t === '明日' ? addDays_(today, 1) : t === 'あさって' ? addDays_(today, 2) : parseDateCell_(t.replace(/^(\\d{1,2})日$/, (m, n) => today.slice(5, 7) + '/' + n));\n    if (dd && !date) { date = dd; return; }\n    if (!reason && CHOICES.ABSENCE_REASONS.indexOf(t) >= 0) { reason = t; return; }\n    memo.push(t);\n  });\n  if (!date) date = practiceDates[0] || '';\n  return { child: child, date: date, reason: reason || 'その他', memo: memo.join(' ') };\n}\n\nfunction handleAbsence_(ev, args) {\n  const u = botUser_(ev);\n  if (!u.kids.length) return needRegister_(ev);\n  const d = botData_();\n  const practices = d.events.filter((e) => !e.race).slice(0, 4);\n  if (!args) {\n    const quick = [];\n    practices.slice(0, u.kids.length > 1 ? 3 : 4).forEach((e) => u.kids.forEach((k) => quick.push([(u.kids.length > 1 ? short_(k.name) + ' ' : '') + formatDate_(e.date), { a: 'abs', d: e.date, c: k.name }, formatDate_(e.date) + ' ' + k.name + 'は休み'])));\n    const picks = u.kids.map((k) => ({ type: 'datetimepicker', label: ('📅 ' + (u.kids.length > 1 ? short_(k.name) + ' ' : '') + '日付を選ぶ').slice(0, 20), data: pbData_({ a: 'abs', c: k.name }), mode: 'date', initial: d.today, min: d.today }));\n    return respond_(ev, [Object.assign(text_('休みの連絡をします。下のボタンから選ぶか、\\n「休み 明日」「休み ' + u.kids[0].name + ' 10/20 体調不良」\\nのように送ってください。\\n理由とひとことは、役員と本人だけに見えます。'), { quickReply: quickPb_(picks.concat(quick.slice(0, 12 - picks.length))) })]);\n  }\n  const p = parseAbsenceArgs_(args, u.kids, practices.map((e) => e.date), d.today);\n  if (!p.child) return respond_(ev, botMessages_(['だれのお休みか、名前も書いてください。\\n例：休み ' + u.kids[0].name + ' 明日'], u.kids.map((k) => ['休み ' + k.name.slice(-6), '休み ' + k.name + ' ' + (p.date || '')])));\n  if (!p.date) return respond_(ev, botMessages_(['日にちが分かりませんでした。例：休み 明日、休み 10/20']));\n  try {\n    const msg = reportAbsenceAction_({ userId: u.userId, name: u.name || getDisplayName_(ev.source), admin: u.admin }, p);\n    const onDay = d.events.find((e) => e.date === p.date);\n    respond_(ev, botMessages_(['✅ ' + msg + '（' + p.reason + (p.memo ? '・' + p.memo : '') + '）' + (onDay ? '\\n' + whenText_(onDay) : '\\n※この日は予定が入っていません') + '\\n取り消すときは「休み取消」と送ってください。'], ['休み取消', '新着', '予定']));\n  } catch (err) {\n    respond_(ev, botMessages_(['⚠ ' + String(err.message || err)]));\n  }\n}\n\nfunction handleAbsenceCancel_(ev) {\n  const u = botUser_(ev);\n  const mine = readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['連絡者userId'] === u.userId && a['日付'] >= today_()).sort((a, b) => (a['日時'] < b['日時'] ? 1 : -1));\n  if (!mine.length) return respond_(ev, botMessages_(['取り消せる休みの連絡はありません。']));\n  const a = mine[0];\n  withLock_(() => clearRow_(SHEETS.ABSENCES, a));\n  respond_(ev, botMessages_(['🗑 ' + formatDate_(a['日付']) + ' ' + a['子ども'] + 'の休みの連絡を取り消しました。' + (mine.length > 1 ? '\\nほかにもあれば、もう一度「休み取消」と送ってください（新しい順に取り消します）。' : '')]));\n}\n\n// ---- 当番・出欠・エントリー ----\n\nfunction handleDuty_(ev) {\n  const u = botUser_(ev);\n  const d = botData_();\n  const labels = famLabelMap_();\n  const all = readRows_(SHEETS.DUTIES).filter((x) => x['日付'] >= d.today);\n  const duties = all.filter((x) => !isRaceStaffRow_(x));\n  const mine = all.filter((x) => x['家族ID'] === u.famId);\n  const lines = ['🧹 わが家の当番'];\n  if (!mine.length) lines.push('これからの当番はありません。');\n  mine.forEach((x) => { const e = d.events.find((y) => y.key === x.eventKey); if (e) lines.push('・' + formatDate_(e.date) + '（' + dayWord_(e.date, d.today) + '）' + (isRaceStaffRow_(x) ? '大会係（入力の担当）' : x['種類'] + '当番') + '\\n　' + e.title + (e.place ? '・' + e.place : '')); });\n  const next = d.events.slice(0, 5).map((e) => '・' + formatDate_(e.date) + ' ' + e.title + '：' + (duties.filter((x) => x.eventKey === e.key).map((x) => labels[x['家族ID']]).filter(Boolean).join('、') || '未定'));\n  // 役員には、当番カレンダー（輪番づくり）を開くボタン\n  if (u.admin) return respond_(ev, botMessages_([lines.join('\\n'), '📋 これからの当番\\n' + next.join('\\n'), '🗓 当番の入れかえ・空きの自動割り当ては「当番カレンダー」で\\n' + dutyCalUrl_()], [{ type: 'uri', label: '🗓 当番カレンダー', uri: dutyCalUrl_() }].concat(MAIN_QUICK)));\n  respond_(ev, botMessages_([lines.join('\\n'), '📋 これからの当番\\n' + next.join('\\n')]));\n}\n\n/** 当番カレンダー（輪番づくり・役員）を開くアドレス */\nfunction dutyCalUrl_() {\n  // GitHub Pages のポータルなら、役員ページ（staff/）を直接開く\n  if (CONFIG.PORTAL_URL) return String(CONFIG.PORTAL_URL).replace(/\\/?$/, '/') + 'staff/?adm=dutycal';\n  const u = portalUrl_();\n  return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'adm=dutycal';\n}\n\n/** 「当番カレンダー」「輪番」と送られたとき：役員にはボタン、ほかの人には自分の当番 */\nfunction handleDutyCal_(ev) {\n  const u = botUser_(ev);\n  if (!u.admin) return handleDuty_(ev);\n  respond_(ev, [flex_('当番カレンダー', { type: 'bubble', body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '12px', contents: [\n    txt_('🗓 当番カレンダー（輪番づくり）', { weight: 'bold', size: 'md' }),\n    txt_('月のカレンダーで、練習・大会の当番を入れる・入れかえる・空きを自動で入れる（役員）', { size: 'xs', color: C_SUB }),\n    btn_(uriAction_('当番カレンダーを開く', dutyCalUrl_()), 'primary', C_RACE),\n  ] } })]);\n}\n\nfunction handleAttendance_(ev) {\n  const u = botUser_(ev);\n  const d = botData_();\n  const np = d.events.find((e) => !e.race);\n  if (!np) return respond_(ev, botMessages_(['練習の予定がありません。']));\n  const off = readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['日付'] === np.date);\n  const all = activeChildren_();\n  const lines = ['🏃 ' + whenText_(np) + '（' + dayWord_(np.date, d.today) + '）', '出席予定 ' + (all.length - off.length) + '人・休み ' + off.length + '人'];\n  off.forEach((a) => lines.push('・' + a['子ども'] + (u.admin ? '（' + a['理由'] + (a['メモ'] ? '・' + a['メモ'] : '') + '）' : '')));\n  respond_(ev, botMessages_([lines.join('\\n')]));\n}\n\nfunction handleEntries_(ev) {\n  const u = botUser_(ev);\n  if (!u.kids.length) return needRegister_(ev);\n  const d = botData_();\n  const entries = readRows_(SHEETS.ENTRIES);\n  const races = d.events.filter((e) => e.race).slice(0, 5);\n  if (!races.length) return respond_(ev, botMessages_(['予定されている大会はありません。']));\n  const lines = ['🏅 大会のエントリー'];\n  races.forEach((e) => {\n    const det = e.detail || {};\n    lines.push('', formatDate_(e.date) + ' ' + e.title + (det.deadline ? '（締切 ' + formatDate_(det.deadline) + (det.deadline < d.today ? '・締切済み' : '') + '）' : ''));\n    u.kids.forEach((k) => {\n      if (!inTarget_(det.target, k.grade)) return lines.push('・' + k.name + '：対象外');\n      const x = entries.find((y) => y.eventKey === e.key && y['子ども'] === k.name);\n      lines.push('・' + k.name + '：' + (x ? x['回答'] + (x['種目'] ? '（' + x['種目'].replace(/,/g, '・') + '）' : '') + (det.fee && x['回答'] === '参加' ? (x['集金'] === '済' ? ' 参加費済' : ' 参加費まだ') : '') : '未回答'));\n    });\n  });\n  lines.push('', '回答はポータルから\\n' + portalUrl_());\n  respond_(ev, botMessages_([lines.join('\\n')]));\n}\n\n// ---- 画面と同じ照合（タイムテーブルの区分・種目） ----\n\nconst ROUND_ORDER_GS = ['予選', '準決勝', '決勝'];\n\nfunction roundOfGs_(r) {\n  const m = String(r['組'] || '').match(/準決勝|予選|決勝|タイムレース/);\n  return m ? m[0] : '';\n}\n\n/** 同じ種目・区分に、前のラウンド（予選・準決勝）の行がある決勝・準決勝か */\nfunction needsAdvanceGs_(rows, r) {\n  const ri = ROUND_ORDER_GS.indexOf(roundOfGs_(r));\n  if (ri <= 0) return false;\n  const g = toHalfWidth_(r['区分'] || '').replace(/\\s/g, '');\n  return rows.some((x) => {\n    const xi = ROUND_ORDER_GS.indexOf(roundOfGs_(x));\n    return x.id !== r.id && xi >= 0 && xi < ri && sameRaceGs_(x['種目'], r['種目']) && toHalfWidth_(x['区分'] || '').replace(/\\s/g, '') === g;\n  });\n}\n\nfunction padTime_(t) {\n  const m = String(t || '').match(/^(\\d{1,2}):(\\d{2})/);\n  return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '99:99';\n}\n\nfunction canonRaceGs_(r) {\n  r = toHalfWidth_(r || '').toLowerCase().replace(/\\s/g, '').replace(/[×x]/g, 'x').replace(/\\(.*?\\)/g, '');\n  if (/リレー|\\dx\\d+m/.test(r)) return 'リレー' + ((r.match(/\\dx\\d+m/) || [''])[0]) + (/クロカン/.test(r) ? 'クロカン' : '');\n  return r.replace('走り幅跳び', '走幅跳').replace('走り高跳び', '走高跳').replace(/幅跳び?$/, '幅跳').replace(/高跳び?$/, '高跳')\n    .replace(/ジャベ(?:リック)?ボール(?:投げ?|スロー)|ボール(?:投げ?|スロー)|ジャベリックスロー|ジャベ$/, 'ボール投').replace(/ハードル/, 'h').replace(/^小学|^[1-6・.]+年|男子|女子|混合/g, '');\n}\n\nfunction sameRaceGs_(a, b) {\n  a = canonRaceGs_(a);\n  b = canonRaceGs_(b);\n  if (!a || !b) return false;\n  if (a === b) return true;\n  // リレーとリレーでないもの・距離のちがうもの・ハードルとそうでないものは別（ポータルの sameCanon と同じ）\n  const rel = (x) => x.indexOf('リレー') === 0, num = (x) => (x.match(/\\d+/g) || []).join('x'), hur = (x) => /\\dmh|^h|h$/.test(x);\n  if (rel(a) !== rel(b) || hur(a) !== hur(b)) return false;\n  if (num(a) && num(b) && num(a) !== num(b)) return false;\n  return a.indexOf(b) >= 0 || b.indexOf(a) >= 0;\n}\n\n/** エントリーの種目に「（男子）」のように部が付いていたら、時刻表のその区分の行だけ */\nfunction qualOkGs_(q, group) {\n  const m = String(q || '').match(/[（(]([^）)]*)[）)]\\s*$/);\n  const n = (v) => toHalfWidth_(v || '').replace(/\\s/g, '');\n  if (!m || n(m[1]) === n(group)) return true;\n  // 「1・2・3・4年男女」と「1〜4年男女」は同じ部\n  const parse = (v) => {\n    v = n(v); let gs = [];\n    const g = v.match(/([1-6](?:[・,、~〜\\-][1-6])*)年/);\n    if (g) { const d = g[1].match(/[1-6]/g).map(Number); if (/[~〜\\-]/.test(g[1]) && d.length === 2) { for (let i = d[0]; i <= d[1]; i++) gs.push(i); } else gs = d; }\n    return gs.sort().join() + '|' + (/男女|混合/.test(v) ? '男女' : /男/.test(v) ? '男子' : /女/.test(v) ? '女子' : '');\n  };\n  return parse(m[1]) !== '|' && parse(m[1]) === parse(group);\n}\n\nfunction groupMatchGs_(g, k) {\n  g = toHalfWidth_(g || '').replace(/[〜～]/g, '~');\n  if (/保護者|大人|一般|父|母|中学|高校|OB|OG|シニア|マスターズ/.test(g)) return false; // 保護者・一般などの部には子どもは出ない\n  const sex = /男女|混合/.test(g) ? '' : /男/.test(g) ? '男' : /女/.test(g) ? '女' : '';\n  if (sex && k.sex && sex !== k.sex) return false;\n  let grades = [];\n  if (/低学年/.test(g)) grades = [1, 2, 3];\n  if (/中学年/.test(g)) grades = [3, 4];\n  if (/高学年/.test(g)) grades = [4, 5, 6];\n  const re = /([1-6](?:\\s*[~\\-－・.,、]\\s*[1-6])*)\\s*年/g;\n  let m;\n  while ((m = re.exec(g))) {\n    const nums = m[1].match(/[1-6]/g).map(Number);\n    if (/[~\\-－]/.test(m[1]) && nums.length === 2) { for (let i = nums[0]; i <= nums[1]; i++) grades.push(i); }\n    else grades = grades.concat(nums);\n  }\n  return !grades.length || !k.grade || grades.indexOf(k.grade) >= 0;\n}\n\n// ---- リッチメニュー（Botとの1対1のトークの下に出るボタン） ----\n\n/**\n * Botとのトーク画面の下に、ボタンのメニューを出す。エディタから1回だけ実行する。\n * 画像は GitHub Pages の richmenu.png（tools/build-richmenu.js で作る）。\n */\nfunction setupRichMenu() {\n  requireOwner_();\n  const W = 2500, H = 843, cw = W / 3, ch = H / 2;\n  const cells = [['新着', '新着'], ['今日', '今日'], ['休み', '休み'], ['カレンダー', 'カレンダー'], ['メニュー', 'メニュー'], ['uri', portalUrl_()]];\n  const menu = {\n    size: { width: W, height: H }, selected: true, name: CONFIG.CLUB_NAME + ' メニュー', chatBarText: 'メニュー',\n    areas: cells.map((c, i) => ({\n      bounds: { x: Math.round((i % 3) * cw), y: Math.round(Math.floor(i / 3) * ch), width: Math.round(cw), height: Math.round(ch) },\n      action: c[0] === 'uri' ? { type: 'uri', label: 'ポータル', uri: c[1] } : { type: 'message', label: c[0], text: c[1] },\n    })),\n  };\n  const id = JSON.parse(lineFetch_(LINE_API + '/richmenu', 'post', menu).getContentText()).richMenuId;\n  const image = UrlFetchApp.fetch(String(CONFIG.PORTAL_URL || '').replace(/\\/?$/, '/') + 'richmenu.png').getBlob();\n  UrlFetchApp.fetch(LINE_DATA_API + '/richmenu/' + id + '/content', {\n    method: 'post', contentType: 'image/png', payload: image.getBytes(),\n    headers: { Authorization: 'Bearer ' + requireProp_('LINE_CHANNEL_ACCESS_TOKEN') },\n  });\n  lineFetch_(LINE_API + '/user/all/richmenu/' + id, 'post');\n  console.log('リッチメニューを設定しました: ' + id);\n}\n","BotUi.gs":"/**\n * Botのボタン操作（カレンダー・予定のカード・押すだけで休み／エントリー／アンケート）。\n * 押したボタンは postback で届く（data は「a=ev&k=…」の形。LINEの上限300文字）。\n * 1対1のトークでは、考えている間「…」を出して待たせない。\n */\n\nconst C_RACE = '#c4512f', C_PRAC = '#2f6fae', C_OK = '#237a55', C_SUB = '#5f7079', C_LINE = '#d6dfe3';\n\n/** 1対1のトークで「…」（読み込み中）を出す。失敗しても気にしない */\nfunction startLoading_(ev) {\n  if (!ev.source || ev.source.type !== 'user') return;\n  try { lineFetch_(LINE_API + '/chat/loading/start', 'post', { chatId: ev.source.userId, loadingSeconds: 10 }); } catch (err) { console.warn(err); }\n}\n\nfunction pbData_(o) { return Object.keys(o).map((k) => k + '=' + encodeURIComponent(o[k])).join('&').slice(0, 300); }\nfunction pbParse_(s) {\n  const o = {};\n  String(s || '').split('&').forEach((kv) => { const i = kv.indexOf('='); if (i > 0) o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });\n  return o;\n}\nfunction pbAction_(label, data, display) { return { type: 'postback', label: String(label).slice(0, 20), data: pbData_(data), displayText: display ? String(display).slice(0, 300) : undefined }; }\nfunction uriAction_(label, uri) { return { type: 'uri', label: String(label).slice(0, 20), uri: uri }; }\nfunction evUrl_(key, tab) { const u = portalUrl_(); return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'ev=' + encodeURIComponent(key) + (tab ? '&et=' + encodeURIComponent(tab) : ''); }\nfunction flex_(alt, contents) { return { type: 'flex', altText: String(alt).slice(0, 400), contents: contents }; }\nfunction txt_(t, o) { return Object.assign({ type: 'text', text: String(t === '' || t == null ? ' ' : t), wrap: true, size: 'sm' }, o || {}); }\nfunction btn_(action, style, color) { return { type: 'button', action: action, style: style || 'secondary', height: 'sm', color: color }; }\nfunction quickPb_(items) {\n  return { items: items.slice(0, 13).map((x) => ({ type: 'action', action: x.type ? x : x.length === 2 && typeof x[1] === 'string' ? { type: 'message', label: x[0].slice(0, 20), text: x[1] } : pbAction_(x[0], x[1], x[2]) })) };\n}\n\n/** ボタン操作で使う「だれが」（ポータルの操作と同じ形）。グループのメンバーか確かめる */\nfunction botCtx_(ev) {\n  const family = findFamily_(ev.source.userId);\n  if (!family) throw new Error('先にお子さんを登録してください（「登録 山田たろう 3年」）。');\n  ensureMember_(family);\n  return { family: family, userId: family.userId, famId: famIdOf_(family), name: family['表示名'] || getDisplayName_(ev.source) || '保護者', admin: isAdmin_(family), coach: isCoach_(family), owner: isOwner_(family) };\n}\n\n// ---- 予定のカード ----\n\n/** 1件の予定のカード。わが家の休み・エントリー・当番も出して、その場で押せるようにする */\nfunction eventBubble_(e, u, d, ctxData) {\n  const dt = e.date.split('-').map(Number);\n  const color = e.race ? C_RACE : C_PRAC;\n  const det = e.detail || {};\n  const body = [txt_(e.title, { weight: 'bold', size: 'md' }), txt_(e.row['開始'] === '終日' ? '終日' : formatWhen_(e.row).replace(/^\\S+\\s?/, '') || '時間は未定', { color: C_SUB })];\n  if (e.place) body.push(txt_('📍 ' + e.place, { color: C_SUB }));\n  const nl = noticeLine_((ctxData.notices || {})[e.key]);\n  if (nl) body.push(txt_(nl, { size: 'xs', color: C_RACE }));\n  if (e.race && (det.meetTime || det.meetPlace)) body.push(txt_('集合 ' + [det.meetTime, det.meetPlace].filter(Boolean).join(' ')));\n  if (e.race && det.items && det.items.length) body.push(txt_('🎒 ' + det.items.join('・'), { color: C_SUB, size: 'xs' }));\n  const duty = ctxData.duties.filter((x) => x.eventKey === e.key);\n  if (duty.length) body.push(txt_('🧹 当番：' + duty.map((x) => ctxData.labels[x['家族ID']] || '').filter(Boolean).join('、') + (duty.some((x) => x['家族ID'] === u.famId) ? '（わが家）' : ''), { size: 'xs', color: duty.some((x) => x['家族ID'] === u.famId) ? C_RACE : C_SUB }));\n  const buttons = [];\n  if (e.race) {\n    if (det.deadline) body.push(txt_('エントリー締切 ' + formatDate_(det.deadline) + (det.deadline < d.today ? '（締切済み）' : ''), { size: 'xs', color: det.deadline < d.today ? C_SUB : C_RACE }));\n    u.kids.forEach((k) => {\n      if (!inTarget_(det.target, k.grade)) return body.push(txt_(k.name + '：対象外', { size: 'xs', color: C_SUB }));\n      const x = ctxData.entries.find((y) => y.eventKey === e.key && y['子ども'] === k.name);\n      body.push(txt_(k.name + '：' + (x ? x['回答'] + (x['種目'] ? '（' + x['種目'].replace(/,/g, '・') + '）' : '') : '未回答'), { size: 'xs', weight: 'bold', color: x ? (x['回答'] === '参加' ? C_OK : C_SUB) : C_RACE }));\n      if (!(det.deadline && det.deadline < d.today) && e.detail) {\n        if (!x || x['回答'] !== '参加') buttons.push(btn_(pbAction_((u.kids.length > 1 ? short_(k.name) + ' ' : '') + '参加する', { a: 'ent', k: e.key, c: k.name, j: '参加' }, k.name + '：' + e.title + 'に参加'), 'primary', C_OK));\n        if (!x || x['回答'] !== '不参加') buttons.push(btn_(pbAction_((u.kids.length > 1 ? short_(k.name) + ' ' : '') + '不参加', { a: 'ent', k: e.key, c: k.name, j: '不参加' }, k.name + '：' + e.title + 'は不参加')));\n      }\n    });\n  } else {\n    u.kids.forEach((k) => {\n      const a = ctxData.absences.find((y) => y['日付'] === e.date && y['子ども'] === k.name);\n      body.push(txt_(k.name + '：' + (a ? 'お休み（' + a['理由'] + '）' : '出席予定'), { size: 'xs', weight: 'bold', color: a ? C_RACE : C_OK }));\n      if (a && a['連絡者userId'] === u.userId) buttons.push(btn_(pbAction_((u.kids.length > 1 ? short_(k.name) + ' ' : '') + '休みを取り消す', { a: 'absc', id: a.id }, formatDate_(e.date) + ' ' + k.name + 'の休みを取り消す')));\n      else if (!a) buttons.push(btn_(pbAction_((u.kids.length > 1 ? short_(k.name) + ' ' : '') + '休みを連絡', { a: 'abs', d: e.date, c: k.name }, formatDate_(e.date) + ' ' + k.name + 'は休み')));\n    });\n    if (e.row['ダウン']) body.push(txt_('🏃 ダウンに入りました（' + String(e.row['ダウン']).replace(/^0/, '') + '）', { size: 'xs', color: C_RACE }));\n  }\n  // くわしい入力はポータルで（役員・その日の当番に、足りないものを入れるボタン）\n  const canEdit = u.admin || duty.some((x) => x['家族ID'] === u.famId);\n  if (e.race && canEdit && !e.detail) buttons.push(btn_(uriAction_('📝 案内を入れる', evUrl_(e.key)), 'link'));\n  else if (e.race && canEdit && !(ctxData.ttKeys || {})[e.key]) buttons.push(btn_(uriAction_('📝 タイムテーブルを入れる', evUrl_(e.key, 'タイムテーブル')), 'link'));\n  else if (!e.race && canEdit) buttons.push(btn_(uriAction_('⏱ タイムを入れる', evUrl_(e.key)), 'link'));\n  buttons.push(btn_(uriAction_('ポータルで開く', evUrl_(e.key)), 'link'));\n  return {\n    type: 'bubble', size: 'kilo',\n    header: { type: 'box', layout: 'horizontal', backgroundColor: color, paddingAll: '10px', contents: [\n      txt_(dt[1] + '/' + dt[2] + '（' + WEEKDAYS[new Date(Date.UTC(dt[0], dt[1] - 1, dt[2])).getUTCDay()] + '）', { color: '#ffffff', weight: 'bold', size: 'lg', flex: 0 }),\n      txt_((e.race ? '大会' : '練習') + '・' + dayWord_(e.date, d.today), { color: '#ffffff', size: 'xs', align: 'end', gravity: 'center' }),\n    ] },\n    body: { type: 'box', layout: 'vertical', spacing: 'xs', paddingAll: '12px', contents: body },\n    footer: { type: 'box', layout: 'vertical', spacing: 'xs', paddingAll: '8px', contents: buttons.slice(0, 6) },\n  };\n}\n\nfunction short_(name) { const t = String(name).trim().split(/[\\s　]+/); return (t[1] || t[0]).slice(0, 4); }\n\nfunction botCtxData_() {\n  return {\n    duties: readRows_(SHEETS.DUTIES).filter((x) => x['日付'] >= addDays_(today_(), -1) && !isRaceStaffRow_(x)),\n    labels: famLabelMap_(),\n    entries: readRows_(SHEETS.ENTRIES),\n    absences: readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['日付'] >= today_()),\n    notices: pendingNotices_(),\n    ttKeys: readRows_(SHEETS.TIMETABLE).reduce((m, r) => { if (r.id) m[r.eventKey] = true; return m; }, {}),\n  };\n}\n\n/** 予定のカードを横に並べる（最大10件） */\nfunction eventsCarousel_(events, u, d, alt) {\n  const cd = botCtxData_();\n  return flex_(alt || '予定', { type: 'carousel', contents: events.slice(0, 10).map((e) => eventBubble_(e, u, d, cd)) });\n}\n\n// ---- カレンダー ----\n\n/** 月のカレンダー。予定のある日を押すと、その日の予定のカードが出る */\nfunction calendarBubble_(ym, d) {\n  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));\n  const first = new Date(Date.UTC(y, m - 1, 1)), days = new Date(Date.UTC(y, m, 0)).getUTCDate();\n  const prefix = ym + '-';\n  const byDay = {};\n  readRows_(SHEETS.EVENTS).filter((e) => e['状態'] !== '中止' && String(e['日付']).indexOf(prefix) === 0).forEach((e) => {\n    const dd = Number(e['日付'].slice(8, 10));\n    const race = d.races[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習';\n    byDay[dd] = byDay[dd] === 'race' || race ? 'race' : 'prac';\n  });\n  const rows = [{ type: 'box', layout: 'horizontal', contents: WEEKDAYS.map((w, i) => txt_(w, { size: 'xs', align: 'center', color: i === 0 ? C_RACE : i === 6 ? C_PRAC : C_SUB, wrap: false })) }];\n  let cells = [];\n  for (let i = 0; i < first.getUTCDay(); i++) cells.push({ type: 'box', layout: 'vertical', flex: 1, contents: [] });\n  for (let dd = 1; dd <= days; dd++) {\n    const date = prefix + ('0' + dd).slice(-2), kind = byDay[dd], today = date === d.today;\n    const cell = { type: 'box', layout: 'vertical', flex: 1, paddingAll: '4px', cornerRadius: '6px', contents: [txt_(String(dd), { size: 'sm', align: 'center', wrap: false, weight: kind || today ? 'bold' : 'regular', color: kind ? '#ffffff' : today ? C_OK : '#182328' })] };\n    if (kind) { cell.backgroundColor = kind === 'race' ? C_RACE : C_PRAC; cell.action = pbAction_(m + '/' + dd, { a: 'day', d: date }, m + '/' + dd + 'の予定'); }\n    else if (today) { cell.borderWidth = '1px'; cell.borderColor = C_OK; }\n    cells.push(cell);\n    if (cells.length === 7) { rows.push({ type: 'box', layout: 'horizontal', spacing: '2px', contents: cells }); cells = []; }\n  }\n  if (cells.length) { while (cells.length < 7) cells.push({ type: 'box', layout: 'vertical', flex: 1, contents: [] }); rows.push({ type: 'box', layout: 'horizontal', spacing: '2px', contents: cells }); }\n  const prev = fmtYm_(y, m - 1), next = fmtYm_(y, m + 1);\n  return {\n    type: 'bubble',\n    header: { type: 'box', layout: 'horizontal', paddingAll: '10px', contents: [\n      { type: 'text', text: '◀', size: 'lg', color: C_SUB, flex: 0, action: pbAction_('前の月', { a: 'cal', m: prev }) },\n      txt_(y + '年' + m + '月', { weight: 'bold', size: 'lg', align: 'center' }),\n      { type: 'text', text: '▶', size: 'lg', color: C_SUB, flex: 0, action: pbAction_('次の月', { a: 'cal', m: next }) },\n    ] },\n    body: { type: 'box', layout: 'vertical', spacing: '4px', paddingAll: '10px', contents: rows.concat([{ type: 'box', layout: 'horizontal', margin: 'md', spacing: 'sm', contents: [\n      txt_('■ 練習', { size: 'xxs', color: C_PRAC, flex: 0, wrap: false }), txt_('■ 大会', { size: 'xxs', color: C_RACE, flex: 0, wrap: false }), txt_('色の日を押すと、その日の予定', { size: 'xxs', color: C_SUB }),\n    ] }]) },\n    footer: { type: 'box', layout: 'horizontal', spacing: 'sm', paddingAll: '8px', contents: [\n      btn_({ type: 'datetimepicker', label: '日付を選ぶ', data: pbData_({ a: 'day' }), mode: 'date', initial: d.today }),\n      btn_(pbAction_('これからの予定', { a: 'list' }, '予定')),\n    ] },\n  };\n}\nfunction fmtYm_(y, m) { const t = new Date(Date.UTC(y, m - 1, 1)); return t.getUTCFullYear() + '-' + ('0' + (t.getUTCMonth() + 1)).slice(-2); }\n\nfunction handleCalendar_(ev, ym) {\n  const d = botData_();\n  const m = /^\\d{4}-\\d{2}$/.test(ym || '') ? ym : d.today.slice(0, 7);\n  respond_(ev, [flex_(Number(m.slice(5)) + '月のカレンダー', calendarBubble_(m, d))]);\n}\n\n/** その日の予定（なければカレンダーに戻るボタン） */\nfunction handleDay_(ev, date) {\n  const u = botUser_(ev);\n  const d = botData_();\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date || '')) return handleCalendar_(ev);\n  const list = readRows_(SHEETS.EVENTS).filter((e) => e['状態'] !== '中止' && e['日付'] === date).sort(compareEvents_)\n    .map((e) => ({ row: e, key: e.eventKey, date: e['日付'], title: e['タイトル'], place: e['場所'], race: !!d.races[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習', detail: d.races[e.eventKey] ? raceToObj_(d.races[e.eventKey]) : null }));\n  if (!list.length) return respond_(ev, [Object.assign(text_(formatDate_(date) + 'は予定がありません。'), { quickReply: quickPb_([['カレンダー', { a: 'cal', m: date.slice(0, 7) }], ['予定', '予定'], ['新着', '新着']]) })]);\n  respond_(ev, [eventsCarousel_(list, u, d, formatDate_(date) + 'の予定')]);\n}\n\n// ---- 押すだけの操作 ----\n\nfunction handlePostback_(ev) {\n  const p = pbParse_(ev.postback && ev.postback.data);\n  const params = (ev.postback && ev.postback.params) || {};\n  ev.privateAnswer = CONFIG.GROUP_PRIVATE_REPLY && ev.source.type === 'group';\n  try {\n    switch (p.a) {\n      case 'cal': return handleCalendar_(ev, p.m);\n      case 'day': return handleDay_(ev, params.date || p.d);\n      case 'list': return handleSchedule_(ev);\n      case 'ev': return handleOneEvent_(ev, p.k);\n      case 'abs': return askAbsenceReason_(ev, p.d || params.date, p.c);\n      case 'absr': return doAbsence_(ev, p.d, p.c, p.r);\n      case 'absc': return doCancelAbsence_(ev, p.id);\n      case 'ent': return doEntry_(ev, p.k, p.c, p.j);\n      case 'race': return doRaceToggle_(ev, p.k, p.c, p.r);\n      case 'poll': return doPoll_(ev, p.id, p.o);\n      case 'tr': return handleTraining_(ev, p.t || '');\n      case 'trc': { const u = botUser_(ev); return p.c ? askTrainKind_(ev, u, p.c) : askTrainKid_(ev, u); }\n      case 'trk': return askTrainAmount_(ev, p.c, p.k);\n      case 'trs': {\n        const v = toHalfWidth_(p.v || ''), m = v.match(/^(\\d+(?:\\.\\d+)?)(km|分|回|本)$/);\n        if (!m) throw new Error('量が読めませんでした。');\n        return saveTrainingBot_(ev, p.c, { kind: p.k, km: m[2] === 'km' ? m[1] : '', min: m[2] === '分' ? m[1] : '', count: m[2] === '回' || m[2] === '本' ? m[1] : '' });\n      }\n      case 'trmv': return moveTrainingBot_(ev, p.id);\n      case 'trdel': return deleteTrainingBot_(ev, p.id);\n      case 'trlog': return showTrainingLog_(ev, botUser_(ev));\n      case 'menu': return respond_(ev, [p.g ? subMenuBubble_(p.g) : helpBubble_(botUser_(ev).admin)]);\n    }\n  } catch (err) {\n    respond_(ev, botMessages_(['⚠ ' + String((err && err.message) || err)]));\n  }\n}\n\nfunction handleOneEvent_(ev, key) {\n  const u = botUser_(ev);\n  const d = botData_();\n  const e = d.events.find((x) => x.key === key);\n  if (!e) return respond_(ev, botMessages_(['この予定は見つかりません（終わったか、中止になりました）。']));\n  respond_(ev, [eventsCarousel_([e], u, d, e.title)]);\n}\n\n/** 休みの理由をボタンで選んでもらう */\nfunction askAbsenceReason_(ev, date, child) {\n  const u = botUser_(ev);\n  if (!u.kids.length) return needRegister_(ev);\n  if (!child) child = u.kids[0].name;\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date || '')) return respond_(ev, botMessages_(['日にちが分かりませんでした。']));\n  const items = CHOICES.ABSENCE_REASONS.map((r) => [r, { a: 'absr', d: date, c: child, r: r }, r]);\n  respond_(ev, [Object.assign(text_(formatDate_(date) + ' ' + child + 'のお休み。理由を選んでください（理由は役員と本人だけに見えます）。'), { quickReply: quickPb_(items.concat([['やめる', '新着']])) })]);\n}\n\nfunction doAbsence_(ev, date, child, reason) {\n  const ctx = botCtx_(ev);\n  const msg = reportAbsenceAction_(ctx, { child: child, date: date, reason: reason });\n  const d = botData_();\n  const onDay = d.events.find((e) => e.date === date);\n  const mine = readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['連絡者userId'] === ctx.userId && a['日付'] === date && a['子ども'] === child).pop();\n  respond_(ev, [Object.assign(text_('✅ ' + msg + '（' + reason + '）' + (onDay ? '\\n' + whenText_(onDay) : '\\n※この日は予定が入っていません')),\n    { quickReply: quickPb_((mine ? [['取り消す', { a: 'absc', id: mine.id }, '休みを取り消す']] : []).concat([['ひとこと添える', '休み ' + child + ' ' + date + ' ' + reason + ' ']], [['新着', '新着'], ['カレンダー', 'カレンダー']])) })]);\n}\n\nfunction doCancelAbsence_(ev, id) {\n  const ctx = botCtx_(ev);\n  const a = readRow
