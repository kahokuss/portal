: x['メモ'], closed: x['終了'] === '○', at: x['日時'], remindAt: ctx.admin ? x['催促'] || '' : '',\n      kids: target, paid: paid.filter((y) => y['集金id'] === x.id && target.indexOf(y['子ども']) >= 0).map((y) => y['子ども']),\n    };\n  }).filter((f) => !f.closed || String(f.at).slice(0, 10) >= addDays_(today_(), -120) || (ctx.admin && String(f.at).slice(0, 10) >= fyStart_(today_())));\n}\n\n// ---- 練習の出席（✓ を押した子）と、練習中のタイム計測 ----\n\nfunction clearAttend_(date, child) {\n  readRows_(SHEETS.ATTEND).filter((x) => x['日付'] === date && x['子ども'] === child).forEach((x) => clearRow_(SHEETS.ATTEND, x));\n}\n\n/** 練習に「出席」と答える（on=false で取り消し）。出席にすると、その日の休みの連絡は取り消す */\nfunction setAttendAction_(ctx, p) {\n  requireMyChild_(ctx, p.child);\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('予定が見つかりません。');\n  const date = ev['日付'];\n  if (date < today_() && !ctx.admin) throw new Error('過ぎた日の出欠は変えられません。');\n  withLock_(() => {\n    clearAttend_(date, p.child);\n    if (!p.on) return;\n    readRows_(SHEETS.ABSENCES).filter((a) => a.id && a['日付'] === date && a['子ども'] === p.child).forEach((a) => clearRow_(SHEETS.ABSENCES, a));\n    appendRow_(SHEETS.ATTEND, { '日付': date, eventKey: p.key, '子ども': p.child, userId: ctx.userId, '表示名': ctx.name, '日時': now_() });\n  });\n  return p.on ? p.child + '：出席にしました' : '';\n}\n\n/**\n * 練習で測ったタイムを、子どもごとの練習の記録として入れる（役員とその日の当番）。\n * 同じ練習・同じ子・同じ距離・同じ本目は上書き。記録を空にすると消す。\n * @param {{key: string, name: string, run: number, rows: {child: string, race: string, record: string}[]}} p\n */\nfunction saveTimesAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('練習が見つかりません。');\n  requireManager_(ctx, p.key);\n  const kids = {};\n  activeChildren_().forEach((c) => (kids[c.name] = true));\n  const name = String(p.name || '').trim().slice(0, 20);\n  const run = Math.max(1, Math.min(9, Number(p.run) || 1));\n  const memo = (name ? name + ' ' : '') + run + '本目';\n  let saved = 0, removed = 0;\n  withLock_(() => {\n    const all = readRows_(SHEETS.RESULTS);\n    (p.rows || []).slice(0, 200).forEach((r) => {\n      const child = String(r.child || '').trim();\n      const race = String(r.race || '').trim().slice(0, 30);\n      const record = toHalfWidth_(r.record || '').trim().replace(/\\s/g, '').slice(0, 20);\n      if (!kids[child] || !race) return;\n      const old = all.find((x) => x.eventKey === p.key && x['子ども'] === child && x['メモ'] === memo);\n      if (!record) { if (old) { clearRow_(SHEETS.RESULTS, old); removed++; } return; }\n      if (old) {\n        if (old['記録'] === record && old['種目'] === race) return;\n        Object.assign(old, { '種目': race, '記録': record, '日時': now_(), userId: ctx.userId, '表示名': ctx.name });\n        updateRow_(SHEETS.RESULTS, old);\n      } else {\n        appendRow_(SHEETS.RESULTS, {\n          '日時': now_(), eventKey: p.key, '大会・練習': ev['日付'] + ' ' + (ev['タイトル'] || '練習'), '子ども': child, '種目': race, '記録': record,\n          '順位': '', 'ラウンド': '', '区分': '練習', 'メモ': memo, userId: ctx.userId, '表示名': ctx.name, id: randomKey_().slice(0, 10),\n        });\n      }\n      saved++;\n    });\n  });\n  if (!saved && !removed) return '変わったところはありません';\n  return memo + 'のタイムを' + saved + '人分保存しました' + (removed ? '（' + removed + '人分を消しました）' : '');\n}\n\n// ---- 自主トレ（ふだんの日の個人トレーニングの記録）。見られるのは、その子の家族だけ ----\n\nfunction myKidNames_(ctx) {\n  return childrenOf_(ctx.userId).map((c) => c.name);\n}\n\n/** 自主トレを見せる範囲：子どもの名前 → 'coach'（コーチに見せる）／'all'（みんなに見せる）。家族だけの子は入らない */\nfunction trainShareLevels_() {\n  const lv = {};\n  readRows_(SHEETS.TRAIN_SHARE).forEach((x) => {\n    if (!x['子ども']) return;\n    const v = x['公開'] === '全員' ? 'all' : x['公開'] === '○' ? 'coach' : '';\n    if (v) lv[x['子ども']] = v; else delete lv[x['子ども']];\n  });\n  return lv;\n}\n\n/** この人が（わが家の子のほかに）見られる子：コーチは「コーチ」「みんな」の子、ほかの人は「みんな」の子 */\nfunction viewableTrainKids_(ctx) {\n  const lv = trainShareLevels_();\n  return Object.keys(lv).filter((k) => lv[k] === 'all' || (ctx.coach && lv[k] === 'coach'));\n}\n\n/** コーチとやりとりできる子（コーチに見せている子） */\nfunction coachThreadKids_(ctx) {\n  if (!ctx.coach) return [];\n  const lv = trainShareLevels_();\n  return Object.keys(lv);\n}\n\n/** mine：わが家の子の見せる範囲／kids：わが家のほかに見られる子（学年・範囲つき） */\nfunction trainShareFor_(ctx, children) {\n  const lv = trainShareLevels_();\n  const myKids = children.filter((c) => c.parents.indexOf(ctx.userId) >= 0).map((c) => c.name);\n  const view = viewableTrainKids_(ctx);\n  const mine = {};\n  myKids.forEach((k) => (mine[k] = lv[k] || ''));\n  return {\n    mine: mine,\n    kids: children.filter((c) => view.indexOf(c.name) >= 0 && myKids.indexOf(c.name) < 0).map((c) => ({ name: c.name, grade: c.grade, level: lv[c.name] })),\n  };\n}\n\nfunction setTrainShareAction_(ctx, p) {\n  if (myKidNames_(ctx).indexOf(p.child) < 0) throw new Error('わが家のお子さんを選んでください。');\n  const level = p.level !== undefined ? p.level : p.on ? 'coach' : '';\n  const v = level === 'all' ? '全員' : level === 'coach' ? '○' : '';\n  withLock_(() => {\n    const row = readRows_(SHEETS.TRAIN_SHARE).find((x) => x['子ども'] === p.child);\n    const data = { '子ども': p.child, '公開': v, '更新者': ctx.name, '日時': now_() };\n    if (row) { Object.assign(row, data); updateRow_(SHEETS.TRAIN_SHARE, row); } else appendRow_(SHEETS.TRAIN_SHARE, data);\n  });\n  return p.child + 'の自主トレを、' + (v === '全員' ? 'みんなに見せる' : v ? 'コーチに見せる' : '家族だけが見る') + 'ようにしました';\n}\n\n// ---- 自主トレへのコーチのコメント（その子の家族とコーチのやりとり） ----\n\nfunction canTrainThread_(ctx, child) {\n  return myKidNames_(ctx).indexOf(child) >= 0 || coachThreadKids_(ctx).indexOf(child) >= 0;\n}\n\nfunction trainCommentsFor_(ctx, children) {\n  const kids = myKidNames_(ctx).concat(coachThreadKids_(ctx));\n  if (!kids.length) return { list: [], read: {} };\n  const read = {};\n  readRows_(SHEETS.TRAIN_SHARE).forEach((x) => { if (kids.indexOf(x['子ども']) >= 0) read[x['子ども']] = x['家族既読'] || ''; });\n  const list = readRows_(SHEETS.TRAIN_COMMENTS).filter((x) => x.id && kids.indexOf(x['子ども']) >= 0).map((x) => ({\n    id: x.id, child: x['子ども'], text: x['本文'], by: x['表示名'], coach: x['コーチ'] === '○', at: x['日時'], mine: x.userId === ctx.userId,\n  }));\n  return { list: list, read: read };\n}\n\nfunction addTrainCommentAction_(ctx, p) {\n  if (!canTrainThread_(ctx, p.child)) throw new Error('この子の自主トレには書きこめません。');\n  const text = String(p.text || '').trim().slice(0, 500);\n  if (!text) throw new Error('コメントを書いてください。');\n  const isFamily = myKidNames_(ctx).indexOf(p.child) >= 0;\n  withLock_(() => appendRow_(SHEETS.TRAIN_COMMENTS, {\n    id: randomKey_().slice(0, 10), '子ども': p.child, '本文': text, userId: ctx.userId, '表示名': ctx.name, 'コーチ': ctx.coach && !isFamily ? '○' : '', '日時': now_(),\n  }));\n  return 'コメントしました';\n}\n\nfunction deleteTrainCommentAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.TRAIN_COMMENTS).find((x) => x.id && x.id === p.id);\n    if (!row || row.userId !== ctx.userId) throw new Error('消せるコメントが見つかりません。');\n    clearRow_(SHEETS.TRAIN_COMMENTS, row);\n  });\n  return 'コメントを消しました';\n}\n\n/** 家族が自主トレを開いたら、コーチのコメントを「読んだ」にする */\nfunction markTrainReadAction_(ctx, p) {\n  if (myKidNames_(ctx).indexOf(p.child) < 0) return '';\n  withLock_(() => {\n    const row = readRows_(SHEETS.TRAIN_SHARE).find((x) => x['子ども'] === p.child);\n    if (row) { row['家族既読'] = now_(); updateRow_(SHEETS.TRAIN_SHARE, row); } else appendRow_(SHEETS.TRAIN_SHARE, { '子ども': p.child, '公開': '', '更新者': ctx.name, '日時': now_(), '家族既読': now_() });\n  });\n  return '';\n}\n\n/** コーチにする・外す（役員だけ）。コーチは、見せてもらっている子の自主トレを見られる */\nfunction setCoachAction_(ctx, p) {\n  withLock_(() => {\n    const f = findFamily_(p.userId);\n    if (!f) throw new Error('見つかりません。');\n    f['コーチ'] = p.on ? '○' : '';\n    f['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, f);\n  });\n  return p.on ? 'コーチにしました' : 'コーチから外しました';\n}\n\nfunction trainingFor_(ctx, children) {\n  const own = children.filter((c) => c.parents.indexOf(ctx.userId) >= 0).map((c) => c.name);\n  const mine = own.concat(viewableTrainKids_(ctx));\n  if (!mine.length) return [];\n  const from = addDays_(today_(), -400);\n  // Strava から取り込んだ記録（id が sv…）は、Strava の決まりで、その家族だけに見せる\n  return readRows_(SHEETS.TRAINING)\n    .filter((x) => x.id && mine.indexOf(x['子ども']) >= 0 && x['日付'] >= from && (!/^sv/.test(x.id) || own.indexOf(x['子ども']) >= 0))\n    .map((x) => ({ strava: /^sv/.test(x.id), id: x.id, date: x['日付'], child: x['子ども'], kind: x['種類'], km: Number(x['距離km']) || 0, min: Number(x['時間分']) || 0, count: Number(x['回数']) || 0, feel: x['調子'], memo: x['メモ'] }));\n}\n\n/** 自主トレを入れる・直す（id があれば直す） */\nfunction saveTrainingAction_(ctx, p) {\n  if (myKidNames_(ctx).indexOf(p.child) < 0) throw new Error('わが家のお子さんを選んでください。');\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(p.date || '')) throw new Error('日にちを選んでください。');\n  if (p.date > today_()) throw new Error('先の日の記録は入れられません。');\n  const kind = String(p.kind || '').trim().slice(0, 20);\n  if (!kind) throw new Error('何をしたかを選んでください。');\n  const num = (v, max) => { const n = Number(toHalfWidth_(String(v || '')).replace(/[^0-9.]/g, '')); return n > 0 ? Math.min(n, max) : 0; };\n  const row = {\n    '日付': p.date, '子ども': p.child, '種類': kind, '距離km': num(p.km, 100) ? String(Math.round(num(p.km, 100) * 100) / 100) : '',\n    '時間分': num(p.min, 600) ? String(Math.round(num(p.min, 600))) : '', '回数': num(p.count, 10000) ? String(Math.round(num(p.count, 10000))) : '',\n    '調子': ['◎', '○', '△'].indexOf(p.feel) >= 0 ? p.feel : '', 'メモ': String(p.memo || '').slice(0, 200), userId: ctx.userId, '表示名': ctx.name, '日時': now_(),\n  };\n  if (!row['距離km'] && !row['時間分'] && !row['回数'] && !row['メモ']) throw new Error('距離・時間・回数のどれかを入れてください。');\n  withLock_(() => {\n    const old = p.id ? readRows_(SHEETS.TRAINING).find((x) => x.id && x.id === p.id) : null;\n    if (old) {\n      if (myKidNames_(ctx).indexOf(old['子ども']) < 0) throw new Error('直せる記録が見つかりません。');\n      Object.assign(old, row);\n      updateRow_(SHEETS.TRAINING, old);\n      ctx.savedId = old.id;\n    } else {\n      ctx.savedId = randomKey_().slice(0, 10);\n      appendRow_(SHEETS.TRAINING, Object.assign({ id: ctx.savedId }, row));\n    }\n  });\n  return p.child + '：' + kind + 'を記録しました';\n}\n\nfunction deleteTrainingAction_(ctx, p) {\n  withLock_(() => {\n    const old = readRows_(SHEETS.TRAINING).find((x) => x.id && x.id === p.id);\n    if (!old || myKidNames_(ctx).indexOf(old['子ども']) < 0) throw new Error('消せる記録が見つかりません。');\n    clearRow_(SHEETS.TRAINING, old);\n  });\n  return '記録を消しました';\n}\n\n// ---- 練習に参加した時間の積み上げ（休みの連絡がなかった練習を、参加として数える） ----\n\n/**\n * 子どもごとの、月ごとの練習時間（分）と、出た大会の数。1年分。\n * 役員・コーチにはクラブ全員、ほかの人にはわが家の子だけ。\n * @return {{kids: Object<string, {m: Object<string, number>, n: number, races: number}>}}\n */\nfunction participationFor_(ctx, children) {\n  const today = today_(), from = addDays_(today, -365);\n  const full = ctx.admin || ctx.coach;\n  const visible = (full ? children : children.filter((c) => c.parents.indexOf(ctx.userId) >= 0)).map((c) => c.name);\n  const names = children.map((c) => c.name); // 平均を出すため、計算は全員分\n  const out = {};\n  names.forEach((n) => (out[n] = { m: {}, n: 0, races: 0 }));\n  if (!visible.length) return { kids: {}, avg: {} };\n  const off = {};\n  readRows_(SHEETS.ABSENCES).forEach((a) => { if (a.id && a['日付'] >= from) off[a['日付'] + '|' + a['子ども']] = true; });\n  const raceKeys = {};\n  readRows_(SHEETS.RACES).forEach((r) => (raceKeys[r.eventKey] = true));\n  const events = readRows_(SHEETS.EVENTS).filter((e) => e['日付'] >= from && e['日付'] <= today && e['状態'] !== '中止');\n  events.forEach((e) => {\n    const type = e['種別'] || guessType_(e['タイトル']);\n    if (type !== '練習' || raceKeys[e.eventKey]) return;\n    if (e['日付'] === today && e['終了'] && toMin_(e['終了']) > toMin_(fmt_(new Date(), 'HH:mm'))) return; // 今日の練習は終わってから\n    const len = e['開始'] && e['開始'] !== '終日' && e['終了'] ? Math.max(0, toMin_(e['終了']) - toMin_(e['開始'])) : 90;\n    if (!len) return;\n    const mon = e['日付'].slice(0, 7);\n    names.forEach((n) => {\n      if (off[e['日付'] + '|' + n]) return;\n      out[n].m[mon] = (out[n].m[mon] || 0) + len;\n      out[n].n++;\n    });\n  });\n  const past = {};\n  events.forEach((e) => (past[e.eventKey] = true));\n  readRows_(SHEETS.ENTRIES).forEach((x) => { if (past[x.eventKey] && x['回答'] === '参加' && out[x['子ども']]) out[x['子ども']].races++; });\n  // 1年の合計時間の平均：チーム・学年・学年と男女。保護者には3人以上の組だけ（だれの時間か分からないように）\n  const groups = {};\n  const add = (k, v) => { const g = groups[k] || (groups[k] = { sum: 0, n: 0 }); g.sum += v; g.n++; };\n  children.forEach((c) => {\n    const total = Object.keys(out[c.name].m).reduce((a, m) => a + out[c.name].m[m], 0);\n    add('team', total);\n    if (c.grade) add('g' + c.grade, total);\n    if (c.grade && c.sex) add('g' + c.grade + c.sex, total);\n  });\n  const avg = {};\n  Object.keys(groups).forEach((k) => { if (full || groups[k].n >= 3) avg[k] = { min: Math.round(groups[k].sum / groups[k].n), n: groups[k].n }; });\n  const kids = {};\n  visible.forEach((n) => (kids[n] = out[n]));\n  return { kids: kids, avg: avg };\n}\n\n// ---- 役員になる：申請して役員が承認する／合言葉（役員の番号）を入れる／役員がだれもいなければすぐ役員 ----\n\nfunction adminCode_(renew) {\n  const props = PropertiesService.getScriptProperties();\n  let code = props.getProperty('ADMIN_CODE');\n  if (!code || renew) {\n    code = String(Math.floor(100000 + Math.random() * 900000));\n    props.setProperty('ADMIN_CODE', code);\n  }\n  return code;\n}\n\n/** 役員の番号を見る・作りなおす（役員だけ） */\nfunction adminCodeAction_(ctx, p) {\n  return { code: adminCode_(!!p.renew) };\n}\n\n/** 家族ごと役員にする（家族のみんなの行も） */\nfunction makeAdmin_(f) {\n  familyRowsOf_(readRows_(SHEETS.FAMILIES), famIdOf_(f)).forEach((x) => {\n    x['役員'] = '○';\n    x['役員申請'] = '';\n    x['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, x);\n  });\n}\n\n/**\n * 役員になりたいと申請する。code（役員の番号）が合えば、すぐ役員。\n * 役員がひとりもいないときも、すぐ役員（最初の設定のため）。cancel で申請を取り下げる\n */\nfunction requestAdminAction_(ctx, p) {\n  if (ctx.admin) return 'すでに役員です';\n  const code = String(p.code || '').replace(/[^0-9]/g, '');\n  return withLock_(() => {\n    const rows = readRows_(SHEETS.FAMILIES);\n    const f = rows.find((x) => x.userId === ctx.userId);\n    if (!f) throw new Error('見つかりません。');\n    if (p.cancel) { f['役員申請'] = ''; updateRow_(SHEETS.FAMILIES, f); return '役員の申請を取り下げました'; }\n    if (!rows.some(isAdminRow_)) { makeAdmin_(f); return '役員がまだいなかったので、役員になりました'; }\n    if (code) {\n      if (code !== adminCode_(false)) throw new Error('役員の番号がちがいます。役員の人に「管理」→「メンバーと役員」で番号を見てもらってください。');\n      makeAdmin_(f);\n      return '役員になりました';\n    }\n    f['役員申請'] = now_();\n    updateRow_(SHEETS.FAMILIES, f);\n    return '役員の申請をしました。役員の人が「管理」→「メンバーと役員」で承認すると、「管理」が出ます';\n  });\n}\n\n/** 役員の申請を承認する・断る（役員だけ） */\nfunction answerAdminAction_(ctx, p) {\n  return withLock_(() => {\n    const f = findFamily_(p.userId);\n    if (!f) throw new Error('見つかりません。');\n    if (p.ok) { makeAdmin_(f); return (f['表示名'] || '') + 'さんの家族を役員にしました'; }\n    familyRowsOf_(readRows_(SHEETS.FAMILIES), famIdOf_(f)).forEach((x) => { x['役員申請'] = ''; updateRow_(SHEETS.FAMILIES, x); });\n    return '申請を断りました';\n  });\n}\n\n/** 家族の係（会計・記録係など）を決める（役員だけ）。家族のみんなの行もそろえる */\nfunction setRoleAction_(ctx, p) {\n  const role = String(p.role || '').replace(/\\s+/g, ' ').trim().slice(0, 40);\n  withLock_(() => {\n    const rows = familyRowsOf_(readRows_(SHEETS.FAMILIES), String(p.fam || ''));\n    if (!rows.length) throw new Error('家族が見つかりません。');\n    rows.forEach((x) => { x['係'] = role; x['更新日時'] = now_(); updateRow_(SHEETS.FAMILIES, x); });\n  });\n  return role ? '係を「' + role + '」にしました' : '係を外しました';\n}\n\n// ---- 管理者（ポータルの持ち主）：Apps Script の setup のログに出る番号を入れた人。一人ずつ ----\n\nfunction ownerCode_() {\n  const props = PropertiesService.getScriptProperties();\n  let code = props.getProperty('OWNER_CODE');\n  if (!code) { code = String(Math.floor(10000000 + Math.random() * 90000000)); props.setProperty('OWNER_CODE', code); }\n  return code;\n}\n\n/** 管理者の番号を入れて管理者になる（番号は Apps Script の持ち主だけがログで見られる） */\nfunction becomeOwnerAction_(ctx, p) {\n  const code = String(p.code || '').replace(/[^0-9]/g, '');\n  const now = Date.now(), props = PropertiesService.getScriptProperties();\n  const lock = Number(props.getProperty('OWNER_LOCK_' + ctx.userId) || 0);\n  if (lock > now) throw new Error('まちがいが続いたので、しばらくしてからもう一度ためしてください。');\n  if (!code || code !== ownerCode_()) {\n    const miss = Number(props.getProperty('OWNER_MISS_' + ctx.userId) || 0) + 1;\n    props.setProperty('OWNER_MISS_' + ctx.userId, String(miss));\n    if (miss >= 5) { props.setProperty('OWNER_LOCK_' + ctx.userId, String(now + 30 * 60000)); props.deleteProperty('OWNER_MISS_' + ctx.userId); }\n    throw new Error('管理者の番号がちがいます。Apps Script で「setup」か「showOwnerCode」を実行すると、ログに番号が出ます。');\n  }\n  props.deleteProperty('OWNER_MISS_' + ctx.userId);\n  withLock_(() => {\n    const f = findFamily_(ctx.userId);\n    f['管理者'] = '○';\n    f['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, f);\n  });\n  return '管理者になりました';\n}\n\n/** 管理者にする・外す（管理者だけ）。管理者が一人もいなくなる操作はできない */\nfunction setOwnerAction_(ctx, p) {\n  if (!ctx.owner) throw new Error('この操作は管理者だけができます。');\n  withLock_(() => {\n    const rows = readRows_(SHEETS.FAMILIES);\n    const f = rows.find((x) => x.userId === p.userId);\n    if (!f) throw new Error('見つかりません。');\n    if (!p.on && !rows.some((x) => x.userId !== f.userId && isOwner_(x))) throw new Error('管理者が一人もいなくなるので、外せません。');\n    f['管理者'] = p.on ? '○' : '';\n    f['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, f);\n  });\n  return p.on ? '管理者にしました' : '管理者から外しました';\n}\n\n// ---- 名簿：役員が子どもの名前・学年・男女をまとめて入れる。保護者が同じ名前で登録すると、その子に結びつく ----\n\n/** @param {{rows: {name: string, grade: number, sex: string}[]}} p */\nfunction saveRosterAction_(ctx, p) {\n  const list = (p.rows || []).slice(0, 200).map((r) => ({\n    name: String(r.name || '').trim().replace(/\\s+/g, ' ').slice(0, 30),\n    grade: Math.max(0, Math.min(6, Number(toHalfWidth_(String(r.grade || '')).replace(/[^0-9]/g, '')) || 0)),\n    sex: /男/.test(r.sex || '') ? '男' : /女/.test(r.sex || '') ? '女' : '',\n  })).filter((r) => r.name);\n  if (!list.length) throw new Error('名前を入れてください。');\n  let added = 0, updated = 0;\n  withLock_(() => {\n    const rows = readRows_(SHEETS.CHILDREN);\n    list.forEach((c) => {\n      const row = rows.find((r) => sameKidName_(r['名前'], c.name));\n      if (row) {\n        if (preferSpacedName_(row['名前'], c.name)) renameKid_(row, c.name);\n        row['名簿'] = '○';\n        if (c.grade) row['学年'] = String(c.grade);\n        if (c.sex) row['性別'] = c.sex;\n        row['更新日時'] = now_();\n        updateRow_(SHEETS.CHILDREN, row);\n        updated++;\n      } else {\n        const r = { '名前': c.name, '学年': c.grade ? String(c.grade) : '', '保護者userId': '', '性別': c.sex, '更新日時': now_(), '名簿': '○' };\n        appendRow_(SHEETS.CHILDREN, r);\n        rows.push(r);\n        added++;\n      }\n    });\n  });\n  return '名簿に' + added + '人を入れました' + (updated ? '（' + updated + '人は学年などを直しました）' : '');\n}\n\n/** 名簿から外す。保護者が登録していない子は消える（記録はスプレッドシートに残る） */\nfunction removeRosterAction_(ctx, p) {\n  withLock_(() => {\n    const row = readRows_(SHEETS.CHILDREN).find((r) => r['名前'] && sameKidName_(r['名前'], p.name));\n    if (!row) throw new Error('見つかりません。');\n    if (splitNames_(row['保護者userId']).length) { row['名簿'] = ''; row['更新日時'] = now_(); updateRow_(SHEETS.CHILDREN, row); }\n    else clearRow_(SHEETS.CHILDREN, row);\n  });\n  return p.name + 'を名簿から外しました';\n}\n\n/** 2重に入った記録（同じ子・種目・記録・大会名・区分）を、1つだけ残して消す（役員） */\nfunction removeDuplicateRecordsAction_(ctx) {\n  let n = 0;\n  withLock_(() => {\n    const seen = {};\n    readRows_(SHEETS.RESULTS).forEach((x) => {\n      if (!x['記録']) return;\n      const k = [String(x['子ども']).replace(/\\s|　/g, ''), x['種目'], x['記録'], x['大会・練習'], x['区分'], x['メモ']].join('|');\n      if (seen[k]) { clearRow_(SHEETS.RESULTS, x); n++; } else seen[k] = true;\n    });\n  });\n  return n ? '2重になっていた記録を' + n + '件消しました' : '2重になっている記録はありません';\n}\n\n/**\n * 大会・練習に結びついていない記録を、同じ日の予定に結びつける（大会のページの「結果」に出るように）。\n * 公式の記録はその日の大会に、練習の記録はその日の練習に。その日にひとつだけあるときだけ結びつける。\n * @return {number} 結びつけた件数\n */\nfunction linkResultsToEvents_() {\n  const raceKeys = {};\n  readRows_(SHEETS.RACES).forEach((r) => (raceKeys[r.eventKey] = true));\n  const byDate = {};\n  readRows_(SHEETS.EVENTS).forEach((e) => {\n    if (!e.eventKey || e['状態'] === '中止') return;\n    const race = raceKeys[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習';\n    const d = byDate[e['日付']] || (byDate[e['日付']] = { race: [], prac: [] });\n    d[race ? 'race' : 'prac'].push(e.eventKey);\n  });\n  let n = 0;\n  withLock_(() => {\n    readRows_(SHEETS.RESULTS).forEach((x) => {\n      if (!x['記録'] || x.eventKey) return;\n      const d = byDate[String(x['大会・練習'] || '').slice(0, 10)];\n      if (!d) return;\n      const list = x['区分'] === '練習' ? d.prac : d.race;\n      if (list.length !== 1) return;\n      x.eventKey = list[0];\n      updateRow_(SHEETS.RESULTS, x);\n      n++;\n    });\n  });\n  return n;\n}\n\n/** 大会名が練習のものか（加速走・ダッシュ・1周走など） */\nconst PRACTICE_MEET = /加速|練習|ダッシュ|1周|一周|坂道|タイム走|計測|トライアル/;\n\n/**\n * 練習の記録なのに「公式」で入ってしまったもの（大会名が加速走など）を「練習」に直す（役員）。\n * 大会に結びついていたら外して、その日の練習に結びつけなおす\n */\nfunction fixPracticeKindsAction_(ctx) {\n  const raceKeys = {};\n  readRows_(SHEETS.RACES).forEach((r) => (raceKeys[r.eventKey] = true));\n  const isRace = {};\n  readRows_(SHEETS.EVENTS).forEach((e) => { isRace[e.eventKey] = raceKeys[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習'; });\n  let n = 0;\n  withLock_(() => {\n    readRows_(SHEETS.RESULTS).forEach((x) => {\n      if (!x['記録'] || x['区分'] === '練習') return;\n      const meet = String(x['大会・練習'] || '').replace(/^\\d{4}-\\d{2}-\\d{2}\\s*/, '');\n      if (!PRACTICE_MEET.test(meet)) return;\n      x['区分'] = '練習';\n      if (x.eventKey && isRace[x.eventKey]) x.eventKey = '';\n      updateRow_(SHEETS.RESULTS, x);\n      n++;\n    });\n  });\n  const linked = linkResultsToEvents_();\n  return n ? n + '件を「練習」の記録に直しました' + (linked ? '（' + linked + '件をその日の練習に結びつけました）' : '') : '直す記録はありませんでした';\n}\n\n// ---- 当番表の取り込み：「日付・種類・当番（名字）」の表から、まとめて当番を入れる ----\n\n/**\n * 名字（と下の名前の頭）から家族をさがす。例：「川辺(り)」→ 川辺 りく の家族。\n * 保護者がまだ登録していない子の家族は 'kid:子どもの名前' にしておき、登録されたら読むときに家族に結びつける。\n * @return {{fam: string}|{error: string}}\n */\nfunction dutyFamOf_(token, kids, famOfUser) {\n  const t = String(token || '').replace(/[（(]サブ(?:当番)?[)）]/g, '').trim();\n  const m = t.match(/^(.+?)\\s*[（(]\\s*(.+?)\\s*[)）]$/);\n  const sur = (m ? m[1] : t).replace(/\\s|　/g, ''), hint = m ? m[2] : '';\n  if (!sur) return { error: '' };\n  let hit = kids.filter((k) => k.name.replace(/\\s|　/g, '').indexOf(sur) === 0);\n  if (hint) hit = hit.filter((k) => k.name.replace(/\\s|　/g, '').slice(sur.length).indexOf(hint) === 0);\n  if (!hit.length) return { error: '「' + t + '」の子が名簿にいません' };\n  const fams = hit.map((k) => { const u = k.parents.find((p) => famOfUser[p]); return u ? famOfUser[u] : 'kid:' + k.name; });\n  const uniq = fams.filter((f, i) => fams.indexOf(f) === i);\n  // 同じ名字の子が2人いて、どちらも保護者がまだのときは、きょうだいとして1つの家族にする\n  if (uniq.length > 1 && !hint && uniq.every((f) => /^kid:/.test(f))) return { fam: uniq[0] };\n  if (uniq.length > 1) return { error: '「' + t + '」はだれか分かりません（「' + sur + '(下の名前の1文字)」と書いてください）' };\n  return { fam: uniq[0] };\n}\n\n/**\n * 当番表を取り込む（役員）。rows：{date: 'yyyy-MM-dd', type: '練習'|'大会', names: '海野・川辺(り)'}\n * その日の予定（練習・大会）があれば結びつけ、なければ日付だけで入れておく（あとで予定ができたら読むときに結びつく）。\n */\nfunction importDutiesAction_(ctx, p) {\n  const kids = activeChildren_();\n  const famOfUser = {};\n  readRows_(SHEETS.FAMILIES).forEach((f) => (famOfUser[f.userId] = famIdOf_(f)));\n  const raceKeys = {};\n  readRows_(SHEETS.RACES).forEach((r) => (raceKeys[r.eventKey] = true));\n  const events = readRows_(SHEETS.EVENTS).filter((e) => e.eventKey && e['状態'] !== '中止');\n  const ng = [];\n  let added = 0, linked = 0, same = 0;\n  withLock_(() => {\n    const all = readRows_(SHEETS.DUTIES);\n    (p.rows || []).slice(0, 400).forEach((r, i) => {\n      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(r.date || '')) return ng.push((i + 1) + '行目：日付が読めません');\n      const type = r.type === '大会' ? '大会' : '練習';\n      const ev = events.find((e) => e['日付'] === r.date && ((raceKeys[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習') === (type === '大会')));\n      String(r.names || '').split(/[・、,，\\/]/).map((x) => x.trim()).filter((x) => x && x !== 'なし').forEach((token) => {\n        const f = dutyFamOf_(token, kids, famOfUser);\n        if (f.error) return ng.push(r.date.slice(5).replace('-', '/') + ' ' + f.error);\n        if (!f.fam) return;\n        if (all.some((d) => d['日付'] === r.date && d['家族ID'] === f.fam && d['種類'] === type)) { same++; return; }\n        const row = { eventKey: ev ? ev.eventKey : '', '日付': r.date, '種類': type, '家族ID': f.fam, '更新者': ctx.name, '更新日時': now_() };\n        appendRow_(SHEETS.DUTIES, row);\n        all.push(row);\n        added++;\n        if (ev) linked++;\n      });\n    });\n  });\n  return added + '件の当番を入れました' + (linked < added ? '（予定がまだない日の ' + (added - linked) + '件は、予定ができたら結びつきます）' : '') + (same ? '（' + same + '件はもう入っていました）' : '') + (ng.length ? '。入れられなかったもの：' + ng.slice(0, 8).join('／') + (ng.length > 8 ? ' ほか' + (ng.length - 8) + '件' : '') : '');\n}\n\n// ---- 来年への引き継ぎ（大会名ごと。「第◯回」や年は取って同じ大会とみなす） ----\n\nfunction raceSeriesName_(title) {\n  return toHalfWidth_(String(title || ''))\n    .replace(/第\\s*\\d+\\s*回/g, '').replace(/(令和|R)\\s*\\d+\\s*年度?/g, '').replace(/20\\d\\d\\s*年?度?/g, '').replace(/[\\s　]/g, '').trim();\n}\n\nfunction saveRaceNoteAction_(ctx, p) {\n  const ev = p.key ? findEvent_(p.key) : null;\n  if (ev) requireManager_(ctx, ev.eventKey);\n  else if (!ctx.admin) throw new Error('この操作は役員だけができます。');\n  const name = raceSeriesName_(p.name || (ev ? ev['タイトル'] : ''));\n  if (!name) throw new Error('大会名がわかりません。');\n  const memo = String(p.memo || '').trim().slice(0, 1000);\n  withLock_(() => {\n    const row = readRows_(SHEETS.RACE_NOTES).find((n) => n.id && n['大会名'] === name);\n    if (row) { Object.assign(row, { 'メモ': memo, '更新者': ctx.name, '日時': now_() }); updateRow_(SHEETS.RACE_NOTES, row); }\n    else if (memo) appendRow_(SHEETS.RACE_NOTES, { id: randomKey_().slice(0, 10), '大会名': name, 'メモ': memo, '更新者': ctx.name, '日時': now_() });\n  });\n  if (ev) logHistory_(ev.eventKey, ctx, '来年への引き継ぎを' + (memo ? '書きました' : '消しました'));\n  return memo ? '「' + name + '」の引き継ぎを保存しました（来年もこの大会で出ます）' : '引き継ぎを消しました';\n}\n","Results.gs":"/**\n * 「結果」コマンドの引数を解析する。\n *   結果 100m 15.2秒           … 登録している子どもが1人ならその子の記録\n *   結果 たろう 100m 15.2秒    … 子どもの名前を指定\n *   結果 たろう 走り幅跳び 3m20 自己ベスト！ … 3つめ以降はメモ\n * @return {{child: string, item: string, record: string, note: string}|{error: string}}\n */\nfunction parseResultArgs_(args, myChildren) {\n  const tokens = splitResultTokens_(args);\n  let child = '';\n  if (tokens.length && myChildren.indexOf(tokens[0]) >= 0) {\n    child = tokens.shift();\n  } else if (myChildren.length === 1) {\n    child = myChildren[0];\n  } else if (myChildren.length === 0) {\n    return { error: 'お子さんの名前が未登録です。先に「登録 山田たろう 3年」のように送ってください。' };\n  } else {\n    return { error: '誰の記録か分かるように、名前から書いてください。\\n例：結果 ' + myChildren[0] + ' 100m 15.2秒' };\n  }\n  if (tokens.length < 2) {\n    return { error: '種目と記録を書いてください。\\n例：結果 100m 15.2秒' };\n  }\n  return {\n    child: child,\n    item: toHalfWidth_(tokens[0]),\n    record: toHalfWidth_(tokens[1]),\n    note: tokens.slice(2).join(' '),\n  };\n}\n\nfunction splitResultTokens_(args) {\n  return String(args || '')\n    .replace(/　/g, ' ')\n    .split(/\\s+/)\n    .filter(Boolean);\n}\n\nfunction handleResultCommand_(ev, args) {\n  const userId = ev.source.userId;\n  const parsed = parseResultArgs_(args, childrenOf_(userId).map((c) => c.name));\n  if (parsed.error) return respond_(ev, [text_(parsed.error)]);\n\n  const event = recentEvent_(today_(), CONFIG.RESULT_EVENT_LOOKBACK_DAYS);\n  appendRow_(SHEETS.RESULTS, {\n    '日時': now_(),\n    eventKey: event ? event.eventKey : '',\n    '大会・練習': event ? event['日付'] + ' ' + event['タイトル'] : '',\n    '子ども': parsed.child,\n    '種目': parsed.item,\n    '記録': parsed.record,\n    'メモ': parsed.note,\n    userId: userId,\n    '表示名': getDisplayName_(ev.source),\n    id: randomKey_().slice(0, 10),\n    '区分': event && dutyType_(event) === '大会' ? '公式' : '練習',\n  });\n\n  let msg = '🏃 記録しました：' + parsed.child + ' ' + parsed.item + ' ' + parsed.record;\n  if (event) msg += '\\n（' + formatDate_(event['日付']) + ' ' + event['タイトル'] + '）';\n  respond_(ev, [text_(msg)]);\n}\n\n/** 子どもごとの記録一覧（新しい順に10件） */\nfunction buildRecordsText_(child, results) {\n  const mine = results.filter((r) => r['子ども'] === child).reverse().slice(0, 10);\n  if (!mine.length) return child + 'さんの記録はまだありません。';\n  const lines = ['🏅 ' + child + 'さんの記録'];\n  mine.forEach((r) => {\n    const when = r['大会・練習'] || r['日時'].slice(0, 10);\n    lines.push('・' + r['種目'] + ' ' + r['記録'] + '（' + when + '）' + (r['メモ'] ? ' ' + r['メモ'] : ''));\n  });\n  return lines.join('\\n');\n}\n\nfunction handleRecordsCommand_(ev, args) {\n  const names = splitNames_(args);\n  const targets = names.length ? names : childrenOf_(ev.source.userId).map((c) => c.name);\n  if (!targets.length) {\n    return respond_(ev, [text_('「記録 山田たろう」のように名前を書くか、先にお子さんを登録してください。')]);\n  }\n  const results = readRows_(SHEETS.RESULTS);\n  respond_(ev, targets.slice(0, 5).map((c) => text_(buildRecordsText_(c, results))));\n}\n","Schedule.gs":"/**\n * スプレッドシートの「予定入力」シートに書いた予定を、Googleカレンダーに入れる。\n * PCでまとめて入れたいとき用。1行が1つの予定。\n *\n *   日付     … 2026-10-20 / 2026/10/20 / 10/20 / 10月20日（年を省くと近い日付）\n *   開始・終了 … 18:00 / 1800 / 18時30分。空なら終日の予定\n *   タイトル  … 例：練習、秋季記録会\n *   場所     … なくてもOK\n *   種別     … 練習 / 大会 / 記録会（空ならタイトルから判断）\n *   削除     … ○ を入れると、カレンダーから消す\n *   状態・カレンダーID・反映内容 … 自動で入ります。さわらないでください\n *\n * 書いたらすぐ（編集のたびに）反映されます。ポータルを開いたときや毎朝の同期でも反映します。\n */\n\n/** 予定入力シートの1行を読み取る。読み取れなければ {error} */\nfunction parseScheduleRow_(row) {\n  const date = parseDateCell_(row['日付']);\n  if (!date) return { error: '日付が読めません（例：2026-10-20、10/20）' };\n  const title = String(row['タイトル'] || '').trim().slice(0, 80);\n  if (!title) return { error: 'タイトルを入れてください' };\n  const start = parseTimeCell_(row['開始']);\n  const end = parseTimeCell_(row['終了']);\n  if (start === null || end === null) return { error: '時刻が読めません（例：18:00、1800）' };\n  if (!start && end) return { error: '開始の時刻も入れてください' };\n  if (start && end && end < start) return { error: '終了が開始より前になっています' };\n  const typeText = String(row['種別'] || '').trim();\n  const type = typeText ? (/練習/.test(typeText) ? '練習' : /記録会/.test(typeText) ? '記録会' : '大会') : '';\n  return { date: date, start: start, end: start ? end || start : '', title: title, place: String(row['場所'] || '').trim().slice(0, 80), type: type };\n}\n\n/** 年を省いた日付は、今日の2か月前から10か月後までに入る年にする */\nfunction parseDateCell_(v) {\n  const s = toHalfWidth_(v).trim().replace(/\\(.\\)|（.）/g, '');\n  let m = s.match(/^(\\d{4})[-/.年](\\d{1,2})[-/.月](\\d{1,2})日?$/);\n  let y, mo, d;\n  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }\n  else if ((m = s.match(/^(\\d{1,2})[/.月](\\d{1,2})日?$/))) {\n    mo = +m[1]; d = +m[2];\n    const today = today_();\n    y = +today.slice(0, 4);\n    const pad = (n) => ('0' + n).slice(-2);\n    if (y + '-' + pad(mo) + '-' + pad(d) < addDays_(today, -61)) y += 1;\n  } else return '';\n  const dt = new Date(Date.UTC(y, mo - 1, d));\n  if (dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return '';\n  return dt.toISOString().slice(0, 10);\n}\n\n/** '18:00' '1800' '18時30分' '6:00pm' → '18:00'。空なら ''、読めなければ null */\nfunction parseTimeCell_(v) {\n  let s = toHalfWidth_(v).trim().replace(/\\s/g, '');\n  if (!s || s === '終日') return '';\n  const pm = /pm|午後/i.test(s);\n  s = s.replace(/am|pm|午前|午後/gi, '');\n  const m = s.match(/^(\\d{1,2})(?:[:：時.]?(\\d{2}))?分?$/) || s.match(/^(\\d{1,2})時半$/);\n  if (!m) return null;\n  let h = +m[1];\n  const mi = /半$/.test(s) ? 30 : +(m[2] || 0);\n  if (pm && h < 12) h += 12;\n  if (h > 23 || mi > 59) return null;\n  return ('0' + h).slice(-2) + ':' + ('0' + mi).slice(-2);\n}\n\n/** 予定入力シートをカレンダーに反映する。反映した件数を返す */\nfunction importScheduleSheet_() {\n  return withLock_(() => {\n    let count = 0;\n    let cal = null;\n    readRows_(SHEETS.SCHEDULE_INPUT).forEach((row) => {\n      const del = /^(○|◯|〇|o|x|×|削除|1|true)$/i.test(String(row['削除']).trim());\n      if (del) {\n        if (!row['カレンダーID'] && row['状態'] === '削除しました') return;\n        cal = cal || calendar_();\n        const ce = row['カレンダーID'] ? cal.getEventById(row['カレンダーID']) : null;\n        if (ce) ce.deleteEvent();\n        Object.assign(row, { '状態': '削除しました', 'カレンダーID': '', '反映内容': '' });\n        updateRow_(SHEETS.SCHEDULE_INPUT, row);\n        count++;\n        return;\n      }\n      if (!row['日付'] && !row['タイトル']) return;\n      const o = parseScheduleRow_(row);\n      if (o.error) {\n        if (row['状態'] !== '⚠ ' + o.error) { row['状態'] = '⚠ ' + o.error; updateRow_(SHEETS.SCHEDULE_INPUT, row); }\n        return;\n      }\n      const sig = [o.date, o.start, o.end, o.title, o.place, o.type].join('|');\n      if (row['カレンダーID'] && row['反映内容'] === sig) return;\n      cal = cal || calendar_();\n      let ce = row['カレンダーID'] ? cal.getEventById(row['カレンダーID']) : null;\n      if (row['カレンダーID'] && !ce) {\n        // ポータルやカレンダーで消した予定は、作り直さずに「削除」にする\n        Object.assign(row, { '削除': '○', '状態': 'カレンダーで消されていたので、削除にしました', 'カレンダーID': '', '反映内容': '' });\n        updateRow_(SHEETS.SCHEDULE_INPUT, row);\n        return;\n      }\n      if (ce && ce.isRecurringEvent()) ce = null;\n      if (ce) updateCalEvent_(ce, o);\n      else ce = createCalEvent_(o);\n      upsertEventRow_(ce, o.type);\n      Object.assign(row, {\n        '日付': o.date, '開始': o.start, '終了': o.end, 'タイトル': o.title, '場所': o.place,\n        '状態': '✅ カレンダーに入れました（' + fmt_(new Date(), 'M/d H:mm') + '）', 'カレンダーID': ce.getId(), '反映内容': sig,\n      });\n      updateRow_(SHEETS.SCHEDULE_INPUT, row);\n      count++;\n    });\n    return count;\n  });\n}\n\n/** 予定入力シートを編集したとき（setup() で作るトリガーから呼ばれる） */\nfunction onScheduleSheetEdit(e) {\n  resetMemo_();\n  try {\n    const sh = e && e.range && e.range.getSheet();\n    // スプレッドシートを手で直したら、ポータルが覚えている表を捨てる\n    if (sh) invalidateTable_(sh.getName());\n    if (sh && sh.getName() !== SHEETS.SCHEDULE_INPUT.name) return;\n    importScheduleSheet_();\n  } catch (err) {\n    console.error(err && err.stack ? err.stack : err);\n  }\n}\n","Sheet.gs":"/**\n * スプレッドシートを簡易データベースとして使う。\n * どのシートも1行目が見出しで、2行目以降がデータ。値はすべて文字列で保存する。\n */\nconst SHEETS = {\n  FAMILIES: { name: '家族', headers: ['userId', '表示名', 'ポータルキー', '役員', '更新日時', 'グループ確認', '家族ID', '休み通知', '新着確認', 'コーチ', '役員申請', '係', '管理者'] },\n  CHILDREN: { name: '子ども', headers: ['名前', '学年', '保護者userId', '更新日時', '性別', '名簿'] },\n  EVENTS: { name: '予定', headers: ['eventKey', '日付', '開始', '終了', 'タイトル', '場所', 'カレンダーID', '種別', '状態', '更新日時', 'ダウン'] },\n  RACES: { name: '大会', headers: ['eventKey', '種別', '対象', '参加費', '締切', '集合時刻', '集合場所', '種目', '持ち物', '注意', '更新日時', '主催', '申込期限', '申込方法', '支払期限', '受付', '要項URL', '手続き期限', '時刻表メモ', '時刻表下書き'] },\n  ENTRIES: { name: 'エントリー', headers: ['eventKey', '子ども', '回答', '種目', '集金', '更新者', '更新日時'] },\n  ABSENCES: { name: '休み', headers: ['id', '日付', '子ども', '理由', 'メモ', '連絡者userId', '連絡者', '確認', '確認者', '日時'] },\n  NOTICES: { name: 'お知らせ', headers: ['id', '日付', 'タイトル', '本文', 'eventKey', '作成者', '日時', '重要'] },\n  READS: { name: '既読', headers: ['お知らせid', 'userId', '日時'] },\n  POLLS: { name: 'アンケート', headers: ['id', 'タイトル', '説明', '選択肢', '複数', '締切', 'eventKey', '作成者', '日時', '終了'] },\n  ANSWERS: { name: '回答', headers: ['アンケートid', '家族ID', '回答', 'コメント', '更新者', '日時'] },\n  FEES: { name: '集金', headers: ['id', '名前', '金額', '対象', '期限', 'メモ', '作成者', '日時', '終了', '催促'] },\n  FEE_PAID: { name: '集金状況', headers: ['集金id', '子ども', '状態', '更新者', '日時'] },\n  TRAINING: { name: '自主トレ', headers: ['id', '日付', '子ども', '種類', '距離km', '時間分', '回数', '調子', 'メモ', 'userId', '表示名', '日時'] },\n  TRAIN_SHARE: { name: '自主トレ公開', headers: ['子ども', '公開', '更新者', '日時', '家族既読'] },\n  TRAIN_COMMENTS: { name: '自主トレコメント', headers: ['id', '子ども', '本文', 'userId', '表示名', 'コーチ', '日時'] },\n  APP_REQ: { name: 'アプリ連携の要望', headers: ['アプリ', 'userId', '表示名', '日時'] },\n  ATTEND: { name: '出席', headers: ['日付', 'eventKey', '子ども', 'userId', '表示名', '日時'] },\n  PHOTOS: { name: '写真', headers: ['日時', 'eventKey', '予定', 'userId', '表示名', 'ファイル名', 'URL', 'ファイルID', '種類'] },\n  RESULTS: { name: '結果', headers: ['日時', 'eventKey', '大会・練習', '子ども', '種目', '記録', 'メモ', 'userId', '表示名', 'id', '順位', 'ラウンド', '区分'] },\n  TIMETABLE: { name: 'タイムテーブル', headers: ['id', 'eventKey', '開始', '種目', '区分', '組', '招集', 'アップ', 'メモ', '更新日時'] },\n  TASKS: { name: '手続き', headers: ['id', 'eventKey', '種類', '対象', '状態', 'メモ', '写真ID', '更新者', '日時'] },\n  DUTIES: { name: '当番', headers: ['eventKey', '日付', '種類', '家族ID', '更新者', '更新日時'] },\n  COMMENTS: { name: 'コメント', headers: ['id', 'eventKey', '種類', '本文', '場所', '公開', '写真ID', 'userId', '表示名', '日時', '対策', '対策者', '対策日時', '提案'] },\n  DOCS: { name: '資料', headers: ['id', 'eventKey', '種類', '名前', 'URL', 'ファイルID', '形式', '追加者', '日時'] },\n  HISTORY: { name: '履歴', headers: ['日時', 'eventKey', '表示名', '内容'] },\n  LEDGER: { name: '会計', headers: ['id', '日付', 'eventKey', '種類', '金額', '相手', '但し書き', '写真ID', '記録者', '日時', '科目'] },\n  BUDGET: { name: '予算', headers: ['id', '年度', '区分', '科目', '金額', 'メモ', '更新者', '日時'] },\n  GOALS: { name: '目標', headers: ['id', '子ども', '種類', '期間', 'タイトル', '種目', '目標記録', '開始記録', '期限', 'eventKey', 'やること', '親id', '状態', '達成日', 'ひとこと', '出した人', 'userId', '日時', '更新日時'] },\n  GOAL_LOG: { name: '目標のやること', headers: ['goalId', 'やること', '日付', '子ども', 'userId', '日時'] },\n  RACE_NOTES: { name: '大会の引き継ぎ', headers: ['id', '大会名', 'メモ', '更新者', '日時'] },\n  SWAPS: { name: '当番の交代', headers: ['id', 'eventKey', '日付', '種類', '依頼家族ID', '依頼者', '理由', '状態', '代わり家族ID', '代わり者', '日時', '更新日時'] },\n  VIDEOS: { name: '参考動画', headers: ['id', 'URL', 'タイトル', '種類', 'メモ', '追加者', 'userId', '日時'] },\n  SCHEDULE_INPUT: { name: '予定入力', headers: ['日付', '開始', '終了', 'タイトル', '場所', '種別', '削除', '状態', 'カレンダーID', '反映内容'] },\n};\n\nlet ss__ = null;\n\nfunction ss_() {\n  if (!ss__) ss__ = SpreadsheetApp.openById(requireProp_('SPREADSHEET_ID'));\n  return ss__;\n}\n\nfunction sheet_(def) {\n  const ss = ss_();\n  let sh = ss.getSheetByName(def.name);\n  if (!sh) {\n    sh = ss.insertSheet(def.name);\n    sh.getRange(1, 1, sh.getMaxRows(), def.headers.length).setNumberFormat('@');\n    sh.getRange(1, 1, 1, def.headers.length).setValues([def.headers]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n  } else if (!headersChecked__[def.name] && CacheService.getScriptCache().get('hdr:' + def.name) !== String(def.headers.length)) {\n    // 前の版で作ったシートに、あとから増えた列の見出しを足す（列は右端に足すだけなので、今のデータはずれない）\n    const width = Math.max(sh.getLastColumn(), 1);\n    const have = sh.getRange(1, 1, 1, width).getValues()[0].map(String);\n    const missing = def.headers.filter((h) => have.indexOf(h) < 0);\n    if (missing.length && def.headers.slice(0, have.filter(Boolean).length).every((h, i) => h === have[i])) {\n      const from = have.filter(Boolean).length + 1;\n      sh.getRange(1, from, sh.getMaxRows(), missing.length).setNumberFormat('@');\n      sh.getRange(1, from, 1, missing.length).setValues([missing]).setFontWeight('bold');\n    }\n  }\n  if (!headersChecked__[def.name]) CacheService.getScriptCache().put('hdr:' + def.name, String(def.headers.length), 21600);\n  headersChecked__[def.name] = true;\n  return sh;\n}\n\nconst headersChecked__ = {};\n\n/** 手入力で日付や時刻に自動変換されたセルも文字列に戻す */\nfunction cellToString_(v, header) {\n  if (v instanceof Date) {\n    if (header.indexOf('日時') >= 0) return fmt_(v, 'yyyy-MM-dd HH:mm:ss');\n    if (['開始', '終了', '記録', '集合時刻', '招集', 'アップ'].indexOf(header) >= 0) return fmt_(v, 'H:mm');\n    return fmt_(v, 'yyyy-MM-dd');\n  }\n  return v === null || v === undefined ? '' : String(v);\n}\n\n/**\n * 全行をオブジェクトの配列で返す。_row に行番号が入る。\n * 速くするため、読んだ表は「同じ実行の中」と「CacheService（6時間）」に覚えておく。\n * 書きこむと表の版（スクリプト プロパティ TV_シート名）を上げるので、古い表は使われない。\n * スプレッドシートを手で直したときは、onScheduleSheetEdit（編集のトリガー）が版を上げる。\n * ロックの中（書きこむ前の読みこみ）では、必ずシートから読む。\n */\n/** 覚えている表を、まとめて1回で取り出しておく（1つずつ取り出すと、表の数だけ往復して遅い） */\nlet prefetch__ = {};\nfunction prefetchTables_() {\n  if (!tableCacheOn_() || lockDepth__) return;\n  tableVersion_('', false);\n  const keys = Object.keys(SHEETS).map((k) => SHEETS[k]).filter((def) => !memo__[def.name]).map((def) => 'tbl:' + def.name + ':' + tableVersion_(def.name, false) + ':' + def.headers.length).filter((k) => !(k in prefetch__));\n  if (!keys.length) return;\n  try {\n    const got = CacheService.getScriptCache().getAll(keys) || {};\n    keys.forEach((k) => (prefetch__[k] = got[k] || null));\n  } catch (err) { console.warn(err); }\n}\n\nfunction readRows_(def) {\n  const name = def.name;\n  if (!lockDepth__ && memo__[name]) return memo__[name].map((o) => Object.assign({}, o));\n  const useCache = tableCacheOn_();\n  const ver = useCache ? tableVersion_(name, !!lockDepth__) : '';\n  const key = 'tbl:' + name + ':' + ver + ':' + def.headers.length;\n  let rows = null;\n  if (useCache && !lockDepth__) {\n    try {\n      const hit = key in prefetch__ ? prefetch__[key] : CacheService.getScriptCache().get(key);\n      if (hit) rows = JSON.parse(hit);\n    } catch (err) { rows = null; }\n  }\n  if (!rows) {\n    rows = readSheetRows_(def);\n    if (useCache) {\n      try { const json = JSON.stringify(rows); if (json.length < 95000) CacheService.getScriptCache().put(key, json, 21600); } catch (err) { /* 大きすぎる表は覚えない */ }\n    }\n  }\n  memo__[name] = rows;\n  return rows.map((o) => Object.assign({}, o));\n}\n\nfunction readSheetRows_(def) {\n  const sh = sheet_(def);\n  const last = sh.getLastRow();\n  if (last < 2) return [];\n  const values = sh.getRange(2, 1, last - 1, def.headers.length).getValues();\n  return values\n    .map((r, i) => {\n      const o = { _row: i + 2 };\n      def.headers.forEach((h, j) => (o[h] = cellToString_(r[j], h)));\n      return o;\n    })\n    .filter((o) => def.headers.some((h) => o[h] !== ''));\n}\n\nlet memo__ = {};\nlet props__ = null;\nlet lockDepth__ = 0;\n\n/** 実行のはじめに呼ぶ（Webアプリ・LINE・トリガーの入口） */\nfunction resetMemo_() {\n  memo__ = {};\n  props__ = null;\n  prefetch__ = {};\n}\n\nfunction tableCacheOn_() {\n  return prop_('NO_TABLE_CACHE') !== '1';\n}\n\nfunction tableVersion_(name, fresh) {\n  if (fresh || !props__) props__ = PropertiesService.getScriptProperties().getProperties();\n  return props__['TV_' + name] || '0';\n}\n\n/** 表を書きかえたら、覚えている表を捨てて版を上げる */\nfunction invalidateTable_(name) {\n  delete memo__[name];\n  if (!tableCacheOn_()) return;\n  const v = String(Date.now()) + Math.floor(Math.random() * 1000);\n  PropertiesService.getScriptProperties().setProperty('TV_' + name, v);\n  if (props__) props__['TV_' + name] = v;\n}\n\n/** すべての表を読み直させる（「更新」ボタン・手での編集） */\nfunction invalidateAllTables_() {\n  Object.keys(SHEETS).forEach((k) => invalidateTable_(SHEETS[k].name));\n}\n\nfunction toValues_(def, obj) {\n  return def.headers.map((h) => (obj[h] === null || obj[h] === undefined ? '' : String(obj[h])));\n}\n\nfunction appendRow_(def, obj) {\n  const sh = sheet_(def);\n  const row = sh.getLastRow() + 1;\n  if (row > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), 100);\n  // 書式を文字列にしてから書き込み、「3:20」などが時刻に化けるのを防ぐ\n  sh.getRange(row, 1, 1, def.headers.length).setNumberFormat('@').setValues([toValues_(def, obj)]);\n  obj._row = row;\n  invalidateTable_(def.name);\n  return obj;\n}\n\nfunction updateRow_(def, obj) {\n  sheet_(def).getRange(obj._row, 1, 1, def.headers.length).setNumberFormat('@').setValues([toValues_(def, obj)]);\n  invalidateTable_(def.name);\n}\n\n/** 行を空にする（行番号がずれないよう、削除ではなく空欄にする） */\nfunction clearRow_(def, obj) {\n  sheet_(def).getRange(obj._row, 1, 1, def.headers.length).setValues([def.headers.map(() => '')]);\n  invalidateTable_(def.name);\n}\n\n/** 複数人が同時に操作しても行が重複しないようにロックして実行する */\nfunction withLock_(fn) {\n  if (lockDepth__) return fn();\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  lockDepth__++;\n  try {\n    return fn();\n  } finally {\n    lockDepth__--;\n    lock.releaseLock();\n  }\n}\n\n// ---- 家族（LINE ユーザー） ----\n\nfunction findFamily_(userId) {\n  return readRows_(SHEETS.FAMILIES).find((f) => f.userId === userId) || null;\n}\n\nfunction findFamilyByKey_(key) {\n  if (!key || !/^[A-Za-z0-9]{16,64}$/.test(key)) return null;\n  return readRows_(SHEETS.FAMILIES).find((f) => f['ポータルキー'] === key) || null;\n}\n\nfunction isCoach_(family) {\n  return !!family && /^(○|◯|〇|o|yes|true|1|コーチ)$/i.test(String(family['コーチ'] || '').trim());\n}\n\nfunction isAdminRow_(family) {\n  return !!family && /^(○|◯|〇|o|yes|true|1|役員)$/i.test(String(family['役員']).trim());\n}\n\n/** 管理者（ポータルの持ち主）。一人ずつ。管理者はいつでも役員として扱う */\nfunction isOwner_(family) {\n  return !!family && /^(○|◯|〇|o|yes|true|1|管理者)$/i.test(String(family['管理者'] || '').trim());\n}\n\n/** 役員は家族ごと：家族のだれかに ○ があれば、同じ家族の人はみな役員 */\nfunction isAdmin_(family) {\n  if (!family) return false;\n  if (isAdminRow_(family) || isOwner_(family)) return true;\n  const id = famIdOf_(family);\n  return readRows_(SHEETS.FAMILIES).some((f) => famIdOf_(f) === id && isAdminRow_(f));\n}\n\n/** 同じ家族の行（家族ごとの設定は、全員の行にそろえて書く） */\nfunction familyRowsOf_(rows, famId) {\n  return rows.filter((f) => famIdOf_(f) === famId);\n}\n\n/** 家族のまとまり（父母・祖父母・兄姉など）。まとめていない人は userId がそのまま家族ID */\nfunction famIdOf_(family) {\n  return family['家族ID'] || family.userId;\n}\n\n/** 同じ家族の保護者の userId（自分も入る） */\nfunction familyMembers_(userId, families) {\n  const rows = families || readRows_(SHEETS.FAMILIES);\n  const me = rows.find((f) => f.userId === userId);\n  if (!me) return [userId];\n  const id = famIdOf_(me);\n  return rows.filter((f) => famIdOf_(f) === id).map((f) => f.userId);\n}\n\n/** 家族の行を用意する（なければ作る）。表示名が分かれば更新する */\nfunction ensureFamily_(userId, displayName) {\n  return withLock_(() => {\n    let f = findFamily_(userId);\n    if (!f) {\n      f = appendRow_(SHEETS.FAMILIES, { userId: userId, '表示名': displayName || '', 'ポータルキー': '', '役員': '', '更新日時': now_() });\n    } else if (displayName && f['表示名'] !== displayName) {\n      f['表示名'] = displayName;\n      f['更新日時'] = now_();\n      updateRow_(SHEETS.FAMILIES, f);\n    }\n    return f;\n  });\n}\n\n/** ポータルにログインした人のキー（ブラウザに保存して、次からはログインを省く）。renew が true なら作り直す */\nfunction portalKeyFor_(userId, displayName, renew) {\n  const f = ensureFamily_(userId, displayName);\n  if (f['ポータルキー'] && !renew) return f['ポータルキー'];\n  return withLock_(() => {\n    const fresh = findFamily_(userId);\n    fresh['ポータルキー'] = randomKey_();\n    fresh['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, fresh);\n    return fresh['ポータルキー'];\n  });\n}\n\n// ---- 子ども ----\n\n/** 名前の空白をのぞいてくらべる（「山田 たろう」と「山田たろう」は同じ子） */\nfunction sameKidName_(a, b) {\n  return String(a || '').replace(/\\s|　/g, '') === String(b || '').replace(/\\s|　/g, '');\n}\n\n/** 登録されている子ども：保護者が登録した子と、役員が名簿に入れた子（保護者がまだでも） */\nfunction activeChildren_() {\n  return readRows_(SHEETS.CHILDREN)\n    .filter((c) => c['名前'] && (splitNames_(c['保護者userId']).length || c['名簿'] === '○'))\n    .map((c) => ({ name: c['名前'], grade: Number(c['学年']) || 0, sex: c['性別'] === '男' || c['性別'] === '女' ? c['性別'] : '', parents: splitNames_(c['保護者userId']), _row: c._row }));\n}\n\nfunction childrenOf_(userId) {\n  return activeChildren_().filter((c) => c.parents.indexOf(userId) >= 0);\n}\n\nfunction allChildren_() {\n  return activeChildren_().map((c) => c.name);\n}\n\n/**\n * この保護者の子どもを list の内容にそろえる。\n * 同じ名前の子がすでにいれば保護者として追加する（家族のだれが登録してもよい）。\n * @param {{name: string, grade: number}[]} list\n */\nfunction saveChildren_(userId, list) {\n  withLock_(() => {\n    // 家族をまとめていれば、家族のだれが直しても両方の子どもとして登録される\n    const members = familyMembers_(userId);\n    const rows = readRows_(SHEETS.CHILDREN);\n    const names = list.map((c) => c.name);\n    rows.forEach((row) => {\n      const parents = splitNames_(row['保護者userId']);\n      const keep = names.some((n) => sameKidName_(n, row['名前']));\n      const rest = parents.filter((u) => members.indexOf(u) < 0);\n      if (!keep && rest.length !== parents.length) {\n        row['保護者userId'] = rest.join(',');\n        row['更新日時'] = now_();\n        updateRow_(SHEETS.CHILDREN, row);\n      }\n    });\n    list.forEach((c) => {\n      // 名簿に入っている子なら、その子に保護者を足す（名前は名簿のまま。ただし空白入りで書き直したときは空白入りにする）\n      const row = rows.find((r) => sameKidName_(r['名前'], c.name));\n      if (row) {\n        if (preferSpacedName_(row['名前'], c.name)) renameKid_(row, c.name);\n        const parents = splitNames_(row['保護者userId']);\n        members.forEach((u) => { if (parents.indexOf(u) < 0) parents.push(u); });\n        row['保護者userId'] = parents.join(',');\n        if (c.grade) row['学年'] = String(c.grade);\n        if (c.sex !== undefined) row['性別'] = c.sex;\n        row['更新日時'] = now_();\n        updateRow_(SHEETS.CHILDREN, row);\n      } else {\n        appendRow_(SHEETS.CHILDREN, { '名前': c.name, '学年': c.grade ? String(c.grade) : '', '保護者userId': members.join(','), '性別': c.sex || '', '更新日時': now_() });\n      }\n    });\n  });\n}\n\n/** 空白だけちがう名前で、新しいほうに空白がある（「海野そら」→「海野 そら」）ときは、新しいほうにする */\nfunction preferSpacedName_(oldName, newName) {\n  const a = String(oldName || '').trim(), b = String(newName || '').trim().replace(/[\\s　]+/g, ' ');\n  return a !== b && sameKidName_(a, b) && /\\s/.test(b);\n}\n\n/**\n * 子どもの名前を書きかえる。エントリー・休み・記録・自主トレ・集金・出席・手続き・当番（保護者がまだの家）の名前もそろえる\n */\nfunction renameKid_(row, newName) {\n  const oldName = row['名前'];\n  newName = String(newName).trim().replace(/[\\s　]+/g, ' ');\n  if (!oldName || oldName === newName) return;\n  row['名前'] = newName;\n  row['更新日時'] = now_();\n  updateRow_(SHEETS.CHILDREN, row);\n  ['ENTRIES', 'ABSENCES', 'FEE_PAID', 'TRAINING', 'TRAIN_SHARE', 'TRAIN_COMMENTS', 'ATTEND', 'RESULTS'].forEach((k) => {\n    readRows_(SHEETS[k]).forEach((r) => { if (r['子ども'] === oldName) { r['子ども'] = newName; updateRow_(SHEETS[k], r); } });\n  });\n  readRows_(SHEETS.TASKS).forEach((r) => {\n    const t = String(r['対象'] || '');\n    if (t === oldName || t.indexOf(oldName + '|') === 0) { r['対象'] = newName + t.slice(oldName.length); updateRow_(SHEETS.TASKS, r); }\n  });\n  readRows_(SHEETS.DUTIES).forEach((r) => { if (r['家族ID'] === 'kid:' + oldName) { r['家族ID'] = 'kid:' + newName; updateRow_(SHEETS.DUTIES, r); } });\n}\n\n/**\n * userId の人を、inviterId の人の家族に入れる。おたがいの子どもは両方の子どもになる。\n * 当番の記録も新しい家族IDに付け替える。\n */\nfunction joinFamily_(userId, inviterId) {\n  withLock_(() => {\n    const families = readRows_(SHEETS.FAMILIES);\n    const me = families.find((f) => f.userId === userId);\n    const inviter = families.find((f) => f.userId === inviterId);\n    if (!me || !inviter) throw new Error('家族が見つかりません。');\n    const newId = famIdOf_(inviter);\n    const oldId = famIdOf_(me);\n    if (inviter['家族ID'] !== newId) { inviter['家族ID'] = newId; updateRow_(SHEETS.FAMILIES, inviter); }\n    if (oldId !== newId) {\n      me['家族ID'] = newId;\n      me['更新日時'] = now_();\n      updateRow_(SHEETS.FAMILIES, me);\n      readRows_(SHEETS.DUTIES).filter((d) => d['家族ID'] === oldId).forEach((d) => { d['家族ID'] = newId; updateRow_(SHEETS.DUTIES, d); });\n    }\n    const members = families.filter((f) => famIdOf_(f) === newId).map((f) => f.userId);\n    readRows_(SHEETS.CHILDREN).forEach((row) => {\n      const parents = splitNames_(row['保護者userId']);\n      if (!parents.some((u) => members.indexOf(u) >= 0)) return;\n      const all = parents.concat(members.filter((u) => parents.indexOf(u) < 0));\n      if (all.length === parents.length) return;\n      row['保護者userId'] = all.join(',');\n      row['更新日時'] = now_();\n      updateRow_(SHEETS.CHILDREN, row);\n    });\n  });\n}\n\n/**\n * 同じ子を、別々の家族として登録した保護者（父と母・祖父母などが招待番号を使わずにそれぞれ登録したなど）を1つの家族にまとめる。\n * 当番や家族の一覧が2つに分かれないように。祖父母・兄姉が登録しても同じ家族に入る。まとめたら true\n */\nfunction mergeSameKidFamilies_() {\n  let changed = false;\n  for (let i = 0; i < 20; i++) {\n    const families = readRows_(SHEETS.FAMILIES);\n    const famOf = {};\n    families.forEach((f) => (famOf[f.userId] = famIdOf_(f)));\n    const kids = readRows_(SHEETS.CHILDREN).filter((c) => c['名前']);\n    const famKids = {};\n    kids.forEach((c) => splitNames_(c['保護者userId']).forEach((u) => { if (famOf[u]) (famKids[famOf[u]] = famKids[famOf[u]] || {})[c['名前']] = true; }));\n    const meets = (a, b) => Object.keys(famKids[a] || {}).some((k) => (famKids[b] || {})[k]);\n    // 2つの別の家族の子をどちらも登録している人（いとこの祖父母など）は、2つの家族をつながないよう自動ではまとめない\n    const bridge = (f) => {\n      const others = Object.keys(famKids).filter((g) => g !== f && meets(f, g));\n      return others.some((g, i) => others.slice(i + 1).some((h) => !meets(g, h)));\n    };\n    let pair = null;\n    kids.some((c) => {\n      const us = splitNames_(c['保護者userId']).filter((u) => famOf[u]);\n      us.some((a) => us.some((b) => {\n        if (famOf[a] === famOf[b] || bridge(famOf[a]) || bridge(famOf[b])) return false;\n        pair = { user: b, into: a };\n        return true;\n      }));\n      return !!pair;\n    });\n    if (!pair) break;\n    joinFamily_(pair.user, pair.into);\n    changed = true;\n  }\n  return changed;\n}\n\n/** 家族のまとまりから外れる。登録した子どもは、ほかの家族の人の子どもとして残る */\nfunction leaveFamily_(userId) {\n  withLock_(() => {\n    const families = readRows_(SHEETS.FAMILIES);\n    const me = families.find((f) => f.userId === userId);\n    if (!me || famIdOf_(me) === userId) return;\n    const others = families.filter((f) => f.userId !== userId && famIdOf_(f) === famIdOf_(me));\n    me['家族ID'] = '';\n    me['更新日時'] = now_();\n    updateRow_(SHEETS.FAMILIES, me);\n    readRows_(SHEETS.CHILDREN).forEach((row) => {\n      const parents = splitNames_(row['保護者userId']);\n      if (parents.indexOf(userId) < 0 || !others.some((f) => parents.indexOf(f.userId) >= 0)) return;\n      row['保護者userId'] = parents.filter((u) => u !== userId).join(',');\n      updateRow_(SHEETS.CHILDREN, row);\n    });\n  });\n}\n\n// ---- 予定 ----\n\nfunction findEvent_(eventKey) {\n  return readRows_(SHEETS.EVENTS).find((e) => e.eventKey === eventKey) || null;\n}\n\n/** 指定日から lookbackDays 日前までで、いちばん新しい予定（写真・結果の紐づけ用） */\nfunction recentEvent_(dateStr, lookbackDays) {\n  const from = addDays_(dateStr, -lookbackDays);\n  const list = readRows_(SHEETS.EVENTS)\n    .filter((e) => e['状態'] !== '中止' && e['日付'] >= from && e['日付'] <= dateStr)\n    .sort(compareEvents_);\n  return list.length ? list[list.length - 1] : null;\n}\n\nfunction compareEvents_(a, b) {\n  const ka = a['日付'] + ' ' + (a['開始'] === '終日' ? '' : a['開始']);\n  const kb = b['日付'] + ' ' + (b['開始'] === '終日' ? '' : b['開始']);\n  return ka < kb ? -1 : ka > kb ? 1 : 0;\n}\n","Strava.gs":"/**\n * Strava との連携：家族ごとに Strava をつなぐと、子どもの名前がタイトルに入った活動（ランニング・自転車など）を\n * 自主トレに取り込む。取り込んだ記録は、Strava の決まりにあわせて「その家族だけ」に見せる（コーチ・みんなには見せない）。\n *\n * 準備（管理者が1回だけ）：https://www.strava.com/settings/api でアプリを作り、\n *   「Authorization Callback Domain」にポータルのドメイン（例：kahokuss.github.io）を入れ、\n *   Client ID と Client Secret をポータルの「自主トレ」→「Strava」に入れる。\n * 家族の Strava の鍵（トークン）は Apps Script のスクリプト プロパティに入れ、スプレッドシートには書かない。\n */\n\nconst STRAVA_API = 'https://www.strava.com';\n// 取り込む活動の種類 → 自主トレの種類\nconst STRAVA_KINDS = {\n  Run: 'ランニング', TrailRun: 'ランニング', VirtualRun: 'ランニング',\n  Ride: '自転車', VirtualRide: '自転車', MountainBikeRide: '自転車', GravelRide: '自転車',\n  Walk: 'ウォーキング', Hike: 'ウォーキング', Swim: '水泳',\n};\nconst STRAVA_SYNC_MINUTES = 60;\n\nfunction stravaKeys_() {\n  const id = prop_('STRAVA_CLIENT_ID'), secret = prop_('STRAVA_CLIENT_SECRET');\n  return id && secret ? { id: id, secret: secret } : null;\n}\n\nfunction stravaLoad_(famId) {\n  try { return JSON.parse(prop_('SV_' + famId) || 'null'); } catch (err) { return null; }\n}\n\nfunction stravaSave_(famId, data) {\n  if (data) setProp_('SV_' + famId, JSON.stringify(data));\n  else PropertiesService.getScriptProperties().deleteProperty('SV_' + famId);\n}\n\nfunction stravaRedirect_() {\n  return String(CONFIG.PORTAL_URL || '').replace(/\\/?$/, '/') + '?strava=1';\n}\n\n/** 子どもの名前で活動を見分ける言葉：設定した言葉、空白なしの名前、名字をのぞいた名前 */\nfunction stravaWords_(name, custom) {\n  const words = String(custom || '').split(/[,、・\\s]+/).filter(Boolean);\n  const full = String(name).replace(/\\s|　/g, '');\n  words.push(full);\n  const sp = String(name).trim().split(/\\s|　/);\n  if (sp.length > 1) words.push(sp[sp.length - 1]);\n  const m = full.match(/^[一-龥々]+([ぁ-んァ-ヶー].+)$/);\n  if (m) words.push(m[1]);\n  return words.filter((w) => w.length >= 2);\n}\n\n/** 画面に出す、わが家の Strava の状態 */\nfunction stravaStateFor_(ctx) {\n  const s = stravaLoad_(ctx.famId);\n  return {\n    configured: !!stravaKeys_(),\n    domain: String(CONFIG.PORTAL_URL || '').replace(/^https?:\\/\\//, '').replace(/\\/.*$/, ''),\n    connected: !!s,\n    name: s ? s.name : '',\n    last: s ? s.lastAt || '' : '',\n    count: s ? s.count || 0 : 0,\n    kw: s ? s.kw || {} : {},\n  };\n}\n\n/** Client ID と Client Secret を入れる（管理者だけ） */\nfunction setStravaKeysAction_(ctx, p) {\n  if (!ctx.owner) throw new Error('この設定は管理者だけができます。');\n  const id = String(p.id || '').replace(/[^0-9]/g, '');\n  const secret = String(p.secret || '').trim();\n  if (!id || !/^[0-9a-f]{20,}$/i.test(secret)) throw new Error('Client ID（数字）と Client Secret（英数字）を入れてください。');\n  setProp_('STRAVA_CLIENT_ID', id);\n  setProp_('STRAVA_CLIENT_SECRET', secret);\n  return 'Strava の設定を保存しました。家族ごとに「Stravaとつなぐ」が使えます';\n}\n\n/** Strava のログイン画面の URL */\nfunction stravaAuthUrlAction_(ctx) {\n  const k = stravaKeys_();\n  if (!k) throw new Error('まだ Strava の設定がされていません。管理者に設定をお願いしてください。');\n  const state = 'sv' + randomKey_().slice(0, 16);\n  CacheService.getScriptCache().put('strava:' + state, ctx.userId, 600);\n  return {\n    url: STRAVA_API + '/oauth/authorize?client_id=' + encodeURIComponent(k.id) + '&response_type=code&approval_prompt=auto&scope=activity:read_all' +\n      '&redirect_uri=' + encodeURIComponent(stravaRedirect_()) + '&state=' + state,\n  };\n}\n\nfunction stravaToken_(payload) {\n  const k = stravaKeys_();\n  if (!k) throw new Error('Strava の設定がありません。');\n  const res = UrlFetchApp.fetch(STRAVA_API + '/oauth/token', {\n    method: 'post', muteHttpExceptions: true,\n    payload: Object.assign({ client_id: k.id, client_secret: k.secret }, payload),\n  });\n  const body = JSON.parse(res.getContentText() || '{}');\n  if (res.getResponseCode() !== 200 || !body.access_token) throw new Error('Strava とつなげませんでした。もう一度ためしてください。');\n  return body;\n}\n\n/** Strava のログインから戻ってきたとき：鍵を受け取って、わが家につなぐ */\nfunction stravaConnectAction_(ctx, p) {\n  if (p.error) throw new Error('Strava の許可がキャンセルされました。');\n  const cache = CacheService.getScriptCache();\n  const who = cache.get('strava:' + String(p.state || ''));\n  if (!who || who !== ctx.userId) throw new Error('Strava とつなぐ時間が切れました。もう一度「Stravaとつなぐ」を押してください。');\n  cache.remove('strava:' + p.state);\n  if (!/activity:read/.test(String(p.scope || 'activity:read_all'))) throw new Error('「活動を見る」を許可してください。');\n  const t = stravaToken_({ code: String(p.code || ''), grant_type: 'authorization_code' });\n  const old = stravaLoad_(ctx.famId) || {};\n  stravaSave_(ctx.famId, {\n    athlete: t.athlete ? t.athlete.id : '', name: t.athlete ? [t.athlete.firstname, t.athlete.lastname].filter(Boolean).join(' ') : '',\n    access: t.access_token, refresh: t.refresh_token, exp: t.expires_at, by: ctx.userId,\n    after: Math.floor(Date.now() / 1000) - 60 * 86400, // つないだときは、60日前の活動から取り込む\n    kw: old.kw || {}, count: old.count || 0,\n  });\n  const n = stravaSync_(ctx.famId, true);\n  return 'Strava とつなぎました' + (n ? '。' + n + '件を自主トレに取り込みました' : '。子どもの名前がタイトルに入った活動を取り込みます');\n}\n\n/** 子どもごとの見分ける言葉を保存 */\nfunction stravaKeywordsAction_(ctx, p) {\n  const s = stravaLoad_(ctx.famId);\n  if (!s) throw new Error('まだ Strava とつながっていません。');\n  const mine = childrenOf_(ctx.userId).map((c) => c.name);\n  s.kw = {};\n  Object.keys(p.kw || {}).forEach((k) => { if (mine.indexOf(k) >= 0) s.kw[k] = String(p.kw[k] || '').slice(0, 40); });\n  stravaSave_(ctx.famId, s);\n  return '見分ける言葉を保存しました';\n}\n\nfunction stravaSyncAction_(ctx) {\n  if (!stravaLoad_(ctx.famId)) throw new Error('まだ Strava とつながっていません。');\n  const n = stravaSync_(ctx.famId, true);\n  return n ? n + '件を自主トレに取り込みました' : '新しい活動はありませんでした（タイトルに子どもの名前が入った活動だけ取り込みます）';\n}\n\nfunction stravaDisconnectAction_(ctx, p) {\n  const s = stravaLoad_(ctx.famId);\n  if (s) {\n    try { UrlFetchApp.fetch(STRAVA_API + '/oauth/deauthorize', { method: 'post', muteHttpExceptions: true, payload: { access_token: s.access } }); } catch (err) {}\n    stravaSave_(ctx.famId, null);\n  }\n  let removed = 0;\n  if (p.remove) {\n    const mine = childrenOf_(ctx.userId).map((c) => c.name);\n    withLock_(() => readRows_(SHEETS.TRAINING).forEach((x) => { if (/^sv/.test(x.id) && mine.indexOf(x['子ども']) >= 0) { clearRow_(SHEETS.TRAINING, x); removed++; } }));\n  }\n  return 'Strava とのつながりを切りました' + (removed ? '（取り込んだ ' + removed + '件も消しました）' : '');\n}\n\n/**\n * わが家の Strava から、新しい活動を自主トレに取り込む。取り込んだ件数を返す。\n * force でなければ、前回から STRAVA_SYNC_MINUTES たっていないときは何もしない\n */\nfunction stravaSync_(famId, force) {\n  const s = stravaLoad_(famId);\n  if (!s || !stravaKeys_()) return 0;\n  if (!force && s.checked && Date.now() - s.checked < STRAVA_SYNC_MINUTES * 60000) return 0;\n  if (!s.exp || s.exp - 300 < Date.now() / 1000) {\n    const t = stravaToken_({ grant_type: 'refresh_token', refresh_token: s.refresh });\n    s.access = t.access_token; s.refresh = t.refresh_token || s.refresh; s.exp = t.expires_at;\n  }\n  const res = UrlFetchApp.fetch(STRAVA_API + '/api/v3/athlete/activities?per_page=100&after=' + (s.after || 0), {\n    method: 'get', muteHttpExceptions: true, headers: { Authorization: 'Bearer ' + s.access },\n  });\n  s.checked = Date.now();\n  if (res.getResponseCode() !== 200) { stravaSave_(famId, s); return 0; }\n  const acts = JSON.parse(res.getContentText() || '[]');\n  // この家族の子ども\n  const fam = readRows_(SHEETS.FAMILIES).filter((f) => famIdOf_(f) === famId).map((f) => f.userId);\n  const kids = activeChildren_().filter((c) => c.parents.some((u) => fam.indexOf(u) >= 0));\n  let n = 0, maxT = s.after || 0;\n  withLock_(() => {\n    const have = {};\n    readRows_(SHEETS.TRAINING).forEach((x) => { if (/^sv/.test(x.id)) have[x.id] = true; });\n    acts.forEach((a) => {\n      const t = Math.floor(new Date(a.start_date).getTime() / 1000);\n      if (t > maxT) maxT = t;\n      const kind = STRAVA_KINDS[a.sport_type] || STRAVA_KINDS[a.type];\n      if (!kind) return;\n      const title = String(a.name || '');\n      kids.filter((k) => stravaWords_(k.name, (s.kw || {})[k.name]).some((w) => title.indexOf(w) >= 0)).forEach((k) => {\n        const id = 'sv' + a.id + (kids.length > 1 ? '_' + kids.indexOf(k) : '');\n        if (have[id]) return;\n        have[id] = true;\n        const km = a.distance ? Math.round(a.distance / 10) / 100 : 0;\n        const min = a.moving_time ? Math.max(1, Math.round(a.moving_time / 60)) : 0;\n        appendRow_(SHEETS.TRAINING, {\n          id: id, '日付': String(a.start_date_local || a.start_date || '').slice(0, 10), '子ども': k.name, '種類': kind,\n          '距離km': km ? String(km) : '', '時間分': min ? String(min) : '', '回数': '', '調子': '',\n          'メモ': ('Strava：' + title).slice(0, 200), userId: s.by || '', '表示名': 'Strava', '日時': now_(),\n        });\n        n++;\n      });\n    });\n  });\n  s.after = maxT;\n  s.count = (s.count || 0) + n;\n  s.lastAt = now_();\n  stravaSave_(famId, s);\n  return n;\n}\n\n/** 15分ごとの同期から：つないでいる家族を、1時間ごとに取り込む */\nfunction stravaSyncAll_() {\n  if (!stravaKeys_()) return;\n  const props = PropertiesService.getScriptProperties().getProperties();\n  Object.keys(props).filter((k) => /^SV_/.test(k)).forEach((k) => {\n    try { stravaSync_(k.slice(3), false); } catch (err) { console.warn('Strava の取り込みに失敗: ' + k + ' ' + err); }\n  });\n}\n\n// ---- ほかのトレーニングアプリ：いまは「開発中」。使いたい人の数を数えて、多いものから作る ----\nconst APP_LIST = ['Strava', 'Garmin Connect', 'Apple ヘルスケア', 'Google ヘルスコネクト', 'Fitbit', 'Polar', 'COROS', 'Suunto', 'Nike Run Club'];\n\nfunction appRequestAction_(ctx, p) {\n  if (APP_LIST.indexOf(p.app) < 0) throw new Error('そのアプリは選べません。');\n  withLock_(() => {\n    const row = readRows_(SHEETS.APP_REQ).find((x) => x['アプリ'] === p.app && x.userId === ctx.userId);\n    if (p.on && !row) appendRow_(SHEETS.APP_REQ, { 'アプリ': p.app, userId: ctx.userId, '表示名': ctx.name, '日時': now_() });\n    if (!p.on && row) clearRow_(SHEETS.APP_REQ, row);\n  });\n  return p.on ? p.app + 'の連携を「使いたい」にしました。要望が集まったら作ります' : '';\n}\n\n/** mine：自分が「使いたい」にしたアプリ／counts：アプリごとの人数（役員・管理者だけ） */\nfunction appRequestsFor_(ctx) {\n  const rows = readRows_(SHEETS.APP_REQ).filter((x) => x['アプリ']);\n  const counts = {};\n  if (ctx.admin) rows.forEach((x) => (counts[x['アプリ']] = (counts[x['アプリ']] || 0) + 1));\n  return { list: APP_LIST, mine: rows.filter((x) => x.userId === ctx.userId).map((x) => x['アプリ']), counts: counts };\n}\n","Swap.gs":"/**\n * 当番の交代：当番の家族が「交代をお願いする」→ ほかの家族が「代わりに入る」（先着1家族）で、その場で入れかわる。\n * 回数は当番表の行のとおりに数えるので、代わりに入った家族は次の自動割り当てで後回し、代わってもらった家族は先になる\n */\n\n/** 当番表の家族ID（保護者がまだだった子は kid:名前）を、今の家族IDにする */\nfunction dutyFamResolver_() {\n  const famOfUser = {};\n  readRows_(SHEETS.FAMILIES).forEach((f) => (famOfUser[f.userId] = famIdOf_(f)));\n  const allKids = activeChildren_();\n  return (v) => {\n    if (!/^kid:/.test(v)) return v;\n    const k = allKids.find((c) => c.name === v.slice(4));\n    const u = k && k.parents.find((x) => famOfUser[x]);\n    return u ? famOfUser[u] : v;\n  };\n}\n\n/** その予定の、その家族の当番の行（大会係は除く） */\nfunction dutyRowOf_(ev, fam) {\n  const res = dutyFamResolver_();\n  return readRows_(SHEETS.DUTIES).find((d) => !isRaceStaffRow_(d) && (d.eventKey === ev.eventKey || (!d.eventKey && d['日付'] === ev['日付'] && d['種類'] === dutyType_(ev))) && res(d['家族ID']) === fam);\n}\n\nfunction swapsFor_(today) {\n  return readRows_(SHEETS.SWAPS)\n    .filter((x) => x.id && x['日付'] >= addDays_(today, -1) && (x['状態'] === '募集中' || x['状態'] === '決定'))\n    .map((x) => ({ id: x.id, key: x.eventKey, date: x['日付'], type: x['種類'], fam: x['依頼家族ID'], by: x['依頼者'], reason: x['理由'], status: x['状態'], to: x['代わり家族ID'], toName: x['代わり者'] }));\n}\n\nfunction swapRequestAction_(ctx, p) {\n  const ev = findEvent_(p.key);\n  if (!ev) throw new Error('予定が見つかりません。');\n  if (ev['日付'] < today_()) throw new Error('終わった予定の当番は交代できません。');\n  withLock_(() => {\n    if (!dutyRowOf_(ev, ctx.famId)) throw new Error('この予定の当番は、わが家ではありません。');\n    if (readRows_(SHEETS.SWAPS).some((x) => x.eventKey === ev.eventKey && x['依頼家族ID'] === ctx.famId && x['状態'] === '募集中')) throw new Error('もう交代をお願いしています。');\n    appendRow_(SHEETS.SWAPS, { id: randomKey_().slice(0, 10), eventKey: ev.eventKey, '日付': ev['日付'], '種類': dutyType_(ev), '依頼家族ID': ctx.famId, '依頼者': ctx.name, '理由': String(p.reason || '').trim().slice(0, 200), '状態': '募集中', '日時': now_(), '更新日時': now_() });\n  });\n  logHistory_(ev.eventKey, ctx, '当番の交代をお願いしました');\n  return '交代をお願いしました。だれかが「代わりに入る」を押すと、その家族に入れかわります';\n}\n\nfunction swapVolunteerAction_(ctx, p) {\n  let ev = null;\n  withLock_(() => {\n    const sw = readRows_(SHEETS.SWAPS).find((x) => x.id === p.id);\n    if (!sw || sw['状態'] !== '募集中') throw new Error('この交代の募集は、もう終わっています。');\n    if (sw['依頼家族ID'] === ctx.famId) throw new Error('自分の家の当番には入れません。');\n    ev = findEvent_(sw.eventKey);\n    if (!ev) throw new Error('予定が見つかりません。');\n    if (dutyRowOf_(ev, ctx.famId)) throw new Error('この日は、もうわが家が当番です。');\n    const row = dutyRowOf_(ev, sw['依頼家族ID']);\n    if (!row) throw new Error('当番が見つかりません（役員が入れかえたかもしれません）。');\n    row['家族ID'] = ctx.famId; row['更新者'] = ctx.name + '（交代）'; row['更新日時'] = now_();\n    updateRow_(SHEETS.DUTIES, row);\n    Object.assign(sw, { '状態': '決定', '代わり家族ID': ctx.famId, '代わり者': ctx.name, '更新日時': now_() });\n    updateRow_(SHEETS.SWAPS, sw);\n  });\n  logHistory_(ev.eventKey, ctx, '当番を交代しました（代わりに入る）');\n  return '代わりに入りました。' + formatDate_(ev['日付']) + 'の当番は、わが家です。ありがとうございます';\n}\n\nfunction swapCancelAction_(ctx, p) {\n  withLock_(() => {\n    const sw = readRows_(SHEETS.SWAPS).find((x) => x.id === p.id);\n    if (!sw || sw['状態'] !== '募集中') throw new Error('この交代の募集は、もう終わっています。');\n    if (sw['依頼家族ID'] !== ctx.famId && !ctx.admin) throw new Error('お願いした家族と役員だけが取り消せます。');\n    Object.assign(sw, { '状態': '取消', '更新日時': now_() });\n    updateRow_(SHEETS.SWAPS, sw);\n  });\n  return '交代のお願いを取り消しました';\n}\n","TestData.gs":"/**\n * 本番で試すための「テスト家族」（親A〜親E）。役員が管理画面から入れて、まとめて消す。\n * userId は TEST_ で始め、LINE には送らない（グループの確認・通知の対象にしない）。\n */\n// 保護者は家族ごとに1〜2人（父母・祖父母）。同じ家族ID で紐付け、子どもの保護者にも全員を入れる\n// 仮の役員：親A＝会長、親B＝副会長・会計係、親C＝記録係・当番係、親D＝大会係（役員ページの係ごとの見え方を試す）\n// 親E は役員でないふつうの保護者（大会ごとの「大会係」に選んで、役員でなくても入力できるかを試す）\nconst TEST_FAMILIES = [\n  { id: 'TEST_A', role: '会長', guardians: [['TEST_A', '親A（母）'], ['TEST_A2', '親A（父）']], kids: [{ name: 'テストA', grade: 3, sex: '男' }] },\n  { id: 'TEST_B', role: '副会長・会計係', guardians: [['TEST_B', '親B（母）']], kids: [{ name: 'テストB', grade: 5, sex: '女' }] },\n  { id: 'TEST_C', role: '記録係・当番係', guardians: [['TEST_C', '親C（父）'], ['TEST_C2', '親C（祖母）']], kids: [{ name: 'テストC', grade: 6, sex: '男' }, { name: 'テストC2', grade: 1, sex: '女' }] },\n  { id: 'TEST_D', role: '大会係', guardians: [['TEST_D', '親D（母）'], ['TEST_D2', '親D（祖父）']], kids: [{ name: 'テストD', grade: 4, sex: '女' }] },\n  { id: 'TEST_E', role: '', staff: false, guardians: [['TEST_E', '親E（父）']], kids: [{ name: 'テストE', grade: 2, sex: '男' }] },\n];\n\nfunction isTestUser_(userId) {\n  return /^TEST_/.test(String(userId || ''));\n}\n\nfunction testKidNames_() {\n  const names = {};\n  readRows_(SHEETS.CHILDREN).forEach((c) => { if (c['名前'] && splitNames_(c['保護者userId']).some(isTestUser_)) names[c['名前']] = true; });\n  TEST_FAMILIES.forEach((f) => f.kids.forEach((k) => (names[k.name] = true)));\n  return names;\n}\n\n/** テスト家族の一覧（役員の画面用）：家族ごとに、保護者（その人として見られる）と子ども */\nfunction testFamiliesFor_(ctx) {\n  if (!ctx.admin) return [];\n  const rows = readRows_(SHEETS.FAMILIES).filter((f) => isTestUser_(f.userId));\n  const kids = readRows_(SHEETS.CHILDREN);\n  const out = [];\n  rows.forEach((f) => {\n    const id = famIdOf_(f);\n    let fam = out.find((x) => x.id === id);\n    if (!fam) { fam = { id: id, guardians: [], kids: [], role: '' }; out.push(fam); }\n    fam.guardians.push({ id: f.userId, name: f['表示名'] });\n    fam.role = f['係'] || fam.role || '';\n    kids.filter((c) => splitNames_(c['保護者userId']).indexOf(f.userId) >= 0).forEach((c) => { if (fam.kids.indexOf(c['名前']) < 0) fam.kids.push(c['名前']); });\n  });\n  return out;\n}\n\n/** 入れる（on）／まとめて消す（off） */\nfunction testFamiliesAction_(ctx, p) {\n  if (p.off) return clearTestData_();\n  let added = 0;\n  withLock_(() => {\n    const fams = readRows_(SHEETS.FAMILIES), kids = readRows_(SHEETS.CHILDREN);\n    TEST_FAMILIES.forEach((t) => {\n      const ids = t.guardians.map((g) => g[0]);\n      t.guardians.forEach((g) => {\n        const f = fams.find((x) => x.userId === g[0]);\n        // 仮の役員として、役員の印と係も入れる（親E はふつうの保護者）。入れた後に画面で係を変えたら、そのまま残す\n        const mark = t.staff === false ? '' : '○';\n        if (!f) { appendRow_(SHEETS.FAMILIES, { userId: g[0], '表示名': g[1], 'ポータルキー': randomKey_(), '更新日時': now_(), 'グループ確認': now_(), '家族ID': t.id, '役員': mark, '係': t.role }); added++; }\n        else if (f['家族ID'] !== t.id) { f['家族ID'] = t.id; updateRow_(SHEETS.FAMILIES, f); }\n      });\n      // 子どもに、家族の保護者をみんな紐付ける\n      t.kids.forEach((k) => {\n        const c = kids.find((x) => x['名前'] === k.name);\n        if (!c) appendRow_(SHEETS.CHILDREN, { '名前': k.name, '学年': String(k.grade), '保護者userId': ids.join(','), '更新日時': now_(), '性別': k.sex, '名簿': '○' });\n        else if (ids.some((u) => splitNames_(c['保護者userId']).indexOf(u) < 0)) { c['保護者userId'] = splitNames_(c['保護者userId']).concat(ids).filter((u, i, a) => a.indexOf(u) === i).join(','); updateRow_(SHEETS.CHILDREN, c); }\n      });\n    });\n  });\n  return added ? 'テスト家族（親A〜親E、保護者' + added + '人）を入れました。試したら「まとめて消す」を押してください' : 'テスト家族はもう入っています';\n}\n\n/** テスト家族と、その子・家族にかかわる行（当番・エントリー・休み・記録・手続きなど）をまとめて消す */\nfunction clearTestData_() {\n  const kidNames = testKidNames_();\n  let n = 0;\n  withLock_(() => {\n    Object.keys(SHEETS).forEach((k) => {\n      const def = SHEETS[k], h = def.headers;\n      const hit = (r) =>\n        (h.indexOf('userId') >= 0 && isTestUser_(r.userId)) ||\n        (h.indexOf('保護者userId') >= 0 && splitNames_(r['保護者userId']).some(isTestUser_)) ||\n        (h.indexOf('連絡者userId') >= 0 && isTestUser_(r['連絡者userId'])) ||\n        (h.indexOf('依頼家族ID') >= 0 && (isTestUser_(r['依頼家族ID']) || isTestUser_(r['代わり家族ID']))) ||\n        (h.indexOf('家族ID') >= 0 && isTestUser_(r['家族ID'])) ||\n        (h.indexOf('子ども') >= 0 && kidNames[r['子ども']]) ||\n        (h.indexOf('対象') >= 0 && kidNames[String(r['対象'] || '').split('|')[0]]);\n      readRows_(def).filter(hit).forEach((r) => { clearRow_(def, r); n++; });\n    });\n  });\n  return 'テスト家族と、かかわるデータ ' + n + '件を消しました';\n}\n\n/** 役員が、テスト家族としてポータルを見る（その家族のキーを返す） */\nfunction testLoginAction_(ctx, p) {\n  if (!isTestUser_(p.id)) throw new Error('テスト家族だけ切りかえられます。');\n  const f = readRows_(SHEETS.FAMILIES).find((x) => x.userId === p.id);\n  if (!f) throw new Error('テスト家族がいません。先に「テスト家族を入れる」を押してください。');\n  return { key: f['ポータルキー'], name: f['表示名'] };\n}\n","Util.gs":"const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];\n\nfunction fmt_(date, pattern) {\n  return Utilities.formatDate(date, CONFIG.TIMEZONE, pattern);\n}\n\nfunction today_() {\n  return fmt_(new Date(), 'yyyy-MM-dd');\n}\n\nfunction now_() {\n  return fmt_(new Date(), 'yyyy-MM-dd HH:mm:ss');\n}\n\n/** 'yyyy-MM-dd' の日付文字列に n 日足す */\nfunction addDays_(dateStr, n) {\n  const p = dateStr.split('-').map(Number);\n  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));\n  return d.toISOString().slice(0, 10);\n}\n\n/** '2026-10-18' → '10/18(日)' */\nfunction formatDate_(dateStr) {\n  const p = dateStr.split('-').map(Number);\n  const wd = WEEKDAYS[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()];\n  return p[1] + '/' + p[2] + '(' + wd + ')';\n}\n\n/** 予定の日時を「10/18(日) 9:00〜12:00」の形にする */\nfunction formatWhen_(ev) {\n  let s = formatDate_(ev['日付']);\n  if (ev['開始'] && ev['開始'] !== '終日') {\n    s += ' ' + ev['開始'].replace(/^0/, '');\n    if (ev['終了']) s += '〜' + ev['終了'].replace(/^0/, '');\n  }\n  return s;\n}\n\n/** 全角英数字・記号・スペースを半角にする */\nfunction toHalfWidth_(s) {\n  return String(s)\n    .replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))\n    .replace(/　/g, ' ');\n}\n\n/** 「太郎 花子」「太郎、花子」などを名前の配列にする */\nfunction splitNames_(s) {\n  return String(s || '')\n    .split(/[\\s,、，・]+/)\n    .map((x) => x.trim())\n    .filter(Boolean);\n}\n\n/** 'a=att&e=xxx&s=yes' → { a: 'att', e: 'xxx', s: 'yes' } */\nfunction parseQuery_(data) {\n  const out = {};\n  String(data || '').split('&').forEach((pair) => {\n    if (!pair) return;\n    const i = pair.indexOf('=');\n    const k = i < 0 ? pair : pair.slice(0, i);\n    const v = i < 0 ? '' : pair.slice(i + 1);\n    out[decodeURIComponent(k)] = decodeURIComponent(v);\n  });\n  return out;\n}\n\nfunction buildQuery_(obj) {\n  return Object.keys(obj)\n    .map((k) => encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]))\n    .join('&');\n}\n\nfunction md5Hex_(s) {\n  return Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, s, Utilities.Charset.UTF_8)\n    .map((b) => ('0' + (b & 0xff).toString(16)).slice(-2))\n    .join('');\n}\n\n/** ポータルの個人リンク用のキー（英数字32文字） */\nfunction randomKey_() {\n  return (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '').slice(0, 32);\n}\n\n/**\n * 「たろう 3年 はなこ 1年」「たろう3年、はなこ」などを子どもの一覧にする。学年は省略できる。\n * @return {{name: string, grade: number}[]}\n */\nfunction parseChildrenArgs_(s) {\n  const out = [];\n  splitNames_(toHalfWidth_(s)).forEach((token) => {\n    const onlyGrade = token.match(/^([1-6])年?生?$/);\n    if (onlyGrade) {\n      if (out.length && !out[out.length - 1].grade) out[out.length - 1].grade = Number(onlyGrade[1]);\n      return;\n    }\n    const withGrade = token.match(/^(.+?)[(（]?([1-6])年生?[)）]?$/);\n    if (withGrade) out.push({ name: withGrade[1], grade: Number(withGrade[2]) });\n    else out.push({ name: token, grade: 0 });\n  });\n  return out;\n}\n","Videos.gs":"/**\n * 参考動画：トレーニングの参考になる動画のリンク（YouTube など）を、クラブのみんなで集める。\n * だれでも足せる。消せるのは足した人と役員。目標の「やること」に動画を付けると、今日やることから開ける。\n */\n\nconst VIDEO_KINDS = ['走り方', 'スタート', 'ダッシュ', '跳躍', '投てき', '筋トレ・体幹', 'ストレッチ', 'なわとび', 'その他'];\n\n/** YouTube の動画ID（watch?v= / youtu.be / shorts / live / embed）。なければ空 */\nfunction youtubeId_(url) {\n  const m = String(url || '').match(/(?:youtube\\.com\\/(?:watch\\?(?:.*&)?v=|shorts\\/|live\\/|embed\\/)|youtu\\.be\\/)([A-Za-z0-9_-]{11})/);\n  return m ? m[1] : '';\n}\n\nfunction videosFor_(ctx) {\n  return readRows_(SHEETS.VIDEOS).filter((v) => v.id && v.URL).reverse().map((v) => ({ id: v.id, url: v.URL, yt: youtubeId_(v.URL), title: v['タイトル'], kind: v['種類'], memo: v['メモ'], by: v['追加者'], mine: v.userId === ctx.userId, at: String(v['日時']).slice(0, 10) }));\n}\n\nfunction addVideoAction_(ctx, p) {\n  const url = String(p.url || '').trim().replace(/\\s.*$/, '');\n  if (!/^https?:\\/\\/[^\\s]+$/.test(url)) throw new Error('動画のリンク（https:// から始まるURL）を貼ってください。');\n  if (readRows_(SHEETS.VIDEOS).some((v) => v.id && (v.URL === url || (youtubeId_(url) && youtubeId_(v.URL) === youtubeId_(url))))) throw new Error('この動画はもう入っています。');\n  let title = String(p.title || '').trim().slice(0, 80);\n  if (!title && youtubeId_(url)) {\n    // YouTube の題名を取ってくる（取れなければ「YouTube の動画」）\n    try {\n      const res = UrlFetchApp.fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url), { muteHttpExceptions: true });\n      if (res.getResponseCode() === 200) title = String(JSON.parse(res.getContentText()).title || '').slice(0, 80);\n    } catch (err) { console.warn(err); }\n  }\n  withLock_(() => appendRow_(SHEETS.VIDEOS, {\n    id: randomKey_().slice(0, 10), URL: url.slice(0, 300), 'タイトル': title || (youtubeId_(url) ? 'YouTube の動画' : '参考動画'),\n    '種類': VIDEO_KINDS.indexOf(p.kind) >= 0 ? p.kind : 'その他', 'メモ': String(p.memo || '').slice(0, 200), '追加者': ctx.name, userId: ctx.userId, '日時': now_(),\n  }));\n  return '参考動画を足しました' + (title ? '：' + title : '');\n}\n\nfunction deleteVideoAction_(ctx, p) {\n  withLock_(() => {\n    const v = readRows_(SHEETS.VIDEOS).find((x) => x.id && x.id === p.id);\n    if (!v) throw new Error('動画が見つかりません。');\n    if (v.userId !== ctx.userId && !ctx.admin) throw new Error('消せるのは、足した人と役員です。');\n    clearRow_(SHEETS.VIDEOS, v);\n  });\n  return '参考動画を消しました';\n}\n"};
