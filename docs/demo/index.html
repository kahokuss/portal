 [];\n  tokens.forEach((t) => {\n    const k = u.kids.find((c) => c.name === t || c.name.replace(/[\\s　]/g, '').indexOf(t) >= 0);\n    if (k) { child = k.name; return; }\n    let m;\n    if ((m = t.match(/^(\\d+(?:\\.\\d+)?)(km|キロ)$/i))) { km = m[1]; return; }\n    if ((m = t.match(/^(\\d+)(分|min)$/))) { min = m[1]; return; }\n    if ((m = t.match(/^(\\d+)(回|本|周)$/))) { count = m[1]; return; }\n    if (!kind && BOT_TRAIN_KINDS.indexOf(t) >= 0) { kind = t; return; }\n    if (!kind && /^ラン|^走/.test(t)) { kind = 'ランニング'; return; }\n    memo.push(t);\n  });\n  if (!tokens.length) return askTrainKid_(ev, u);\n  if (!kind || (!km && !min && !count)) return askTrainKind_(ev, u, child);\n  if (!child) return askTrainKid_(ev, u);\n  return saveTrainingBot_(ev, child, { kind: kind, km: km, min: min, count: count, memo: memo.join(' ') });\n}\n\nfunction askTrainKid_(ev, u) {\n  if (u.kids.length === 1) return askTrainKind_(ev, u, u.kids[0].name);\n  respond_(ev, [Object.assign(text_('🏃 だれの自主トレですか？'), { quickReply: quickPb_(u.kids.map((k) => [short_(k.name), { a: 'trc', c: k.name }, k.name])) })]);\n}\nfunction askTrainKind_(ev, u, child) {\n  respond_(ev, [Object.assign(text_('🏃 ' + child + 'の今日の自主トレ。何をしましたか？\\\\n（文字でも「自主トレ 縄跳び 350回」のように送れます）'),\n    { quickReply: quickPb_(BOT_TRAIN_KINDS.map((k) => [k, { a: 'trk', c: child, k: k }, k]).concat([['記録を見る', { a: 'trlog' }, '自主トレの記録']])) })]);\n}\nfunction askTrainAmount_(ev, child, kind) {\n  const list = BOT_TRAIN_AMOUNTS[kind] || ['10分', '20分', '30分'];\n  respond_(ev, [Object.assign(text_(child + '：' + kind + '。どれくらい？\\\\n（ほかの数は「自主トレ ' + kind + ' 25分」のように送ってください）'),\n    { quickReply: quickPb_(list.map((a) => [a, { a: 'trs', c: child, k: kind, v: a }, kind + ' ' + a])) })]);\n}\n/** 保存して、「昨日の分にする」「取り消す」「もう1つ」のボタン */\nfunction saveTrainingBot_(ev, child, p, date) {\n  const ctx = botCtx_(ev);\n  saveTrainingAction_(ctx, Object.assign({ child: child, date: date || today_() }, p));\n  const id = ctx.savedId, amt = [p.km && p.km + 'km', p.min && p.min + '分', p.count && p.count + (/ダッシュ|坂道/.test(p.kind) ? '本' : '回')].filter(Boolean).join(' ');\n  const st = trainWeek_(child);\n  respond_(ev, [Object.assign(text_('✅ ' + child + '：' + p.kind + ' ' + amt + ' を記録しました（' + formatDate_(date || today_()) + '）\\\\nこの7日：' + st), {\n    quickReply: quickPb_([['昨日の分にする', { a: 'trmv', id: id }, '昨日の分にする'], ['取り消す', { a: 'trdel', id: id }, '取り消す'], ['もう1つ記録', { a: 'trc', c: child }, '自主トレ'], ['記録を見る', { a: 'trlog' }, '自主トレの記録'], ['メニュー', 'メニュー']]),\n  })]);\n}\nfunction trainWeek_(child) {\n  const from = addDays_(today_(), -6), rows = readRows_(SHEETS.TRAINING).filter((t) => t.id && t['子ども'] === child && t['日付'] >= from);\n  const days = {}; rows.forEach((t) => (days[t['日付']] = true));\n  return Object.keys(days).length + '日・' + rows.length + '件';\n}\n/** 最近1週間の記録（Botは見る・取り消すまで。直すのはポータルで） */\nfunction showTrainingLog_(ev, u) {\n  const names = u.kids.map((k) => k.name), from = addDays_(today_(), -6);\n  const rows = readRows_(SHEETS.TRAINING).filter((t) => t.id && names.indexOf(t['子ども']) >= 0 && t['日付'] >= from).sort((a, b) => (a['日付'] < b['日付'] ? 1 : -1));\n  const lines = ['🏃 この1週間の自主トレ'];\n  if (!rows.length) lines.push('まだ記録はありません。');\n  rows.slice(0, 15).forEach((t) => lines.push(formatDate_(t['日付']) + ' ' + (u.kids.length > 1 ? t['子ども'] + '：' : '') + t['種類'] + ' ' + [t['距離km'] && t['距離km'] + 'km', t['時間分'] && t['時間分'] + '分', t['回数'] && t['回数'] + '回'].filter(Boolean).join(' ')));\n  const mine = rows.filter((t) => !/^sv/.test(t.id))[0];\n  lines.push('', '前の日の記録を直すときは、ポータルの「目標・自主トレ」→「記録」→「最近の記録」の「直す」から。');\n  const q = [['記録する', { a: 'trc', c: u.kids.length === 1 ? u.kids[0].name : '' }, '自主トレ']];\n  if (mine) q.push(['最新を取り消す', { a: 'trdel', id: mine.id }, '最新の記録を取り消す']);\n  q.push({ type: 'uri', label: 'ポータルで直す', uri: portalUrl_() + (portalUrl_().indexOf('?') >= 0 ? '&' : '?') + 'tab=train&trv=log' });\n  respond_(ev, [Object.assign(text_(lines.join('\\\\n')), { quickReply: quickPb_(q) })]);\n}\nfunction moveTrainingBot_(ev, id) {\n  const ctx = botCtx_(ev);\n  const t = readRows_(SHEETS.TRAINING).find((x) => x.id === id);\n  if (!t) throw new Error('記録が見つかりません。');\n  const y = addDays_(today_(), -1);\n  saveTrainingAction_(ctx, { id: id, child: t['子ども'], date: y, kind: t['種類'], km: t['距離km'], min: t['時間分'], count: t['回数'], feel: t['調子'], memo: t['メモ'] });\n  respond_(ev, botMessages_(['📅 ' + t['子ども'] + '：' + t['種類'] + 'を ' + formatDate_(y) + ' の記録にしました。'], ['自主トレ', 'メニュー']));\n}\nfunction deleteTrainingBot_(ev, id) {\n  const ctx = botCtx_(ev);\n  const t = readRows_(SHEETS.TRAINING).find((x) => x.id === id);\n  deleteTrainingAction_(ctx, { id: id });\n  respond_(ev, botMessages_(['🗑 ' + (t ? formatDate_(t['日付']) + ' ' + t['子ども'] + '：' + t['種類'] + 'の' : '') + '記録を取り消しました。'], ['自主トレ', 'メニュー']));\n}\n\n/** メニューの分け方：まず目的（4つ）を選び、次にその中の操作を選ぶ */\nconst BOT_MENU = [\n  { id: 'see', icon: '📅', t: '予定を見る', d: 'カレンダー・これからの予定・今日', items: [\n    ['カレンダー', '月の表。日にちを押すとその日の予定'], ['予定', 'これからの予定（カードから休み・参加も）'], ['今日', '今日の予定。大会の日は時刻・招集'],\n  ] },\n  { id: 'send', icon: '🙋', t: '連絡・回答する', d: '休み・大会の参加・アンケート', items: [\n    ['休み', '休みの連絡（日付と理由を押すだけ）'], ['エントリー', '大会に出るか（種目は役員が登録）'], ['アンケート', 'ボタンで回答'],\n  ] },\n  { id: 'home', icon: '🏠', t: 'わが家のこと', d: '当番・集金・記録・自主トレ・ふりかえり', items: [\n    ['当番', 'わが家の当番と、これからの当番（役員は当番カレンダーも）'], ['集金', '払っていない集金・参加費'], ['記録', 'お子さんの記録'], ['自主トレ', '自主トレを記録する'], ['ふりかえり', '今週のやること・できた／できなかった'],\n  ] },\n  { id: 'club', icon: '📢', t: 'クラブの様子', d: '新着・お知らせ・出欠・写真', items: [\n    ['新着', 'わが家に関係することをまとめて'], ['お知らせ', '最近のお知らせ'], ['出欠', '次の練習で休む人'], ['写真', 'アルバム（ポータル）'],\n  ] },\n];\n\n/** 押せる1行（左にアイコン、名前と説明、右に ›）。文字が切れないよう横いっぱい */\nfunction menuRow_(icon, title, desc, action) {\n  return { type: 'box', layout: 'horizontal', spacing: 'md', paddingAll: '10px', backgroundColor: '#f3f6f7', cornerRadius: '10px', action: action, contents: [\n    icon ? txt_(icon, { size: 'xl', flex: 0, gravity: 'center', wrap: false }) : null,\n    { type: 'box', layout: 'vertical', flex: 1, contents: [txt_(title, { weight: 'bold', size: 'md' }), txt_(desc, { size: 'xs', color: C_SUB })] },\n    txt_('›', { size: 'xl', color: C_SUB, flex: 0, gravity: 'center', wrap: false }),\n  ].filter(Boolean) };\n}\n\n/** メニュー（1段目：目的を選ぶ） */\n/** 役員ページ（係ごとの今やること・道具）。GitHub Pages のポータルなら staff/ を直接 */\nfunction staffUrl_() {\n  if (CONFIG.PORTAL_URL) return String(CONFIG.PORTAL_URL).replace(/\\/?$/, '/') + 'staff/';\n  const u = portalUrl_();\n  return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'tab=admin';\n}\n\nfunction helpBubble_(admin) {\n  return flex_('メニュー', {\n    type: 'bubble',\n    body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '12px', contents: [\n      txt_('🏃 ' + CONFIG.CLUB_NAME + ' メニュー', { weight: 'bold', size: 'lg' }),\n      txt_('したいことを選んでください', { color: C_SUB, size: 'xs' }),\n    ].concat(BOT_MENU.map((g) => menuRow_(g.icon, g.t, g.d, pbAction_(g.t, { a: 'menu', g: g.id }, g.t)))).concat([\n      txt_('💻 タイムテーブル・記録・大会の案内・名簿など、くわしい入力はポータルで', { size: 'xs', color: C_SUB, margin: 'md' }),\n      btn_(uriAction_('ポータルを開く', portalUrl_()), 'primary', C_RACE),\n    ]).concat(admin ? [btn_(uriAction_('🛠 役員ページを開く', staffUrl_()), 'secondary')] : []) },\n  });\n}\n\n/** メニュー（2段目：その中の操作） */\nfunction subMenuBubble_(id) {\n  const g = BOT_MENU.find((x) => x.id === id) || BOT_MENU[0];\n  return flex_(g.t, {\n    type: 'bubble',\n    body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '12px', contents: [\n      txt_(g.icon + ' ' + g.t, { weight: 'bold', size: 'lg' }),\n    ].concat(g.items.map((x) => menuRow_('', x[0], x[1], { type: 'message', label: x[0], text: x[0] }))).concat([\n      { type: 'text', text: '‹ メニューにもどる', size: 'sm', color: C_PRAC, margin: 'md', action: pbAction_('メニュー', { a: 'menu' }, 'メニュー') },\n    ]) },\n  });\n}\n","Calendar.gs":"/**\n * カレンダーの予定に対応するキー。\n * 繰り返し予定は各回が同じ ID を持つので日付を足して区別する。\n */\nfunction eventKey_(calEvent) {\n  let base = calEvent.getId();\n  if (calEvent.isRecurringEvent()) base += '|' + fmt_(calEvent.getStartTime(), 'yyyy-MM-dd');\n  return md5Hex_(base).slice(0, 12);\n}\n\nfunction calendar_() {\n  const calendar = CalendarApp.getCalendarById(requireProp_('CALENDAR_ID'));\n  if (!calendar) throw new Error('カレンダーが見つかりません。CALENDAR_ID と共有設定を確認してください');\n  return calendar;\n}\n\n/** 予定名から種別を判断する */\nfunction guessType_(title) {\n  return CONFIG.RACE_KEYWORDS.test(title) ? '大会' : '練習';\n}\n\nfunction calEventToRow_(ce) {\n  const allDay = ce.isAllDayEvent();\n  return {\n    eventKey: eventKey_(ce),\n    '日付': fmt_(allDay ? ce.getAllDayStartDate() : ce.getStartTime(), 'yyyy-MM-dd'),\n    '開始': allDay ? '終日' : fmt_(ce.getStartTime(), 'HH:mm'),\n    '終了': allDay ? '' : fmt_(ce.getEndTime(), 'HH:mm'),\n    'タイトル': ce.getTitle(),\n    '場所': ce.getLocation(),\n    'カレンダーID': ce.getId(),\n  };\n}\n\nconst EVENT_FIELDS = ['日付', '開始', '終了', 'タイトル', '場所'];\n\nfunction syncRange_() {\n  const today = today_();\n  const first = addDays_(today, -CONFIG.SYNC_DAYS_BEFORE);\n  const last = addDays_(today, CONFIG.SYNC_DAYS_AHEAD);\n  return { first: first, last: last, start: new Date(first + 'T00:00:00+09:00'), end: new Date(addDays_(last, 1) + 'T00:00:00+09:00') };\n}\n\n/** Google カレンダーの予定を「予定」シートに取り込む */\nfunction syncCalendar_() {\n  const range = syncRange_();\n  return withLock_(() => {\n    const rows = readRows_(SHEETS.EVENTS);\n    const byKey = {};\n    rows.forEach((r) => (byKey[r.eventKey] = r));\n    const seen = {};\n\n    calendar_().getEvents(range.start, range.end).forEach((ce) => {\n      const data = calEventToRow_(ce);\n      seen[data.eventKey] = true;\n      const row = byKey[data.eventKey];\n      if (!row) {\n        appendRow_(SHEETS.EVENTS, Object.assign(data, { '種別': guessType_(data['タイトル']), '状態': '予定', '更新日時': now_() }));\n        return;\n      }\n      const changed = EVENT_FIELDS.some((f) => row[f] !== data[f]);\n      if (!changed && row['状態'] !== '中止') return;\n      Object.assign(row, data, { '状態': '予定', '更新日時': now_() });\n      if (!row['種別']) row['種別'] = guessType_(row['タイトル']);\n      updateRow_(SHEETS.EVENTS, row);\n    });\n\n    // 期間内なのにカレンダーから消えた予定は中止扱い\n    rows.forEach((r) => {\n      if (seen[r.eventKey] || r['状態'] === '中止') return;\n      if (r['日付'] < range.first || r['日付'] > range.last) return;\n      r['状態'] = '中止';\n      r['更新日時'] = now_();\n      updateRow_(SHEETS.EVENTS, r);\n    });\n    setProp_('LAST_SYNC', String(Date.now()));\n  });\n}\n\n/** 前回の同期から時間がたっていればカレンダーを読み直す */\nfunction syncIfStale_() {\n  const last = Number(prop_('LAST_SYNC') || 0);\n  if (Date.now() - last < CONFIG.SYNC_INTERVAL_MINUTES * 60000) return;\n  importScheduleSafely_();\n  try {\n    syncCalendar_();\n  } catch (err) {\n    console.error(err && err.stack ? err.stack : err);\n  }\n}\n\n/** カレンダーの予定から「予定」シートの行を作る・直す。type を渡すと種別も決める */\nfunction upsertEventRow_(ce, type) {\n  const data = calEventToRow_(ce);\n  const row = findEvent_(data.eventKey);\n  if (row) {\n    Object.assign(row, data, { '状態': '予定', '更新日時': now_() });\n    if (type) row['種別'] = type;\n    updateRow_(SHEETS.EVENTS, row);\n    return row;\n  }\n  return appendRow_(SHEETS.EVENTS, Object.assign(data, { '種別': type || guessType_(data['タイトル']), '状態': '予定', '更新日時': now_() }));\n}\n\nfunction timeOn_(date, hhmm) {\n  return new Date(date + 'T' + ('0' + hhmm).slice(-5) + ':00+09:00');\n}\n\n/**\n * 予定をカレンダーに作る。start が空なら終日の予定。\n * @return {CalendarEvent}\n */\nfunction createCalEvent_(o) {\n  const cal = calendar_();\n  const opt = { location: o.place || '' };\n  if (!o.start) return cal.createAllDayEvent(o.title, new Date(o.date + 'T00:00:00+09:00'), opt);\n  return cal.createEvent(o.title, timeOn_(o.date, o.start), timeOn_(o.date, o.end || o.start), opt);\n}\n\n/** カレンダーの予定を o の内容に直す */\nfunction updateCalEvent_(ce, o) {\n  ce.setTitle(o.title);\n  ce.setLocation(o.place || '');\n  if (!o.start) ce.setAllDayDate(new Date(o.date + 'T00:00:00+09:00'));\n  else ce.setTime(timeOn_(o.date, o.start), timeOn_(o.date, o.end || o.start));\n}\n\n/** 「予定」シートの行に対応するカレンダーの予定（繰り返し予定は直せないので null） */\nfunction editableCalEvent_(row) {\n  const ce = row && row['カレンダーID'] ? calendar_().getEventById(row['カレンダーID']) : null;\n  if (!ce) return null;\n  if (ce.isRecurringEvent()) throw new Error('この予定はGoogleカレンダーの「繰り返し予定」なので、カレンダーのほうで直してください。');\n  return ce;\n}\n\n/**\n * ポータルで作った・直した大会をカレンダーにも反映し、「予定」シートの行を返す。\n * 大会はカレンダーでは終日の予定にする（集合時刻などはポータル側で持つ）。\n */\nfunction upsertRaceEvent_(eventKey, title, date, place) {\n  const cal = calendar_();\n  const d = new Date(date + 'T00:00:00+09:00');\n  let row = eventKey ? findEvent_(eventKey) : null;\n  if (row) {\n    const ce = cal.getEventById(row['カレンダーID']);\n    if (ce && !ce.isRecurringEvent()) {\n      ce.setTitle(title);\n      ce.setLocation(place || '');\n      ce.setAllDayDate(d);\n    }\n    Object.assign(row, { '日付': date, '開始': '終日', '終了': '', 'タイトル': title, '場所': place || '', '種別': '大会', '状態': '予定', '更新日時': now_() });\n    updateRow_(SHEETS.EVENTS, row);\n    return row;\n  }\n  const ce = cal.createAllDayEvent(title, d, { location: place || '' });\n  const data = calEventToRow_(ce);\n  return appendRow_(SHEETS.EVENTS, Object.assign(data, { '種別': '大会', '状態': '予定', '更新日時': now_() }));\n}\n\n/** 予定入力シートの反映（失敗してもポータルは開けるようにする） */\nfunction importScheduleSafely_() {\n  try {\n    importScheduleSheet_();\n  } catch (err) {\n    console.error(err && err.stack ? err.stack : err);\n  }\n}\n","Commands.gs":"/**\n * コマンドへの返事。1対1のトークでは、ふつうに返信する（無料）。\n * グループで送られた個人的なコマンドは、グループには出さず、送った人だけに1対1で届ける\n * （プッシュなので1通ぶん無料枠を使う。Botを友だち追加していない人には届かないので、そのときだけグループで案内する）。\n */\nfunction respond_(ev, messages) {\n  // 返事の下に、よく使うボタンを出す（押すとその言葉が送られる）\n  const last = messages[messages.length - 1];\n  if (last && !last.quickReply) last.quickReply = quickItems_(MAIN_QUICK);\n  if (!ev.privateAnswer) return reply_(ev.replyToken, messages);\n  try {\n    push_(ev.source.userId, messages);\n  } catch (err) {\n    console.warn('個別の返事に失敗: ' + err);\n    // 429 は、今月の無料の通数（プッシュ）を使い切ったとき。返信（リプライ）は無料なので、グループに案内だけ出す\n    const overQuota = / 429 /.test(String(err));\n    reply_(ev.replyToken, [text_(overQuota\n      ? '今月のBotの無料の通数を使い切ったため、グループからは個別にお返事できません。Botとの1対1のトークで送ってください（1対1なら無料でお返事できます）。'\n      : 'お返事は、送った人だけに届くようにしています。Bot「' + CONFIG.CLUB_NAME + '」を友だち追加して、1対1のトークで送ってください。')]);\n  }\n}\n\n/** 使い方の文章（CONFIG を使うので、ファイルの読み込み順に左右されないよう関数にする） */\nfunction helpText_() {\n  return [\n    '🏃 ' + CONFIG.CLUB_NAME + ' Botの使い方',\n    '下のボタンか、メニューから選べます。',\n    '',\n    '新着 … 次の練習・わが家の当番・エントリーの締切・お知らせなど、まとめて',\n    '今日 … 今日の予定（大会の日は、子どもの時刻・招集・ナンバー）',\n    'カレンダー … 月のカレンダー（日にちを押すと、その日の予定）',\n    '予定 … これからの予定（カードから休み・エントリーをそのまま押せます）',\n    '休み … 休みの連絡（例：休み 明日／休み たろう 10/20 体調不良）。「休み取消」で取り消し',\n    '当番 … わが家の当番と、これからの当番',\n    '出欠 … 次の練習で休む人',\n    'エントリー … 大会のエントリーの状況',\n    'アンケート … 答えていないアンケートにボタンで回答',\n    '集金 … わが家の払っていない集金・参加費',\n    'お知らせ … 最近のお知らせ',\n    '自主トレ … 自主トレを記録（例：自主トレ ランニング 3km 20分）',\n    'ポータル … 予定・大会のエントリー・休みの連絡ができるページのリンク（グループのメンバーだけが見られます）',\n    '登録 名前 学年 … お子さんを登録（例：登録 山田たろう 3年 山田はなこ 1年）。ポータルの「わが家」からもできます',\n    '結果 種目 記録 … レース結果を記録（例：結果 100m 15.2秒）',\n    '記録 … お子さんの記録一覧',\n    '写真 … アルバム（ポータル）のリンク',\n    '',\n    '📷 グループに送った写真は自動で保存され、ポータルの「写真」で大会・練習ごとに見られます。',\n    '🔒 Botの返事は、グループで送っても、送った人にだけ届きます（Botを友だち追加してください）。Botとの1対1のトークで送るのがおすすめです。',\n  ].join('\\n');\n}\n\n/**\n * 1語目をコマンドとして解釈する。普段の会話に反応しないよう、\n * 1語目がコマンド名と完全に一致したときだけ反応する。\n * @return {{name: string, args: string}|null}\n */\nfunction parseCommand_(text) {\n  const m = String(text).trim().match(/^(\\S+)(?:\\s+([\\s\\S]*))?$/);\n  if (!m) return null;\n  const word = toHalfWidth_(m[1]).toLowerCase();\n  const aliases = {\n    'ヘルプ': 'help', '使い方': 'help', 'help': 'help',\n    '登録': 'register',\n    'ポータル': 'portal', 'portal': 'portal',\n    '役員': 'staff', '役員ページ': 'staff', '管理': 'staff', '役員サイト': 'staff',\n    '新着': 'news', '確認': 'news', 'お知らせ': 'notices', 'メニュー': 'help', 'もっと': 'help',\n    'カレンダー': 'calendar', '月': 'calendar', 'アンケート': 'polls', '集金': 'fees', '自主トレ': 'training', 'トレーニング': 'training', 'ふりかえり': 'review', '振り返り': 'review',\n    '今日': 'today', 'きょう': 'today',\n    '予定': 'schedule', '次': 'schedule', 'スケジュール': 'schedule',\n    '休み': 'absence', '欠席': 'absence', 'やすみ': 'absence',\n    '休み取消': 'absenceCancel', '取消': 'absenceCancel', '取り消し': 'absenceCancel',\n    '当番': 'duty',\n    '当番カレンダー': 'dutyCal', '輪番': 'dutyCal', '当番表': 'dutyCal',\n    '出欠': 'attendance',\n    'エントリー': 'entries',\n    '結果': 'result',\n    '記録': 'records',\n    '写真': 'photos', 'アルバム': 'photos',\n  };\n  const name = aliases[word];\n  if (!name) return null;\n  return { name: name, args: (m[2] || '').trim() };\n}\n\n/** グループで送られても、みんなに見せる返事。いまはなし（Botの返事はすべて、送った人にだけ届ける） */\nconst PUBLIC_COMMANDS = [];\n\n/** グループで「ダウン入ります」「ダウンに入りました」などと送られたか（返事はしない） */\nconst DOWN_PATTERN = /^(?:今から|いまから)?(?:クール)?ダウン(?:です|でーす|になります|します|しま|中|に入|入|はい|開始|始|スタート)/;\n\nfunction handleText_(ev) {\n  if (ev.source.type === 'group' && DOWN_PATTERN.test(String(ev.message.text).trim())) {\n    // 保護者へのお知らせは、送った人のメッセージそのもの（通数はかからない）。Botは時刻を記録するだけ\n    recordDown_(new Date(ev.timestamp), getDisplayName_(ev.source));\n    return;\n  }\n  // 練習の変更の連絡（「次の木曜日は16時50分から競技場で練習します」など）は、記録だけして返事はしない\n  // 大会の日の「場所を取りました」は、その大会の陣地（集合場所）として記録する（返事はしない）\n  if (ev.source.type === 'group' && !parseCommand_(ev.message.text) && recordJinchi_(ev)) return;\n  if (ev.source.type === 'group' && !parseCommand_(ev.message.text) && recordScheduleNotice_(ev)) return;\n  const cmd = parseCommand_(ev.message.text);\n  if (!cmd) return;\n  ev.privateAnswer = CONFIG.GROUP_PRIVATE_REPLY && ev.source.type === 'group' && PUBLIC_COMMANDS.indexOf(cmd.name) < 0;\n  switch (cmd.name) {\n    case 'help':\n      return respond_(ev, [helpBubble_(botUser_(ev).admin)]);\n    case 'calendar':\n      return handleCalendar_(ev, /^\\d{1,2}$/.test(toHalfWidth_(cmd.args)) ? botMonthOf_(Number(toHalfWidth_(cmd.args))) : '');\n    case 'notices':\n      return handleNotices_(ev);\n    case 'polls':\n      return handlePolls_(ev);\n    case 'fees':\n      return handleFees_(ev);\n    case 'training':\n      return handleTraining_(ev, cmd.args);\n    case 'review':\n      return handleReview_(ev);\n    case 'register':\n      return handleRegister_(ev, cmd.args);\n    case 'portal':\n      return handlePortal_(ev);\n    case 'staff':\n      return handleStaff_(ev);\n    case 'news':\n      return handleNews_(ev);\n    case 'today':\n      return handleToday_(ev);\n    case 'schedule':\n      return handleSchedule_(ev);\n    case 'absence':\n      return handleAbsence_(ev, cmd.args);\n    case 'absenceCancel':\n      return handleAbsenceCancel_(ev);\n    case 'duty':\n      return handleDuty_(ev);\n    case 'dutyCal':\n      return handleDutyCal_(ev);\n    case 'attendance':\n      return handleAttendance_(ev);\n    case 'entries':\n      return handleEntries_(ev);\n    case 'result':\n      return handleResultCommand_(ev, cmd.args);\n    case 'records':\n      return handleRecordsCommand_(ev, cmd.args);\n    case 'photos':\n      return respond_(ev, [text_('📷 アルバム（LINEグループのメンバーだけが見られます）\\n' + portalUrl_() + (portalUrl_().indexOf('?') >= 0 ? '&' : '?') + 'tab=album')]);\n  }\n}\n\nfunction handleRegister_(ev, args) {\n  const userId = ev.source.userId;\n  const list = parseChildrenArgs_(args);\n  if (!list.length) {\n    const children = childrenOf_(userId);\n    return respond_(ev, [\n      text_(\n        children.length\n          ? '登録中のお子さん：' + children.map((c) => c.name + (c.grade ? '（' + c.grade + '年）' : '')).join('、') + '\\n変更するときは「登録 名前 学年」を送り直すか、ポータルの「わが家」から直してください。'\n          : '「登録 山田たろう 3年」のように、お子さんの名前と学年を送ってください。'\n      ),\n    ]);\n  }\n  ensureFamily_(userId, getDisplayName_(ev.source));\n  saveChildren_(userId, list);\n  const noGrade = list.some((c) => !c.grade);\n  respond_(ev, [\n    text_('登録しました：' + list.map((c) => c.name + (c.grade ? '（' + c.grade + '年）' : '')).join('、') + (noGrade ? '\\n学年はポータルの「わが家」から入れられます。' : '') +\n      '\\nポータル：' + portalUrl_()),\n  ]);\n}\n\n/**\n * ポータルのリンクはみんな同じ。開くと LINE ログインがあり、グループのメンバーだけが入れるので、グループに出してよい。\n */\nfunction handlePortal_(ev) {\n  const admin = botUser_(ev).admin;\n  respond_(ev, [\n    text_('🏃 ' + CONFIG.CLUB_NAME + ' ポータル\\n' + portalUrl_() + '\\n\\n開くと「LINEでログイン」が出ます。' + CONFIG.CLUB_NAME + 'のLINEグループのメンバーだけが見られます。' + (admin ? '\\n\\n🛠 役員ページ\\n' + staffUrl_() : '')),\n  ]);\n}\n\n/** 「役員」「役員ページ」「管理」：役員には役員ページ（係ごと）を開くボタン */\nfunction handleStaff_(ev) {\n  if (!botUser_(ev).admin) return respond_(ev, botMessages_(['役員ページは役員だけが使えます。ポータルはこちら\\n' + portalUrl_()]));\n  respond_(ev, [flex_('役員ページ', { type: 'bubble', body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '12px', contents: [\n    txt_('🛠 役員ページ', { weight: 'bold', size: 'md' }),\n    txt_('係ごと（全体・当番・記録・大会・会計）の「今やること」と道具', { size: 'xs', color: C_SUB }),\n    btn_(uriAction_('役員ページを開く', staffUrl_()), 'primary', C_RACE),\n    btn_(uriAction_('🗓 当番カレンダー', dutyCalUrl_()), 'secondary'),\n  ] } })]);\n}\n","Config.gs":"/**\n * 設定値。クラブの運用に合わせてここを書き換えてください。\n *\n * 秘密の値（アクセストークンなど）はコードに書かず、\n * 「プロジェクトの設定 > スクリプト プロパティ」に保存します。\n *   LINE_CHANNEL_ACCESS_TOKEN … LINE Developers で発行したチャネルアクセストークン（必須）\n *   CALENDAR_ID               … 練習・大会を登録する Google カレンダーの ID（必須）\n *   SPREADSHEET_ID            … setup() が自動で作成・保存します\n *   PHOTO_FOLDER_ID           … setup() が自動で作成・保存します\n *   WEBHOOK_TOKEN             … setup() が自動で作成・保存します\n *   GROUP_ID                  … Bot をグループに招待すると自動で保存されます\n *   LINE_LOGIN_CHANNEL_ID     … LINE ログインのチャネル ID（ポータルのログインに使う・必須）\n *   LINE_LOGIN_CHANNEL_SECRET … LINE ログインのチャネルシークレット（必須）\n */\n/** サーバー（Apps Script）の版。tools/build-pages.js が dist/Code.gs を作るときに入れる（画面の版とくらべて、古いままなら知らせる） */\nconst SERVER_VERSION = 'dev';\n\nconst CONFIG = {\n  TIMEZONE: 'Asia/Tokyo',\n  CLUB_NAME: '河北SS',\n\n  // ポータルの画面の場所（GitHub Pages）。\n  // 空のときは Apps Script のウェブアプリの画面を使う\n  PORTAL_URL: 'https://kahokuss.github.io/portal/',\n\n  // カレンダーから取り込む範囲（今日から何日前〜何日先まで）\n  SYNC_DAYS_BEFORE: 60,\n  // 大会・記録会は、ポータルに3年分残す（去年・おととしの案内や時刻表・手続き・結果を見られるように）。練習は SYNC_DAYS_BEFORE まで\n  RACE_KEEP_DAYS: 1100,\n  SYNC_DAYS_AHEAD: 180,\n  // ポータルを開いたとき、前回の同期から何分たっていたらカレンダーを読み直すか\n  // （ふだんは15分ごとのトリガー syncJob が裏で読み直すので、開くときは待たせない）\n  SYNC_INTERVAL_MINUTES: 90,\n  // 毎日カレンダーを同期する時刻\n  DAILY_HOUR: 5,\n\n  // カレンダーの予定名にこの言葉が入っていたら「大会」として扱う（ポータルで変更もできます）\n  RACE_KEYWORDS: /大会|記録会|競技会|選手権|マラソン|駅伝|ロードレース|リレー|スプリント|クロスカントリー|クロカン|陸上競技|カップ|杯/,\n  // 大会を作るとき、エントリー締切を何日前に自動で入れるか\n  DEADLINE_DAYS_BEFORE: 10,\n  // 当番の仕事（練習のページの「当番」と、当番表の画面に出す）。体育館の使い方が変わったらここを直す\n  DUTY_GUIDE: [\n    '【当番】体育館のカギを、利用当日（火・木）に上井コミュニティセンターで借りる（土曜日の練習は、金曜日17時までに借りる）',\n    '【当番】使用日誌を書く',\n    '【当番】体育館を使わないときは、当日17時までに上井コミュニティセンターに連絡（土曜日の練習は金曜日17時まで）',\n    '【次回の当番】練習のあと体育館のカギをかけ、カギを翌日の午前中に返す（土曜日の練習のあとは月曜日の午前中）。むずかしいときは返せる人にお願いする',\n    '【次回の当番】最後に忘れ物などを確かめてから帰る',\n    'カギの借り受け・返却や、体育館を使わない連絡をしたら、LINEで報告する',\n    '上井コミュニティセンター：開館 9:00〜17:00',\n  ],\n\n  // 練習の予定をポータルで作るときの時間の候補（夏・秋〜春）\n  PRACTICE_TIMES: [['17:00', '18:30'], ['18:00', '19:30']],\n  // タイムテーブルで「アップ」を空にしたとき、招集の何分前を目安に出すか\n  WARM_UP_MINUTES_BEFORE_CALL: 30,\n  // 家族の招待番号の有効時間（時間。最大6）\n  INVITE_HOURS: 6,\n\n  // ポータルを使っている人が、まだクラブのLINEグループにいるかを何時間ごとに確かめ直すか\n  MEMBER_RECHECK_HOURS: 12,\n\n  // グループで送られたコマンドの返事を、グループに出さず、送った人にだけ1対1で返すか\n  GROUP_PRIVATE_REPLY: true,\n\n  // 休みの連絡を、役員にLINEで個別に知らせるか（1件につき役員の人数分の通数を使います）\n  // （通数を節約するため、いまは止めています。役員と当番は、Botの「新着」「出欠」とポータルの出欠で確認します）\n  ABSENCE_PUSH_TO_ADMINS: false,\n\n  // ヒヤリハットが書かれたら、役員にLINEで個別に知らせるか（1件につき役員の人数分の通数を使います）\n  NEAR_MISS_PUSH_TO_ADMINS: false,\n\n  // グループに投稿された写真をすべてドライブに保存するか\n  SAVE_ALL_PHOTOS: true,\n  // 写真を何日前までの予定に紐づけるか（大会の翌日に写真を上げる場合など）\n  PHOTO_EVENT_LOOKBACK_DAYS: 2,\n  // 結果を何日前までの予定に紐づけるか\n  RESULT_EVENT_LOOKBACK_DAYS: 7,\n};\n\n/** 大会の種目・持ち物・会場の候補（ポータルの入力補助に使います） */\nconst CHOICES = {\n  RACES: ['50m', '100m', '80mH', '800m', '1000m', '走幅跳', '走高跳', 'ジャベボール投', 'リレー', '1km', '2km', '駅伝'],\n  ITEMS: ['ユニフォーム', 'アスリートビブス', 'ゼッケン', 'スパイク', '弁当', '水筒', '帽子', 'レジャーシート', 'ベンチコート', 'タオル', '着替え', '雨具'],\n  TARGETS: ['全員', '3年生以上', '4年生以上', '希望者'],\n  ABSENCE_REASONS: ['体調不良', '家の都合', '学校行事', 'その他'],\n  // 大会の手続き（チェックリスト）の種類\n  TASKS: ['エントリー控え', '参加費支払い', 'プログラム', '受付', '招集', '進出', 'リレー予選', 'リレー決勝', 'レーン', 'ナンバー', 'リザルト', '陣地'],\n  // だれでも報告できる手続き（会場で助け合えるように）。ほかは役員と当番だけ\n  OPEN_TASKS: ['招集', '進出', 'レーン', 'ナンバー', 'リザルト', '陣地'],\n  ROUNDS: ['予選', '準決勝', '決勝', 'タイムレース'],\n  // 大会の申込方法と、資料の種類\n  APPLY_HOW: ['Web', 'メール', 'FAX', '郵送', '持参', '当日'],\n  DOC_KINDS: ['要項', '申込書', 'プログラム', '地図', 'リザルト', 'その他'],\n};\n\nfunction prop_(key) {\n  return PropertiesService.getScriptProperties().getProperty(key);\n}\n\nfunction setProp_(key, value) {\n  PropertiesService.getScriptProperties().setProperty(key, value);\n}\n\nfunction requireProp_(key) {\n  const value = prop_(key);\n  if (!value) throw new Error('スクリプト プロパティ ' + key + ' が設定されていません');\n  return value;\n}\n","Decorate.gs":"/**\n * スプレッドシートを、PCで直接さわりやすくする（setup() から呼ぶ）。\n *   ・書きかえてよい列の見出しは緑、自動で入る列は灰色。見出しにメモ\n *   ・ID などの裏方の列はかくす\n *   ・自動の列を書きかえようとすると、確認が出る（止めはしない）\n *   ・いちばん前に「使い方」シート、その次に「予定入力」シート\n */\nconst SHEET_GUIDE = {\n  '家族': { edit: ['役員', '休み通知'], hide: ['userId', 'ポータルキー', 'グループ確認', '家族ID', '新着確認'], note: '役員には「役員」に ○。休みの連絡をLINEで受け取る人は「休み通知」に ○（受け取らないなら ×）' },\n  '子ども': { edit: ['名前', '学年', '性別'], hide: ['保護者userId'], note: '4月に学年を1つ上げてください。性別は 男 か 女' },\n  '予定入力': { edit: ['日付', '開始', '終了', 'タイトル', '場所', '種別', '削除'], hide: ['カレンダーID', '反映内容'], note: '1行に1つの予定。書くとすぐGoogleカレンダーとポータルに入ります' },\n  '予定': { edit: [], hide: ['eventKey', 'カレンダーID'], note: 'Googleカレンダーから自動で取り込みます。直すときは「予定入力」シートかポータルで' },\n  '大会': { edit: ['種別', '対象', '参加費', '締切', '集合時刻', '集合場所', '種目', '持ち物', '注意', '主催', '申込期限', '申込方法', '支払期限', '受付', '要項URL'], hide: ['eventKey', '手続き期限'], note: '大会の案内。ポータルの「案内を直す」と同じ内容です' },\n  'エントリー': { edit: ['回答', '種目', '集金'], hide: ['eventKey'], note: '回答は 参加 / 不参加、集金は 済 か空欄' },\n  '休み': { edit: ['理由', 'メモ', '確認'], hide: ['id', '連絡者userId'], note: '' },\n  'お知らせ': { edit: ['タイトル', '本文'], hide: ['id', 'eventKey'], note: '' },\n  '写真': { edit: [], hide: ['eventKey', 'userId', 'ファイルID'], note: '写真を消すときは、ポータルの「消す」で' },\n  '結果': { edit: ['種目', '記録', '順位', 'ラウンド', 'メモ'], hide: ['eventKey', 'userId', 'id'], note: '' },\n  'タイムテーブル': { edit: ['開始', '種目', '区分', '組', '招集', 'アップ', 'メモ'], hide: ['id', 'eventKey'], note: '' },\n  '手続き': { edit: ['状態', 'メモ'], hide: ['id', 'eventKey', '写真ID'], note: '' },\n  '当番': { edit: [], hide: ['eventKey'], note: '当番はポータルの「当番表」か、予定のページで決めてください' },\n  'コメント': { edit: ['本文', '場所', '対策'], hide: ['id', 'eventKey', 'userId', '写真ID'], note: 'ヒヤリハットの一覧にも使えます（「種類」で絞り込み）' },\n  '資料': { edit: ['種類', '名前', 'URL'], hide: ['id', 'eventKey', 'ファイルID'], note: '' },\n  '履歴': { edit: [], hide: ['eventKey'], note: 'だれがいつ何をしたかの記録です' },\n  '会計': { edit: ['日付', '種類', '金額', '相手', '但し書き'], hide: ['id', 'eventKey', '写真ID'], note: '' },\n};\n\nconst GUIDE_ROWS = [\n  ['このスプレッドシートは、ポータルとLINE Botのデータです（クラブ共用アカウントのものです）'],\n  [''],\n  ['■ PCで書きかえてよいところ'],\n  ['・見出しが緑の列は、書きかえてOKです。灰色の列は自動で入るので、さわらないでください（さわろうとすると確認が出ます）'],\n  ['・「予定入力」シート：練習や大会を1行ずつ書くと、すぐGoogleカレンダーとポータルに入ります。コピー＆貼り付けでまとめて入れられます'],\n  ['　　日付：2026-10-20、10/20　　開始・終了：17:00、1700（空なら終日）　　種別：練習・大会・記録会　　削除：○ でカレンダーから消える'],\n  ['・「家族」シート：役員に ○、休みの連絡を受け取る人に ○'],\n  ['・「子ども」シート：名前の書き間違い、4月の学年の繰り上げ、男女'],\n  [''],\n  ['■ 注意'],\n  ['・見出し（1行目）の名前や、列の順番は変えないでください'],\n  ['・かくしてある列（ID など）は、つながりを保つためのものです。表示しても書きかえないでください'],\n  ['・日付は 2026-10-20、時刻は 17:00 の形で書くと確実です'],\n  ['・まちがえたら「ファイル → 変更履歴」で前の状態に戻せます'],\n  ['・写真や資料のファイルは、ドライブで直接消さず、ポータルの「消す」を使ってください'],\n];\n\nfunction decorateSheets_() {\n  const ss = ss_();\n  Object.keys(SHEETS).forEach((k) => {\n    const def = SHEETS[k];\n    const guide = SHEET_GUIDE[def.name];\n    if (!guide) return;\n    try {\n      decorateSheet_(sheet_(def), def, guide);\n    } catch (err) {\n      console.warn('シートの見た目を整えられませんでした: ' + def.name + ' ' + err);\n    }\n  });\n  try {\n    let g = ss.getSheetByName('使い方');\n    if (!g) g = ss.insertSheet('使い方');\n    g.getRange(1, 1, GUIDE_ROWS.length, 1).setValues(GUIDE_ROWS);\n    g.getRange(1, 1).setFontWeight('bold');\n    g.setColumnWidth(1, 900);\n    g.setTabColor('#2f6fae');\n    ss.setActiveSheet(g);\n    ss.moveActiveSheet(1);\n    const input = ss.getSheetByName(SHEETS.SCHEDULE_INPUT.name);\n    if (input) {\n      input.setTabColor('#237a55');\n      ss.setActiveSheet(input);\n      ss.moveActiveSheet(2);\n      const col = (h) => SHEETS.SCHEDULE_INPUT.headers.indexOf(h) + 1;\n      const rows = Math.max(1, input.getMaxRows() - 1);\n      input.getRange(2, col('種別'), rows, 1).setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(['練習', '大会', '記録会'], true).setAllowInvalid(true).build());\n      input.getRange(2, col('削除'), rows, 1).setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(['○'], true).setAllowInvalid(true).build());\n    }\n    ss.setActiveSheet(g);\n  } catch (err) {\n    console.warn('使い方シートを作れませんでした: ' + err);\n  }\n}\n\nfunction decorateSheet_(sh, def, guide) {\n  const n = def.headers.length;\n  def.headers.forEach((h, i) => {\n    const editable = guide.edit.indexOf(h) >= 0;\n    const cell = sh.getRange(1, i + 1);\n    cell.setBackground(editable ? '#d9ead3' : '#eeeeee');\n    cell.setNote(editable ? '書きかえてOK' + (i === 0 && guide.note ? '\\n' + guide.note : '') : '自動で入ります。さわらないでください' + (i === 0 && guide.note ? '\\n' + guide.note : ''));\n  });\n  if (guide.note) sh.getRange(1, 1).setNote(guide.note);\n  // 前に付けた「自動の列」の保護をはずしてから付け直す（確認が出るだけで、止めはしない）\n  sh.getProtections(SpreadsheetApp.ProtectionType.RANGE).forEach((p) => {\n    if (String(p.getDescription()).indexOf('自動で入る列') === 0) p.remove();\n  });\n  def.headers.forEach((h, i) => {\n    if (guide.edit.indexOf(h) >= 0) return;\n    sh.getRange(1, i + 1, sh.getMaxRows(), 1).protect().setDescription('自動で入る列：' + h).setWarningOnly(true);\n  });\n  sh.getRange(1, 1, 1, n).protect().setDescription('自動で入る列：見出し').setWarningOnly(true);\n  guide.hide.forEach((h) => {\n    const i = def.headers.indexOf(h);\n    if (i >= 0) sh.hideColumns(i + 1);\n  });\n}\n","Goals.gs":"/**\n * 目標管理：目標（いつまでに・何を）と、そのためにやること（曜日つきで毎週のスケジュールに）。\n * 種類は「自分」（家族が立てる）と「ミッション」（監督から言われた目標）。監督はスマホを使わないので、ミッションはふつう親がわが家の子の分を入れる。\n * 役員はまとめて何人にも入れられる。\n * 期間は 大会／年間／半年／3ヶ月／月。大きな目標は、途中目標（半年・3ヶ月・月）に分けられる。\n * 見られる人は自主トレと同じ（家族・「コーチに見せる」ならコーチ・「みんなに見せる」ならみんな）。ミッションは出した側（コーチ・役員）も見られる。\n */\n\nconst GOAL_PERIODS = ['大会', '年間', '半年', '3ヶ月', '月', '週'];\n\n/** ミッションをまとめて何人にも入れられる人：役員・コーチ・「練習」の係の家・その日（前後1日）の練習当番の家 */\nfunction canMission_(ctx) {\n  if (ctx.admin || ctx.coach) return true;\n  if (ctx.missionOk !== undefined) return ctx.missionOk;\n  const today = today_();\n  const role = readRows_(SHEETS.FAMILIES).some((f) => famIdOf_(f) === ctx.famId && /練習|コーチ/.test(f['係'] || ''));\n  const duty = readRows_(SHEETS.DUTIES).some((d) => d['家族ID'] === ctx.famId && d['種類'] === '練習' && d['日付'] >= addDays_(today, -1) && d['日付'] <= addDays_(today, 1));\n  ctx.missionOk = role || duty;\n  return ctx.missionOk;\n}\n\nfunction goalsFor_(ctx, children) {\n  const own = children.filter((c) => c.parents.indexOf(ctx.userId) >= 0).map((c) => c.name);\n  const see = own.concat(viewableTrainKids_(ctx));\n  const boss = canMission_(ctx);\n  const rows = readRows_(SHEETS.GOALS).filter((g) => g.id && (see.indexOf(g['子ども']) >= 0 || (boss && g['種類'] === 'ミッション')));\n  const ids = {};\n  rows.forEach((g) => (ids[g.id] = true));\n  const from = addDays_(today_(), -120);\n  return {\n    list: rows.map((g) => {\n      let acts = [];\n      try { acts = JSON.parse(g['やること'] || '[]'); } catch (err) { acts = []; }\n      return {\n        id: g.id, child: g['子ども'], kind: g['種類'] || '自分', period: g['期間'], title: g['タイトル'], race: g['種目'], target: g['目標記録'], start: g['開始記録'],\n        deadline: g['期限'], key: g.eventKey, actions: acts, parent: g['親id'], done: g['状態'] === '達成', doneAt: g['達成日'], note: g['ひとこと'], by: g['出した人'], at: String(g['日時']).slice(0, 10),\n        mine: own.indexOf(g['子ども']) >= 0, canEdit: own.indexOf(g['子ども']) >= 0 || boss,\n      };\n    }),\n    log: readRows_(SHEETS.GOAL_LOG).filter((x) => ids[x.goalId] && x['日付'] >= from).map((x) => ({ goal: x.goalId, act: Number(x['やること']) || 0, date: x['日付'] })),\n    missionKids: boss ? missionKidStats_(today_()) : {},\n  };\n}\n\nfunction cleanActions_(list) {\n  return (list || []).slice(0, 8).map((a) => {\n    const x = { t: String((a && a.t) || '').trim().slice(0, 40), days: ((a && a.days) || []).map(Number).filter((d, i, arr) => d >= 0 && d <= 6 && arr.indexOf(d) === i).sort() };\n    if (a && /^[A-Za-z0-9]{6,12}$/.test(a.v || '')) x.v = a.v; // 参考動画\n    return x;\n  }).filter((a) => a.t);\n}\n\n/** 目標を立てる・直す。ミッションは、家族ならわが家の子に、役員・コーチなら children（何人でも）にまとめて */\nfunction saveGoalAction_(ctx, p) {\n  const mission = p.kind === 'ミッション';\n  const own = myKidNames_(ctx);\n  const many = mission && canMission_(ctx) && (p.children || []).length;\n  const kids = (many ? p.children : [p.child]).filter(Boolean);\n  if (!kids.length) throw new Error('だれの目標かを選んでください。');\n  if (!many && own.indexOf(kids[0]) < 0 && !canMission_(ctx)) throw new Error('わが家のお子さんを選んでください。');\n  const title = String(p.title || '').trim().slice(0, 60);\n  if (!title) throw new Error('目標を書いてください（例：100mで14秒50を切る）。');\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(p.deadline || '')) throw new Error('いつまでの目標かを選んでください。');\n  const base = {\n    '種類': mission ? 'ミッション' : '自分', '期間': GOAL_PERIODS.indexOf(p.period) >= 0 ? p.period : '月', 'タイトル': title,\n    '種目': String(p.race || '').trim().slice(0, 30), '目標記録': String(p.target || '').trim().slice(0, 20), '期限': p.deadline, eventKey: String(p.key || '').slice(0, 40),\n    'やること': JSON.stringify(cleanActions_(p.actions)), '親id': String(p.parent || '').slice(0, 20), 'ひとこと': String(p.note || '').slice(0, 200), '更新日時': now_(),\n    '出した人': mission ? String(p.from || '監督').trim().slice(0, 20) || '監督' : '',\n  };\n  let n = 0;\n  withLock_(() => {\n    if (p.id) {\n      const g = readRows_(SHEETS.GOALS).find((x) => x.id === p.id);\n      if (!g) throw new Error('目標が見つかりません。');\n      if (own.indexOf(g['子ども']) < 0 && !canMission_(ctx)) throw new Error('この目標は直せません。');\n      Object.assign(g, base, { '種類': g['種類'] });\n      updateRow_(SHEETS.GOALS, g);\n      n = 1;\n      return;\n    }\n    kids.forEach((child) => {\n      appendRow_(SHEETS.GOALS, Object.assign({ id: randomKey_().slice(0, 10), '子ども': child, '開始記録': String(p.startRecords && p.startRecords[child] || p.start || '').slice(0, 20), '状態': '', userId: ctx.userId, '日時': now_() }, base));\n      n++;\n    });\n  });\n  return p.id ? '目標を直しました' : mission ? (n > 1 ? n + '人にミッションを入れました' : 'ミッションを入れました：' + title) : '目標を立てました：' + title;\n}\n\nfunction findGoalFor_(ctx, id, needEdit) {\n  const g = readRows_(SHEETS.GOALS).find((x) => x.id && x.id === id);\n  if (!g) throw new Error('目標が見つかりません。');\n  const own = myKidNames_(ctx).indexOf(g['子ども']) >= 0;\n  const ok = own || canMission_(ctx);\n  if (!ok) throw new Error('この目標は操作できません。');\n  return g;\n}\n\nfunction deleteGoalAction_(ctx, p) {\n  withLock_(() => {\n    const g = findGoalFor_(ctx, p.id, true);\n    readRows_(SHEETS.GOALS).filter((x) => x['親id'] === g.id).forEach((x) => { x['親id'] = g['親id'] || ''; updateRow_(SHEETS.GOALS, x); });\n    clearRow_(SHEETS.GOALS, g);\n  });\n  return '目標を消しました';\n}\n\n/** 達成にする・もどす（家族もコーチも） */\nfunction setGoalDoneAction_(ctx, p) {\n  let t = '';\n  withLock_(() => {\n    const g = findGoalFor_(ctx, p.id, false);\n    g['状態'] = p.done ? '達成' : '';\n    g['達成日'] = p.done ? today_() : '';\n    g['更新日時'] = now_();\n    updateRow_(SHEETS.GOALS, g);\n    t = g['タイトル'];\n  });\n  return p.done ? '🎉 達成！' + t : '達成をもどしました';\n}\n\n/** やることの「できた」（日付ごと）。家族だけ */\nfunction checkGoalActionAction_(ctx, p) {\n  const date = /^\\d{4}-\\d{2}-\\d{2}$/.test(p.date || '') ? p.date : today_();\n  if (date > today_()) throw new Error('先の日はまだチェックできません。');\n  withLock_(() => {\n    const g = readRows_(SHEETS.GOALS).find((x) => x.id && x.id === p.id);\n    if (!g || myKidNames_(ctx).indexOf(g['子ども']) < 0) throw new Error('わが家の子の目標だけチェックできます。');\n    const idx = String(Number(p.act) || 0);\n    const row = readRows_(SHEETS.GOAL_LOG).find((x) => x.goalId === p.id && x['やること'] === idx && x['日付'] === date);\n    if (p.on && !row) appendRow_(SHEETS.GOAL_LOG, { goalId: p.id, 'やること': idx, '日付': date, '子ども': g['子ども'], userId: ctx.userId, '日時': now_() });\n    if (!p.on && row) clearRow_(SHEETS.GOAL_LOG, row);\n  });\n  return p.on ? 'できた！' : 'チェックを外しました';\n}\n\n/**\n * 大きな目標を途中目標に分ける。steps は画面で計算したもの：{deadline, target, title, unit, children: [...]}（入れ子にすると「近いほど細かく」）。\n * 記録の目標なら、今の記録から目標記録まで日にちに合わせて少しずつ近づく目標記録が入っている\n */\nfunction splitGoalAction_(ctx, p) {\n  const UNITS = ['半年', '3ヶ月', '月', '週'];\n  let n = 0;\n  withLock_(() => {\n    const g = findGoalFor_(ctx, p.id, true);\n    const make = (steps, parent, limit) => {\n      (steps || []).slice(0, 30).forEach((x) => {\n        const unit = x.unit || p.unit;\n        if (n >= 60 || !/^\\d{4}-\\d{2}-\\d{2}$/.test(x.deadline || '') || x.deadline > limit || UNITS.indexOf(unit) < 0) return;\n        const id = randomKey_().slice(0, 10);\n        appendRow_(SHEETS.GOALS, {\n          id: id, '子ども': g['子ども'], '種類': g['種類'], '期間': unit, 'タイトル': String(x.title || '').slice(0, 60) || g['タイトル'],\n          '種目': g['種目'], '目標記録': String(x.target || '').slice(0, 20), '開始記録': g['開始記録'], '期限': x.deadline, eventKey: '', 'やること': '[]', '親id': parent,\n          '状態': '', '達成日': '', 'ひとこと': '', '出した人': g['出した人'], userId: ctx.userId, '日時': now_(), '更新日時': now_(),\n        });\n        n++;\n        make(x.children, id, x.deadline);\n      });\n    };\n    make(p.steps, g.id, g['期限']);\n    if (!n) throw new Error('期限までが短いので、分けられません。');\n  });\n  return n + 'つの途中目標をつくりました';\n}\n\n/** Bot用：今日やること（わが家の子の、期限前・未達成の目標のうち今日の曜日のもの） */\nfunction todayGoalActions_(kidNames, date) {\n  const wd = new Date(date + 'T00:00:00Z').getUTCDay();\n  const done = {};\n  readRows_(SHEETS.GOAL_LOG).filter((x) => x['日付'] === date).forEach((x) => (done[x.goalId + '|' + x['やること']] = true));\n  const out = [];\n  readRows_(SHEETS.GOALS).filter((g) => g.id && kidNames.indexOf(g['子ども']) >= 0 && g['状態'] !== '達成' && g['期限'] >= date).forEach((g) => {\n    let acts = [];\n    try { acts = JSON.parse(g['やること'] || '[]'); } catch (err) { acts = []; }\n    acts.forEach((a, i) => { if ((a.days || []).indexOf(wd) >= 0) out.push({ child: g['子ども'], goal: g['タイトル'], t: a.t, done: !!done[g.id + '|' + i], id: g.id, i: i }); });\n  });\n  return out;\n}\n\n// ---- 目標の様子（Botの「今日」・週のふりかえり・コーチの「止まっている子」で使う） ----\n\n/** '1:01.27' '14.50' '15.2秒' → 秒、'3m20' '3.20m' → m、'45回' → 回。読めなければ null（画面の markValue と同じ） */\nfunction markValueGs_(rec) {\n  const r = toHalfWidth_(String(rec || '')).replace(/\\s/g, '');\n  let m;\n  if ((m = r.match(/^(\\d+)m(\\d{1,2})$/))) return +m[1] + +m[2] / 100;\n  if ((m = r.match(/^(\\d+(?:\\.\\d+)?)m$/))) return +m[1];\n  if ((m = r.match(/^(\\d+)[:'分](\\d{1,2}(?:\\.\\d+)?)\"?秒?$/))) return +m[1] * 60 + +m[2];\n  if ((m = r.match(/^(\\d+(?:\\.\\d+)?)秒?$/))) return +m[1];\n  if ((m = r.match(/^(\\d+)回$/))) return +m[1];\n  return null;\n}\nfunction higherBetterGs_(race, sample) { return /跳|投|ボール/.test(race || '') || /回$/.test(sample || ''); }\nfunction fmtMarkGs_(v, race, sample) {\n  if (/回$/.test(sample || '')) return Math.round(v) + '回';\n  if (/跳|投|ボール/.test(race || '')) { let m = Math.floor(v), cm = Math.round((v - m) * 100); if (cm === 100) { m++; cm = 0; } return m + 'm' + ('0' + cm).slice(-2); }\n  if (v >= 60) { const mm = Math.floor(v / 60), ss = v - mm * 60; return mm + ':' + (ss < 10 ? '0' : '') + ss.toFixed(2); }\n  return v.toFixed(2);\n}\nfunction goalActs_(g) { try { return JSON.parse(g['やること'] || '[]'); } catch (err) { return []; } }\n\n/** 子どもの記録（日付つき）。種目は sameRaceGs_ でそろえる */\nfunction kidResults_(child) {\n  return readRows_(SHEETS.RESULTS).filter((x) => x['子ども'] === child && x['記録']).map((x) => ({ date: String(x['大会・練習'] || x['日時']).slice(0, 10), race: x['種目'], record: x['記録'] }));\n}\nfunction bestOf_(results, race, sample, until) {\n  let best = null;\n  results.forEach((r) => {\n    if (!sameRaceGs_(r.race, race) || (until && r.date > until)) return;\n    const v = markValueGs_(r.record);\n    if (v === null) return;\n    if (best === null || (higherBetterGs_(race, sample) ? v > best.v : v < best.v)) best = { v: v, record: r.record, date: r.date };\n  });\n  return best;\n}\n\n/** その子の目標の様子：連続日数・この7日・最後にできた日・やることがあるか・いちばん大きい目標とペース */\nfunction kidGoalStats_(child, today) {\n  const goals = readRows_(SHEETS.GOALS).filter((g) => g.id && g['子ども'] === child);\n  const logs = {};\n  let last = '';\n  readRows_(SHEETS.GOAL_LOG).filter((x) => x['子ども'] === child).forEach((x) => { logs[x.goalId + '|' + x['やること'] + '|' + x['日付']] = true; if (x['日付'] > last) last = x['日付']; });\n  const active = (g, date) => g['状態'] !== '達成' && g['期限'] >= date && String(g['日時']).slice(0, 10) <= date;\n  const todo = (date) => {\n    const wd = new Date(date + 'T00:00:00Z').getUTCDay(), out = [];\n    goals.filter((g) => active(g, date)).forEach((g) => goalActs_(g).forEach((a, i) => { if ((a.days || []).indexOf(wd) >= 0) out.push({ g: g, t: a.t, done: !!logs[g.id + '|' + i + '|' + date] }); }));\n    return out;\n  };\n  let streak = 0;\n  for (let n = 0; n < 60; n++) {\n    const list = todo(addDays_(today, -n));\n    if (!list.length) continue;\n    const all = list.every((x) => x.done);\n    if (n === 0 && !all) continue;\n    if (!all) break;\n    streak++;\n  }\n  let plan7 = 0, done7 = 0;\n  for (let n = 0; n < 7; n++) { const l = todo(addDays_(today, -n)); plan7 += l.length; done7 += l.filter((x) => x.done).length; }\n  const hasActs = goals.some((g) => active(g, today) && goalActs_(g).length);\n  // いちばん大きい目標（自分の目標を先に。期間の長い順）と、いま向かっている小さい目標\n  const tops = goals.filter((g) => active(g, today) && !(g['親id'] && goals.some((p) => p.id === g['親id']))).sort((a, b) => (a['種類'] === 'ミッション') - (b['種類'] === 'ミッション') || GOAL_PERIODS.indexOf(a['期間']) - GOAL_PERIODS.indexOf(b['期間']) || (a['期限'] < b['期限'] ? -1 : 1));\n  const hero = tops[0] || null;\n  let step = hero;\n  for (let k = 0; step && k < 6; k++) { const nx = goals.filter((g) => g['親id'] === step.id && active(g, today)).sort((a, b) => (a['期限'] < b['期限'] ? -1 : 1))[0]; if (!nx) break; step = nx; }\n  const pace = step ? goalPaceGs_(child, step.race ? step : hero, today) : null;\n  return { streak: streak, plan7: plan7, done7: done7, last: last, hasActs: hasActs, hero: hero, step: step, pace: pace, todo: todo };\n}\n\n/** 最近120日の記録の伸びから、期限の日の記録を予想（画面の goalPace と同じ考え方） */\nfunction goalPaceGs_(child, g, today) {\n  if (!g || !g['種目'] || markValueGs_(g['目標記録']) === null) return null;\n  const race = g['種目'], target = g['目標記録'], from = addDays_(today, -120), res = kidResults_(child);\n  const pts = {};\n  res.forEach((r) => {\n    if (!sameRaceGs_(r.race, race) || r.date < from) return;\n    const v = markValueGs_(r.record);\n    if (v === null) return;\n    if (pts[r.date] === undefined || (higherBetterGs_(race, target) ? v > pts[r.date] : v < pts[r.date])) pts[r.date] = v;\n  });\n  const ds = Object.keys(pts);\n  if (ds.length < 2) return null;\n  const day = (x) => Math.round((new Date(x + 'T00:00:00Z') - new Date(from + 'T00:00:00Z')) / 86400000);\n  const xs = ds.map(day), ys = ds.map((x) => pts[x]), n = xs.length;\n  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;\n  let sxx = 0, sxy = 0;\n  xs.forEach((x, i) => { sxx += (x - mx) * (x - mx); sxy += (x - mx) * (ys[i] - my); });\n  if (!sxx) return null;\n  const hb = higherBetterGs_(race, target), tv = markValueGs_(target);\n  let pred = my + (sxy / sxx) * (day(g['期限']) - mx);\n  const best = bestOf_(res, race, target);\n  if (best && (hb ? pred < best.v : pred > best.v)) pred = best.v;\n  const ok = hb ? pred >= tv : pred <= tv, gap = Math.abs(pred - tv);\n  return { at: g['期限'], race: race, pred: fmtMarkGs_(pred, race, target), ok: ok, gap: /跳|投|ボール/.test(race) ? Math.round(gap * 100) + 'cm' : /回$/.test(target) ? Math.round(gap) + '回' : gap.toFixed(2) + '秒' };\n}\n\n/** 週のはじめ（月曜） */\nfunction weekStart_(date) { const wd = new Date(date + 'T00:00:00Z').getUTCDay(); return addDays_(date, -((wd + 6) % 7)); }\n\n/** 週のふりかえりの文（Bot用）。月曜は先週、ほかの日は今週 */\nfunction weekReviewText_(child, today) {\n  const st = kidGoalStats_(child, today);\n  const mon = new Date(today + 'T00:00:00Z').getUTCDay() === 1 ? addDays_(weekStart_(today), -7) : weekStart_(today);\n  const end = addDays_(mon, 6), until = end < today ? end : today;\n  const acts = {};\n  for (let d = mon; d <= until; d = addDays_(d, 1)) st.todo(d).forEach((x) => { const a = acts[x.t] || (acts[x.t] = { p: 0, ok: 0 }); a.p++; if (x.done) a.ok++; });\n  const names = Object.keys(acts);\n  const lines = ['📅 ' + child + 'の' + (mon < weekStart_(today) ? '先週' : '今週') + 'のふりかえり（' + formatDate_(mon) + '〜' + formatDate_(end) + '）'];\n  if (!names.length) lines.push('この週の「やること」はありません。ポータルの「目標」で、やることと曜日を決めましょう。');\n  let p = 0, ok = 0;\n  names.forEach((t) => { p += acts[t].p; ok += acts[t].ok; lines.push((acts[t].ok === acts[t].p ? '◎ ' : acts[t].ok ? '○ ' : '✕ ') + t + '　' + acts[t].ok + '/' + acts[t].p); });\n  if (p) lines.push('できた ' + ok + '/' + p + '（' + Math.round(ok * 100 / p) + '%）' + (ok === p ? ' 🎉 パーフェクト！' : ok / p >= 0.7 ? ' よくがんばりました' : ' 来週はできる曜日に変えてみよう'));\n  // この週に出たベスト\n  const res = kidResults_(child), pbs = [];\n  res.filter((r) => r.date >= mon && r.date <= end).forEach((r) => {\n    const before = bestOf_(res.filter((x) => x.date < mon), r.race, r.record);\n    const v = markValueGs_(r.record);\n    if (v !== null && (!before || (higherBetterGs_(r.race, r.record) ? v > before.v : v < before.v)) && pbs.indexOf(r.race + ' ' + r.record) < 0) pbs.push(r.race + ' ' + r.record);\n  });\n  if (pbs.length) lines.push('🏅 ベスト更新：' + pbs.join('、'));\n  if (st.streak >= 2) lines.push('🔥 ' + st.streak + '日連続でできています');\n  return lines.join('\\n');\n}\n\n/** コーチ・役員用：ミッションの子ごとの、やることの様子（数だけ。中身は出さない） */\nfunction missionKidStats_(today) {\n  const kids = {};\n  readRows_(SHEETS.GOALS).filter((g) => g.id && g['種類'] === 'ミッション').forEach((g) => (kids[g['子ども']] = true));\n  const out = {};\n  Object.keys(kids).forEach((k) => { const s = kidGoalStats_(k, today); out[k] = { plan7: s.plan7, done7: s.done7, last: s.last, hasActs: s.hasActs, streak: s.streak }; });\n  return out;\n}\n","Line.gs":"const LINE_API = 'https://api.line.me/v2/bot';\nconst LINE_DATA_API = 'https://api-data.line.me/v2/bot';\n\nfunction lineFetch_(url, method, payload) {\n  const options = {\n    method: method,\n    headers: { Authorization: 'Bearer ' + requireProp_('LINE_CHANNEL_ACCESS_TOKEN') },\n    muteHttpExceptions: true,\n  };\n  if (payload) {\n    options.contentType = 'application/json';\n    options.payload = JSON.stringify(payload);\n  }\n  const res = UrlFetchApp.fetch(url, options);\n  const code = res.getResponseCode();\n  if (code >= 300) {\n    throw new Error('LINE API ' + code + ' ' + url + ': ' + res.getContentText());\n  }\n  return res;\n}\n\n/** 返信（無料・通数にカウントされない）。メッセージは1回5件まで */\nfunction reply_(replyToken, messages) {\n  if (!replyToken || !messages || !messages.length) return;\n  lineFetch_(LINE_API + '/message/reply', 'post', { replyToken: replyToken, messages: messages.slice(0, 5) });\n}\n\n/** プッシュ（無料枠の通数にカウントされる）。5件ずつ送る */\nfunction push_(to, messages) {\n  if (isTestUser_(to)) return; // テスト家族には送らない\n  for (let i = 0; i < messages.length; i += 5) {\n    lineFetch_(LINE_API + '/message/push', 'post', { to: to, messages: messages.slice(i, i + 5) });\n  }\n}\n\nfunction getMessageContent_(messageId) {\n  return lineFetch_(LINE_DATA_API + '/message/' + messageId + '/content', 'get').getBlob();\n}\n\n/** 送信者の LINE の表示名（取れなければ空文字） */\nfunction getDisplayName_(source) {\n  try {\n    let url;\n    if (source.type === 'group') {\n      url = LINE_API + '/group/' + source.groupId + '/member/' + source.userId;\n    } else if (source.type === 'room') {\n      url = LINE_API + '/room/' + source.roomId + '/member/' + source.userId;\n    } else {\n      url = LINE_API + '/profile/' + source.userId;\n    }\n    return JSON.parse(lineFetch_(url, 'get').getContentText()).displayName || '';\n  } catch (err) {\n    console.warn(err);\n    return '';\n  }\n}\n\n/** Botの LINE ID（@から始まる）。ポータルから「Botで開く」リンクを作るのに使う。1回だけ調べて覚える */\nfunction botBasicId_() {\n  const saved = prop_('BOT_BASIC_ID');\n  if (saved) return saved === '-' ? '' : saved;\n  try {\n    const id = JSON.parse(lineFetch_(LINE_API + '/info', 'get').getContentText()).basicId || '';\n    setProp_('BOT_BASIC_ID', id || '-');\n    return id;\n  } catch (err) {\n    console.warn(err);\n    return '';\n  }\n}\n\nfunction text_(t) {\n  return { type: 'text', text: String(t).slice(0, 5000) };\n}\n\n/**\n * 今月のメッセージ通数（無料枠）と、グループの人数。グループに送ると人数分の通数を使う。\n * 10分だけ覚えておく。取れなかった値は null\n */\nfunction pushQuota_() {\n  const cache = CacheService.getScriptCache();\n  const hit = cache.get('pushQuota');\n  if (hit) return JSON.parse(hit);\n  const get = (url) => {\n    try { return JSON.parse(lineFetch_(url, 'get').getContentText()); } catch (err) { console.warn(err); return null; }\n  };\n  const quota = get(LINE_API + '/message/quota');\n  const used = get(LINE_API + '/message/quota/consumption');\n  const groupId = prop_('GROUP_ID');\n  const members = groupId ? get(LINE_API + '/group/' + groupId + '/members/count') : null;\n  const limit = quota && quota.type === 'limited' ? Number(quota.value) : null;\n  const out = {\n    limit: limit,\n    used: used ? Number(used.totalUsage) : null,\n    remaining: limit !== null && used ? Math.max(0, limit - Number(used.totalUsage)) : null,\n    members: members ? Number(members.count) : null,\n  };\n  cache.put('pushQuota', JSON.stringify(out), 600);\n  return out;\n}\n","Login.gs":"/**\n * ポータルのログイン（LINEログイン）と、LINEグループのメンバー確認。\n *\n * 流れ：\n *   1. グループに貼った共通のリンク（Webアプリの URL）を開く\n *   2. 「LINEでログイン」→ LINE の画面で許可（LINEアプリ内ならほぼ自動）\n *   3. LINE から ?code=...&state=... 付きでこの Webアプリに戻ってくる\n *   4. code を ID トークンに替えて LINE のユーザー ID を確かめ、\n *      Bot が入っているクラブのグループのメンバーかどうかを Messaging API で確認する\n *   5. メンバーなら、その人用のキーを発行してポータルを表示する\n *\n * スクリプト プロパティ：\n *   LINE_LOGIN_CHANNEL_ID / LINE_LOGIN_CHANNEL_SECRET … LINE ログインのチャネル（Messaging API と同じプロバイダーに作る）\n */\nconst LINE_AUTH_URL = 'https://access.line.me/oauth2/v2.1/authorize';\nconst LINE_TOKEN_URL = 'https://api.line.me/oauth2/v2.1/token';\nconst LINE_VERIFY_URL = 'https://api.line.me/oauth2/v2.1/verify';\n\n/**\n * LINE ログイン画面への URL。state は使い捨てで10分だけ有効。\n * redirectUri はログイン後に戻る画面（GitHub Pages か、Apps Script のウェブアプリ）。\n */\nfunction loginUrl_(redirectUri) {\n  const state = randomKey_();\n  CacheService.getScriptCache().put('login:' + state, redirectUri, 600);\n  return LINE_AUTH_URL + '?' + buildQuery_({\n    response_type: 'code',\n    client_id: requireProp_('LINE_LOGIN_CHANNEL_ID'),\n    redirect_uri: redirectUri,\n    state: state,\n    scope: 'profile openid',\n  });\n}\n\nfunction postForm_(url, form) {\n  const res = UrlFetchApp.fetch(url, { method: 'post', payload: form, muteHttpExceptions: true });\n  const code = res.getResponseCode();\n  const body = JSON.parse(res.getContentText() || '{}');\n  if (code >= 300) throw new Error('LINEログインに失敗しました（' + code + ' ' + (body.error_description || body.error || '') + '）');\n  return body;\n}\n\n/**\n * LINE ログインから戻ってきたときの処理。\n * @return {{key: string}|{error: string}}\n */\nfunction handleLoginCallback_(code, state) {\n  const cache = CacheService.getScriptCache();\n  const redirectUri = state ? cache.get('login:' + state) : null;\n  if (!redirectUri) return { error: 'ログインの有効期限が切れました。もう一度「LINEでログイン」を押してください。' };\n  cache.remove('login:' + state);\n  let profile;\n  try {\n    const token = postForm_(LINE_TOKEN_URL, {\n      grant_type: 'authorization_code',\n      code: code,\n      redirect_uri: redirectUri,\n      client_id: requireProp_('LINE_LOGIN_CHANNEL_ID'),\n      client_secret: requireProp_('LINE_LOGIN_CHANNEL_SECRET'),\n    });\n    profile = postForm_(LINE_VERIFY_URL, { id_token: token.id_token, client_id: requireProp_('LINE_LOGIN_CHANNEL_ID') });\n  } catch (err) {\n    console.error(err);\n    return { error: 'LINEログインに失敗しました。もう一度お試しください。' };\n  }\n  const userId = profile.sub;\n  if (!userId) return { error: 'LINEのユーザーを確認できませんでした。' };\n  if (!isGroupMember_(userId)) {\n    return { error: CONFIG.CLUB_NAME + 'のLINEグループのメンバーだけが見られるページです。グループに入っているLINEアカウントでログインしてください。' };\n  }\n  const key = portalKeyFor_(userId, profile.name || '', false);\n  markMemberChecked_(userId);\n  return { key: key };\n}\n\n/** Bot が入っているクラブのグループに、この人がいるか */\nfunction isGroupMember_(userId) {\n  const groupId = requireProp_('GROUP_ID');\n  const res = UrlFetchApp.fetch(LINE_API + '/group/' + groupId + '/member/' + userId, {\n    method: 'get',\n    headers: { Authorization: 'Bearer ' + requireProp_('LINE_CHANNEL_ACCESS_TOKEN') },\n    muteHttpExceptions: true,\n  });\n  const code = res.getResponseCode();\n  if (code === 200) return true;\n  if (code === 404) return false;\n  throw new Error('グループのメンバー確認に失敗しました（' + code + '）');\n}\n\n/** Botが使っているグループの名前と人数（役員ページに出す）。1時間おぼえる */\nfunction groupInfo_() {\n  const id = prop_('GROUP_ID');\n  if (!id) return { name: '', count: 0, next: prop_('NEXT_GROUP') === '1' };\n  const cache = CacheService.getScriptCache();\n  const hit = cache.get('grpinfo');\n  let info = hit ? JSON.parse(hit) : null;\n  if (!info) {\n    info = { name: '', count: 0 };\n    try { info.name = JSON.parse(lineFetch_(LINE_API + '/group/' + id + '/summary', 'get').getContentText()).groupName || ''; } catch (e) { console.warn(e); }\n    try { info.count = JSON.parse(lineFetch_(LINE_API + '/group/' + id + '/members/count', 'get').getContentText()).count || 0; } catch (e) { console.warn(e); }\n    cache.put('grpinfo', JSON.stringify(info), 3600);\n  }\n  info.next = prop_('NEXT_GROUP') === '1';\n  return info;\n}\n\n/** 管理者だけ：次にBotを招待したグループを、クラブのグループに切りかえる（cancel で取り消し） */\nfunction switchGroupAction_(ctx, p) {\n  if (!ctx.owner) throw new Error('この操作は管理者だけができます。');\n  if (p.cancel) { PropertiesService.getScriptProperties().deleteProperty('NEXT_GROUP'); return '切りかえを取り消しました'; }\n  setProp_('NEXT_GROUP', '1');\n  return '切りかえの準備をしました。新しいグループにBotを招待すると、そのグループに切りかわります';\n}\n\nfunction markMemberChecked_(userId) {\n  withLock_(() => {\n    const f = findFamily_(userId);\n    if (!f) return;\n    f['グループ確認'] = now_();\n    updateRow_(SHEETS.FAMILIES, f);\n  });\n}\n\n/**\n * ポータルを使うたびに、ときどきグループのメンバーかを確かめ直す。\n * グループを抜けた人は使えなくなる。確認に失敗したとき（LINE 側の一時的なエラー）は通す。\n */\nfunction ensureMember_(family) {\n  if (isTestUser_(family.userId)) return; // テスト家族（親A〜E）は LINE に聞かない\n  const last = family['グループ確認'] ? new Date(family['グループ確認'].replace(' ', 'T') + '+09:00').getTime() : 0;\n  if (Date.now() - last < CONFIG.MEMBER_RECHECK_HOURS * 3600000) return;\n  let member;\n  try {\n    member = isGroupMember_(family.userId);\n  } catch (err) {\n    console.warn(err);\n    return;\n  }\n  if (!member) throw new Error(CONFIG.CLUB_NAME + 'のLINEグループのメンバーではないため、ポータルを使えません。');\n  markMemberChecked_(family.userId);\n}\n\n/** グループのメンバーにだけ出す共通のリンク */\nfunction portalUrl_() {\n  return CONFIG.PORTAL_URL || ScriptApp.getService().getUrl();\n}\n\n// ---- PCでのログイン（スマホに出した番号で入る） ----\n\n/**\n * スマホでログインしている人が、PCで使うための番号（6けた・5分・1回だけ）を出す。\n * PCで番号を入れると、その人としてログインできる（パスワードは使わない）\n */\nfunction pcCodeAction_(ctx) {\n  const cache = CacheService.getScriptCache();\n  let code = '';\n  for (let i = 0; i < 5 && !code; i++) {\n    const c = String(100000 + (parseInt(randomKey_().slice(0, 8), 16) % 900000));\n    if (!cache.get('pc:' + c)) code = c;\n  }\n  if (!code) throw new Error('もう一度お試しください。');\n  cache.put('pc:' + code, ctx.userId, 300);\n  return { code: code, minutes: 5 };\n}\n\n/** PCで番号を入れたとき。まちがいが続いたら、しばらく受け付けない（当てずっぽうを防ぐ） */\nfunction codeLogin_(code) {\n  const cache = CacheService.getScriptCache();\n  const fails = Number(cache.get('pcFails') || 0);\n  if (fails >= 20) throw new Error('番号のまちがいが続いたので、10分ほど待ってからお試しください。');\n  const c = toHalfWidth_(code).replace(/\\D/g, '');\n  const userId = c.length === 6 ? cache.get('pc:' + c) : null;\n  if (!userId) {\n    cache.put('pcFails', String(fails + 1), 600);\n    throw new Error('番号がちがうか、期限（5分）が切れています。スマホでもう一度番号を出してください。');\n  }\n  cache.remove('pc:' + c);\n  const f = findFamily_(userId);\n  if (!f) throw new Error('ログインできませんでした。');\n  ensureMember_(f);\n  return { key: portalKeyFor_(userId, '', false) };\n}\n","Main.gs":"/**\n * ポータルの画面を返す。\n * LINE ログインから戻ってきたとき（?code=）は、グループのメンバーか確かめてからキーを渡す。\n * それ以外は、ブラウザに保存したキーで開くか、ログインボタンを出す。\n */\nfunction doGet(e) {\n  resetMemo_();\n  const p = (e && e.parameter) || {};\n  if (p.dl) return docDownloadPage_(String(p.dl));\n  let key = '';\n  let error = '';\n  if (p.code) {\n    const r = handleLoginCallback_(p.code, p.state);\n    key = r.key || '';\n    error = r.error || '';\n  } else if (p.error) {\n    error = 'LINEログインがキャンセルされました。';\n  }\n  const t = HtmlService.createTemplateFromFile('Portal');\n  t.key = key;\n  t.error = error;\n  t.login = loginUrl_(ScriptApp.getService().getUrl());\n  t.apiUrl = '';\n  t.build = '';\n  t.server = '';\n  t.lite = false; // Apps Script の画面は全部入り（役員の画面もふくむ）\n  t.home = ScriptApp.getService().getUrl();\n  t.club = CONFIG.CLUB_NAME;\n  return t.evaluate()\n    .setTitle(CONFIG.CLUB_NAME + ' ポータル')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');\n}\n\n/**\n * POST を受け取る。\n *   ?token=… 付き … LINE からの Webhook。Apps Script ではリクエストヘッダー（署名）を読めないため、\n *                    Webhook URL に付けた token が一致するリクエストだけを処理する\n *   token なし   … GitHub Pages のポータル画面からの操作（apiPost_）\n */\nfunction doPost(e) {\n  resetMemo_();\n  const p = (e && e.parameter) || {};\n  if (p.token === undefined) return apiPost_(e);\n  if (p.token !== prop_('WEBHOOK_TOKEN')) return ok_();\n  const body = JSON.parse(e.postData.contents);\n  const t0 = Date.now();\n  (body.events || []).forEach((ev) => {\n    try {\n      if (isDuplicate_(ev)) return;\n      handleEvent_(ev);\n    } catch (err) {\n      console.error(err && err.stack ? err.stack : err);\n    }\n  });\n  if ((body.events || []).length) console.log('Bot: ' + (body.events || []).map((x) => x.type).join(',') + ' ' + (Date.now() - t0) + 'ms');\n  return ok_();\n}\n\nfunction ok_() {\n  return ContentService.createTextOutput('OK');\n}\n\n/**\n * GitHub Pages のポータル画面からの操作。本文は {action, key, payload} の JSON。\n * 返事は {ok: …} か {error: '…'}。\n */\nfunction apiPost_(e) {\n  let out;\n  try {\n    const body = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    if (body.action === 'loginUrl') {\n      out = { ok: { url: loginUrl_(portalUrl_()) } };\n    } else if (body.action === 'login') {\n      const r = handleLoginCallback_(String((body.payload || {}).code || ''), String((body.payload || {}).state || ''));\n      out = r.key ? { ok: { key: r.key } } : { error: r.error };\n    } else if (body.action === 'codeLogin') {\n      out = { ok: codeLogin_(String((body.payload || {}).code || '')) };\n    } else {\n      out = { ok: api(body.key, body.action, body.payload) };\n    }\n  } catch (err) {\n    out = { error: String((err && err.message) || err) };\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\n/** LINE の再送で同じイベントを二重に処理しないようにする */\nfunction isDuplicate_(ev) {\n  if (!ev.webhookEventId) return false;\n  const cache = CacheService.getScriptCache();\n  if (cache.get(ev.webhookEventId)) return true;\n  cache.put(ev.webhookEventId, '1', 3600);\n  return false;\n}\n\nfunction handleEvent_(ev) {\n  const source = ev.source || {};\n\n  if (ev.type === 'join') {\n    if (source.type === 'group') {\n      // 最初に招待されたグループ（または管理者が「切りかえ」を押したあとに招待されたグループ）を、クラブのグループにする\n      const cur = prop_('GROUP_ID');\n      if (!cur || prop_('NEXT_GROUP') === '1') {\n        setProp_('GROUP_ID', source.groupId);\n        PropertiesService.getScriptProperties().deleteProperty('NEXT_GROUP');\n        CacheService.getScriptCache().remove('grpinfo');\n        reply_(ev.replyToken, [text_('招待ありがとうございます！' + CONFIG.CLUB_NAME + 'のBotです。\\nこのグループのメンバーが、ポータルとBotを使えるようになりました。\\n使い方は、Botを友だち追加して、1対1のトークで「ヘルプ」と送ってください。')]);\n      } else if (cur !== source.groupId) {\n        reply_(ev.replyToken, [text_(CONFIG.CLUB_NAME + 'のBotは、登録済みのグループだけで動きます。このグループでは反応しません。')]);\n      }\n    }\n    return;\n  }\n  if (ev.type === 'follow') {\n    reply_(ev.replyToken, [text_('友だち追加ありがとうございます！\\nはじめに、ポータルの「わが家」でお子さんを登録してください。\\n' + portalUrl_()), helpBubble_()]);\n    return;\n  }\n\n  // 登録済みのグループ以外のグループからは反応しない（1対1のトークはOK）\n  const groupId = prop_('GROUP_ID');\n  if (source.type === 'group' && groupId && source.groupId !== groupId) return;\n  if (source.type === 'room') return;\n  if (!source.userId) return;\n\n  if (ev.type === 'postback') { startLoading_(ev); prefetchTables_(); return handlePostback_(ev); }\n  if (ev.type === 'message' && ev.message.type === 'text') {\n    if (source.type === 'user' && parseCommand_(ev.message.text)) { startLoading_(ev); prefetchTables_(); }\n    return handleText_(ev);\n  }\n  if (ev.type === 'message' && ev.message.type === 'image' && source.type === 'group') return handleImage_(ev);\n}\n\n/** 毎日トリガーで実行：カレンダーの予定を取り込む */\n/** 15分ごとのトリガー：Googleカレンダーと予定入力シートを読み直す（ポータルを開くときに待たせないため） */\nfunction syncJob() {\n  resetMemo_();\n  importScheduleSafely_();\n  syncCalendar_();\n  try { stravaSyncAll_(); } catch (err) { console.warn('Strava: ' + err); }\n}\n\nfunction dailyJob() {\n  resetMemo_();\n  importScheduleSafely_();\n  syncCalendar_();\n}\n\n/**\n * Webアプリからは google.script.run で公開関数を呼べてしまうので、\n * 管理用の関数はスクリプトの持ち主（クラブ共用アカウント）がエディタから実行したときだけ動かす。\n */\nfunction requireOwner_() {\n  const active = Session.getActiveUser().getEmail();\n  if (!active || active !== Session.getEffectiveUser().getEmail()) {\n    throw new Error('この関数は、スクリプトの持ち主がエディタから実行してください');\n  }\n}\n\n/**\n * 最初に1回だけ手動で実行する。\n * スプレッドシート・写真フォルダ・Webhook 用トークン・毎日のトリガーを用意する。\n */\nfunction setup() {\n  requireOwner_();\n  requireProp_('LINE_CHANNEL_ACCESS_TOKEN');\n  requireProp_('CALENDAR_ID');\n\n  if (!prop_('SPREADSHEET_ID')) {\n    setProp_('SPREADSHEET_ID', SpreadsheetApp.create(CONFIG.CLUB_NAME + ' ポータル データ').getId());\n  }\n  Object.keys(SHEETS).forEach((k) => sheet_(SHEETS[k]));\n  const defaultSheet = ss_().getSheetByName('シート1') || ss_().getSheetByName('Sheet1');\n  if (defaultSheet && ss_().getSheets().length > 1) ss_().deleteSheet(defaultSheet);\n  decorateSheets_();\n\n  if (!prop_('PHOTO_FOLDER_ID')) {\n    setProp_('PHOTO_FOLDER_ID', DriveApp.createFolder(CONFIG.CLUB_NAME + ' 写真').getId());\n  }\n  if (!prop_('WEBHOOK_TOKEN')) {\n    setProp_('WEBHOOK_TOKEN', Utilities.getUuid().replace(/-/g, ''));\n  }\n\n  ScriptApp.getProjectTriggers()\n    .filter((t) => t.getHandlerFunction() === 'dailyJob')\n    .forEach((t) => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('dailyJob').timeBased().everyDays(1).atHour(CONFIG.DAILY_HOUR).create();\n  ScriptApp.getProjectTriggers()\n    .filter((t) => t.getHandlerFunction() === 'syncJob')\n    .forEach((t) => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('syncJob').timeBased().everyMinutes(15).create();\n\n  // スプレッドシートの「予定入力」シートを書きかえたら、すぐカレンダーに入れる\n  ScriptApp.getProjectTriggers()\n    .filter((t) => t.getHandlerFunction() === 'onScheduleSheetEdit')\n    .forEach((t) => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('onScheduleSheetEdit').forSpreadsheet(ss_()).onEdit().create();\n\n  syncCalendar_();\n\n  console.log('スプレッドシート: ' + ss_().getUrl());\n  console.log('写真フォルダ: ' + photoFolderUrl_());\n  console.log('Webhook URL: <ウェブアプリのURL>?token=' + prop_('WEBHOOK_TOKEN'));\n  console.log('管理者の番号: ' + ownerCode_() + '（ポータルの「わが家」→「管理者になる」に入れると、その人が管理者になります。人に教えないでください）');\n}\n\n/** 管理者の番号をログに出す（setup をしなくても見られる） */\nfunction showOwnerCode() {\n  requireOwner_();\n  console.log('管理者の番号: ' + ownerCode_());\n}\n\n/** 動作確認用：カレンダーをすぐ同期する */\nfunction syncNow() {\n  syncCalendar_();\n  console.log('同期しました');\n}\n","Money.gs":"/**\n * 会計係：年度（4月はじまり）の予算と実績、集金の催促した日の記録（催促は手作業。LINEでは送らない）。\n * 実績は「会計」の記録（科目つき）と、集金で受け取った分（集金の名前＝科目）から数える\n */\n\nfunction fyStart_(date) {\n  const y = Number(String(date).slice(0, 4)), m = Number(String(date).slice(5, 7));\n  return (m >= 4 ? y : y - 1) + '-04-01';\n}\n\nfunction budgetFor_(ctx) {\n  if (!ctx.admin) return [];\n  return readRows_(SHEETS.BUDGET).filter((x) => x.id).map((x) => ({ id: x.id, fy: Number(x['年度']) || 0, kind: x['区分'] === '収入' ? '収入' : '支出', cat: x['科目'], amount: Number(x['金額']) || 0, memo: x['メモ'] || '' }));\n}\n\n/** 予算の行を入れる・直す・消す（年度・区分・科目・金額） */\nfunction saveBudgetAction_(ctx, p) {\n  if (p.remove) {\n    withLock_(() => { const row = readRows_(SHEETS.BUDGET).find((x) => x.id && x.id === p.id); if (row) clearRow_(SHEETS.BUDGET, row); });\n    return '予算の行を消しました';\n  }\n  const fy = Number(p.fy) || Number(fyStart_(today_()).slice(0, 4));\n  const kind = p.kind === '収入' ? '収入' : '支出';\n  const cat = String(p.cat || '').trim().slice(0, 30);\n  if (!cat) throw new Error('科目を入れてください（例：年会費、大会参加費）。');\n  const amount = Number(toHalfWidth_(String(p.amount || '')).replace(/[^0-9]/g, '')) || 0;\n  withLock_(() => {\n    const rows = readRows_(SHEETS.BUDGET);\n    const row = (p.id && rows.find((x) => x.id === p.id)) || rows.find((x) => x.id && Number(x['年度']) === fy && x['区分'] === kind && x['科目'] === cat);\n    const data = { '年度': String(fy), '区分': kind, '科目': cat, '金額': String(amount), 'メモ': String(p.memo || '').slice(0, 100), '更新者': ctx.name, '日時': now_() };\n    if (row) updateRow_(SHEETS.BUDGET, Object.assign(row, data));\n    else appendRow_(SHEETS.BUDGET, Object.assign({ id: randomKey_().slice(0, 10) }, data));\n  });\n  return fy + '年度の予算「' + cat + '」を保存しました';\n}\n\n/** 集金の催促は手作業（LINEでは送らない）。役員が催促したら、その日を記録だけする */\nfunction feeRemindAction_(ctx, p) {\n  withLock_(() => {\n    const fee = readRows_(SHEETS.FEES).find((x) => x.id && x.id === p.id);\n    if (!fee) throw new Error('集金が見つかりません。');\n    fee['催促'] = p.clear ? '' : today_();\n    updateRow_(SHEETS.FEES, fee);\n  });\n  return p.clear ? '催促した日の記録を消しました' : '「' + formatDate_(today_()) + 'に催促した」と記録しました';\n}\n","Notice.gs":"/**\n * グループに流れた「練習の変更の連絡」を拾って、その日の練習に結びつけて残す（Botは返事をしない）。\n *   例：「次の木曜日の練習について連絡です。16時50分から競技場で練習します」\n *       「明日の練習は雨のため中止です」\n * ポータルの練習のページとBotの「今日」「予定」「新着」に出し、役員がボタン1つで予定（カレンダー）に反映できる。\n * カレンダーを勝手には書きかえない。\n */\n\nconst WEEKDAY_CHARS = '日月火水木金土';\n\n/**\n * 変更の連絡かどうかを読み取る。ちがえば null\n * @return {{date: string, start: string, end: string, place: string, cancel: boolean}|null}\n */\nfunction parseScheduleNotice_(text, today) {\n  const t = toHalfWidth_(text || '').replace(/\\s+/g, ' ');\n  if (!/練習|れんしゅう/.test(t)) return null;\n  const date = noticeDate_(t, today);\n  if (!date) return null;\n  const cancel = /中止|練習(?:は|も)?(?:なし|ありません|お休み(?:です|にします|になります))/.test(t);\n  const times = [];\n  const re = /(\\d{1,2})(?:時(?:(\\d{1,2})分|半)?|:(\\d{2}))/g;\n  let m;\n  while ((m = re.exec(t))) {\n    let h = +m[1];\n    const mi = m[2] ? +m[2] : m[3] ? +m[3] : /半/.test(m[0]) ? 30 : 0;\n    if (h < 9) h += 12; // 「5時から」は夕方\n    if (h <= 23 && mi <= 59) times.push(('0' + h).slice(-2) + ':' + ('0' + mi).slice(-2));\n  }\n  const pm = t.match(/(?:場所[はは:：]?\\s*)([^\\s、。]{2,15})/) || t.match(/([^\\s、。]{2,15}?)(?:で|にて)(?:の)?(?:練習|集合|行い|やり|実施|します)/) || t.match(/([^\\s、。]{2,15}?)に(?:集合|変更)/);\n  let place = pm ? pm[1].replace(/^.*(?:から|は|、)/, '').replace(/^(?:の|で)/, '') : '';\n  if (/^(?:今日|明日|次|練習|こちら|現地|いつも)/.test(place) || /\\d/.test(place)) place = '';\n  if (!cancel && !times.length && !place) return null;\n  // 終わりの時刻は「16時〜18時」「16時から18時まで」のように幅で書かれたときだけ（「15時30分頃に連絡」などは使わない）\n  const T = '(\\\\d{1,2})(?:時(?:(\\\\d{1,2})分|半)?|:(\\\\d{2}))';\n  const rg = t.match(new RegExp(T + '\\\\s*(?:〜|~|-|－|ー|から)\\\\s*' + T + '(?:まで)?'));\n  let end = '';\n  if (rg && times.length >= 2) {\n    const hm = (h, a, b, half) => { let x = +h; if (x < 9) x += 12; return ('0' + x).slice(-2) + ':' + ('0' + (a ? +a : b ? +b : half ? 30 : 0)).slice(-2); };\n    const s0 = hm(rg[1], rg[2], rg[3], /^\\d{1,2}時半/.test(rg[0])), e0 = hm(rg[4], rg[5], rg[6], /半(?:まで)?$/.test(rg[0]));\n    if (s0 === times[0] && e0 > s0) end = e0;\n  }\n  return { date: date, start: cancel ? '' : times[0] || '', end: cancel ? '' : end, place: cancel ? '' : place, cancel: cancel };\n}\n\n/** 「今日」「明日」「あさって」「次の木曜日」「木曜」「10/23」「10月23日」「23日」を日付にする */\nfunction noticeDate_(t, today) {\n  if (/今日|本日/.test(t)) return today;\n  if (/明日|あした/.test(t)) return addDays_(today, 1);\n  if (/あさって|明後日/.test(t)) return addDays_(today, 2);\n  let m = t.match(/(\\d{1,2})[\\/月](\\d{1,2})日?/);\n  if (m) return parseDateCell_(m[1] + '/' + m[2]);\n  m = t.match(/(次の|来週の?|今週の?)?([日月火水木金土])曜/);\n  if (m) {\n    const want = WEEKDAY_CHARS.indexOf(m[2]);\n    const now = new Date(today + 'T00:00:00Z').getUTCDay();\n    if (/来週/.test(m[1] || '')) {\n      const toMonday = (8 - now) % 7 || 7;\n      return addDays_(today, toMonday + (want + 6) % 7);\n    }\n    let n = (want - now + 7) % 7;\n    if (n === 0 && m[1]) n = 7;\n    return addDays_(today, n);\n  }\n  m = t.match(/(\\d{1,2})日(?:\\(.\\)|（.）)?の/);\n  if (m) {\n    const d = +m[1];\n    let mo = +today.slice(5, 7);\n    if (d < +today.slice(8, 10)) mo = mo % 12 + 1;\n    return parseDateCell_(mo + '/' + d);\n  }\n  return '';\n}\n\n/** グループのメッセージが練習の変更の連絡なら、「コメント」シートに「変更連絡」として残す */\nfunction recordScheduleNotice_(ev) {\n  const text = String(ev.message.text || '');\n  const today = fmt_(new Date(ev.timestamp), 'yyyy-MM-dd');\n  const p = parseScheduleNotice_(text, today);\n  if (!p) return false;\n  const target = readRows_(SHEETS.EVENTS).find((e) => e['日付'] === p.date && e['状態'] !== '中止' && (e['種別'] || guessType_(e['タイトル'])) === '練習');\n  withLock_(() => {\n    appendRow_(SHEETS.COMMENTS, {\n      id: randomKey_().slice(0, 10), eventKey: target ? target.eventKey : '', '種類': '変更連絡', '本文': text.slice(0, 1000), '場所': p.place,\n      '公開': '全員', '写真ID': '', userId: ev.source.userId, '表示名': getDisplayName_(ev.source), '日時': now_(), '提案': JSON.stringify(p),\n    });\n  });\n  return true;\n}\n\n/** 変更連絡の内容で、予定（カレンダー）を直す・中止にする・ない日なら練習をつくる（役員） */\nfunction applyNoticeAction_(ctx, p) {\n  const row = readRows_(SHEETS.COMMENTS).find((x) => x.id && x.id === p.id && x['種類'] === '変更連絡');\n  if (!row) throw new Error('変更連絡が見つかりません。');\n  let s;\n  try { s = JSON.parse(row['提案'] || '{}'); } catch (err) { s = {}; }\n  if (p.start !== undefined) s.start = parseTimeCell_(p.start) || '';\n  if (p.end !== undefined) s.end = parseTimeCell_(p.end) || '';\n  if (p.place !== undefined) s.place = String(p.place || '').trim().slice(0, 80);\n  const ev = row.eventKey ? findEvent_(row.eventKey) : null;\n  let msg;\n  if (s.cancel) {\n    if (!ev) throw new Error('この日の練習は、もともと予定に入っていません。');\n    msg = cancelEventAction_(ctx, { key: ev.eventKey });\n  } else if (ev) {\n    const len = ev['開始'] && ev['終了'] && ev['開始'] !== '終日' ? toMin_(ev['終了']) - toMin_(ev['開始']) : 90;\n    const start = s.start || (ev['開始'] === '終日' ? '' : ev['開始']);\n    const end = s.end || (s.start ? minToHm_(toMin_(s.start) + len) : ev['終了']);\n    msg = editEventAction_(ctx, { key: ev.eventKey, date: ev['日付'], start: start, end: end, title: ev['タイトル'], place: s.place || ev['場所'] });\n  } else {\n    if (!s.start) throw new Error('時刻が分からないので、ポータルの「練習の予定をつくる」から入れてください。');\n    msg = savePracticesAction_(ctx, { dates: [s.date], start: s.start, end: s.end || minToHm_(toMin_(s.start) + 90), title: '練習', place: s.place });\n  }\n  withLock_(() => {\n    const r = readRows_(SHEETS.COMMENTS).find((x) => x.id === p.id);\n    if (!r) return;\n    if (!r.eventKey) {\n      const made = readRows_(SHEETS.EVENTS).find((e) => e['日付'] === s.date && e['状態'] !== '中止');\n      if (made) r.eventKey = made.eventKey;\n    }\n    r['対策'] = '予定に反映しました';\n    r['対策者'] = ctx.name;\n    r['対策日時'] = now_();\n    updateRow_(SHEETS.COMMENTS, r);\n  });\n  return msg;\n}\n\nfunction minToHm_(n) {\n  return ('0' + Math.floor(n / 60)).slice(-2) + ':' + ('0' + (n % 60)).slice(-2);\n}\n\n// ---- 大会の陣地（場所取り・集合場所） ----\n\nconst JINCHI_PATTERN = /場所(?:を)?(?:取|と)り|場所取り|陣地/;\n\n/** その日の大会（練習でない予定） */\nfunction raceOn_(date) {\n  const races = {};\n  readRows_(SHEETS.RACES).forEach((r) => (races[r.eventKey] = true));\n  return readRows_(SHEETS.EVENTS).find((e) => e['日付'] === date && e['状態'] !== '中止' && (races[e.eventKey] || (e['種別'] || guessType_(e['タイトル'])) !== '練習')) || null;\n}\n\n/** 大会の日に「本部の右側の階段に場所を取りました」などと送られたら、陣地として残す */\nfunction recordJinchi_(ev) {\n  const text = String(ev.message.text || '');\n  if (!JINCHI_PATTERN.test(text)) return false;\n  const race = raceOn_(fmt_(new Date(ev.timestamp), 'yyyy-MM-dd'));\n  if (!race) return false;\n  const ctx = { name: getDisplayName_(ev.source) || '保護者' };\n  upsertTask_(ctx, race.eventKey, '陣地', '', (t) => { t['メモ'] = text.slice(0, 300); t['状態'] = '済'; });\n  logHistory_(race.eventKey, ctx, '陣地：' + text.slice(0, 40));\n  return true;\n}\n\n/** 陣地を書いた人が、そのあと20分以内にグループに送った写真は、陣地の写真にする */\nfunction attachJinchiPhoto_(displayName, fileId, posted) {\n  if (!displayName || !fileId) return;\n  const date = fmt_(posted, 'yyyy-MM-dd');\n  const t = readRows_(SHEETS.TASKS).find((x) => x.id && x['種類'] === '陣地' && x['更新者'] === displayName && String(x['日時']).slice(0, 10) === date &&\n    Math.abs(posted.getTime() - new Date(String(x['日時']).replace(' ', 'T') + '+09:00').getTime()) <= 20 * 60000);\n  if (!t) return;\n  withLock_(() => {\n    const row = readRows_(SHEETS.TASKS).find((x) => x.id === t.id);\n    row['写真ID'] = splitNames_(row['写真ID']).concat([fileId]).join(',');\n    updateRow_(SHEETS.TASKS, row);\n  });\n}\n","Photos.gs":"const EXTENSIONS = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp' };\n\nfunction photoRoot_() {\n  return DriveApp.getFolderById(requireProp_('PHOTO_FOLDER_ID'));\n}\n\nfunction subfolder_(parent, name) {\n  const it = parent.getFoldersByName(name);\n  return it.hasNext() ? it.next() : parent.createFolder(name);\n}\n\n/** フォルダ名に使えない文字を除く */\nfunction safeName_(s) {\n  return String(s || '').replace(/[\\\\/:*?\"<>|]/g, '_').trim();\n}\n\n/**\n * グループに投稿された写真をドライブに保存する。\n * 直近の予定（大会・練習）ごとのフォルダに分け、なければ日付のフォルダに入れる。\n */\nfunction handleImage_(ev) {\n  if (!CONFIG.SAVE_ALL_PHOTOS) return;\n  // 外部 URL の画像（LINE 以外の配信元）は対象外\n  if (ev.message.contentProvider && ev.message.contentProvider.type !== 'line') return;\n\n  const posted = new Date(ev.timestamp);\n  const date = fmt_(posted, 'yyyy-MM-dd');\n  const event = recentEvent_(date, CONFIG.PHOTO_EVENT_LOOKBACK_DAYS);\n  const folderName = event ? event['日付'] + ' ' + safeName_(event['タイトル']) : date;\n  const folder = subfolder_(photoRoot_(), folderName);\n\n  const displayName = getDisplayName_(ev.source);\n  const blob = getMessageContent_(ev.message.id);\n  const ext = EXTENSIONS[blob.getContentType()] || 'jpg';\n  const fileName = fmt_(posted, 'yyyyMMdd_HHmmss') + '_' + (safeName_(displayName) || 'photo') + '_' + ev.message.id + '.' + ext;\n  const file = folder.createFile(blob.setName(fileName));\n\n  appendRow_(SHEETS.PHOTOS, {\n    '日時': fmt_(posted, 'yyyy-MM-dd HH:mm:ss'),\n    eventKey: event ? event.eventKey : '',\n    '予定': event ? event['タイトル'] : '',\n    userId: ev.source.userId,\n    '表示名': displayName,\n    'ファイル名': fileName,\n    URL: file.getUrl(),\n    'ファイルID': file.getId(),\n    '種類': 'LINE',\n  });\n  attachJinchiPhoto_(displayName, file.getId(), posted);\n}\n\n/** 写真フォルダのURL（ドライブに問い合わせず、IDから作る） */\nfunction photoFolderUrl_() {\n  return 'https://drive.google.com/drive/folders/' + requireProp_('PHOTO_FOLDER_ID');\n}\n","Portal.gs":"/**\n * ポータル（Webアプリ）のサーバー側。\n * 画面からは google.script.run.api(key, action, payload) だけを呼ぶ。\n * key は LINE ログイン（Login.gs）でグループのメンバーと確認できた人に発行するキー。\n */\nfunction api(key, action, payload) {\n  resetMemo_();\n  const t0 = Date.now();\n  prefetchTables_();\n  const family = findFamilyByKey_(key);\n  if (!family) throw new Error('ログインが切れました。もう一度「LINEでログイン」を押してください。');\n  ensureMember_(family);\n  const handler = API_ACTIONS[action];\n  if (!handler) throw new Error('不明な操作です: ' + action);\n  if (handler.admin && !isAdmin_(family)) throw new Error('この操作は役員だけができます。');\n  const ctx = { family: family, userId: family.userId, famId: famIdOf_(family), name: family['表示名'] || '保護者', admin: isAdmin_(family), coach: isCoach_(family), owner: isOwner_(family) };\n  const message = handler.run(ctx, payload || {});\n  // 写真などは、画面の状態ではなく結果だけを返す\n  if (handler.raw) return message;\n  // 家族をまとめた・外れた、コーチになったときなどは、その場で画面に反映する\n  const fresh = findFamily_(ctx.userId);\n  if (fresh) { ctx.famId = famIdOf_(fresh); ctx.coach = isCoach_(fresh); ctx.admin = isAdmin_(fresh); ctx.owner = isOwner_(fresh); }\n  const t1 = Date.now();\n  prefetchTables_(); // 書きかえた表だけ読み直し、ほかは覚えている分をまとめて\n  // 画面のデータ：表の版（どれか書きかわると変わる）・人・日付が同じなら、前に作った分をそのまま使う\n  const sKey = stateCacheKey_(ctx);\n  const cache = CacheService.getScriptCache();\n  if (sKey) {\n    let hit = null;\n    try { hit = cache.get(sKey); } catch (e) { /* なければ作る */ }\n    if (hit) {\n      const st0 = JSON.parse(hit);\n      if (message) st0.message = message;\n      console.log('api ' + action + '：操作 ' + (t1 - t0) + 'ms・画面（おぼえていた分） ' + (Date.now() - t1) + 'ms');\n      return st0;\n    }\n  }\n  const state = buildState_(ctx);\n  if (sKey) { try { const js = JSON.stringify(state); if (js.length < 95000) cache.put(sKey, js, 600); } catch (e) { /* 大きすぎるときは覚えない */ } }\n  if (message) state.message = message;\n  console.log('api ' + action + '：操作 ' + (t1 - t0) + 'ms・画面 ' + (Date.now() - t1) + 'ms');\n  return state;\n}\n\n/** まとめて保存：画面でためた ✓（当番・エントリー・支払い）を一度に書いて、画面のデータは1回だけ作る */\nconst BATCHABLE_ = ['setDuty', 'saveEntry', 'setPaid', 'setFeePaid'];\nfunction batchAction_(ctx, p) {\n  const ops = (p.ops || []).slice(0, 300), ng = [];\n  let ok = 0;\n  ops.forEach((o) => {\n    const h = BATCHABLE_.indexOf(o && o.a) >= 0 ? API_ACTIONS[o.a] : null;\n    if (!h) return ng.push('まとめて保存できない操作です');\n    if (h.admin && !ctx.admin) return ng.push('役員だけができる操作です');\n    try { h.run(ctx, o.p || {}); ok++; } catch (e) { ng.push(String(e.message || e).replace(/^Error:\\s*/, '')); }\n  });\n  return ng.length ? (ok ? ok + '件は保存しました。' : '') + '保存できなかったもの ' + ng.length + '件：' + ng.filter((x, i, a) => a.indexOf(x) === i).slice(0, 3).join('／') : '';\n}\n\n/** 画面のデータを覚えておくときの名前。表の版（TV_*）・サーバーの版・人・今日が同じなら同じ名前 */\nfunction stateCacheKey_(ctx) {\n  if (!tableCacheOn_()) return '';\n  const props = PropertiesService.getScriptProperties().getProperties();\n  const tv = Object.keys(props).filter((k) => /^TV_/.test(k)).sort().map((k) => k + '=' + props[k]).join('&');\n  const raw = [SERVER_VERSION, ctx.userId, ctx.famId, ctx.admin, ctx.coach, today_(), tv].join('|');\n  return 'st:' + Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, raw, Utilities.Charset.UTF_8).map((b) => ((b + 256) % 256).toString(16).padStart(2, '0')).join('');\n}\n\nconst API_ACTIONS = {\n  bootstrap: { run: () => { syncIfStale_(); } },\n  refresh: { run: () => { invalidateAllTables_(); importScheduleSafely_(); syncCalendar_(); } },\n  saveChildren: { run: saveChildrenAction_ },\n  inviteFamily: { raw: true, run: inviteFamilyAction_ },\n  pcCode: { raw: true, run: pcCodeAction_ },\n  joinFamily: { run: joinFamilyAction_ },\n  leaveFamily: { run: (ctx) => { leaveFamily_(ctx.userId); return '家族のまとまりから外れました'; } },\n  setNotify: { admin: true, run: setNotifyAction_ },\n  setAdmin: { admin: true, run: setAdminAction_ },\n  setDuty: { admin: true, run: setDutyAction_ },\n  saveBudget: { admin: true, run: saveBudgetAction_ },\n  setDutyOrder: { admin: true, run: setDutyOrderAction_ },\n  groupInfo: { admin: true, raw: true, run: () => groupInfo_() },\n  switchGroup: { admin: true, run: switchGroupAction_ },\n  feeRemind: { admin: true, run: feeRemindAction_ },\n  swapRequest: { run: swapRequestAction_ },\n  swapVolunteer: { run: swapVolunteerAction_ },\n  swapCancel: { run:
