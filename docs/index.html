<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>河北SS ポータル</title>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #e9eef0; --surface: #ffffff; --surface-2: #f3f6f7; --fg: #182328; --muted: #5f7079; --line: #d6dfe3;
  --track: #c4512f; --track-soft: #f6e1d9; --field: #237a55; --field-soft: #dcefe5; --sky: #2f6fae; --sky-soft: #dde9f5;
  --warn: #a8660b; --warn-soft: #f8ead2; --viz-line: #2f6fae; --viz-pb: #c4512f;
  /* 学年の色（1年〜6年。色は学年に付いて、並びで変わらない） */
  --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --g4: #eda100; --g5: #e87ba4; --g6: #008300;
  /* 目標の色（濃い藍に金。ほかの画面と区別する） */
  --goal-a: #26457f; --goal-b: #172c55; --goal-gold: #ffc94d; --goal-ink: #ffffff; --goal-soft: #e6ecf7;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1518; --surface: #182126; --surface-2: #1f2a30; --fg: #e4ebee; --muted: #94a5ad; --line: #2d3a40;
    --track: #ec8566; --track-soft: #3f2219; --field: #4cc28c; --field-soft: #163527; --sky: #6aa7e3; --sky-soft: #172b3f;
    --warn: #e5a54a; --warn-soft: #3a2a12; --viz-line: #4f8fd1; --viz-pb: #e07050; color-scheme: dark;
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500; --g5: #d55181; --g6: #008300;
    --goal-a: #24395f; --goal-b: #141f38; --goal-gold: #ffd36b; --goal-ink: #f4f7ff; --goal-soft: #1b2640;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.app { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.frame { background: var(--surface-2); border: 0; border-radius: 22px; overflow: hidden; overflow: clip; display: flex; flex-direction: column; min-height: calc(100vh - 24px); }
.top { background: var(--surface); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--track); display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 13px; flex: none; }
.top h1 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; line-height: 1.3; }
.top .me { font-size: 11.5px; color: var(--muted); }
.top > div:not(.logo) { min-width: 0; flex: 1; }
.top .me { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .reload { margin-left: auto; flex: none; white-space: nowrap; }
.view { flex: 1; padding: 12px; display: grid; gap: 12px; align-content: start; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; z-index: 6; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -2px 8px rgba(0,0,0,.06); }
/* 下のメニューは画面の下に固定（LINEのブラウザでも、スクロールしなくても押せる）。その分だけ中身の下をあける */
.frame:has(.nav:not([hidden])) .view { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.view.navpad { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.nav.admin { grid-template-columns: repeat(6, 1fr); }
.nav button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 8px 0 7px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--track); font-weight: 700; }
.card { background: var(--surface); border: 0; border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 1.02rem; margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-family: var(--font-body); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.big { font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; line-height: 1.35; }
.sub { color: var(--muted); font-size: 12.5px; }
.hint { font-size: 11.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; line-height: 1.7; white-space: nowrap; }
.p-race { background: var(--track-soft); color: var(--track); }
.p-prac { background: var(--sky-soft); color: var(--sky); }
.p-ok { background: var(--field-soft); color: var(--field); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-gray { background: var(--surface-2); color: var(--muted); }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; min-height: 42px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: var(--track); color: #fff; }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 0; }
.btn.small { padding: 6px 12px; min-height: 32px; font-size: 12.5px; border-radius: 9px; white-space: nowrap; flex: none; }
.btn.ok { background: var(--field); }
.btn:disabled { opacity: .5; cursor: wait; }
.link { border: 0; background: none; color: var(--sky); font: inherit; cursor: pointer; padding: 0; justify-self: start; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.list { display: grid; }
.list > * { padding: 8px 0; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; padding-top: 0; }
.notice .t { font-weight: 700; }
.notice .b { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
.date { flex: none; width: 46px; text-align: center; border-radius: 10px; background: var(--surface-2); border: 0; padding: 3px 0; line-height: 1.2; font-variant-numeric: tabular-nums; }
.date b { display: block; font-size: 15px; }
.date span { font-size: 10.5px; color: var(--muted); }
.date.race { background: var(--track-soft); border-color: transparent; }
.ev { display: flex; gap: 10px; align-items: center; background: none; border: 0; text-align: left; font: inherit; color: inherit; width: 100%; cursor: pointer; }
.ev .main { flex: 1; min-width: 0; }
.ev .ttl { font-weight: 700; }
.ev.past { opacity: .55; }
.ev.cancel .ttl { text-decoration: line-through; }
.month { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 12px; margin: 4px 2px -4px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
/* 大会のページのタブ：折り返して全部見えるように、4つずつのマス目に */
.tabs.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tabs.grid button { padding: 9px 2px; border-radius: 10px; font-size: 12.5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: clip; letter-spacing: -.02em; min-width: 0; }
@media (max-width: 380px) { .tabs.grid button { font-size: 11.5px; } }
@media (min-width: 900px) { .tabs.grid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.tabs button { border: 0; background: var(--surface-2); color: var(--muted); font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--track); border-color: var(--track); color: #fff; font-weight: 700; }
.kv { display: grid; grid-template-columns: 4.5em 1fr; gap: 4px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; white-space: pre-wrap; }
.tbl-wrap { overflow-x: auto; max-width: 100%; min-width: 0; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
/* スマホでは横にはみ出さないよう、文字の多いところは折り返す（数字・名前は折り返さない） */
td.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 5.5em; }
td .nw { white-space: nowrap; }
.kid > *, .card > * { min-width: 0; }
th { font-weight: 500; color: var(--muted); font-size: 11.5px; }
tr.hl td { background: var(--track-soft); }
.kid { border: 0; background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice button { border: 0; background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 7px 14px; min-height: 36px; font: inherit; font-size: 13.5px; cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--field); border-color: var(--field); color: #fff; font-weight: 700; }
.choice button.no[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); }
.choice button:disabled { opacity: .45; cursor: not-allowed; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 6px 8px; display: grid; }
.stat b { font-family: var(--font-display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
form.f, .f { display: grid; gap: 8px; }
.f label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--fg); }
.f select, .f input, .f textarea { font: inherit; font-weight: 400; font-size: 16px; min-height: 44px; color: var(--fg); background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
.f textarea { min-height: 90px; resize: vertical; font-size: 16px; }
.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f .lbl { font-size: 13px; font-weight: 700; color: var(--fg); margin-bottom: -4px; }
.f input:focus, .f select:focus, .f textarea:focus, .tmin:focus, .tbin:focus, .tmsel:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-soft); background: var(--surface); }
.f input::placeholder, .f textarea::placeholder { color: var(--muted); opacity: .7; }
.filled { background: var(--field-soft) !important; border-color: var(--field) !important; }
.quick { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.quick button { border: 0; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 5px 11px; min-height: 30px; font: inherit; font-size: 12.5px; cursor: pointer; }
.toast { background: var(--field-soft); color: var(--field); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; }
.toast.err { background: var(--track-soft); color: var(--track); }
.copybox { white-space: pre-wrap; background: var(--surface-2); border: 0; border-radius: 10px; padding: 10px; font-size: 12.5px; user-select: all; }
.menu { display: grid; gap: 8px; }
.menu button { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; text-align: left; border: 0; background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 12px; font: inherit; cursor: pointer; }
.menu b { display: block; font-size: 14px; }
.menu span.d { font-size: 12px; color: var(--muted); }
.busy { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--surface); padding: 6px 14px; border-radius: 999px; font-size: 12.5px; z-index: 10; }
.kidcard { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.kc-no { font-size: 13px; }
.childrow { display: grid; grid-template-columns: minmax(0, 1fr) 6.5em 32px; gap: 6px; align-items: center; }
.icon-btn { border: 0; background: var(--surface-2); color: var(--muted); border-radius: 8px; width: 32px; height: 32px; font: inherit; cursor: pointer; }
.empty { padding: 24px 8px; text-align: center; color: var(--muted); }
/* PC：メニューを左に、中身を広く */
@media (min-width: 900px) {
  .app { max-width: 1100px; }
  .frame { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "top top" "nav view"; }
  .top { grid-area: top; padding: 14px 22px; }
  .view { grid-area: view; padding: 18px 26px; }
  .nav, .nav.admin { grid-area: nav; grid-template-columns: 1fr; align-content: start; position: sticky; top: 0; left: auto; right: auto; margin: 0; max-width: none; box-shadow: none; align-self: start; border-top: 0; border-right: 1px solid var(--line); padding: 10px 0; }
  .frame:has(.nav:not([hidden])) .view, .view.navpad { padding-bottom: 18px; }
  .nav button { grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; padding: 11px 18px; font-size: 14px; }
  .nav button[aria-current="page"] { background: var(--track-soft); }
  .busy { bottom: 24px; }
  .wide-only { display: block !important; }
}
.wide-only { display: none; }
[data-drop].drop-on { outline: 3px dashed var(--sky); outline-offset: 3px; background: var(--sky-soft) !important; }
.grid-edit { width: 100%; border-collapse: collapse; font-size: 13px; }
.grid-edit th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
.grid-edit td { padding: 3px; }
.grid-edit input { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; width: 100%; min-width: 0; }
.grid-edit input:hover, .grid-edit input:focus { border-color: var(--line); background: var(--surface-2); }
.grid-edit tr.changed td { background: var(--warn-soft); }
.grid-edit tr.race td:first-child { border-left: 3px solid var(--track); }
.grid-edit tr.cancelled td { opacity: .5; text-decoration: line-through; }
.top > div.acts { margin-left: auto; flex: none; display: flex; gap: 6px; }
.top .acts .btn { white-space: nowrap; text-decoration: none; }
.btn.line { background: #06c755; color: #fff; border: 0; }
.childrow { grid-template-columns: minmax(0, 1fr) 5.4em 4.4em 32px; }
.choice.duty button { display: grid; text-align: center; line-height: 1.3; padding: 4px 10px; border-radius: 12px; }
.choice.duty button small { font-size: 10.5px; opacity: .8; font-weight: 400; }
.att { display: grid; gap: 4px; }
.att .g { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.att .g > b { font-size: 11.5px; color: var(--muted); width: 2.6em; flex: none; }
.tt { display: flex; gap: 10px; align-items: flex-start; }
.tt-time { flex: none; width: 3.4em; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.tt .main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.tt-kids { display: grid; gap: 4px; }
.tt-kids > span { justify-content: space-between; }
.callt { color: var(--track); }
.ttcards { display: grid; gap: 8px; }
.ttcard { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.ttcard.open { border-color: var(--sky); box-shadow: 0 0 0 2px var(--sky-soft); }
.ttcard.bad { border-color: var(--track); }
.ttc-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; font: inherit; color: var(--fg); text-align: left; padding: 10px 12px; cursor: pointer; min-height: 48px; }
.ttc-no { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.ttc-ttl { flex: 1; min-width: 0; display: grid; font-weight: 700; font-size: 14.5px; }
.ttc-ttl small { font-weight: 400; color: var(--muted); font-size: 12px; }
.ttc-ttl small.ttc-warn { color: var(--track); font-weight: 700; }
.ttc-arrow { color: var(--muted); font-size: 11px; }
.ttc-body { padding: 4px 12px 12px; border-top: 1px solid var(--line); gap: 10px; }
.fld { display: grid; gap: 4px; }
.f .fld, .fld { font-size: 13px; color: var(--fg); }
.fl { font-size: 13px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.req { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--track); border-radius: 4px; padding: 0 5px; line-height: 1.6; }
.opt { font-size: 10.5px; font-weight: 400; color: var(--muted); }
.fh { font-size: 11.5px; font-weight: 400; color: var(--muted); line-height: 1.45; }
.fl { flex-wrap: wrap; row-gap: 0; }
.choice.sm button { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.tte { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 6px 0; border-top: 1px solid var(--line); }
.tte:first-child { border-top: 0; }
.tte .w2 { grid-column: span 2; }
.tte .w3 { grid-column: span 3; }
.tte input { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface-2); border: 0; border-radius: 8px; padding: 5px 6px; min-width: 0; width: 100%; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.thumb { border: 0; border-radius: 10px; padding: 0; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.upl { display: inline-block; }
.viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; display: grid; place-items: center; padding: 12px; }
.viewer img { max-width: 100%; max-height: calc(100vh - 80px); border-radius: 8px; }
.viewer.pdfv { display: block; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.viewer.pdfv .vcap { position: static; padding: 8px 0 16px; }
.viewer.pdfv .vbar { position: sticky; top: 0; z-index: 1; display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(0,0,0,.75); }
.viewer.pdfv .pages { display: grid; gap: 10px; padding: 10px; justify-items: center; }
.viewer.pdfv .pages img { max-height: none; width: 100%; max-width: 1000px; background: #fff; border-radius: 4px; }
.viewer .vbar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; left: 12px; display: flex; gap: 8px; justify-content: flex-end; }
.viewer .vbar a { text-decoration: none; }
.viewer .vcap { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; color: #fff; font-size: 12px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); }
.cal button { border: 0; background: var(--surface-2); color: var(--fg); border-radius: 8px; padding: 6px 0 4px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cal button small { display: block; font-size: 9px; color: var(--muted); height: 10px; }
.cal button[aria-pressed="true"] { background: var(--field); border-color: var(--field); color: #fff; font-weight: 700; }
.cal button[aria-pressed="true"] small { color: #fff; }
.cal button:disabled { opacity: .35; cursor: not-allowed; }
.banner { background: var(--track-soft); border-color: transparent; }
.card.foldable > h2 { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.card.foldable > h2 small { margin-left: auto; }
.fold-ic { flex: none; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s; }
.card.folded > h2 .fold-ic { transform: rotate(-90deg); }
.card.folded > :not(h2) { display: none !important; }
.rsvp-kid { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
.rsvp-kid .nm { min-width: 0; display: grid; }
.rsvp-kid .nm b { font-size: 15px; }
.yn { display: flex; gap: 6px; flex: none; }
.yn label { display: contents; }
.yn button { min-width: 76px; height: 44px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--muted); font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 0 12px; }
.yn button .mk { font-size: 16px; }
.yn button.y[aria-pressed="true"] { background: var(--field); border-color: var(--field); color: #fff; }

<body>
<div class="app">
  <div class="frame">
    <div class="top">
      <div class="logo" aria-hidden="true">SS</div>
      <div><h1 id="clubName">ポータル</h1><div class="me" id="me"></div></div>
      <div class="acts"><button class="btn small ghost" id="reload" type="button" hidden>更新</button><a class="btn small line" id="toLine" href="https://line.me/R/nv/chat" target="_top">LINEへ</a></div>
    </div>
    <main class="view" id="view"><div class="empty">読み込んでいます…</div></main>
    <nav class="nav" id="nav" aria-label="メニュー" hidden></nav>
  </div>
</div>
<div class="busy" id="busy" hidden>保存しています…</div>
<script>
var KEY = "";
var LOGIN_URL = "";
var LOGIN_ERROR = "";
var HOME_URL = "https://kahokuss.github.io/portal/";
var CLUB = "河北SS";
// GitHub Pages に置いた画面では、Apps Script のウェブアプリの URL が入る（Apps Script の画面では空）
var API_URL = "https://script.google.com/macros/s/AKfycbyUMYsbH2Ivw5SlLrcQxO4DCnb1Gj2K8JNSYmgrlqYlXuoCYs9guHuqi0FN2m65t2qz/exec";
// GitHub Pages の画面の版（tools/build-pages.js が入れる）。新しい版が出ていたら読み直すのに使う
var BUILD = "e8e2450c7e";
// この画面に合うサーバー（Apps Script）の版。ちがえば「サーバーの更新がまだ」と知らせる
var EXPECT_SERVER = "b63325d337";
// サーバーの更新で貼るコード（GitHub の dist/Code.gs をそのまま表示）
var CODE_URL = 'https://github.com/kahokuss/portal/raw/main/dist/Code.gs';
document.getElementById('clubName').textContent = CLUB + ' ポータル';
(function () {
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var ST = null;
  var S = { tab: 'home', event: null, etab: '概要', toast: '', toastErr: false, absForm: false, onlyRace: false, admin: 'menu', draft: null, filled: {}, saved: null, notice: null };
  var view = document.getElementById('view');

  // ---- 共通 ----
  function d(s) { var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function md(s) { var x = d(s); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate() + '(' + WD[x.getUTCDay()] + ')'; }
  function diff(a, b) { return Math.round((d(b) - d(a)) / 86400000); }
  function addDays(s, n) { return new Date(d(s).getTime() + n * 86400000).toISOString().slice(0, 10); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function yen(n) { return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
  function pad(n) { return ('0' + n).slice(-2); }
  function toHalf(s) { return String(s).replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); }).replace(/　/g, ' '); }
  function fmtTime(s) { s = toHalf(String(s)).trim().replace('時', ':').replace('分', ''); var m = s.match(/^(\d{1,2})[:.]?(\d{2})$/); return m ? (+m[1]) + ':' + m[2] : s; }
  function on(sel, fn) { view.querySelectorAll(sel).forEach(function (el) { el.addEventListener('click', fn); }); }
  function when(e) { return md(e.date) + (e.start && e.start !== '終日' ? ' ' + e.start.replace(/^0/, '') + (e.end ? '〜' + e.end.replace(/^0/, '') : '') : ''); }
  function isRace(e) { return e.type !== '練習'; }
  function typePill(e) { return '<span class="pill ' + (isRace(e) ? 'p-race' : 'p-prac') + '">' + esc(e.type) + '</span>'; }
  function evByKey(k) { return ST.events.find(function (e) { return e.key === k; }); }
  function kidInfo(n) { return ST.kids.find(function (k) { return k.name === n; }) || { name: n, grade: 0 }; }
  function myNames() { return ST.me.children.map(function (c) { return c.name; }); }
  function inTarget(target, grade) { var m = String(target || '').match(/([1-6])年生?以上/); return !m || !grade || grade >= Number(m[1]); }
  function entryOf(key, child) { return ST.entries.find(function (x) { return x.key === key && x.child === child; }); }
  function toastHtml() { return S.toast ? '<div class="toast' + (S.toastErr ? ' err' : '') + '">' + esc(S.toast) + '</div>' : ''; }

  /** サーバーを呼ぶ。Apps Script の画面なら google.script.run、GitHub Pages の画面なら fetch で */
  function rpc(action, payload, ok, ng) {
    if (!API_URL) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ng).api(KEY, action, payload || {});
      return;
    }
    // text/plain で送ると、ブラウザの事前確認（CORS のプリフライト）なしで Apps Script に届く
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, key: KEY, payload: payload || {} }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res.error) ng(new Error(res.error)); else ok(res.ok); })
      .catch(function () { ng(new Error('通信できませんでした。電波のよいところで「更新」を押してください。')); });
  }
  function call(action, payload, done) {
    document.getElementById('busy').hidden = false;
    rpc(action, payload, function (st) {
        document.getElementById('busy').hidden = true;
        document.getElementById('busy').textContent = '保存しています…';
        ST = fillDefaults(st);
        saveState(st);
        if (st.message) { S.toast = '✅ ' + st.message; S.toastErr = false; }
        if (done) done(st);
        render();
      }, function (err) {
        document.getElementById('busy').hidden = true;
        document.getElementById('busy').textContent = '保存しています…';
        var msg = String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '');
        if (/ログインが切れ|グループのメンバーではない/.test(msg)) { clearKey(); ST = null; showLogin(msg); return; }
        if (/不明な操作です/.test(msg)) msg = 'サーバー（Apps Script）が古い版のため、この操作はまだ使えません。役員がApps Scriptを「新バージョン」でデプロイすると使えます。';
        S.toast = '⚠ ' + msg;
        S.toastErr = true;
        if (!ST) { view.innerHTML = '<div class="card"><div class="big">ページを開けませんでした</div><div class="sub">' + esc(msg) + '</div></div>'; return; }
        render();
      });
  }
  /** サーバー（Apps Script）が古い版のままでも画面がこわれないよう、足りない項目をうめる */
  function fillDefaults(st) {
    ['duties', 'timetable', 'tasks', 'photos', 'families', 'parents', 'results', 'ledger', 'comments', 'docs', 'history', 'polls', 'fees', 'attends', 'training'].forEach(function (k) { if (!st[k]) st[k] = []; });
    if (!st.me.canManage) st.me.canManage = [];
    if (!st.trainShare) st.trainShare = { mine: {}, kids: [] };
    if (Array.isArray(st.trainShare.mine)) { var m0 = {}; st.trainShare.mine.forEach(function (k) { m0[k] = 'coach'; }); st.trainShare.mine = m0; }
    if (!st.trainComments) st.trainComments = { list: [], read: {} };
    if (!st.participation) st.participation = { kids: {} };
    if (!st.strava) st.strava = { configured: false, connected: false, kw: {} };
    if (!st.appRequests) st.appRequests = { list: [], mine: [], counts: {} };
    if (!st.me.family) st.me.family = [st.me.name];
    if (!st.choices.practiceTimes) st.choices.practiceTimes = [['17:00', '18:30'], ['18:00', '19:30']];
    if (!st.choices.warmMinutes) st.choices.warmMinutes = 30;
    if (!st.choices.rounds) st.choices.rounds = ['予選', '準決勝', '決勝', 'タイムレース'];
    if (!st.choices.applyHow) st.choices.applyHow = ['Web', 'メール', 'FAX', '郵送', '持参', '当日'];
    if (!st.choices.docKinds) st.choices.docKinds = ['要項', '申込書', 'プログラム', '地図', 'リザルト', 'その他'];
    return st;
  }
  function go(tab, key) {
    S.tab = tab; S.event = key || null; S.toast = ''; S.absForm = false;
    // 自主トレを開いたときは、日付を今日に（前に入れた日のままにしない。直している途中は除く）
    if (tab === 'train' && S.trForm && !S.trForm.id) S.trForm.date = ST.today;
    render(); window.scrollTo(0, 0);
  }

  function upcoming(filter) { return ST.events.filter(function (e) { return !e.cancelled && e.date >= ST.today && filter(e); }); }
  function myStatus(e) {
    var det = e.detail || {};
    return ST.me.children.map(function (k) {
      if (!inTarget(det.target, k.grade)) return '<span class="pill p-gray">' + esc(k.name) + '：対象外</span>';
      var x = entryOf(e.key, k.name);
      if (!x) return '<span class="pill p-warn">' + esc(k.name) + '：未回答</span>';
      return '<span class="pill ' + (x.join === '参加' ? 'p-ok' : 'p-gray') + '">' + esc(k.name) + '：' + x.join + (x.races.length ? '（' + esc(x.races.join('・')) + '）' : '') + '</span>';
    }).join(' ');
  }

  // ---- ホーム ----
  /** サーバー（Apps Script）が画面より古いとき（コードを貼っただけで「新バージョン」でデプロイしていないなど） */
  function serverOld() { return !!(API_URL && EXPECT_SERVER && ST && ST.server !== EXPECT_SERVER); }
  function serverBanner() {
    if (!serverOld()) return '';
    return '<section class="card" style="box-shadow:inset 4px 0 0 var(--track)"><div class="toast err">⚠ サーバー（Apps Script）が古い版のままです。コメントや写真などの新しい機能が保存されないことがあります。</div>' +
      (ST.me.admin && (ST.me.owner || !ST.me.hasOwner) ? '<div class="sub">PCで更新してください。<b>保存だけでは変わりません。</b></div>' + updateButtons() + versionLine() : ST.me.admin ? '<div class="sub">管理者に、Apps Scriptの更新（新バージョンでデプロイ）をお願いしてください。</div>' : '<div class="sub">役員の方に、Apps Scriptの更新（新バージョンでデプロイ）をお願いしてください。</div>') + '</section>';
  }
  // ---- やること・お知らせの既読・アンケート・集金 ----
  /** 自分の家でまだやっていないこと（エントリー・集金・アンケート・お知らせ・当番） */
  function todoItems() {
    var out = [], names = myNames();
    upcoming(isRace).forEach(function (e) {
      var det = e.detail || {};
      if (!det.target && !e.detail) return;
      var closed = det.deadline && det.deadline < ST.today;
      var miss = closed ? [] : ST.me.children.filter(function (k) { return inTarget(det.target, k.grade) && !entryOf(e.key, k.name); });
      // 参加と答えたあとに残っていること（種目・参加費）
      var joined = ST.me.children.filter(function (k) { var x = entryOf(e.key, k.name); return x && x.join === '参加'; });
      var noRace = joined.filter(function (k) { return det.races && det.races.length > 1 && !entryOf(e.key, k.name).races.length; });
      var unpaid = det.fee ? joined.filter(function (k) { return !entryOf(e.key, k.name).paid; }) : [];
      var dleft = diff(ST.today, e.date);
      if (noRace.length && !closed) out.push({ ic: '🏃', hot: true, t: esc(e.title) + 'の種目を選ぶ', s: noRace.map(function (k) { return esc(k.name); }).join('・'), a: 'data-entry="' + e.key + '"', order: det.deadline ? diff(ST.today, det.deadline) : dleft });

  }

  /** 名簿の文を読む：1行に1人。「山田 はな 6年 女」「山田はな,6,女」「名前\t学年\t男女」など */
  function parseRoster(text) {
    return String(text || '').split(/\r?\n/).map(function (line) {
      var t = toHalf(line).replace(/[,，、\t]/g, ' ').trim();
      if (!t || /^(名前|氏名|No|番号)/.test(t)) return null;
      var toks = t.split(/\s+/), grade = 0, sex = '', name = [];
      toks.forEach(function (x, i) {
        var g = x.match(/^([1-6])(年生?)?$/);
        if (g && !grade && (i > 0 || toks.length === 1)) { grade = +g[1]; return; }
        if (/^(男|女|男子|女子|M|F)$/i.test(x) && !sex) { sex = /女|F/i.test(x) ? '女' : '男'; return; }
        if (/^\d+$/.test(x) && i === 0) return; // 行の番号
        name.push(x);
      });
      return name.length ? { name: name.join(' '), grade: grade, sex: sex } : null;
    }).filter(Boolean);
  }

  function parseTT(raw) {
    var T = '(\\d{1,2})[:：時](\\d{2})';

      var l = ' ' + line.trim().replace(/[()（）]/g, ' ').replace(/[〜～]/g, '~').replace(/の(男子|女子)/, '$1').replace(/小学生?/g, ' ') + ' ', r = blankTT(), m;

      var round = (l.match(/準決勝|予選|決勝|タイムレース/) || [''])[0];
      if (round) l = l.replace(round, ' ');
      if ((m = l.match(/(\d+)\s*部/))) { r.memo = m[1] + '部'; l = l.replace(m[0], ' '); }
      var RNG = T + '(?:\\s*[~\\-－]\\s*' + T + ')?', rng = function (m) { return +m[1] + ':' + m[2] + (m[3] ? '〜' + +m[3] + ':' + m[4] : ''); };
      if ((m = l.match(new RegExp('招集(?:開始)?\\s*' + RNG)))) { r.call = rng(m); l = l.replace(m[0], ' '); }
      if ((m = l.match(new RegExp('アップ\\s*' + RNG)))) { r.warm = rng(m); l = l.replace(m[0], ' '); }
      if (/全体アップ/.test(l) && !/アップ\s*\d/.test(line)) { r.memo = (r.memo ? r.memo + ' ' : '') + 'アップは全体アップ'; }
      // 表をそのまま写したとき：「競技開始 9:30　招集 9:00~9:10　アップ 9:00~9:20」の並び

    for (var i = 0; i < want.length; i += 12) (function (ids) {

  /** スマホの大きな写真は、送る前に小さくする（長い辺1600px） */
  function readImage(file, done) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      done(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

        if (!date && (m = x.match(/^(\d{1,2})[\/月](\d{1,2})日?$/))) { var yy = +m[1] < mo - 6 ? y + 1 : +m[1] > mo + 6 ? y - 1 : y; date = yy + '-' + pad(m[1]) + '-' + pad(m[2]); return; }

  /** 表計算のファイル（.xlsx・.csv）を読む。.xlsx は SheetJS を使う（そのときだけ読み込む） */
  function readTableFile(file, done) {
    var name = file.name || '';
    document.getElementById('recFileName').textContent = name;
    if (/\.(csv|tsv|txt)$/i.test(name)) {
      var r = new FileReader();
      r.onload = function () { done(String(r.result).split(/\r?\n/).map(function (l) { return l.split(/\t|,/); }), name); };
      r.readAsText(file, 'utf-8');
      return;
    }
    var go = function () {
      var r = new FileReader();
      r.onload = function () {
        try {
          var wb = XLSX.read(new Uint8Array(r.result), { type: 'array', cellDates: true });
          done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }), name);
        } catch (e) { S.toast = '⚠ ファイルを読めませんでした'; S.toastErr = true; render(); }
      };
      r.readAsArrayBuffer(file);
    };
    if (window.XLSX) return go();
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = go;
    sc.onerror = function () { S.toast = '⚠ Excelを読む部品を読み込めませんでした。CSVで保存するか、表をコピーして貼り付けてください'; S.toastErr = true; render(); };
    document.head.appendChild(sc);
  }
  /** 表（行の配列）から記録を読み取る。見出しがあれば「1行に1記録」か「横に種目が並ぶ表」、なければ「名前 種目 記録 日付 大会」 */
  /** 大会名から練習の記録と分かるもの（サーバーの PRACTICE_MEET と同じ） */

    rows = rows.map(function (r) { return r.map(norm); }).filter(function (r) { return r.some(Boolean); });
    var hi = rows.findIndex(function (r) { return r.some(function (c) { return /^(名前|氏名|選手名?|なまえ)$/.test(c); }); });
    var out = [];

      var skip = /^(No\.?|番号|学年|年|性別|男女|ふりがな|カナ|フリガナ|所属|チーム|備考|メモ)$/;

        if (cR >= 0 && cV >= 0) { if (r[cR] && r[cV]) out.push({ child: child, race: r[cR], record: r[cV], date: cD >= 0 ? toDate(r[cD]) : '', meet: cM >= 0 ? r[cM] : '', place: cP >= 0 ? r[cP] : '', round: cRd >= 0 ? r[cRd] : '', memo: cMemo >= 0 ? r[cMemo] : '' }); return; }
        head.forEach(function (h, i) {

    if (!files.length) { S.toast = '⚠ 写真' + (d.mode === 'doc' ? 'かPDF' : '') + 'を入れてください'; S.toastErr = true; render(); return; }
    if (d.mode === 'form') { readImage(files[0], function (data) { if (data && FORMDROP[d.kind]) FORMDROP[d.kind](data); }); return; }
    var busy = document.getElementById('busy'), i = 0, ok = 0, lastErr = '';
    (function next() {
      if (i >= files.length) {
        busy.hidden = true; busy.textContent = '保存しています…';
        S.toast = ok ? '✅ ' + ok + '件を追加しました' + (lastErr ? '（' + (files.length - ok) + '件は失敗：' + lastErr + '）' : '') : '⚠ ' + (lastErr || '追加できませんでした'); S.toastErr = !ok || !!lastErr;

          function (st) { ST = fillDefaults(st); ok++; next(); }, function (err) { lastErr = String(err.message || err); next(); });
      });
    })();
  }

    nav.innerHTML = NAV.filter(function (n) { return n[0] !== 'admin' || ST.me.admin; }).map(function (n) {
      var b = badges[n[0]] ? '<span class="badge" aria-label="' + badges[n[0]] + '件">' + badges[n[0]] + '</span>' : '';
      return '<button type="button" data-nav="' + n[0] + '"' + (S.tab === n[0] ? ' aria-current="page"' : '') + '>' + b + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n[0]] + '</svg>' + n[1] + '</button>';
    }).join('');
    nav.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { if (this.dataset.nav === 'admin') S.admin = 'menu'; if (this.dataset.nav === 'family') S.kidsDraft = null; go(this.dataset.nav); }); });
  }
  function render() {
    CURKEY = ''; FORMDROP = {};
    document.getElementById('clubName').textContent = ST.club + ' ポータル';
    document.getElementById('me').textContent = ST.me.name + 'さん' + (ST.me.children.length ? '（' + ST.me.children.map(function (k) { return k.name + (k.grade ? ' ' + k.grade + '年' : ''); }).join('・') + '）' : '') + (ST.me.owner ? '・管理者' : ST.me.admin ? '・役員' : '');
    document.getElementById('reload').hidden = false;
    if (S.tab === 'admin' && !ST.me.admin && !(S.admin === 'race' && S.draft && S.draft.from === 'edit')) S.tab = 'home';
    renderNav();
    var vt = document.getElementById('vtip'); if (vt) vt.hidden = true;
    var app = document.querySelector('.app'); if (app) app.classList.toggle('wide', S.tab === 'dash');
    ({ home: home, events: events, album: album, family: family, admin: admin, train: train, dash: dash })[S.tab]();
    injectGuide();
    if (S.stravaPending && !serverOld()) { var sp = S.stravaPending; S.stravaPending = null; setTimeout(function () { call('stravaConnect', sp); }, 0); }
    applyFolds();
  }
  // ---- 折りたたみ：カードの見出しを押すと閉じる・開く（このスマホに覚える） ----
  var FOLD_STORE = 'clubPortalFold';
  // はじめから閉じておくカード（見出しの文字）
  var FOLD_DEFAULT = ['予定を直す', '履歴', '最近のヒヤリハット', 'PCでも使う', 'だれに見せる', 'アプリ連携', 'Strava', '1週間のスケジュール', 'おわった目標'];
  var FOLD_DEFAULT_MEMBER = ['練習当番', '大会当番']; // 当番を入れかえる役員には開いておく
  function foldState() { try { return JSON.parse(localStorage.getItem(FOLD_STORE) || '{}'); } catch (e) { return {}; } }
  function foldKey(h2) {
    var c = h2.cloneNode(true);
    c.querySelectorAll('small, button, a, .fold-ic').forEach(function (x) { x.remove(); });
    return S.tab + ':' + c.textContent.replace(/[0-9０-９]+(件|人|日)/g, '').trim().slice(0, 30);
  }
  function applyFolds() {
    var st = foldState();
    view.querySelectorAll('.card > h2:first-child').forEach(function (h2) {
      var card = h2.parentNode, key = foldKey(h2), title = key.split(':').slice(1).join(':');
      if (!title || card.querySelector('form') && card.querySelector('form').contains(document.activeElement)) return;
      var folded = key in st ? st[key] : FOLD_DEFAULT.concat(ST.me.admin ? [] : FOLD_DEFAULT_MEMBER).some(function (t) { return title.indexOf(t) === 0; });
      card.classList.add('foldable');
      card.classList.toggle('folded', folded);
      h2.setAttribute('role', 'button');
      h2.setAttribute('tabindex', '0');
      h2.setAttribute('aria-expanded', String(!folded));
      if (!h2.querySelector('.fold-ic')) h2.insertAdjacentHTML('beforeend', '<span class="fold-ic" aria-hidden="true">⌄</span>');
      var toggle = function (ev) {
        if (ev.target.closest('button, a, input, select, label')) return;
        if (ev.type === 'keydown' && ev.key !== 'Enter' && ev.key !== ' ') return;
        ev.preventDefault();
        var now = !card.classList.contains('folded'), s2 = foldState();
        s2[key] = now;
        try { localStorage.setItem(FOLD_STORE, JSON.stringify(s2)); } catch (e) {}
        card.classList.toggle('folded', now);
        h2.setAttribute('aria-expanded', String(!now));
      };
      h2.addEventListener('click', toggle);
      h2.addEventListener('keydown', toggle);
    });
  }

  document.getElementById('reload').addEventListener('click', function () { S.toast = ''; checkNewVersion(); call('refresh'); });

  /** スマホに古い画面が残っていても、新しい版が出ていれば読み直す（?v= を付けて、保存された画面を使わせない） */
  function checkNewVersion() {
    if (!BUILD || !window.fetch) return;
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/var BUILD = "([^"]*)"/);
      if (m && m[1] && m[1] !== BUILD) location.replace(location.pathname + '?v=' + m[1]);
    }).catch(function () {});
  }

  // ---- ログイン ----
  var STORE = 'clubPortalKey';
  function saveKey(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function loadKey() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function clearKey() { try { localStorage.removeItem(STORE); localStorage.removeItem(STATE); } catch (e) {} KEY = ''; }
  // 前回の画面を覚えておき、次に開いたときすぐ出す（そのあと裏で最新にする）
  var STATE = 'clubPortalState';
  function saveState(st) { try { localStorage.setItem(STATE, JSON.stringify({ k: String(KEY).slice(0, 8), st: st })); } catch (e) {} }
  function loadState() { try { var s = JSON.parse(localStorage.getItem(STATE) || 'null'); return s && s.k === String(KEY).slice(0, 8) ? s.st : null; } catch (e) { return null; } }
  function openFast() {
    var cached = loadState();
    if (cached && cached.me) { try { ST = fillDefaults(cached); render(); } catch (e) { ST = null; } }
    call('bootstrap', null, pendingJoin);
    if (ST) document.getElementById('busy').textContent = '最新にしています…';
  }
  function showLogin(msg) {
    document.getElementById('nav').hidden = true; document.getElementById('view').classList.remove('navpad');
    document.getElementById('reload').hidden = true;
    document.getElementById('me').textContent = '';
    view.innerHTML = '<section class="card"><div class="big">ようこそ</div><div class="sub">このページは、' + esc(CLUB) + 'のLINEグループのメンバーだけが見られます。グループに入っているLINEアカウントでログインしてください。</div>' +
      (msg ? '<div class="toast' + (/しました/.test(msg) ? '' : ' err') + '">' + esc(msg) + '</div>' : '') +
      '<a class="btn" id="loginBtn" href="' + esc(LOGIN_URL || '#') + '" target="_top" style="text-align:center;text-decoration:none;background:#06c755">LINEでログイン</a>' +
      '<div class="hint">LINEアプリの中で開くと、ボタンを押すだけでログインできます。PCでは、LINEのQRコードをスマホで読み取ってログインできます。</div></section>' +
      (API_URL ? '<section class="card"><h2>スマホに出した番号でログイン（PC）</h2><div class="sub">スマホのポータルの「わが家」→「PCでも使う」で出る6けたの番号を入れてください。</div>' +
        '<form class="f" id="codeForm"><input id="pcCode" inputmode="numeric" maxlength="6" placeholder="6けたの番号" autocomplete="one-time-code" style="font-size:20px;letter-spacing:.3em;text-align:center"><button class="btn" type="submit">ログイン</button></form></section>' : '');
    var cf = document.getElementById('codeForm');
    if (cf) cf.addEventListener('submit', function (e) {
      e.preventDefault();
      var b = cf.querySelector('button'); b.disabled = true; b.textContent = 'ログインしています…';
      rpc('codeLogin', { code: document.getElementById('pcCode').value }, function (r) { KEY = r.key; start(); }, function (err) { showLogin(err.message); });
    });
    // GitHub Pages の画面では、押したときにログイン用の URL をもらう
    if (!LOGIN_URL) document.getElementById('loginBtn').addEventListener('click', function (e) {
      e.preventDefault();
      var b = this; b.textContent = 'LINEに移動しています…';
      rpc('loginUrl', {}, function (r) { window.top.location.href = r.url; }, function (err) { b.textContent = 'LINEでログイン'; showLogin(err.message); });
    });
  }
  // 家族の招待リンク（?join=番号）で開いたときは、ログインのあとで家族になる
  var JOIN = 'clubPortalJoin';
  function pendingJoin() {
    var code = ''; try { code = localStorage.getItem(JOIN) || ''; localStorage.removeItem(JOIN); } catch (e) {}
    if (code && confirm('家族の招待番号 ' + code + ' で、家族の登録をまとめますか？')) call('joinFamily', { code: code }, function () { S.tab = 'family'; S.kidsDraft = null; });
  }
  function start() {
    if (KEY) saveKey(KEY);
    else KEY = loadKey();
    if (KEY) openFast();   // ログイン直後、または前回のログインが残っているとき（再読み込みで期限切れの表示が出ても、保存したキーで開く）
    else showLogin(LOGIN_ERROR);
  }
  // GitHub Pages の画面に LINE ログインから戻ってきたとき（?code=&state=）
  var q = new URLSearchParams(location.search);
  if (q.get('tab') && /^(home|events|album|family|train|admin|dash)$/.test(q.get('tab'))) S.tab = q.get('tab');
  if (q.get('ev') && /^[\w-]{6,40}$/.test(q.get('ev'))) { S.tab = 'events'; S.event = q.get('ev'); S.etab = /^(概要|エントリー|種目|タイムテーブル|手続き|結果|写真)$/.test(q.get('et') || '') ? q.get('et') : '概要'; }
  if (q.get('v') || q.get('tab') || q.get('ev')) { q.delete('v'); q.delete('tab'); q.delete('ev'); q.delete('et'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
  // Strava のログインから戻ってきたとき（?strava=1&code=…&state=…）。LINEログインの code とは分けて扱う
  if (q.get('strava')) {
    S.stravaPending = { code: q.get('code') || '', state: q.get('state') || '', scope: q.get('scope') || '', error: q.get('error') || '' };
    S.tab = 'train';
    q.delete('strava'); q.delete('code'); q.delete('state'); q.delete('scope'); q.delete('error');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  }
  if (q.get('join')) {
    try { localStorage.setItem(JOIN, q.get('join').replace(/\D/g, '').slice(0, 6)); } catch (e) {}
    q.delete('join');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  }
  if (API_URL && (q.get('code') || q.get('error'))) {
    history.replaceState(null, '', location.pathname);
    if (q.get('error')) { LOGIN_ERROR = 'LINEログインがキャンセルされました。'; start(); }
    else {
      view.innerHTML = '<div class="empty">ログインしています…</div>';
      rpc('login', { code: q.get('code'), state: q.get('state') }, function (r) { KEY = r.key; start(); }, function (err) {
        // 再読み込みなどで同じ code をもう一度使ったときは、保存してあるキーで開く
        KEY = loadKey();
        if (KEY) openFast(); else showLogin(err.message);
      });
    }
  } else {
    start();
  }
  checkNewVersion();
})();
</script>
</body>
</html>
