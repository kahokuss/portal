var GAS_MOCK_SRC = "// Apps Script のサービス（スプレッドシート・カレンダー・LINE API など）をメモリ上でまねる。\n// src/*.gs をそのまま読み込んで、Node.js でサーバー側の動きを確かめるために使う。\nconst fs = require('fs');\nconst path = require('path');\nconst vm = require('vm');\nconst crypto = require('crypto');\n\nconst SRC = path.join(__dirname, '..', 'src');\n\nfunction tokyoParts(date) {\n  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });\n  const o = {};\n  f.formatToParts(date).forEach((p) => (o[p.type] = p.value));\n  return o;\n}\n\nfunction formatDate(date, tz, pattern) {\n  const p = tokyoParts(date);\n  return pattern\n    .replace('yyyy', p.year).replace('MM', p.month).replace('dd', p.day)\n    .replace('HH', p.hour).replace(/(^|[^H])H(?!H)/, (m, a) => a + String(Number(p.hour)))\n    .replace('mm', p.minute).replace('ss', p.second);\n}\n\nclass Range {\n  constructor(sheet, r, c, nr, nc) { Object.assign(this, { sheet, r, c, nr: nr || 1, nc: nc || 1 }); }\n  setValues(vals) {\n    vals.forEach((row, i) => row.forEach((v, j) => {\n      const rr = this.r + i;\n      while (this.sheet.data.length < rr) this.sheet.data.push([]);\n      this.sheet.data[rr - 1][this.c + j - 1] = v;\n    }));\n    return this;\n  }\n  getValues() {\n    const out = [];\n    for (let i = 0; i < this.nr; i++) {\n      const row = this.sheet.data[this.r + i - 1] || [];\n      const vals = [];\n      for (let j = 0; j < this.nc; j++) vals.push(row[this.c + j - 1] === undefined ? '' : row[this.c + j - 1]);\n      out.push(vals);\n    }\n    return out;\n  }\n  setNumberFormat() { return this; }\n  setFontWeight() { return this; }\n  setBackground(c) { this.sheet.backgrounds[this.c] = c; return this; }\n  setNote(t) { this.sheet.notes[this.c] = t; return this; }\n  setDataValidation() { return this; }\n  protect() { const p = { desc: '', setDescription(d) { p.desc = d; return p; }, setWarningOnly() { return p; }, getDescription: () => p.desc, remove: () => { this.sheet.protections = this.sheet.protections.filter((x) => x !== p); } }; this.sheet.protections.push(p); return p; }\n}\n\nclass Sheet {\n  constructor(name) { this.name = name; this.data = []; this.maxRows = 1000; this.hidden = []; this.notes = {}; this.backgrounds = {}; this.protections = []; }\n  hideColumns(c) { this.hidden.push(c); }\n  setTabColor() {}\n  setColumnWidth() {}\n  getProtections() { return this.protections.slice(); }\n  getName() { return this.name; }\n  getRange(r, c, nr, nc) {\n    if (r + (nr || 1) - 1 > this.maxRows) throw new Error('範囲がシートの外です');\n    return new Range(this, r, c, nr, nc);\n  }\n  getLastColumn() { return Math.max(0, ...this.data.map((r) => (r || []).length)); }\n  getLastRow() {\n    for (let i = this.data.length; i > 0; i--) if ((this.data[i - 1] || []).some((v) => v !== '' && v !== undefined)) return i;\n    return 0;\n  }\n  getMaxRows() { return this.maxRows; }\n  insertRowsAfter(after, n) { this.maxRows += n; }\n  setFrozenRows() {}\n  // テスト用：見出しをキーにしたオブジェクトで返す\n  rows() {\n    const [head, ...rest] = this.data;\n    return rest.filter((r) => r && r.some((v) => v !== '')).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] === undefined ? '' : r[i]])));\n  }\n}\n\nclass Spreadsheet {\n  constructor(id, name) { this.id = id; this.name = name; this.sheets = [new Sheet('シート1')]; }\n  getId() { return this.id; }\n  getUrl() { return 'https://docs.google.com/spreadsheets/d/' + this.id; }\n  getSheetByName(n) { return this.sheets.find((s) => s.name === n) || null; }\n  insertSheet(n) { const s = new Sheet(n); this.sheets.push(s); return s; }\n  getSheets() { return this.sheets.slice(); }\n  deleteSheet(s) { this.sheets = this.sheets.filter((x) => x !== s); }\n  setActiveSheet(s) { this.active = s; return s; }\n  moveActiveSheet(pos) { this.sheets = this.sheets.filter((x) => x !== this.active); this.sheets.splice(pos - 1, 0, this.active); }\n}\n\nclass Cal   // eslint-disable-next-line no-new-func
  new Function('require', 'module', '__dirname', GAS_MOCK_SRC)(function (n) { return shim[n]; }, module, '/tests');
  var createGas = module.exports.createGas;

  // ---- ダミーデータ（名前はすべて架空） ----
  var SEI = ['山田', '佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '中村', '小林', '加藤', '吉田', '山本', '松本', '井上', '木村', '林', '清水', '山口', '森', '池田'];
  var MEI = ['たろう', 'はな', 'けんた', 'さくら', 'ゆうと', 'みお', 'そうた', 'ひなた', 'りく', 'あおい', 'はると', 'ゆい', 'かいと', 'めい', 'こうき', 'りん', 'だいち', 'あかり', 'しょう', 'ここな'];

  function seed() {
    var now = new Date();
    var gas = createGas({ now: now.toISOString() });
    gas.init();
    var today = ymd(now), day = function (n) { return ymd(new Date(now.getTime() + n * 864e5)); };

      var ds = day(i), wd = new Date(ds + 'T00:00:00Z').getUTCDay();
      if (wd !== 2 && wd !== 4 && wd !== 6) continue;

    gas.sheet('家族').data.forEach(function (r) { if (['U1', 'U2', 'U3', 'U4'].indexOf(r[0]) >= 0) r[3] = '○'; }); // 役員は4家族

    // 係：会長（山田）・副会長で会計係（佐藤）・記録係と当番係（鈴木）・大会係（高橋）
    [['U1', '会長'], ['U2', '副会長・会計係'], ['U3', '記録係・当番係'], ['U4', '大会係']].forEach(function (x) { api('U1', 'setRole', { fam: x[0], role: x[1] }); });
    var st = api('U1', 'bootstrap');
    var race = st.events.find(function (e) { return e.title === '第3回 お試し記録会'; });
    var road = st.events.find(function (e) { return e.title === 'お試しロードレース大会'; });
    var past = st.events.find(function (e) { return e.title === '秋の陸上競技会'; });
    api('U1', 'saveRace', { key: race.key, title: race.title, date: race.date, place: '市営陸上競技場', type: '記録会', target: '全員', fee: 500, deadline: day(5), races: ['100m', '走幅跳', '800m'], items: ['ユニフォーム', 'スパイク', 'ゼッケン', '水筒'], meetTime: '8:00', meetPlace: '正面スタンド下', applyBy: day(7), payBy: day(10) });
    api('U1', 'saveRace', { key: road.key, title: road.title, date: road.date, place: '運動公園', type: '大会', target: '3年生以上', fee: 800, deadline: day(20), races: ['2km', '3km'] });
    api('U1', 'saveRace', { key: past.key, title: past.title, date: past.date, place: '県営陸上競技場', type: '大会', target: '全員', races: ['100m', '走幅跳'] });
    // 当番：過去の練習と大会（前回からの日数がばらばらになるように）、これからの2週間は自動で。その先は空けておく（自動で入れるのを試せる）
    var fams = SEI.map(function (s, k) { return 'U' + (k + 1); });
    var prac = st.events.filter(function (e) { return e.type === '練習' && e.date < today; });
    prac.forEach(function (e, n) { api('U1', 'setDuty', { key: e.key, fam: fams[(n * 7) % fams.length], on: true }); });
    api('U1', 'setDuty', { key: past.key, fam: 'U3', on: true });
    api('U1', 'setDuty', { key: past.key, fam: 'U4', on: true });
    api('U1', 'autoDuty', { type: '練習', days: 6, per: 1 }); // 2週目の当番はわざと空けておく（当番係の「今やること」に出る）
    api('U1', 'setDuty', { key: race.key, fam: 'U5', on: true });
    api('U1', 'setDuty', { key: race.key, fam: 'U6', on: true });
    // エントリー（保護者は参加・不参加、種目は役員が登録）
    SEI.forEach(function (s, k) {
      if (k % 5 === 4) return;
      var u = 'U' + (k + 1), name = s + ' ' + MEI[k];
      api(u, 'saveEntry', { key: race.key, child: name, join: k % 7 === 6 ? '不参加' : '参加' });
      if (k % 7 !== 6) api('U1', 'saveEntry', { key: race.key, child: name, join: '参加', races: (k % 6) + 1 >= 3 && k % 3 === 0 ? ['100m', '走幅跳'] : ['100m'] });
    });
    // 時刻表
    api('U1', 'saveTimetable', { key: race.key, rows: [
      { start: '9:30', race: '100m', group: '1・2年男子', call: '9:10' }, { start: '9:40', race: '100m', group: '1・2年女子', call: '9:20' },
      { start: '10:00', race: '100m', group: '3・4年男子', call: '9:40' }, { start: '10:10', race: '100m', group: '3・4年女子', call: '9:50' },

    api('U1', 'saveRace', { key: rec.key, title: rec.title, date: rec.date, place: '市営陸上競技場', type: '記録会', target: '全員', fee: 400, races: ['50m', '100m', '800m'], payBy: rec.date });

    var recs = [];
    SEI.forEach(function (s0, k) { var g = (k % 6) + 1; for (var mth = 5; mth >= 1; mth--) recs.push({ child: s0 + ' ' + MEI[k], race: g <= 2 ? '50m' : '100m', record: (g <= 2 ? 11 - g * 0.4 - (5 - mth) * 0.05 : 21 - g * 0.9 - (5 - mth) * 0.08).toFixed(2), date: day(-mth * 30), meet: '練習', kind: '練習' }); });
    api('U1', 'addRecords', { rows: recs });
    // 会計：年会費の集金（半分くらい済み）、大会の参加費の集金、過去の大会への支払い、年会費の入金
    api('U1', 'saveFee', { name: '年会費', amount: 3000, target: '全員', deadline: day(10) });
    var fee = api('U1', 'bootstrap').fees.find(function (f) { return f.name === '年会費'; });
    if (fee) SEI.forEach(function (s0, k) { if (k % 2 === 0) api('U1', 'setFeePaid', { id: fee.id, child: s0 + ' ' + MEI[k], paid: true }); });
    SEI.forEach(function (s0, k) { if (k % 5 !== 4 && k % 7 !== 6 && k % 3 === 0) api('U1', 'setPaid', { key: race.key, child: s0 + ' ' + MEI[k], paid: true }); });

    api('U1', 'saveLedger', { kind: '入金', amount: 30000, note: '年会費（10家族分）', date: day(-3) });

    var lastPrac = st.events.filter(function (e) { return e.type === '練習' && e.date < today; }).slice(-1)[0];
    if (lastPrac) api('U6', 'saveComment', { key: lastPrac.key, kind: 'ヒヤリハット', body: '駐車場から車が急に出てきて、子どもとぶつかりそうになった', place: '校庭の駐車場の出入口' });
    api('U1', 'savePoll', { title: '記録会の送迎、車を出せますか', options: ['出せる', '出せない'], deadline: day(6) });

    api('U1', 'saveRaceNote', { key: road.key, memo: 'エントリーは先着順。申込開始日（例年10月はじめ）の朝にすぐ申し込む' });

  // ---- 画面（ポータル本体は、本物と同じ Portal.html を中の枠で動かす） ----
  var PEOPLE = [['U1', '山田さん（会長）'], ['U2', '佐藤さん（副会長・会計係）'], ['U3', '鈴木さん（記録係・当番係）'], ['U4', '高橋さん（大会係）'], ['U7', '渡辺さん（保護者）'], ['U5', '田中さん（保護者・大会の当番）']];
